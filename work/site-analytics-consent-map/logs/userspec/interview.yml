conversation_history:
  - asked_at: "2026-09-10 01:13:33 +03:00"
    topic_keys: ["feature_description", "success_criteria", "constraints", "migration"]
    agent_questions: |
      Исходные вопросы владельца: выдать карту страниц edabalans с отметками внутренней статистики, Метрики и cookie-плашки; сделать плашку универсальной; временно показывать её только на главной; описать правильные правила аналитики; реализацию отложить.
    user_answer: |
      «выкати мне вообще тогда карту сайта едабалнс чтобы я знал а что у нас там за страницы и напротив каждой пометь собирается ли там статистика или нет и есть ли там плашка. плашка универсальная одна на все. в одном месте нажал - она перестает повяляться везде.

      пока временно давай сделаем так что в интенсиве она не всплывает вообще. пока только на главной странице сайта. потому что на интенсив люди попадают из бота только а на сайт просто так могут.

      и сделай чтобы все там было поп праивлом с аналитикой и нашей внутренней и метрики.

      напиши под это тз. а реализовывать будешь потом. чтобы сейчас не загруать систему»
