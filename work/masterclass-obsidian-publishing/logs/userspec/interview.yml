pending_question_batch:
  asked_at: "2026-09-16"
  agent_questions: |
    1. Как называется старый чат с твоей последней правкой МК? Это нужно, чтобы взять именно её, а не более ранний редакторский пакет.
    2. Вопросы анкет и подсказки тоже делаем редактируемыми в Markdown? Рекомендую да, но без изменения типов полей, расчётов и логики анкеты.
    3. Делаем две команды: «Опубликовать текущий файл» и «Опубликовать изменения МК» — вторую со списком затронутых файлов и подтверждением? Рекомендую именно так.
  status: answered_scope_changed
  user_answer_excerpt: |
    Первое: какой чат? Я не знаю. Скорее всего это либо Яндекс.Директ, либо VSL, кто-то из них. Либо дизайн. Напиши им, выясни сам.
    Второе: вопросы-анкеты, подсказки — тоже делаем в редактируемом MD.
    Давай пока не будем. Давай пока мне просто дай отредачить, и я тебя тут попрошу потом всё это сделать просто вручную.
  resolution: "Связаться с тремя чатами; сначала утверждение найденного источника, потом каталог по дням. API и кнопки отложены. Анкетные тексты включены, DQS исключён. Независимо разрешён локальный тест форматирования. Это выписки, не полный транскрипт ответа; детальный контекст — checkpoint.md и source-confirmation.md."

notes: "Research-only preparation. Сборщик main пишет напрямую в DB; HTTP API полного editorial package отсутствует. Анкетные вопросы и access gates не включены в полный Markdown publish. До выбора канонического источника и раскрытия первой публикации production не менять."
