# User-spec planning interview

interview_metadata:
  started: "2026-09-19"
  last_updated: "2026-09-19"
  status: "in_progress"
  can_resume: true

conversation_history:
  - asked_at: "2026-09-19"
    topic_keys: ["feature_description", "user_problem", "ui_ux_requirements", "integration_points"]
    agent_questions: |
      Владелец самостоятельно провёл полный проход текущей админки и попросил не
      задавать повторных вопросов до фиксации ТЗ.
    user_answer: |
      Сначала выдать 2–3 эмодзи на выбор для каждого пункта свёрнутой панели вместо
      CRM/DQ/CI/ME/OD. Реализацию пока не начинать. CRM должна стать главной, пустую
      главную и дубли убрать. Люди — плотная таблица; покупатели, сопровождение и
      доступ к МК — быстрые фильтры. Оплаты — отдельная быстрая лента. Объяснить
      первое появление, теги и доступы, разобраться с медленной загрузкой и прыгающим
      поиском. Из карточки человека сразу открывать настоящее приложение, оставив
      только компактный административный переключатель человека и приложения.
      Каталог материалов перенести в маркетинг, контент переименовать в курсы и
      показывать конкретные курсы. Определитель допродаж перенести в коммерцию.
      Продукты/описания и цены/тарифы пока оставить раздельно. Финансовую модель
      адаптировать под desktop и позже связать с фактическими метриками. Telegram
      оставить служебным и неактивным. Разъяснить карту/инструкцию/планы/документы/
      Библиотекаря. Подготовить архитектуру онлайн-редактора канонических Markdown
      курсов с API, preview, версиями и безопасной публикацией. Унифицировать
      визуальный стиль всех внутренних экранов, но фирменная основа не договорена:
      последняя фраза оборвалась после «возьмём, наверное, мой фирменный…».

