notes: "Канонический URL сообщения — https://edabalans.ru/dqs. Прежняя ручная кнопка отправки заменяется автоматической доставкой при первом reveal. Реализацию продолжает отдельный DQS-чат в изолированном worktree; финальная редактура существующего слота проходит через edabalans-writer и требует согласования до production."
