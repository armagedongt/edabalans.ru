    required: true
user_experience:
  user_stories:
    score: 3
    value: Редактор сохраняет MD+картинку, выбирает материал и публикует. Codex находит
      тот же файл и ID, выполняет адресное добавление/перестановку по поручению, обновляет
      тот же каталог и проверяет прогресс.
    gaps: []
    required: true
  acceptance_criteria:
    score: 3
    value: Новая картинка и смена байтов старой отображаются после публикации только
      выбранного материала; локальные ссылки остаются рабочими. Выдача наследует фактический
      доступ к материалу, включая разрешённые прямые ссылки рецептов ACCESS_RECIPES
      до дня15. Действующие HTML превращены в Markdown без изменения текста/компонентов;
      архив сохранён. Пять рецептов подключаются только по подтверждённому оригиналу
      и вычислительному hash. Structure CLI preview/apply добавляет, переставляет
      и переносит обычные статьи с явной обязательностью и защитой прогресса. Клиент/инструкция
      C обновлены.
    gaps: []
    required: true
  edge_cases:
    score: 3
    value: Неоднозначный basename и выход из vault запрещены; HTTPS ссылки не скачиваются;
      кодовые примеры не преобразуются; body/media limits действующего Pillow validator.
      Архивы не становятся активными. Спецшаги продаж/анкет/приложений не перемещаются
      между днями универсальной операцией. Existing participants requiredness задаётся
      явно, completed_at не сбрасывается.
    gaps: []
    required: true
  error_scenarios:
    score: 3
    value: Конфликт серверной основы отклоняется до upload; ошибка upload не меняет
      материал; изменившиеся при upload локальные байты отменяют text publication.
      Retry того же scoped digest не создаёт копий. Lost response проверяется readback;
      локальная правка сохраняется. Structure ошибка откатывает материал/manifest/progress/events;
      старый клиент после structural marker получает 409 без записей.
    gaps: []
    required: true
  verification_strategy:
    score: 3
    value: Агент выполняет целевые API/filesystem/renderer проверки, свежие code/security/test
      review, CI и runtime smoke; фиксирует хэши принятого содержания и сохранение
      unrelated drafts. Владелец не обязан повторно доказывать работу; инструкция
      содержит простой сценарий выбранного материала с PNG.
    gaps: []
    required: true
  ui_ux_requirements:
    score: 3
    value: Использовать существующее окно и кнопки; без отдельной админки структуры.
      Шпаргалка/инструкция в C обновляются по фактическому результату.
    gaps: []
    required: false
  risks:
    score: 3
    value: 'Утечка private image: reuse actual course day/step authorization. Потеря
      локальных вложений: mapping accepted rendered source, не необратимая замена
      ссылок. Потеря содержания HTML: сохранённая основа и deterministic equality.
      Progress race: shared/exclusive course transaction guard и revision/ID validation.
      Реальные structural действия production требуют существующий backup договор.'
    gaps: []
    required: true
  technical_decisions:
    score: 3
    value: 'Существующие API, Pillow и ManagedDocumentVersion; scoped immutable image
      records без DDL/нового volume/хоста/SaaS. Серверный оригинал содержит канонические
      URL, локальный MD сохраняет Obsidian ссылки через publisher state mapping. Главная:
      только замена src существующих фото через стабильные asset slots; макет прежний.
      Structure IDs и точная транзакция без нового GUI. Обычные фотографии рецепта
      публикуются со scoped proof и полным source; calculator cards/comments и runtime
      components защищены, namespace hash/version обновляются атомарно.'
    gaps: []
    required: false
  deploy_approach:
    score: 3
    value: Штатные ревью и release поверх свежего main, проверка CI/production, установка
