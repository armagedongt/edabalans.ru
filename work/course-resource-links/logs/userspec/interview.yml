    user_answer: |
      Нужен общий ключ ссылки на материал. Если материал открыт — открыть его; если
      не куплен — показать единый модуль покупки. Нужно отличать купленный курс от
      уже открытого по прохождению. Калорийный курс и курс тренировок открываются
      после всех 20 дней Мастер-класса. В CRM нужна отдельная галочка полного
      открытия курса для конкретного пользователя. Решение должно переноситься на
      будущие курсы и быть задокументировано.

