# User-spec planning interview
# Questions and answers are preserved verbatim. Topic fields track what is known and still open.

interview_metadata:
  started: "2026-08-29"
  last_updated: "2026-08-29"
  status: "in_progress"  # in_progress | completed
  can_resume: true

conversation_history:
  - asked_at: "2026-08-29"
    topic_keys: ["feature_name", "feature_description", "user_problem", "constraints", "integration_points"]
    agent_questions: |
      Initial task description supplied by the owner.
    user_answer: |
      До этого у меня по обрывкам работали разные чаты: кто-то собирал калории, кто-то работал на сервере, кто-то локально. Кто-то использовал не те транскрипты, оставлял сырой текст, перерабатывал его или делал пост почти один в один. Нужно понять всю систему: что, где и как лежит; подсветить дубли; фиксировать, если из большого стрима взята только часть, какая именно, куда она пошла, а остальное остаётся для идей и контекста. У каждой единицы информации должен быть один канонический источник.

      В единую историю должны войти: свои стримы и видео внутри и вне МК, каталог статей, видео YouTube и канала, коммерческая информация (бизнес-модель, тарифы, презентации, продающие тезисы), а отдельно — чужие книги, вебинары и прочее. Нужна нормальная навигация, чтобы любой чат понимал, по какому вопросу куда обращаться. Сначала создать архитектуру, затем догружать транскрипты и вставлять их в готовую схему. Нужна максимальная применимость при минимальной сложности реализации и поддержки.
  - asked_at: "2026-08-29"
    topic_keys: ["feature_description", "constraints", "integration_points", "migration_needs"]
    agent_questions: |
      Уточнение границ и порядка наполнения библиотеки.
    user_answer: |
      Работа состоит из двух этапов. Сначала нужна общая архитектура и правила. Потом — наполнение материалами: каждый раз прогон копий и дублей, приведение к одному источнику, переименование всех связанных файлов. Например, транскрипт должен называться так же, как соответствующий файл на компьютере. В готовую схему нужно внести всё, что уже есть, а потом постепенно докидывать новое.

      Модель и каталог постов делает другой бот.
  - asked_at: "2026-08-29"
    topic_keys: ["feature_description", "success_criteria", "integration_points", "migration_needs"]
    agent_questions: |
      Уточнение: библиотека была описана слишком узко как слой транскриптов.
    user_answer: |
      Нужна общая информационная библиотека проекта: учебные материалы, видео и аудио МК, Калорийного, тренировок и интенсива, голосовые Telegram, презентации, VSL, отзывы, бизнес-информация, внешние книги и другие источники. Видеотекст нужно не оставлять голым, а полностью структурировать; длинные стримы разбивать на карту тем, продаж, историй, вопросов и ответов. Видеоуроки должны иметь структурированный текст-компаньон, чтобы любой модуль понимал их смысл. В библиотеку нужно сначала перенести и переработать смысл из разрозненных мест, затем удалить лишние копии и переключить другие модули на единственный источник. Каталог постов и его модель делает другой бот; библиотека должна только связывать его с источниками.
