conversation_history:
  - asked_at: "2026-08-25 12:00:00"
    topic_keys: ["feature_description", "success_criteria", "technical_decisions", "ui_ux_requirements"]
    agent_questions: |
      Итоговое уточнение владельца после обсуждения архитектуры документации, модулей, Wiki, новых чатов и административных инструментов.
    user_answer: |
      Итогом разговора владелец просит сначала составить полный список дел, затем полное ТЗ и после этого реализовать его. Нужно навести порядок во всех файлах, создать автоматически формируемое дерево модулей с элементами базы знаний в конечных карточках, переработать AGENTS.md и сделать так, чтобы каждый новый чат понимал маршрутизацию, терминологию, правила общения и источники истины. Модуль является функциональной возможностью, но каждый файл, скрипт и функция должен принадлежать какому-либо модулю и быть доступен через дерево. Ручного редактора карты не должно быть: карта формируется из проектных файлов и обновляется вместе с изменениями. Wiki не должна содержать отдельную устаревающую копию. NocoDB пока не используется и его единый вход отложен.

