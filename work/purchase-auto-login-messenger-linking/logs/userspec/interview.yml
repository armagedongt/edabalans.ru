      Исходное описание задачи владельцем без отдельного вопроса интервью.
    user_answer: |
      После подтверждённой покупки покупателя нужно вернуть на страницу успешной оплаты с кнопкой входа в личный кабинет. По этой кнопке человек должен без ручного ввода логина и пароля попасть в ЛК и остаться авторизованным через cookie; логин и назначенный пароль одновременно отправляются на email для входа с другого устройства или после потери сессии.

      В ЛК постоянно показывается компактный статус подключённых Telegram и MAX, отметка основного мессенджера и кнопка изменения. Редактирование открывает общую панель подключения, отключения и выбора основного канала.

      В первом дне Мастер-класса после материала о ведении дневника и до анкеты должен находиться обычный обязательный материал подключения мессенджера. Для продолжения требуется минимум один Telegram или MAX; второй рекомендуется как резервный. Эта панель использует тот же компонент и ту же логику, что управление в ЛК. Выбранный канал нужен для сервисных сообщений, пересылки анкет и дальнейших функций курса.
