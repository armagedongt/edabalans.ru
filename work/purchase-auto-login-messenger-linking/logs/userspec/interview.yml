  technical_decisions:
    score: 98
    value: "Не требовать messenger до входа в ЛК. Только direct Robokassa: для первой покупки T123-hosted JS переводит браузер top-level через edabalans.ru для browser binding, затем в Robokassa; success action 60 минут создаёт 45-day session без пароля в форме/URL. Stable grant retry возвращает ту же session. Повторная покупка с существующим AccountCredential не получает новый browser grant, onboarding, credential email или ротацию; success page только подтверждает добавление покупки в существующий кабинет. Если credential отсутствует, он создаётся и отправляется один раз. Требовать минимум один messenger в материале после дневника; связь завершается bot consume, бот возвращает в точный материал; второй optional. Первая успешно committed связь становится preferred; вторая не меняет её без явного выбора. Один shared resolver направляет все клиентские automatic marketing/service/course сообщения в preferred exact Contact; named Telegram/MAX action переопределяет одну отправку. Если named platform ещё не связана, persisted pending action связывается с link attempt и после успешной привязки доставляет исходный материал идемпотентно ровно один раз. При смене preferred уже отправленное и находящееся во внешнем вызове не трогается, все pending до отправки и будущие шаги используют новый preferred без дублей. Reactive replies остаются на платформе входящего действия; owner alerts и cross-messenger bridge вне preferred. Все клиентские автоматические сообщения до выпуска обязаны иметь полноценный MAX-совместимый renderer: platform-specific формы заменяются ближайшим нативным аналогом с сохранением смысла и данных; технические payloads/анкеты могут делиться по лимиту, а авторские посты создаются в общем лимите и отправляются одним сообщением. Telegram-only клиентский контент в принятом контуре не допускается и не перенаправляется молча. Self-service unlink/relink identity отсутствует: пользователь может только подключить ещё не связанную платформу и выбрать preferred; смена аккаунта/удаление связи выполняется через Сергея. `/stop` остаётся безусловным отказом от отправок. Новый обязательный шаг действует только для покупок после release cutoff; старые участники не меняются."
