notes: '22.10 пользователь прямо поручил сразу реализовать локальный рабочий прототип для просмотра, без публикации.
  Это новое разрешение на ограниченную реализацию, не утверждение полного будущего ТЗ. Первая покупка любого продукта;
  сопровождение по распознанным оплатам. Свободные платежи без человека/назначения требуют отдельной привязки, не
  выводить её из суммы. 22.10 разрешены числовые поправки искусственного притока с явной пометкой; пока не реализованы.
  Локальная демонстрационная SQLite-база, не копия production.'
