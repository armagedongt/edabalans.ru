general_understanding:
  feature_name:
    score: 95
    value: "Редакционная система публичного блога"
    gaps: []
    required: true

  feature_description:
    score: 100
    value: "Обновить шапку и hero главной блога, добавить фотографию и рубрики «Личное» и «ЗОЖ», реализовать шаблон Markdown-статей, содержание, связанные статьи и переиспользуемые продуктовые вставки, затем сразу публично опубликовать шесть тематически разных переработанных авторских статей с Pikabu и закрепить будущий редакционный workflow. Персонализацию CTA пока не включать; вынести общую cookie/identity-систему в отдельное исследование."
    gaps: []
    required: true

  work_type:
    score: 100
    value: "feature"
    gaps: []
    required: true

  user_problem:
    score: 90
    value: "Текущая главная уже визуально нравится, но hero и шапка недостаточно ясно показывают автора и смысл блога. Страниц статей и повторяемого публикационного контура пока нет, поэтому каждую будущую публикацию пришлось бы собирать вручную, а CTA и рекомендации могли бы разъехаться между статьями."
    gaps: []
    required: true

  target_users:
    score: 95
    value: "Новые читатели из поиска, Pikabu, Telegram и основного сайта; вернувшиеся читатели, знакомые с бесплатным интенсивом или продуктами; Сергей как редактор и публикатор новых статей."
    gaps: []
    required: false

  success_criteria:
    score: 100
    value: "Главная соответствует заданной desktop/mobile композиции и утверждённому тезису; шесть индексируемых статей открываются в едином шаблоне, содержат работающие оглавление, медиа, редакционно выбранные CTA и связанные статьи; Markdown и короткие безопасные вставки имеют один документированный контракт; новый материал можно подготовить и опубликовать по короткому разовому или пакетному workflow."
    gaps: []
    required: true

  constraints:
    score: 100
    value: "Сохранять каноническую палитру и Inter, не создавать второй авторский голос или второй подвал, тексты проводить через edabalans-writer, брать только полные собственные исходники, CTA-компоненты отделять от Markdown, не раскрывать платный канон целиком. Первый выпуск не использует cookie/CRM для выбора CTA; общая identity-система находится в отдельном исследовании и не блокирует блог."
    gaps: []
    required: true

  testing_strategy:
    score: 100
    value: "Unit: metadata/schema, slug lookup, heading anchors, safe directives и hostile arguments, related resolution, image validation. Integration: public homepage/article routes, 404, canonical/OpenGraph, theme shell, Caddy article/assets whitelist. UI: desktop/mobile light/dark screenshots и клавиатурное оглавление. Release smoke: все шесть URL, CTA destinations, изображения, footer и отсутствие горизонтального overflow."
    gaps: []
    required: true

user_experience:
  user_stories:
    score: 100
    value: "Читатель открывает главную, понимает тему и автора, выбирает рубрику/карточку, читает статью с оглавлением и медиа, получает один основной следующий шаг и три содержательно связанные статьи. Сергей передаёт разовую статью: интегратор сам предлагает категорию/CTA/related, согласует их и публикует. Для пакета интегратор ставит задачу писарю, получает проверенные MD, сам расставляет компоненты, проверяет и выпускает пакет."
    gaps: []
    required: true

  acceptance_criteria:
    score: 100
    value: "Hero и header соответствуют утверждённому тексту/композиции; присутствуют рубрики «Личное» и «ЗОЖ»; карточки менее округлые и без отдельного заголовка «Статьи». Шесть exact материалов доступны публично и индексируемо по стабильным URL. Одна metadata-модель строит карточки, article SEO и related. Markdown не исполняет raw HTML/JS; разрешены только закрытые короткие directives. Каждая статья имеет TOC, тему, медиа, CTA, три related и общий footer."
    gaps: []
    required: true

  edge_cases:
    score: 100
    value: "TOC скрывается при недостаточном числе разделов; anchors детерминированы. Длинные заголовки и кириллица не ломают layout/slug. Отсутствующее необязательное inline-медиа не создаёт broken image, а обязательное hero-медиа блокирует публикацию. Related никогда не ссылается на текущую/неопубликованную статью. Тема сохраняется между главной и статьями."
    gaps: []
    required: true

  error_scenarios:
    score: 100
    value: "Неизвестный directive, небезопасный URL/аргумент, дублированный slug, отсутствующий required asset или непрошедший writer gate останавливают публикацию и не показывают сырой синтаксис читателю. Неизвестный article URL даёт 404. Для первого пакета production release выполняется только после готовности всех шести статей; сбой smoke запускает штатный rollback."
    gaps: []
    required: true

  verification_strategy:
    score: 100
    value: "Агент прогоняет unit/integration/policy tests, renderer validation, route smoke и визуальные проверки 360/430/768/1440 в light/dark. После deploy перечитывает production URL и проверяет все CTA/related/media/canonical. Владелец вручную оценивает только редакционное качество шести текстов и внешний вид hero/article page."
    gaps: []
    required: true

  ui_ux_requirements:
    score: 100
    value: "Desktop header: слева крупнее «Похудение — это есть.рф» и «Блог Сергея Воронцова», nav по центру, theme icon справа с мягкой границей и жёлтым hover. Hero на всех размерах: название, «Авторский блог Сергея Воронцова», тезис «Пишу о питании, похудении и пищевых привычках, чтобы сделать ваше похудение проще», существующая фотография из блока «Об авторе», рубрики. Cards чуть прямоугольнее; heading «Статьи» отсутствует. Article: компактный TOC, sticky/popover на desktop, адаптивные CTA, related и общий footer; light/dark единообразны."
    gaps: []
    required: false

  risks:
    score: 100
    value: "XSS/unsafe directives — закрытый renderer+sanitizer+tests; расхождение карточек/страниц — единый manifest; hotlink/пропажа Pikabu media — собственные assets с provenance; устаревшие медицинские тезисы — writer fact/source review; продуктовые факты — component provider от владельца продукта; частичный пакет — release gate шести статей; identity/privacy scope creep — отдельная спецификация."
    gaps: []
    required: true

  technical_decisions:
    score: 100
    value: "Первый выпуск Git-backed и без migration: канонические MD-файлы плюс валидируемый единый manifest метаданных. Короткие component calls являются закрытым DSL, а не исполняемыми пользовательскими scripts. Компоненты рендерятся сервером и повторно проходят sanitizer. CTA выбирается редакционно; runtime identity не используется. Related задаётся явно."
    gaps: []
    required: false

  deploy_approach:
    score: 100
    value: "Обычный code-only release из main без migration: обновить Caddy whitelist для article/assets, backend routes/static/content, пройти CI, deploy smoke и rollback policy. Статьи сразу indexable; sitemap/canonical/OG включены в тот же выпуск."
    gaps: []
    required: false

  manual_user_actions:
    score: 100
    value: "Не требуются: фотография берётся из принадлежащего владельцу блока «Об авторе», домен уже опубликован. Владелец только оценивает результат после выпуска."
    gaps: []
    required: false

integration:
  integration_points:
    score: 100
    value: "platform.blog владеет routes/shell/template/manifest consumption; platform.content — MD dialect, writer gates и article standard; product modules — CTA facts/links/component semantics; operations.proxy — public article/assets paths. Канонические MD+manifest одновременно формируют homepage cards, article metadata и related, исключая второй источник."
    gaps: []
    required: true

  dependencies:
    score: 100
    value: "Переиспользуются article_markup sanitizer/renderer, masterclass component allowlist pattern, existing blog theme/footer, product catalog public facts и current deploy pipeline. Новые внешние библиотеки не нужны."
    gaps: []
    required: false

  technical_constraints:
    score: 100
    value: "Slug только через validated lookup, не filesystem path; assets только allowlisted; HTTPS/internal links; raw HTML/script/iframe/styles запрещены; rendering не зависит от Playwright/Pikabu/runtime browser; public CTA не принимает email/local marker и не раскрывает CRM state."
    gaps: []
    required: false

  data_requirements:
    score: 100
    value: "Шесть full sources с exact external_id и provenance; локально сохранённые разрешённые media assets; MD как канон тела; manifest как канон slug/title/excerpt/category/hero/related/CTA/status/source. Writer validation/review artifacts остаются редакционным доказательством и не публикуются пользователю."
    gaps: []
    required: false

  migration_needs:
    score: 100
    value: "Для блога migration не нужна. Anonymous browser identity, consent records и CRM binding потребуют отдельного user-spec, migration, backup/restore и production approval; они вне текущего выпуска."
    gaps: []
    required: false

notes: "Первая попытка создать текстовую задачу не материализовалась в списке задач. Созданы повторная пользовательская задача «Чистописец: 6 статей блога» с обновлёнными exact source IDs и отдельная исследовательская задача «Исследование общей идентификации посетителей». Они владеют только своими work-папками, не меняют production и не конкурируют с интегрирующим блоговым потоком. Пользователь попросил фотографию и после пакета вопросов сказал, что на всё ответил; как обратимое техническое допущение используется принадлежащий ему exact asset из блока «Об авторе»: https://static.tildacdn.com/tild6131-3761-4733-b863-653238373732/image.png. Это не выдаётся за отдельное явное утверждение crop; crop выбирается адаптивно без изменения самого изображения."
