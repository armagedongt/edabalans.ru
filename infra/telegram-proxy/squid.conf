# Blind CONNECT proxy dedicated to the Telegram bot.
# The network firewall also restricts this listener to the production server.
http_port 3128

acl production_bot_server src 201.51.2.210/32
acl telegram_api dstdomain api.telegram.org
acl CONNECT method CONNECT
acl SSL_port port 443

http_access deny !CONNECT
http_access deny !SSL_port
http_access allow production_bot_server telegram_api
http_access deny all

# Do not cache or retain client request history.
cache deny all
access_log none
cache_store_log none
cache_log /dev/null
forwarded_for delete
via off

