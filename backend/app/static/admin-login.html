<!doctype html>
<html lang="ru">
<head>
<link rel="preload" href="/assets/fonts/manrope-cyrillic-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/manrope-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site-typography.css?v=20261018-brand-hero">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Вход в админку · Похудение — это есть!</title>
  <link rel="icon" type="image/svg+xml" href="/admin/static/admin-favicon.svg">
  <link rel="stylesheet" href="/admin/static/admin-login.css?v=20261019-minimal">
</head>
<body>
  <main class="login-shell">
    <section class="login-panel">
      <form class="login-card" id="login-form" aria-labelledby="login-title">
        <p class="login-kicker">Вход в админку</p>
        <h1 id="login-title">Похудение — это есть!</h1>
        <label>Логин или электронная почта<input name="username" autocomplete="username" required autofocus></label>
        <label>Пароль<span class="password-field"><input name="password" type="password" autocomplete="current-password" required><button type="button" id="show-password">Показать</button></span></label>
        <div class="login-error" id="login-error" role="alert"></div>
        <button class="login-submit" type="submit">Войти</button>
        <small class="login-help">Сессия сохранится на этом устройстве на 30 дней.</small>
      </form>
    </section>
  </main>
  <script src="/admin/static/admin-login.js"></script>
</body>
</html>
