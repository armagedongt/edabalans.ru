<!doctype html>
<html lang="ru">
<head>
<link rel="preload" href="/assets/fonts/manrope-cyrillic-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/manrope-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site-typography.css?v=20261018-typography">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Открыть канал</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #18212b); font: 16px/1.5 var(--ed-font-body, Manrope, Arial, sans-serif); }
    main { max-width: 460px; margin: 0 auto; padding: 24px; border: 1px solid var(--tg-theme-section-separator-color, #e0e4e8); border-radius: 14px; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
    .avatar { width: 64px; height: 64px; flex: 0 0 64px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 4px var(--tg-theme-bg-color, #fff), 0 4px 20px #18212b20; }
    h1 { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 600; }
    .role { margin: 3px 0 0; font-size: 15px; color: var(--tg-theme-hint-color, #66717d); }
    p { margin: 0 0 24px; }
    #status { margin: 16px 0 0; font-size: 14px; color: var(--tg-theme-hint-color, #5d6b78); }
    #status:empty { display: none; }
    a { display: block; padding: 13px 18px; border-radius: 12px; text-align: center; text-decoration: none; background: var(--tg-theme-button-color, #229ed9); color: var(--tg-theme-button-text-color, #fff); font-weight: 600; }
  </style>
  <script id="destination" type="application/json">{{DESTINATION_JSON}}</script>
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="/apps/channel-bridge/bridge.js"></script>
</head>
<body>
  <main>
    <header>
      <img class="avatar" src="/blog/assets/sergey-author-channel.webp" width="64" height="64" alt="Сергей Воронцов">
      <div>
        <h1>Сергей Воронцов</h1>
        <p class="role">Тренер по питанию</p>
      </div>
    </header>
    <p>Пишу о питании и похудении так, чтобы вы менялись.</p>
    <p>Познакомьтесь с моим подходом поближе — читайте статью-инструкцию в моем канале <strong>«Как сделать похудение проще»</strong> и не забудьте подписаться, чтобы не пропускать новые посты.</p>
    <a id="open-post" href="{{DESTINATION_URL}}">Открыть канал</a>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
