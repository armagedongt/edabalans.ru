<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Открыть канал</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 28px 24px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #18212b); font: 17px/1.5 system-ui, sans-serif; }
    main { max-width: 420px; margin: 3vh auto 0; }
    h1 { margin: 0 0 16px; font-size: 25px; line-height: 1.25; font-weight: 650; }
    p { margin: 0 0 24px; }
    #status { margin: 16px 0 0; font-size: 14px; color: var(--tg-theme-hint-color, #5d6b78); }
    #status:empty { display: none; }
    a { display: block; padding: 13px 18px; border-radius: 12px; text-align: center; text-decoration: none; background: var(--tg-theme-button-color, #229ed9); color: var(--tg-theme-button-text-color, #fff); font-weight: 600; }
  </style>
  <script id="destination" type="application/json">{{DESTINATION_JSON}}</script>
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="/apps/channel-bridge/bridge.js"></script>
</head>
<body>
  <main>
    <h1>Сергей Воронцов 🥖 Похудение — это есть!</h1>
    <p>Пишу об адекватном отношении к питанию и похудению так, чтобы вы менялись!</p>
    <a id="open-post" href="{{DESTINATION_URL}}">Открыть канал</a>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
