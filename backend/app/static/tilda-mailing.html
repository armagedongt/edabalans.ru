<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Перенос кабинетов — письма</title><link rel="icon" href="/admin/static/admin-favicon.svg"><link rel="stylesheet" href="/admin/static/admin.css"><link rel="stylesheet" href="/admin/static/admin-shell.css"><link rel="stylesheet" href="/admin/tilda-mailing/tilda-mailing.css"></head>
<body><aside class="admin-sidebar"></aside><main class="mailing-main"><h1>Перенос кабинетов — письма</h1><p>Письма подготовлены с существующими паролями. Открытие страницы и сохранение правок ничего не отправляют.</p><div id="mailing-status" role="status"></div><div class="mailing-toolbar"><button id="refresh" type="button">Обновить статусы</button><button id="launch" type="button" disabled>Отправить выбранные письма</button></div><div class="mailing-grid"><section><h2>Получатели</h2><div id="recipients"></div></section><section id="editor" hidden><h2 id="editor-title">Письмо</h2><form id="letter-form"><label>Тема<input id="subject" maxlength="300" required></label><label>Текст письма<textarea id="body" rows="22" maxlength="20000" required></textarea></label><label class="mailing-included"><input id="included" type="checkbox"> Включить в рассылку</label><div class="mailing-toolbar"><button id="save" type="submit">Сохранить</button><button id="copy" type="button">Скопировать письмо</button></div><div id="editor-status" role="status"></div></form></section></div></main><script src="/admin/static/admin-shell.js" defer></script><script src="/admin/tilda-mailing/tilda-mailing.js" defer></script></body></html>
