<script>
(function(global){
'use strict';
const keys=['protein','fat','carbohydrate','calories'];
function gcd(a,b){while(b){const c=a%b;a=b;b=c}return a||1n}
function fraction(n,d=1n){n=BigInt(n);d=BigInt(d);if(d<=0n)throw Error('Некорректный точный источник');const g=gcd(n<0n?-n:n,d);return {n:n/g,d:d/g}}
function add(a,b){return fraction(a.n*b.d+b.n*a.d,a.d*b.d)}
function multiply(a,n,d=1n){return fraction(a.n*BigInt(n),a.d*BigInt(d))}
function compare(a,b){const x=a.n*b.d,y=b.n*a.d;return x<y?-1:x>y?1:0}
function weight(raw){const s=String(raw).trim();if(!/^[0-9]+$/.test(s))return null;const n=BigInt(s);return n>=1n&&n<=99999n?n:null}
function quantity(raw){const s=String(raw).trim().replace(',','.');if(s.length>35||!/^[0-9]+(?:\.[0-9]{1,28})?$/.test(s))return null;const [a,b='']=s.split('.'),d=10n**BigInt(b.length),n=BigInt(a)*d+BigInt(b||'0');return n>=d&&n<=99999n*d?fraction(n,d):null}
function nutrition(raw,max){const s=String(raw).trim();if(!/^[0-9]+(?:[.,][0-9]{1,3})?$/.test(s))return null;const [a,b='']=s.replace(',','.').split('.');const n=BigInt(a)*1000n+BigInt(b.padEnd(3,'0'));return n<=BigInt(max)*1000n?n:null}
function exact(source){if(source.exact?.unit!=='per100_milli')throw Error('Точный источник недоступен. Откройте рецепт заново.');return Object.fromEntries(keys.map(k=>[k,fraction(source.exact[k].numerator,source.exact[k].denominator)]))}
function format(value,key){if(value===null)return '—';const divisor=key==='calories'?100000n:10000n;const d=value.d*divisor;const rounded=(2n*value.n+d)/(2n*d);return key==='calories'?String(rounded):String(rounded/10n)+','+String(rounded%10n)}
function ranks(values){return values.map(row=>Object.fromEntries(keys.map(k=>{if(!row||row[k].n===0n)return [k,null];const unique=[];for(const candidate of values){if(candidate&&candidate[k].n>0n&&!unique.some(v=>compare(v,candidate[k])===0))unique.push(candidate[k])}unique.sort((a,b)=>compare(b,a));const at=unique.slice(0,3).findIndex(v=>compare(v,row[k])===0);return [k,at<0?null:at+1]})))}
function calculate(rows,yieldRaw,portionRaw){const all=Object.fromEntries(keys.map(k=>[k,fraction(0n)]));let mass=0n,count=0;const values=rows.map(row=>{const w=weight(row.weight);if(!row.source||w===null)return null;const source=exact(row.source),v=Object.fromEntries(keys.map(k=>[k,multiply(source[k],w)]));mass+=w;count++;for(const k of keys)all[k]=add(all[k],v[k]);return v});const y=quantity(yieldRaw),p=quantity(portionRaw);return {values,ranks:ranks(values),mass,all:count?all:null,per100:count&&y?Object.fromEntries(keys.map(k=>[k,multiply(all[k],100n*y.d,y.n)])):null,perPortion:count&&y&&p&&compare(p,y)<=0?Object.fromEntries(keys.map(k=>[k,multiply(all[k],p.n*y.d,p.d*y.n)])):null}}
global.EdabalansRecipeMath=Object.freeze({keys,fraction,add,multiply,compare,weight,quantity,nutrition,exact,format,ranks,calculate});
}(window));
</script>
<script>
(function(){
'use strict';
const root=document.getElementById('recipes-app'),math=window.EdabalansRecipeMath;
const host=window.EdabalansAppHost||'https://edabalans.ru';
const context=window.EdabalansAppContext||{},accountUrl=context.accountUrl||'/lk';
const labels={protein:'Б',fat:'Ж',carbohydrate:'У',calories:'кал'},fullLabels={protein:'Белки',fat:'Жиры',carbohydrate:'Углеводы',calories:'Калории'};
let nextKey=0,displayFrame=0,statusTimer=0;
const state={title:'',notes:'',yield:'',portion:'',rows:[],recipe:null,base:'',generation:0,screen:0,saving:false,editor:null,recipes:[],products:[],originals:[],status:'Новый рецепт',error:false,conflict:false,libraryGeneration:0,openGeneration:0,deletedRecipes:new Set(),tutorialCompleted:null,tutorialBootstrapped:false,slides:[],tutorialStep:0,tutorialSaving:false};
function blank(){return {key:'row-'+(++nextKey),term:'',source:null,weight:'',items:[],searchGeneration:0,searchStatus:'',controller:null,timer:null,own:false}}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalized(value){return String(value).trim().replace(/\s+/g,' ')}
function normalizedWeight(value){const text=String(value).trim().replace(',','.');return /^[0-9]+$/.test(text)?String(BigInt(text)):text.replace(/^0+(?=[0-9])/,'').replace(/(\.[0-9]*?)0+$/,'$1').replace(/\.$/,'')}
function empty(row){return !row.source&&!row.term.trim()&&!row.weight.trim()}
function fingerprint(){return JSON.stringify({title:normalized(state.title),notes:state.notes,yield:normalizedWeight(state.yield),portion:normalizedWeight(state.portion),rows:state.rows.filter(row=>!empty(row)).map(row=>({kind:row.source?.kind||'',id:row.source?.id||'',term:row.source?'':normalized(row.term),weight:normalizedWeight(row.weight)}))})}
function dirty(){return fingerprint()!==state.base}
function setStatus(text,error=false,conflict=false){clearTimeout(statusTimer);state.status=text;state.error=error;state.conflict=conflict;renderStatus();if(!error&&!state.saving)statusTimer=setTimeout(()=>{root.querySelector('.recipe-status').hidden=true},3000)}
function renderStatus(){root.querySelector('.recipe-status').hidden=['Новый рецепт','Изменено'].includes(state.status);root.querySelector('.recipe-status-text').textContent=state.status;root.querySelector('.recipe-status').dataset.error=String(state.error);root.querySelector('.recipe-reload').hidden=!state.conflict;root.querySelector('.save').disabled=state.saving;root.querySelectorAll('[data-open],[data-original],[data-delete-recipe],.recipe-library-new').forEach(b=>b.disabled=state.saving)}

return JSON.stringify(persisted)
}
async function save(){if(state.saving)return;const error=validate();if(error){setStatus(error,true);updateResults();return}const body={title:normalized(state.title),notes:state.notes,yield:normalizedWeight(state.yield),portion:normalizedWeight(state.portion),ingredients:state.rows.filter(row=>!empty(row)).map(row=>({kind:row.source.kind,sourceId:row.source.id,weight:normalizedWeight(row.weight)}))};const sent=state.rows.filter(row=>!empty(row)).map(row=>({key:row.key,kind:row.source.kind,id:row.source.id}));const recipe=state.recipe,generation=state.generation,screen=state.screen,snapshot=fingerprint();if(recipe)body.version=recipe.version;state.saving=true;setStatus('Сохраняю…');try{const data=await api('/api/apps/recipes'+(recipe?'/'+recipe.id:''),{method:recipe?'PUT':'POST',body:JSON.stringify(body)});if(state.screen!==screen)return;if(state.generation===generation)reset(data.recipe);else{state.recipe=data.recipe;state.base=adoptSavedSources(data.recipe,sent,snapshot);setStatus(dirty()?'Изменено после сохранения':'Сохранено');updateResults()}await loadLibrary()}catch(error){setStatus(error.status===409?'Рецепт изменён в другой вкладке':error.message,true,error.status===409);if(error.timeout)await loadLibrary()}finally{state.saving=false;renderStatus()}}
async function loadLibrary(){const generation=++state.libraryGeneration;library.querySelector('.recipe-library-status').textContent='Загружаю…';try{const [recipes,products,originals]=await Promise.all([api('/api/apps/recipes'),api('/api/apps/recipes/products'),api('/api/apps/recipes/originals')]);if(generation!==state.libraryGeneration)return;state.recipes=recipes.recipes;state.products=products.products;state.originals=originals.originals;state.slides=recipes.help;if(!state.tutorialBootstrapped){state.tutorialBootstrapped=true;state.tutorialCompleted=recipes.tutorialCompleted;main.inert=!state.tutorialCompleted;if(state.tutorialCompleted)tutorial.close();else renderTutorial()}renderLibrary();library.querySelector('.recipe-library-status').textContent=''}catch(error){if(generation===state.libraryGeneration){library.querySelector('.recipe-library-status').textContent=error.message;if(!state.tutorialBootstrapped){tutorial.querySelector('.recipe-tutorial-error').textContent=error.message;tutorial.querySelector('.tutorial-next').textContent='Повторить'}}}}
function renderLibrary(){library.querySelector('.recipe-library-originals').innerHTML=state.originals.map(item=>`<div class="recipe-library-item"><button type="button" class="recipe-library-name" data-original="${esc(item.id)}">${esc(item.title)}</button></div>`).join('');library.querySelectorAll('[data-original]').forEach(button=>button.onclick=()=>openRecipe(button.dataset.original,true));library.querySelector('.recipe-library-recipes').innerHTML=state.recipes.length?state.recipes.map(item=>`<div class="recipe-library-item"><button type="button" class="recipe-library-name" data-open="${esc(item.id)}">${esc(item.title)}</button><button type="button" class="recipe-btn" data-delete-recipe="${esc(item.id)}" aria-label="Удалить рецепт ${esc(item.title)}">Удалить</button></div>`).join(''):'<p>Пока нет сохранённых рецептов.</p>';library.querySelector('.recipe-library-products').innerHTML=state.products.length?state.products.map(item=>`<div class="recipe-library-item"><div class="recipe-library-name">${esc(item.name)}<div class="recipe-library-meta">${esc(displaySource(item))}</div></div><button type="button" class="recipe-btn" data-hide-product="${esc(item.id)}" aria-label="Скрыть продукт ${esc(item.name)}">Скрыть</button></div>`).join(''):'<p>Своих продуктов пока нет.</p>';library.querySelectorAll('[data-open]').forEach(button=>button.onclick=()=>openRecipe(button.dataset.open));library.querySelectorAll('[data-delete-recipe]').forEach(button=>button.onclick=()=>deleteRecipe(button.dataset.deleteRecipe));library.querySelectorAll('[data-hide-product]').forEach(button=>button.onclick=async()=>{if(!confirm('Скрыть продукт из поиска? В сохранённых рецептах он останется.'))return;try{await api('/api/apps/recipes/products/'+button.dataset.hideProduct,{method:'DELETE'});await loadLibrary()}catch(error){library.querySelector('.recipe-library-status').textContent=error.message}});renderStatus()}
function allowDiscard(){return !dirty()||confirm('Есть несохранённые изменения. Открыть другой рецепт и потерять их?')}
function closeLibrary(){state.openGeneration++;library.close();root.querySelector('.open-library').focus()}
async function openRecipe(id,original=false){if(state.saving||!allowDiscard())return;const generation=state.generation,screen=state.screen,opening=++state.openGeneration;library.querySelector('.recipe-library-status').textContent='Открываю…';try{const data=await api('/api/apps/recipes/'+(original?'originals/':'')+id);if(state.generation!==generation||state.screen!==screen||state.openGeneration!==opening||state.deletedRecipes.has(id))return;reset(data.recipe);closeLibrary()}catch(error){if(state.generation!==generation||state.screen!==screen||state.openGeneration!==opening)return;if(library.open)library.querySelector('.recipe-library-status').textContent=error.message;else setStatus(error.message,true,true)}}
async function deleteRecipe(id){if(state.saving)return;const current=state.recipe?.id===id,screen=state.screen,generation=state.generation,opening=state.openGeneration;if(!confirm(current&&dirty()?'Удалить рецепт и потерять несохранённые изменения?':'Удалить рецепт?'))return;try{await api('/api/apps/recipes/'+id,{method:'DELETE'});state.deletedRecipes.add(id);if(state.recipe?.id===id){if(current&&state.screen===screen&&state.generation===generation&&state.openGeneration===opening)reset();else{state.recipe=null;state.base='';setStatus('Рецепт удалён. Текущий черновик можно сохранить как новый.');updateResults()}}await loadLibrary()}catch(error){library.querySelector('.recipe-library-status').textContent=error.message}}
function renderTutorial(){const slide=state.slides[state.tutorialStep];tutorial.querySelector('.recipe-tutorial-progress').textContent=slide?(state.tutorialStep+1)+' из '+state.slides.length:'';tutorial.querySelector('h2').textContent=slide?.title||'Как пользоваться';tutorial.querySelector('.recipe-tutorial-body').innerHTML=slide?slide.body.split(/\n\s*\n/).map(text=>'<p>'+esc(text)+'</p>').join(''):'<p>Загружаю…</p>';if(slide&&state.tutorialStep===2){const legend=document.createElement('div');legend.className='recipe-tutorial-legend';legend.innerHTML=math.keys.map(k=>'<span class="recipe-number" data-nutrient="'+k+'" data-rank="1">'+labels[k]+'</span>').join('');tutorial.querySelector('.recipe-tutorial-body').prepend(legend)}tutorial.querySelector('.tutorial-back').hidden=state.tutorialStep===0;tutorial.querySelector('.tutorial-next').textContent=state.tutorialStep===state.slides.length-1?'Начать':'Далее';tutorial.querySelector('.tutorial-close').hidden=!state.tutorialCompleted;tutorial.querySelector('.recipe-tutorial-error').textContent='';tutorial.scrollTop=0}
function openTutorial(step=0){state.tutorialStep=state.tutorialCompleted?Math.max(0,Math.min(step,state.slides.length-1)):0;renderTutorial();if(!tutorial.open)tutorial.showModal()}
function closeTutorial(){tutorial.close();root.querySelector('.recipe-tutorial-link').focus()}
tutorial.addEventListener('cancel',e=>{if(!state.tutorialCompleted||state.tutorialSaving)e.preventDefault()});tutorial.querySelector('.tutorial-back').onclick=()=>{if(state.tutorialSaving)return;state.tutorialStep--;renderTutorial()};tutorial.querySelector('.tutorial-close').onclick=closeTutorial;tutorial.querySelector('.tutorial-next').onclick=async()=>{if(state.tutorialSaving)return;if(!state.tutorialBootstrapped){await loadLibrary();return}if(state.tutorialStep<state.slides.length-1){state.tutorialStep++;renderTutorial();return}const button=tutorial.querySelector('.tutorial-next');state.tutorialSaving=true;button.disabled=true;try{if(!state.tutorialCompleted)await api('/api/apps/recipes/tutorial',{method:'POST',body:'{}'});state.tutorialCompleted=true;main.inert=false;closeTutorial();window.dispatchEvent(new CustomEvent('edabalans:app-completed',{detail:{app:'recipes',completion:'tutorial'}}))}catch(error){tutorial.querySelector('.recipe-tutorial-error').textContent=error.message}finally{state.tutorialSaving=false;button.disabled=false}};
window.EdabalansRecipesOpenTutorial=()=>openTutorial();root.querySelector('.recipe-tutorial-link').onclick=()=>openTutorial();
root.querySelector('.recipe-device-switch').hidden=new URLSearchParams(location.search).get('appTest')!=='1';
root.querySelectorAll('[data-device]').forEach(button=>button.onclick=()=>{root.classList.toggle('recipe-phone',button.dataset.device==='phone');root.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));scheduleFit()});
main.inert=true;renderTutorial();tutorial.showModal();
root.querySelector('.recipe-title-edit').onclick=editTitle;titleInput.onblur=viewTitle;titleInput.onkeydown=e=>{if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();viewTitle();root.querySelector('.recipe-title-edit').focus()}};root.querySelector('.recipe-notes-edit').onclick=editNotes;const notesView=root.querySelector('.recipe-notes-view');notesView.onclick=e=>{if(!e.target.closest('a'))editNotes()};notesView.onkeydown=e=>{if(e.target===notesView&&(e.key==='Enter'||e.key===' ')){e.preventDefault();editNotes()}};notesInput.onblur=viewNotes;titleInput.oninput=()=>{state.title=titleInput.value;changed()};notesInput.oninput=()=>{state.notes=notesInput.value;changed()};quantityInput(yieldInput,value=>{state.yield=value;changed()});quantityInput(portionInput,value=>{state.portion=value;changed()});root.querySelector('.save').onclick=save;
root.querySelector('.open-account').onclick=function(){location.href=accountUrl};
root.querySelector('.recipe-add').onclick=()=>{let row=state.rows.at(-1);if(!empty(row)&&state.rows.length>=100){setStatus('В рецепте допустимы до 100 строк',true);return}closeEditor();if(!empty(row)){row=blank();state.rows.push(row);createRow(row)}beginEdit(row,'name');changed()};
root.querySelector('.open-library').onclick=()=>{closeEditor();library.showModal();loadLibrary()};root.querySelector('.close-library').onclick=closeLibrary;library.addEventListener('cancel',()=>{state.openGeneration++;root.querySelector('.open-library').focus()});library.querySelector('.recipe-library-new').onclick=()=>{if(state.saving||!allowDiscard())return;reset();closeLibrary();editTitle()};root.querySelector('.recipe-reload').onclick=()=>{if(state.recipe)openRecipe(state.recipe.id)};
root.addEventListener('focusout',()=>{setTimeout(()=>{if(state.editor){const row=state.rows.find(r=>r.key===state.editor.key),el=row&&rowElement(row);if(el&&!row.own&&!el.contains(document.activeElement))closeEditor()}},0)});
window.addEventListener('resize',()=>{if(root.isConnected)scheduleFit()});window.addEventListener('beforeunload',e=>{if(root.isConnected&&dirty()){e.preventDefault();e.returnValue=''}});
reset();loadLibrary();
}());
</script>
