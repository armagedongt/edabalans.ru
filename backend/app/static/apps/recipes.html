<script>
(function(global){
'use strict';
const keys=['protein','fat','carbohydrate','calories'];
function gcd(a,b){while(b){const c=a%b;a=b;b=c}return a||1n}
function fraction(n,d=1n){n=BigInt(n);d=BigInt(d);if(d<=0n)throw Error('Некорректный точный источник');const g=gcd(n<0n?-n:n,d);return {n:n/g,d:d/g}}
function add(a,b){return fraction(a.n*b.d+b.n*a.d,a.d*b.d)}
function multiply(a,n,d=1n){return fraction(a.n*BigInt(n),a.d*BigInt(d))}
function compare(a,b){const x=a.n*b.d,y=b.n*a.d;return x<y?-1:x>y?1:0}
function weight(raw){const s=String(raw).trim();if(!/^[0-9]+$/.test(s))return null;const n=BigInt(s);return n>=1n&&n<=99999n?n:null}
function nutrition(raw,max){const s=String(raw).trim();if(!/^[0-9]+(?:[.,][0-9]{1,3})?$/.test(s))return null;const [a,b='']=s.replace(',','.').split('.');const n=BigInt(a)*1000n+BigInt(b.padEnd(3,'0'));return n<=BigInt(max)*1000n?n:null}
function exact(source){if(source.exact?.unit!=='per100_milli')throw Error('Точный источник недоступен. Откройте рецепт заново.');return Object.fromEntries(keys.map(k=>[k,fraction(source.exact[k].numerator,source.exact[k].denominator)]))}
function format(value,key){if(value===null)return '—';const divisor=key==='calories'?100000n:10000n;const d=value.d*divisor;const rounded=(2n*value.n+d)/(2n*d);return key==='calories'?String(rounded):String(rounded/10n)+','+String(rounded%10n)}
function ranks(values){return values.map(row=>Object.fromEntries(keys.map(k=>{if(!row||row[k].n===0n)return [k,null];const unique=[];for(const candidate of values){if(candidate&&candidate[k].n>0n&&!unique.some(v=>compare(v,candidate[k])===0))unique.push(candidate[k])}unique.sort((a,b)=>compare(b,a));const at=unique.slice(0,3).findIndex(v=>compare(v,row[k])===0);return [k,at<0?null:at+1]})))}
function calculate(rows,yieldRaw,portionRaw){const all=Object.fromEntries(keys.map(k=>[k,fraction(0n)]));let mass=0n,count=0;const values=rows.map(row=>{const w=weight(row.weight);if(!row.source||w===null)return null;const source=exact(row.source),v=Object.fromEntries(keys.map(k=>[k,multiply(source[k],w)]));mass+=w;count++;for(const k of keys)all[k]=add(all[k],v[k]);return v});const y=weight(yieldRaw),p=weight(portionRaw);return {values,ranks:ranks(values),mass,all:count?all:null,per100:count&&y?Object.fromEntries(keys.map(k=>[k,multiply(all[k],100n,y)])):null,perPortion:count&&y&&p&&p<=y?Object.fromEntries(keys.map(k=>[k,multiply(all[k],p,y)])):null}}
global.EdabalansRecipeMath=Object.freeze({keys,fraction,add,multiply,compare,weight,nutrition,exact,format,ranks,calculate});
}(window));
</script>
<script>
(function(){
'use strict';
const root=document.getElementById('recipes-app'),math=window.EdabalansRecipeMath;
const host=window.EdabalansAppHost||'https://edabalans.ru';
const context=window.EdabalansAppContext||{},accountUrl=context.accountUrl||'/lk';
const labels={protein:'Б',fat:'Ж',carbohydrate:'У',calories:'кал'},fullLabels={protein:'Белки',fat:'Жиры',carbohydrate:'Углеводы',calories:'Калории'};
let nextKey=0,displayFrame=0;
const state={title:'',yield:'',portion:'',rows:[],recipe:null,base:'',generation:0,screen:0,saving:false,editor:null,recipes:[],products:[],status:'Новый рецепт',error:false,conflict:false,libraryGeneration:0,openGeneration:0,deletedRecipes:new Set()};
function blank(){return {key:'row-'+(++nextKey),term:'',source:null,weight:'',items:[],searchGeneration:0,searchStatus:'',controller:null,timer:null,own:false}}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalized(value){return String(value).trim().replace(/\s+/g,' ')}
function normalizedWeight(value){const text=String(value).trim();return /^[0-9]+$/.test(text)?String(BigInt(text)):text}
function empty(row){return !row.source&&!row.term.trim()&&!row.weight.trim()}
function fingerprint(){return JSON.stringify({title:normalized(state.title),yield:normalizedWeight(state.yield),portion:normalizedWeight(state.portion),rows:state.rows.filter(row=>!empty(row)).map(row=>({kind:row.source?.kind||'',id:row.source?.id||'',term:row.source?'':normalized(row.term),weight:normalizedWeight(row.weight)}))})}
function dirty(){return fingerprint()!==state.base}
function setStatus(text,error=false,conflict=false){state.status=text;state.error=error;state.conflict=conflict;renderStatus()}
function renderStatus(){root.querySelector('.recipe-status-text').textContent=state.status;root.querySelector('.recipe-status').dataset.error=String(state.error);root.querySelector('.recipe-reload').hidden=!state.conflict;root.querySelector('.save').disabled=state.saving;root.querySelectorAll('[data-open],[data-delete-recipe],.recipe-library-new').forEach(b=>b.disabled=state.saving)}
function changed(){state.generation++;if(!state.saving)setStatus(dirty()?'Изменено':state.recipe?'Сохранено':'Новый рецепт');updateResults()}
async function api(path,options={},externalSignal){const controller=new AbortController();let timedOut=false;const abort=()=>controller.abort();externalSignal?.addEventListener('abort',abort,{once:true});const timeout=setTimeout(()=>{timedOut=true;controller.abort()},10000);try{const response=await fetch(host+path,{...options,credentials:'include',headers:{'Content-Type':'application/json',...options.headers},signal:controller.signal});const data=await response.json();if(!response.ok||!data.ok){const error=Error(typeof(data.error||data.detail)==='string'?(data.error||data.detail):'Не удалось выполнить действие');error.status=response.status;throw error}return data}catch(error){if(timedOut){const timeoutError=Error('Ответ не получен. Черновик сохранён на экране; проверьте «Мои рецепты» перед повторной попыткой.');timeoutError.timeout=true;throw timeoutError}if(error.name==='TypeError')throw Error('Нет связи. Данные остаются на экране. Попробуйте ещё раз.');throw error}finally{clearTimeout(timeout);externalSignal?.removeEventListener('abort',abort)}}
root.innerHTML=`<main class="recipe-shell"><header class="recipe-heading"><h1>Калькулятор рецептов</h1><button type="button" class="open-account" aria-label="Личный кабинет" title="Личный кабинет"></button></header><div class="recipe-controls"><input class="recipe-title" aria-label="Название рецепта" maxlength="255" placeholder="Название рецепта"><button type="button" class="recipe-btn open-library">Мои рецепты</button><button type="button" class="recipe-btn primary save">Сохранить</button></div><div class="recipe-status" role="status" aria-live="polite"><span class="recipe-status-text"></span><button type="button" class="recipe-btn recipe-reload" hidden>Открыть свежую версию</button></div><div class="recipe-parameters"><label>Вес готового блюда, г<input class="recipe-yield" inputmode="numeric" autocomplete="off" aria-describedby="recipe-yield-error"><span class="recipe-error" id="recipe-yield-error"></span></label><label>Вес порции, г<input class="recipe-portion" inputmode="numeric" autocomplete="off" aria-describedby="recipe-portion-error"><span class="recipe-error" id="recipe-portion-error"></span></label></div><div class="recipe-table" role="table" aria-label="Состав и КБЖУ рецепта"><div class="recipe-columns" role="row"><span role="columnheader">похудение-это-есть.рф</span><span role="columnheader">Вес</span><span role="columnheader">Б</span><span role="columnheader">Ж</span><span role="columnheader">У</span><span role="columnheader">кал</span></div><div class="recipe-rows" role="rowgroup"></div><div class="recipe-totals" role="rowgroup"></div></div><div class="recipe-add-area"><button type="button" class="recipe-btn recipe-add">+ Добавить продукт</button></div></main><dialog class="recipe-library" aria-labelledby="recipe-library-title"><div class="recipe-library-head"><h2 id="recipe-library-title">Мои рецепты</h2><button type="button" class="recipe-btn close-library">Закрыть</button></div><button type="button" class="recipe-btn recipe-library-new">+ Новый рецепт</button><div class="recipe-library-status" role="status" aria-live="polite"></div><section class="recipe-library-recipes"></section><h3>Мои продукты</h3><section class="recipe-library-products"></section></dialog>`;
const titleInput=root.querySelector('.recipe-title'),yieldInput=root.querySelector('.recipe-yield'),portionInput=root.querySelector('.recipe-portion'),rowsNode=root.querySelector('.recipe-rows'),library=root.querySelector('.recipe-library');
root.querySelector('.recipe-totals').innerHTML=[['all','Итого на блюдо'],['per100','Итого на 100 г'],['perPortion','Итого на порцию']].map(([kind,title])=>`<div class="recipe-total ${kind}" role="row" data-total="${kind}"><div class="recipe-total-label" role="rowheader">${title}</div><div class="recipe-cell recipe-weight-cell" role="cell"><span class="recipe-number" data-weight></span></div>${math.keys.map(k=>`<div class="recipe-cell" role="cell" data-nutrient="${k}"><span class="recipe-number" data-nutrient="${k}"></span></div>`).join('')}</div>`).join('');
function rowElement(row){return Array.from(rowsNode.children).find(el=>el.dataset.key===row.key)}
function createRow(row){const el=document.createElement('div');el.className='recipe-row';el.dataset.key=row.key;el.setAttribute('role','row');el.innerHTML=`<div class="recipe-cell recipe-name-cell" role="cell"></div><div class="recipe-cell recipe-weight-cell" role="cell"></div>${math.keys.map(k=>`<div class="recipe-cell" role="cell" data-nutrient="${k}"><span class="recipe-number" data-nutrient="${k}"></span></div>`).join('')}<div class="recipe-error recipe-row-error" id="error-${row.key}" hidden></div><div class="recipe-extra" hidden></div>`;rowsNode.append(el);renderRowFields(row);return el}
function cancelSearch(row){clearTimeout(row.timer);row.controller?.abort();row.controller=null;row.searchGeneration++;row.items=[];row.searchStatus=''}
function closeEditor(){if(!state.editor)return;const row=state.rows.find(r=>r.key===state.editor.key);state.editor=null;if(row){cancelSearch(row);row.own=false;renderRowFields(row)}updateResults()}
function beginEdit(row,field){if(state.editor?.key!==row.key||state.editor?.field!==field)closeEditor();state.editor={key:row.key,field};renderRowFields(row);const input=rowElement(row).querySelector(field==='name'?'.product-input':'.weight-input');input.focus();input.select();if(field==='name'&&row.term.trim())search(row)}
function renderRowFields(row){const el=rowElement(row);if(!el)return;const active=state.editor?.key===row.key,field=active?state.editor.field:null;el.hidden=empty(row)&&state.rows.at(-1)===row&&state.rows.length>1&&!active;
const name=el.querySelector('.recipe-name-cell'),weight=el.querySelector('.recipe-weight-cell');
if(field==='name'){name.innerHTML=`<input class="product-input" aria-label="Название продукта" aria-autocomplete="list" aria-controls="suggestions-${row.key}" aria-expanded="false" autocomplete="off" value="${esc(row.term)}" aria-describedby="error-${row.key}">`;const input=name.firstChild;input.oninput=()=>{row.term=input.value;row.source=null;row.own=false;changed();search(row)};input.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();closeEditor()}if(e.key==='ArrowDown'){const option=el.querySelector('.recipe-suggestion');if(option){e.preventDefault();option.focus()}}}}
else{name.innerHTML=`<button type="button" class="recipe-edit ${row.term?'':'placeholder'}" aria-label="Изменить продукт: ${esc(row.term||'пустая строка')}">${esc(row.term||'Выбрать продукт')}</button>`;name.firstChild.onclick=()=>beginEdit(row,'name')}
if(field==='weight'){weight.innerHTML=`<input class="weight-input" aria-label="Вес ингредиента в граммах" inputmode="numeric" autocomplete="off" value="${esc(row.weight)}" aria-describedby="error-${row.key}">`;const input=weight.firstChild;input.oninput=()=>{row.weight=input.value;changed()};input.onkeydown=e=>{if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();closeEditor()}}}
else{weight.innerHTML=`<button type="button" class="recipe-edit" aria-label="Изменить вес: ${esc(row.term||'пустая строка')}"><span class="recipe-number" data-weight>${esc(math.weight(row.weight)!==null?String(math.weight(row.weight)):row.weight||'—')}</span></button>`;weight.firstChild.onclick=()=>beginEdit(row,'weight')}
const extra=el.querySelector('.recipe-extra');extra.hidden=!active;if(active)renderSearch(row);else extra.innerHTML='';
}
function search(row){cancelSearch(row);const term=row.term.trim(),generation=row.searchGeneration,screen=state.screen;row.searchStatus=term?'Ищу…':'';renderSearch(row);if(!term)return;row.timer=setTimeout(async()=>{const controller=new AbortController();row.controller=controller;try{const data=await api('/api/apps/recipes/catalog?q='+encodeURIComponent(term),{},controller.signal);if(state.screen!==screen||!state.rows.includes(row)||row.searchGeneration!==generation||row.term.trim()!==term||state.editor?.key!==row.key)return;row.items=data.items;row.searchStatus=row.items.length?'На 100 г':'Ничего не найдено'}catch(error){if(row.searchGeneration!==generation||state.screen!==screen||!state.rows.includes(row))return;if(error.name==='AbortError')return;row.searchStatus=error.message;row.items=[]}finally{if(state.screen===screen&&state.rows.includes(row)&&row.searchGeneration===generation&&state.editor?.key===row.key)renderSearch(row)}},200)}
function displaySource(item){const exact=math.exact(item);return math.keys.map(k=>labels[k]+' '+math.format(math.multiply(exact[k],100n),k)).join(' · ')}
function renderSearch(row){const el=rowElement(row);if(!el||state.editor?.key!==row.key)return;const extra=el.querySelector('.recipe-extra');if(row.own)return;extra.innerHTML=`${state.editor.field==='name'?`<div class="recipe-search-status" role="status">${esc(row.searchStatus)}</div><div class="recipe-suggestions" id="suggestions-${row.key}" role="listbox" aria-label="Продукты и рецепты">${row.items.map((item,i)=>`<button type="button" class="recipe-suggestion" role="option" aria-selected="false" data-pick="${i}"><strong>${esc(item.name)}</strong><small>${esc(item.kind==='recipe'?'Мой рецепт':item.isPersonal?'Мой продукт':'Общий каталог')} · на 100 г: ${esc(displaySource(item))}</small></button>`).join('')}</div>`:''}<div class="recipe-row-actions">${state.editor.field==='name'?'<button type="button" class="recipe-btn recipe-own-trigger">+ Добавить свой продукт</button>':''}<button type="button" class="recipe-btn recipe-remove">Удалить строку</button><button type="button" class="recipe-btn finish-edit">Готово</button></div>`;
el.querySelector('.product-input')?.setAttribute('aria-expanded',String(row.items.length>0));extra.querySelectorAll('[data-pick]').forEach(button=>{button.onclick=()=>pick(row,row.items[button.dataset.pick]);button.onkeydown=e=>{const options=Array.from(extra.querySelectorAll('[data-pick]')),at=options.indexOf(button);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();options[(at+(e.key==='ArrowDown'?1:options.length-1))%options.length].focus()}if(e.key==='Escape'){e.preventDefault();el.querySelector('.product-input').focus()}}});extra.querySelector('.recipe-own-trigger')?.addEventListener('click',()=>ownForm(row));extra.querySelector('.recipe-remove').onclick=()=>removeRow(row);extra.querySelector('.finish-edit').onclick=()=>{closeEditor();rowElement(row)?.querySelector('.recipe-name-cell button')?.focus()}}
function pick(row,item){if(!item||!state.rows.includes(row))return;cancelSearch(row);row.source=item;row.term=item.name;row.own=false;state.editor=null;renderRowFields(row);if(state.rows.at(-1)===row&&state.rows.length<100){const trailing=blank();state.rows.push(trailing);createRow(trailing)}changed();rowElement(row).querySelector('.recipe-weight-cell button').focus()}
function removeRow(row){cancelSearch(row);const index=state.rows.indexOf(row);state.rows.splice(index,1);rowElement(row)?.remove();state.editor=null;if(!state.rows.length){const newRow=blank();state.rows.push(newRow);createRow(newRow)}changed();rowElement(state.rows[Math.min(index,state.rows.length-1)])?.querySelector('.recipe-name-cell button').focus()}
function ownForm(row){cancelSearch(row);row.own=true;const extra=rowElement(row).querySelector('.recipe-extra');extra.innerHTML=`<form class="recipe-own-form"><h3>Свой продукт · на 100 г</h3><label>Название<input name="name" maxlength="255" value="${esc(row.term)}" autocomplete="off"></label><div class="recipe-own-grid">${math.keys.map(k=>`<label>${fullLabels[k]}${k==='calories'?'':' , г'}<input name="${k}" inputmode="decimal" autocomplete="off" value="0"></label>`).join('')}</div><div class="recipe-error own-error" role="status"></div><div class="recipe-row-actions"><button type="submit" class="recipe-btn add-own">Добавить</button><button type="button" class="recipe-btn cancel-own">Отмена</button></div></form>`;const form=extra.firstChild;form.querySelector('input').focus();form.querySelector('.cancel-own').onclick=()=>{row.own=false;renderSearch(row);rowElement(row).querySelector('.product-input')?.focus()};form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('.add-own');if(button.disabled)return;const fields=new FormData(form),name=normalized(fields.get('name'));const body={name};let message=!name||name.length>255?'Введите название до 255 символов':'';for(const k of math.keys){body[k]=fields.get(k);if(math.nutrition(body[k],k==='calories'?1000:100)===null)message=fullLabels[k]+': число от 0 до '+(k==='calories'?'1000':'100')+', не более трёх знаков после запятой'}form.querySelector('.own-error').textContent=message;if(message)return;button.disabled=true;const screen=state.screen,generation=row.searchGeneration;try{const data=await api('/api/apps/recipes/products',{method:'POST',body:JSON.stringify(body)});if(state.screen===screen&&state.rows.includes(row)&&row.own&&row.searchGeneration===generation)pick(row,data.product)}catch(error){form.querySelector('.own-error').textContent=error.message}finally{button.disabled=false}}}
function rowMessage(row){if(empty(row))return state.rows.at(-1)===row?'':'Заполните или удалите пустую строку';if(!row.source)return 'Выберите продукт или рецепт из поиска';if(math.weight(row.weight)===null)return 'Вес: целое число от 1 до 99 999 г';return ''}
function numberNode(el,k){return el.querySelector('.recipe-cell[data-nutrient="'+k+'"] .recipe-number')}
function updateResults(){let result;try{result=math.calculate(state.rows,state.yield,state.portion)}catch(error){setStatus(error.message,true);return}const authoritative=state.generation===state.serverGeneration?state.recipe:null;let savedIndex=0;
state.rows.forEach((row,index)=>{const el=rowElement(row);if(!el)return;el.hidden=empty(row)&&state.rows.at(-1)===row&&state.rows.length>1&&state.editor?.key!==row.key;const saved=!empty(row)?authoritative?.ingredients[savedIndex++]:null;for(const k of math.keys){const node=numberNode(el,k),values=result.values[index];node.textContent=saved?saved.total[k].replace('.',','):math.format(values?values[k]:null,k);const rank=saved?saved.ranks[k]:result.ranks[index][k];if(rank)node.dataset.rank=rank;else delete node.dataset.rank}const error=el.querySelector('.recipe-row-error'),message=rowMessage(row);error.hidden=!message;error.textContent=message;el.querySelector('input')?.setAttribute('aria-invalid',String(!!message))});
const y=math.weight(state.yield),p=math.weight(state.portion);const yError=state.yield.trim()&&y===null?'Введите целый выход от 1 до 99 999 г':'';const pError=state.portion.trim()&&(p===null||y&&p>y)?'Порция: целое число от 1 до выхода блюда':'';root.querySelector('#recipe-yield-error').textContent=yError;root.querySelector('#recipe-portion-error').textContent=pError;yieldInput.setAttribute('aria-invalid',String(!!yError));portionInput.setAttribute('aria-invalid',String(!!pError));
for(const kind of ['all','per100','perPortion']){const el=root.querySelector('[data-total="'+kind+'"]');const values=result[kind],mass=kind==='all'?y:kind==='per100'?(y?100n:null):(p&&y&&p<=y?p:null);el.querySelector('[data-weight]').textContent=mass!==null&&values?String(mass):'—';for(const k of math.keys)numberNode(el,k).textContent=authoritative?authoritative.totals[kind][k].replace('.',','):math.format(values?values[k]:null,k)}
if(result.mass>99999n&&!state.saving)setStatus('Суммарный вес ингредиентов не должен превышать 99 999 г',true);scheduleFit()}
// Check real glyph widths at this viewport; expanded rows never hide or shrink a value.
function scheduleFit(){cancelAnimationFrame(displayFrame);displayFrame=requestAnimationFrame(()=>{for(const el of root.querySelectorAll('.recipe-row,.recipe-total'))fitRow(el)})}
function restoreGrid(el){const values=el.querySelector('.recipe-values');if(values){for(const block of values.children){const cell=block.firstElementChild;el.insertBefore(cell,values)}values.remove()}el.classList.remove('expanded');el.querySelectorAll('.recipe-value-label').forEach(label=>label.remove())}
function fitRow(el){const focused=document.activeElement,start=focused.selectionStart,end=focused.selectionEnd;const keepFocus=()=>{if(el.contains(focused)&&document.activeElement!==focused){focused.focus({preventScroll:true});if(typeof start==='number')focused.setSelectionRange(start,end)}};restoreGrid(el);const cells=Array.from(el.children).filter(c=>c.classList.contains('recipe-cell')&&!c.classList.contains('recipe-name-cell'));const canvas=fitRow.canvas||(fitRow.canvas=document.createElement('canvas'));const measure=canvas.getContext('2d');const over=cells.some(cell=>{const node=cell.querySelector('.recipe-number');if(!node||node.textContent==='—')return false;const style=getComputedStyle(node),cellStyle=getComputedStyle(cell);measure.font=style.font;const available=cell.clientWidth-parseFloat(cellStyle.paddingLeft)-parseFloat(cellStyle.paddingRight);return measure.measureText(node.textContent).width+parseFloat(style.paddingLeft)+parseFloat(style.paddingRight)>available+.1});if(!over){keepFocus();return}el.classList.add('expanded');const values=document.createElement('div');values.className='recipe-values';const anchor=el.querySelector('.recipe-row-error');el.insertBefore(values,anchor);for(const cell of cells){const label=document.createElement('span');label.className='recipe-value-label';label.textContent=cell.dataset.nutrient?labels[cell.dataset.nutrient]:'Вес, г';const block=document.createElement('div');block.className='recipe-value-block';cell.prepend(label);block.append(cell);values.append(block)}keepFocus()}
function reset(recipe=null){state.openGeneration++;state.screen++;state.rows.forEach(cancelSearch);state.editor=null;state.recipe=recipe;state.title=recipe?.title||'';state.yield=recipe?String(recipe.yield):'';state.portion=recipe?String(recipe.portion):'';state.rows=recipe?recipe.ingredients.map(item=>({...blank(),key:item.id,term:item.source.name,source:item.source,weight:String(item.weight)})):[];if(state.rows.length<100)state.rows.push(blank());state.generation++;state.serverGeneration=state.generation;rowsNode.innerHTML='';state.rows.forEach(createRow);titleInput.value=state.title;yieldInput.value=state.yield;portionInput.value=state.portion;state.base=fingerprint();setStatus(recipe?'Сохранено':'Новый рецепт');updateResults()}
function validate(){const title=normalized(state.title);if(!title||title.length>255)return 'Введите название рецепта до 255 символов';if(!math.weight(state.yield))return 'Введите целый вес готового блюда от 1 до 99 999 г';const y=math.weight(state.yield),p=math.weight(state.portion);if(!p||p>y)return 'Порция должна быть от 1 г до веса готового блюда';const used=state.rows.filter((row,i)=>!(i===state.rows.length-1&&empty(row)));if(!used.length)return 'Добавьте хотя бы один продукт';if(used.some(row=>rowMessage(row)||empty(row)))return 'Проверьте продукт и вес в отмеченных строках';if(used.length>100||math.calculate(used,state.yield,state.portion).mass>99999n)return 'В рецепте допустимы до 100 строк и до 99 999 г ингредиентов';return ''}
async function save(){if(state.saving)return;const error=validate();if(error){setStatus(error,true);updateResults();return}const body={title:normalized(state.title),yield:normalizedWeight(state.yield),portion:normalizedWeight(state.portion),ingredients:state.rows.filter(row=>!empty(row)).map(row=>({kind:row.source.kind,sourceId:row.source.id,weight:normalizedWeight(row.weight)}))};const recipe=state.recipe,generation=state.generation,screen=state.screen,snapshot=fingerprint();if(recipe)body.version=recipe.version;state.saving=true;setStatus('Сохраняю…');try{const data=await api('/api/apps/recipes'+(recipe?'/'+recipe.id:''),{method:recipe?'PUT':'POST',body:JSON.stringify(body)});if(state.screen!==screen)return;if(state.generation===generation)reset(data.recipe);else{state.recipe=data.recipe;state.base=snapshot;setStatus(dirty()?'Изменено после сохранения':'Сохранено');updateResults()}await loadLibrary()}catch(error){setStatus(error.status===409?'Рецепт изменён в другой вкладке. Черновик остался на экране.':error.message,true,error.status===409);if(error.timeout)await loadLibrary()}finally{state.saving=false;renderStatus()}}
async function loadLibrary(){const generation=++state.libraryGeneration;library.querySelector('.recipe-library-status').textContent='Загружаю…';try{const [recipes,products]=await Promise.all([api('/api/apps/recipes'),api('/api/apps/recipes/products')]);if(generation!==state.libraryGeneration)return;state.recipes=recipes.recipes;state.products=products.products;renderLibrary();library.querySelector('.recipe-library-status').textContent=''}catch(error){if(generation===state.libraryGeneration)library.querySelector('.recipe-library-status').textContent=error.message}}
function renderLibrary(){library.querySelector('.recipe-library-recipes').innerHTML=state.recipes.length?state.recipes.map(item=>`<div class="recipe-library-item"><button type="button" class="recipe-library-name" data-open="${esc(item.id)}">${esc(item.title)}</button><button type="button" class="recipe-btn" data-delete-recipe="${esc(item.id)}" aria-label="Удалить рецепт ${esc(item.title)}">Удалить</button></div>`).join(''):'<p>Пока нет сохранённых рецептов.</p>';library.querySelector('.recipe-library-products').innerHTML=state.products.length?state.products.map(item=>`<div class="recipe-library-item"><div class="recipe-library-name">${esc(item.name)}<div class="recipe-library-meta">${esc(displaySource(item))}</div></div><button type="button" class="recipe-btn" data-hide-product="${esc(item.id)}" aria-label="Скрыть продукт ${esc(item.name)}">Скрыть</button></div>`).join(''):'<p>Своих продуктов пока нет.</p>';library.querySelectorAll('[data-open]').forEach(button=>button.onclick=()=>openRecipe(button.dataset.open));library.querySelectorAll('[data-delete-recipe]').forEach(button=>button.onclick=()=>deleteRecipe(button.dataset.deleteRecipe));library.querySelectorAll('[data-hide-product]').forEach(button=>button.onclick=async()=>{if(!confirm('Скрыть продукт из поиска? В сохранённых рецептах он останется.'))return;try{await api('/api/apps/recipes/products/'+button.dataset.hideProduct,{method:'DELETE'});await loadLibrary()}catch(error){library.querySelector('.recipe-library-status').textContent=error.message}});renderStatus()}
function allowDiscard(){return !dirty()||confirm('Есть несохранённые изменения. Открыть другой рецепт и потерять их?')}
function closeLibrary(){state.openGeneration++;library.close();root.querySelector('.open-library').focus()}
async function openRecipe(id){if(state.saving||!allowDiscard())return;const generation=state.generation,screen=state.screen,opening=++state.openGeneration;library.querySelector('.recipe-library-status').textContent='Открываю…';try{const data=await api('/api/apps/recipes/'+id);if(state.generation!==generation||state.screen!==screen||state.openGeneration!==opening||state.deletedRecipes.has(id))return;reset(data.recipe);closeLibrary()}catch(error){if(state.generation!==generation||state.screen!==screen||state.openGeneration!==opening)return;if(library.open)library.querySelector('.recipe-library-status').textContent=error.message;else setStatus(error.message,true,true)}}
async function deleteRecipe(id){if(state.saving)return;const current=state.recipe?.id===id,screen=state.screen,generation=state.generation,opening=state.openGeneration;if(!confirm(current&&dirty()?'Удалить рецепт и потерять несохранённые изменения?':'Удалить рецепт?'))return;try{await api('/api/apps/recipes/'+id,{method:'DELETE'});state.deletedRecipes.add(id);if(state.recipe?.id===id){if(current&&state.screen===screen&&state.generation===generation&&state.openGeneration===opening)reset();else{state.recipe=null;state.base='';setStatus('Рецепт удалён. Текущий черновик можно сохранить как новый.');updateResults()}}await loadLibrary()}catch(error){library.querySelector('.recipe-library-status').textContent=error.message}}
titleInput.oninput=()=>{state.title=titleInput.value;changed()};yieldInput.oninput=()=>{state.yield=yieldInput.value;changed()};portionInput.oninput=()=>{state.portion=portionInput.value;changed()};root.querySelector('.save').onclick=save;
root.querySelector('.open-account').onclick=function(){location.href=accountUrl};
root.querySelector('.recipe-add').onclick=()=>{let row=state.rows.at(-1);if(!empty(row)&&state.rows.length>=100){setStatus('В рецепте допустимы до 100 строк',true);return}closeEditor();if(!empty(row)){row=blank();state.rows.push(row);createRow(row)}beginEdit(row,'name');changed()};
root.querySelector('.open-library').onclick=()=>{closeEditor();library.showModal();loadLibrary()};root.querySelector('.close-library').onclick=closeLibrary;library.addEventListener('cancel',()=>{state.openGeneration++;root.querySelector('.open-library').focus()});library.querySelector('.recipe-library-new').onclick=()=>{if(state.saving||!allowDiscard())return;reset();closeLibrary();titleInput.focus()};root.querySelector('.recipe-reload').onclick=()=>{if(state.recipe)openRecipe(state.recipe.id)};
root.addEventListener('focusout',()=>{setTimeout(()=>{if(state.editor){const row=state.rows.find(r=>r.key===state.editor.key),el=row&&rowElement(row);if(el&&!row.own&&!el.contains(document.activeElement))closeEditor()}},0)});
window.addEventListener('resize',()=>{if(root.isConnected)scheduleFit()});window.addEventListener('beforeunload',e=>{if(root.isConnected&&dirty()){e.preventDefault();e.returnValue=''}});
reset();loadLibrary();
}());
</script>
