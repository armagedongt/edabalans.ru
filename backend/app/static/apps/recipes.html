<div id="recipes-app"></div>
<style>
#recipes-app{--ink:#242224;--muted:#807878;--paper:#fffdfb;--line:#e5dddd;--red:#a54545;--redsoft:#fbefed;box-sizing:border-box;max-width:1060px;margin:auto;padding:14px;font:14px/1.35 Arial,sans-serif;color:var(--ink)}#recipes-app *{box-sizing:border-box}#recipes-app button,#recipes-app input{font:inherit}#recipes-app button{cursor:pointer}#recipes-app .shell{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px #492d2610;overflow:hidden}.top{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.title{border:0;background:transparent;min-width:0;flex:1;font-size:21px;font-weight:700;outline:none}.actions{display:flex;gap:7px}.btn{border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:#fff;color:var(--ink);white-space:nowrap}.btn.primary{border-color:var(--red);background:var(--red);color:white}.btn.active{background:var(--redsoft);color:var(--red);border-color:#d6aaa5}.body{padding:12px 16px 16px}.head,.row{display:grid;grid-template-columns:minmax(190px,1.9fr) 86px minmax(205px,1.2fr) 26px;gap:8px;align-items:center}.head{padding:0 0 7px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.row{position:relative;border-top:1px solid #eee7e5;padding:7px 0}.field{width:100%;border:1px solid #d8cecc;border-radius:7px;background:#fff;padding:8px 9px;outline:none}.field:focus{border-color:#bc7772;box-shadow:0 0 0 3px #f6e3e1}.number{text-align:center}.nutrients{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.nutrient{min-width:0;padding:3px 4px;border-radius:5px;background:#faf6f5;text-align:center}.nutrient b{display:block;color:#783633;font-size:12px}.nutrient small{color:var(--muted);font-size:10px}.remove{border:0;background:transparent;color:#aa7974;font-size:19px;padding:2px}.suggestions{position:absolute;z-index:5;left:0;top:45px;width:min(390px,100%);background:white;border:1px solid #d7c9c7;border-radius:8px;box-shadow:0 10px 25px #39201b22;overflow:hidden}.suggestion{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;border-bottom:1px solid #f0e8e6;background:white;padding:9px 10px;text-align:left}.suggestion:hover{background:var(--redsoft)}.suggestion span{color:var(--muted);font-size:11px}.new-product{margin:9px 0 2px;padding:10px;border:1px dashed #cfaaa7;border-radius:8px;background:#fff9f8}.new-product[hidden]{display:none}.new-product-grid{display:grid;grid-template-columns:1.5fr repeat(4,75px) auto;gap:6px;align-items:center}.summary{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:10px;background:#fffafa}.summary-block{padding:10px 12px}.summary-block+ .summary-block{border-left:1px solid var(--line)}.summary label{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}.summary input{width:88px;border:0;border-bottom:1px solid #cfc2bf;background:transparent;text-align:center;padding:4px;outline:none;color:var(--ink);font-weight:700}.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.total{text-align:center}.total b{display:block;color:#803936;font-size:16px}.total small{color:var(--muted)}.recipe-list{padding:11px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;overflow:auto}.recipe-list strong{font-size:12px;color:var(--muted);white-space:nowrap}.recipe-chip{border:0;background:#f6f1ef;color:#564a48;padding:6px 8px;border-radius:7px;white-space:nowrap}.recipe-chip.selected{background:#e8c7c4;color:#622522}.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:700px){#recipes-app{padding:6px}.top{align-items:flex-start;flex-wrap:wrap}.title{font-size:19px;flex-basis:100%;order:0}.actions{width:100%;justify-content:space-between}.body{padding:8px 10px}.head{display:none}.row{grid-template-columns:1fr 70px 24px;gap:6px;padding:9px 0}.nutrients{grid-column:1/4;grid-row:2;grid-template-columns:repeat(4,1fr)}.new-product-grid{grid-template-columns:repeat(4,1fr)}.new-product-grid .field:first-child{grid-column:1/5}.new-product-grid .btn{grid-column:1/5}.summary{grid-template-columns:1fr}.summary-block+.summary-block{border-left:0;border-top:1px solid var(--line)}}
</style>
<script>
(function(){'use strict';var root=document.getElementById('recipes-app'),app={rows:[blank()],recipe:null,recipes:[],portion:false,portionG:0,portionKcal:0};function blank(){return{key:Math.random().toString(36).slice(2),term:'',source:null,weight:'100',items:[]}}function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function email(){return window.EdabalansIdentity&&window.EdabalansIdentity.email||''}function number(v){return /^\d+$/.test(String(v))?Number(v):0}function api(url,opts){opts=opts||{};opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});return fetch((window.EdabalansAppHost||'')+url,opts).then(function(r){return r.json().then(function(x){if(!r.ok||!x.ok)throw Error(x.error||x.detail||'Не удалось выполнить действие');return x})})}function fmt(v){return String(v||'0').replace(/\.0$/,'')}function totals(){var t={weight:0,protein:0,fat:0,carbohydrate:0,calories:0};app.rows.forEach(function(r){if(!r.source)return;var w=number(r.weight);t.weight+=w;['protein','fat','carbohydrate','calories'].forEach(function(k){t[k]+=Number(r.source[k])*w/100})});t.yield=t.weight-number(app.shrinkage);return t}function shown(t){var scale=app.portion&&t.yield>0?app.portionG/t.yield:1;return{protein:t.protein*scale,fat:t.fat*scale,carbohydrate:t.carbohydrate*scale,calories:t.calories*scale}}function nutrient(label,val){return'<div class="nutrient"><small>'+label+'</small><b>'+fmt(val)+'</b></div>'}function rowHtml(r,i){var per=r.source?'<div class="nutrients">'+nutrient('Б',r.source.protein)+nutrient('Ж',r.source.fat)+nutrient('У',r.source.carbohydrate)+nutrient('ккал',r.source.calories)+'</div>':'<div class="nutrients"><div class="nutrient"><small>Выберите продукт</small></div></div>';var items=r.items&&r.items.length?'<div class="suggestions">'+r.items.map(function(x){return'<button class="suggestion" data-pick="'+esc(x.id)+'" data-kind="'+esc(x.kind)+'"><b>'+esc(x.name)+'</b><span>Б '+fmt(x.protein)+' · Ж '+fmt(x.fat)+' · У '+fmt(x.carbohydrate)+' · '+fmt(x.calories)+' ккал</span></button>'}).join('')+'</div>':'';return'<div class="row" data-key="'+r.key+'"><input class="field product" value="'+esc(r.term)+'" placeholder="Продукт" autocomplete="off"><input class="field number weight" value="'+esc(r.weight)+'" inputmode="numeric" pattern="[0-9]*"><div>'+per+'</div><button class="remove" title="Удалить строку">×</button>'+items+'</div>'}function render(){var t=totals(),s=shown(t);if(!app.portionG&&t.yield>0)app.portionG=t.yield; if(!app.portionKcal&&t.yield>0)app.portionKcal=Math.round(t.calories);var rows=app.rows.map(rowHtml).join('');var chips=app.recipes.map(function(x){return'<button class="recipe-chip '+(app.recipe&&app.recipe.id===x.id?'selected':'')+'" data-open="'+x.id+'">'+esc(x.title)+'</button>'}).join('');root.innerHTML='<div class="shell"><div class="top"><input class="title" value="'+esc(app.recipe?app.recipe.title:'Новое блюдо')+'" aria-label="Название рецепта"><div class="actions"><button class="btn portion '+(app.portion?'active':'')+'">'+(app.portion?'Весь рецепт':'На порцию')+'</button><button class="btn primary save">Сохранить</button><button class="btn delete" '+(!app.recipe?'disabled':'')+'>Удалить</button></div></div><div class="body"><div class="head"><span>Продукт</span><span>Вес, г</span><span>На 100 г</span><span></span></div>'+rows+'<button class="btn add">+ Добавить продукт</button><div class="new-product" hidden></div><div class="summary"><div class="summary-block"><label>Вес до готовки <input class="raw-weight" readonly value="'+t.weight+' г"></label><label>Усушка / утруска <input class="shrinkage" inputmode="numeric" value="'+esc(app.shrinkage||'0')+'"> г</label><label>Выход <input class="yield" readonly value="'+Math.max(0,t.yield)+' г"></label></div><div class="summary-block"><label>Порция <input class="portion-g" inputmode="numeric" value="'+Math.round(app.portionG||0)+'"> г</label><label>Калории порции <input class="portion-kcal" inputmode="numeric" value="'+Math.round(app.portionKcal||0)+'"> ккал</label><div class="totals">'+nutrient('Белки',s.protein.toFixed(1))+nutrient('Жиры',s.fat.toFixed(1))+nutrient('Углеводы',s.carbohydrate.toFixed(1))+nutrient('Ккал',Math.round(s.calories))+'</div></div></div></div><div class="recipe-list"><strong>Мои блюда</strong>'+chips+'</div></div>';bind()}function selectNumeric(input){input.addEventListener('focus',function(){this.select()});input.addEventListener('keydown',function(e){if(['e','E','+','-','.',',','ArrowUp','ArrowDown'].indexOf(e.key)>-1)e.preventDefault()});input.addEventListener('input',function(){this.value=this.value.replace(/\D/g,'')});input.addEventListener('wheel',function(e){e.preventDefault()},{passive:false})}function bind(){root.querySelectorAll('input[inputmode="numeric"]').forEach(selectNumeric);root.querySelectorAll('.row').forEach(function(el){var r=app.rows.filter(function(x){return x.key===el.dataset.key})[0],product=el.querySelector('.product');product.oninput=function(){r.term=this.value;r.source=null;if(r.term.trim().length<1){r.items=[];render();return}api('/api/apps/recipes/catalog?email='+encodeURIComponent(email())+'&q='+encodeURIComponent(r.term)).then(function(x){r.items=x.items;render()}).catch(function(){r.items=[];render()})};product.onfocus=function(){if(r.source){r.term=r.source.name;r.source=null;product.select();api('/api/apps/recipes/catalog?email='+encodeURIComponent(email())+'&q='+encodeURIComponent(r.term)).then(function(x){r.items=x.items;render()})}};el.querySelector('.weight').oninput=function(){r.weight=this.value;render()};el.querySelector('.remove').onclick=function(){app.rows=app.rows.filter(function(x){return x!==r});if(!app.rows.length)app.rows=[blank()];render()};el.querySelectorAll('[data-pick]').forEach(function(b){b.onclick=function(){var found=r.items.filter(function(x){return x.id===b.dataset.pick&&x.kind===b.dataset.kind})[0];r.source=found;r.term=found.name;r.items=[];if(app.rows.indexOf(r)===app.rows.length-1)app.rows.push(blank());render()}})});root.querySelector('.add').onclick=function(){app.rows.push(blank());render()};root.querySelector('.portion').onclick=function(){app.portion=!app.portion;render()};root.querySelector('.shrinkage').oninput=function(e){app.shrinkage=e.target.value;render()};root.querySelector('.portion-g').oninput=function(e){var t=totals();app.portionG=Math.min(number(e.target.value),Math.max(0,t.yield));app.portionKcal=t.yield?app.portionG/t.yield*t.calories:0;render()};root.querySelector('.portion-kcal').oninput=function(e){var t=totals();app.portionKcal=number(e.target.value);app.portionG=t.calories?Math.min(t.yield,app.portionKcal/t.calories*t.yield):0;render()};root.querySelector('.save').onclick=save;root.querySelector('.delete').onclick=function(){if(!app.recipe||!confirm('Удалить рецепт?'))return;api('/api/apps/recipes/'+app.recipe.id+'?email='+encodeURIComponent(email()),{method:'DELETE'}).then(function(){app.recipe=null;app.rows=[blank()];return load()}).then(render).catch(alert)};root.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){api('/api/apps/recipes/'+b.dataset.open+'?email='+encodeURIComponent(email())).then(function(x){apply(x.recipe);render()}).catch(alert)}})}function save(){var title=root.querySelector('.title').value,items=app.rows.filter(function(r){return r.source}).map(function(r){return{kind:r.source.kind,sourceId:r.source.id,weight:r.weight}}),body={email:email(),title:title,shrinkage:app.shrinkage||'0',ingredients:items};if(app.recipe){body.version=app.recipe.version;api('/api/apps/recipes/'+app.recipe.id,{method:'PUT',body:JSON.stringify(body)}).then(function(x){apply(x.recipe);return load()}).then(render).catch(alert)}else api('/api/apps/recipes',{method:'POST',body:JSON.stringify(body)}).then(function(x){apply(x.recipe);return load()}).then(render).catch(alert)}function apply(recipe){app.recipe=recipe;app.shrinkage=String(recipe.shrinkage);app.rows=recipe.ingredients.map(function(x){return{key:x.id,term:x.source.name,source:Object.assign({},x.source,x.per100),weight:String(x.weight),items:[]}});app.portionG=Number(recipe.totals.yield);app.portionKcal=Number(recipe.totals.all.calories)}function load(){return api('/api/apps/recipes?email='+encodeURIComponent(email())).then(function(x){app.recipes=x.recipes})}load().then(render).catch(function(e){root.innerHTML='<div class="empty">'+esc(e.message)+'</div>'})}());
</script>
<script>
(function () {
  var root = document.getElementById('recipes-app');
  var activeProductField = null;
  function addOwnProductButton() {
    var add = root.querySelector('.add');
    if (add && !root.querySelector('.open-own-product')) {
      var button = document.createElement('button');
      button.className = 'btn open-own-product';
      button.type = 'button';
      button.textContent = 'Свой продукт';
      add.insertAdjacentElement('afterend', button);
    }
  }
  addOwnProductButton();
  new MutationObserver(addOwnProductButton).observe(root, {childList:true, subtree:true});
  root.addEventListener('focusin', function (event) {
    if (event.target.classList.contains('product')) activeProductField = event.target;
  });
  root.addEventListener('click', function (event) {
    var trigger = event.target.closest('.open-own-product');
    if (trigger) {
      var block = root.querySelector('.new-product');
      block.hidden = false;
      block.innerHTML = '<div class="new-product-grid"><input class="field own-name" placeholder="Свой продукт"><input class="field own-protein" inputmode="numeric" placeholder="Б"><input class="field own-fat" inputmode="numeric" placeholder="Ж"><input class="field own-carb" inputmode="numeric" placeholder="У"><input class="field own-kcal" inputmode="numeric" placeholder="ккал"><button class="btn primary save-own">Добавить</button></div>';
      block.querySelectorAll('input[inputmode="numeric"]').forEach(function (input) { input.onfocus = function () { input.select(); }; input.oninput = function () { input.value = input.value.replace(/\D/g, ''); }; });
      block.querySelector('.own-name').focus();
      return;
    }
    var save = event.target.closest('.save-own');
    if (!save) return;
    var form = save.closest('.new-product');
    var identity = window.EdabalansIdentity && window.EdabalansIdentity.email || '';
    fetch((window.EdabalansAppHost||'')+'/api/apps/recipes/products', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:identity,name:form.querySelector('.own-name').value,protein:form.querySelector('.own-protein').value,fat:form.querySelector('.own-fat').value,carbohydrate:form.querySelector('.own-carb').value,calories:form.querySelector('.own-kcal').value})}).then(function (response) { return response.json(); }).then(function (payload) { if (!payload.ok) throw Error(payload.error || 'Не удалось добавить продукт'); form.hidden=true; form.innerHTML=''; if (activeProductField) { activeProductField.value=payload.product.name; activeProductField.dispatchEvent(new Event('input', {bubbles:true})); } }).catch(function (error) { alert(error.message); });
  });
}());
</script>
