<div id="recipes-app"></div>
<style>
#recipes-app{--ink:#282426;--muted:#817779;--paper:#fffdfc;--line:#e9dfdf;--accent:#a84848;--accent-dark:#853232;--accent-soft:#fff1f0;max-width:940px;margin:0 auto;padding:10px;font:14px/1.35 Arial,sans-serif;color:var(--ink);box-sizing:border-box}#recipes-app *{box-sizing:border-box}#recipes-app button,#recipes-app input{font:inherit}.recipe-shell{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--paper);box-shadow:0 10px 30px rgba(55,30,30,.06)}.recipe-top{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--line)}.recipe-title{min-width:100px;flex:1;border:0;background:transparent;font-size:20px;font-weight:700;color:var(--ink);outline:0}.recipe-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}.recipe-btn{border:1px solid #dacdcc;border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}.recipe-btn:hover{border-color:#bd8c88;background:#fff8f7}.recipe-btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}.recipe-btn.primary:hover{background:var(--accent-dark)}.recipe-btn.active{border-color:#d7a6a2;background:var(--accent-soft);color:var(--accent-dark)}.recipe-body{padding:10px 15px 0}.recipe-columns,.recipe-row{display:grid;grid-template-columns:minmax(180px,1fr) 78px minmax(300px,1.25fr) 25px;gap:8px;align-items:center}.recipe-columns{padding:0 0 6px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.recipe-row{position:relative;padding:8px 0;border-top:1px solid #f0e8e7}.recipe-field{width:100%;height:35px;border:1px solid #dcd0cf;border-radius:8px;background:#fff;padding:7px 9px;color:var(--ink);outline:0}.recipe-field:focus{border-color:#bb7773;box-shadow:0 0 0 3px #f6e5e3}.recipe-weight{text-align:center;font-weight:700}.recipe-nutrients{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.recipe-nutrient{min-width:0;padding:4px 3px;border-radius:6px;background:#fbf6f5;text-align:center}.recipe-nutrient small{display:block;color:var(--muted);font-size:9px;line-height:1}.recipe-nutrient strong{display:block;margin-top:2px;color:var(--accent-dark);font-size:13px;line-height:1.1}.recipe-nutrient.is-per100 strong{color:#5d5556;font-size:11px}.recipe-remove{border:0;background:transparent;color:#b0807d;font-size:20px;line-height:1;cursor:pointer}.recipe-suggestions{position:absolute;z-index:8;top:46px;left:0;width:min(430px,100%);overflow:hidden;border:1px solid #ddc9c7;border-radius:9px;background:#fff;box-shadow:0 12px 25px rgba(59,33,31,.15)}.recipe-suggestion{display:grid;width:100%;grid-template-columns:minmax(0,1fr) 218px;align-items:center;gap:8px;border:0;border-bottom:1px solid #f2e9e7;background:#fff;padding:9px 10px;text-align:left;cursor:pointer}.recipe-suggestion:last-child{border:0}.recipe-suggestion:hover{background:var(--accent-soft)}.recipe-suggestion b{min-width:0}.recipe-suggestion span{color:var(--muted);font-size:11px;text-align:right}.recipe-own-trigger{grid-column:1/5;justify-self:start;border:0;background:transparent;padding:0;color:var(--accent);font-size:12px;cursor:pointer}.recipe-own-form{grid-column:1/5;display:grid;grid-template-columns:1.5fr repeat(4,64px) auto;gap:6px;padding:7px;border-radius:9px;background:var(--accent-soft)}.recipe-own-form[hidden]{display:none}.recipe-add{margin:8px 0 10px}.recipe-total{display:grid;grid-template-columns:112px repeat(5,minmax(0,1fr));align-items:stretch;border-top:1px solid var(--line);background:#fffafa}.recipe-total+.recipe-total{border-top:1px solid #eee3e1}.recipe-total-label{display:flex;align-items:center;padding:8px 12px;color:var(--muted);font-size:12px;font-weight:700}.recipe-total-value{padding:7px 3px;text-align:center}.recipe-total-value small{display:block;color:var(--muted);font-size:10px}.recipe-total-value strong{display:block;color:var(--accent-dark);font-size:15px}.recipe-total.per100 .recipe-total-value strong{font-size:13px;color:#5d5556}.recipe-bottom{margin:10px -15px 0;padding:10px 15px;border-top:1px solid var(--line);background:#fcf6f5}.recipe-bottom-line{display:flex;flex-wrap:wrap;align-items:center;gap:9px}.recipe-bottom-line+.recipe-bottom-line{margin-top:8px}.recipe-bottom-label{margin-right:2px;color:var(--muted);font-size:12px;font-weight:700}.recipe-compact{display:flex;align-items:center;gap:5px}.recipe-compact input{width:70px;height:29px;border:1px solid #d9cecd;border-radius:7px;background:#fff;padding:4px;text-align:center;font-weight:700;outline:0}.recipe-compact input:focus{border-color:#bb7773}.recipe-portion-totals{display:grid;grid-template-columns:repeat(4,minmax(48px,1fr));gap:4px;flex:1;min-width:230px}.recipe-portion-totals .recipe-nutrient{background:#fff}.recipe-library{position:fixed;z-index:9999;inset:0;display:flex;justify-content:flex-end;background:rgba(35,22,22,.28)}.recipe-library-panel{width:min(430px,100%);height:100%;overflow:auto;background:#fffdfc;box-shadow:-12px 0 32px rgba(48,25,23,.18);padding:18px}.recipe-library-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px}.recipe-library-head h2{margin:0;font-size:20px}.recipe-library-section{margin-top:20px}.recipe-library-section h3{margin:0 0 7px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.recipe-library-item{display:flex;align-items:center;gap:7px;padding:9px 0;border-top:1px solid #eee5e3}.recipe-library-item:first-of-type{border-top:0}.recipe-library-name{min-width:0;flex:1;font-weight:700}.recipe-library-meta{color:var(--muted);font-size:11px}.recipe-icon-btn{border:0;background:transparent;padding:5px;color:#8c6663;cursor:pointer}.recipe-empty{padding:17px 0;color:var(--muted)}
@media(max-width:700px){#recipes-app{padding:5px}.recipe-top{align-items:flex-start;flex-wrap:wrap;padding:12px}.recipe-title{flex-basis:100%;font-size:19px}.recipe-actions{width:100%;justify-content:space-between}.recipe-btn{padding:7px 8px;font-size:12px}.recipe-body{padding:8px 10px 0}.recipe-columns{display:none}.recipe-row{grid-template-columns:minmax(0,1fr) 66px 23px;gap:6px;padding:9px 0}.recipe-nutrients{grid-column:1/4;grid-row:2}.recipe-own-trigger,.recipe-own-form{grid-column:1/4}.recipe-own-form{grid-template-columns:repeat(4,1fr)}.recipe-own-form input:first-child,.recipe-own-form button{grid-column:1/5}.recipe-total{grid-template-columns:78px repeat(5,minmax(0,1fr))}.recipe-total-label{padding:7px;font-size:11px}.recipe-total-value{padding:6px 2px}.recipe-total-value strong{font-size:13px}.recipe-bottom{margin:9px -10px 0;padding:9px 10px}.recipe-portion-totals{width:100%;min-width:0}.recipe-suggestion{grid-template-columns:minmax(0,1fr) 150px}.recipe-suggestion span{display:block;margin-top:0;text-align:right}.recipe-library-panel{width:100%}}
</style>
<script>
(function(){
'use strict';
var root=document.getElementById('recipes-app');
var host=window.EdabalansAppHost||'https://app.edabalans.ru';
var context=window.EdabalansAppContext||{};
var accountUrl=context.accountUrl||'https://похудение-это-есть.рф/lk';
var state={rows:[blank()],recipe:null,title:'Новое блюдо',recipes:[],products:[],shrinkage:'0',portion:false,portionG:0,portionKcal:0,library:false,ownFor:null,focus:null};
function blank(){return{key:Math.random().toString(36).slice(2),term:'',source:null,weight:'100',items:[]}}
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function email(){return window.EdabalansIdentity&&window.EdabalansIdentity.email||''}
function digits(v){return /^\d+$/.test(String(v))?Number(v):0}
function fmt(v,dec){var n=Number(v)||0;return dec?n.toFixed(dec).replace(/\.0+$/,''):String(Math.round(n))}
function api(path,opts){opts=opts||{};opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});return fetch(host+path,opts).then(function(r){return r.json().then(function(data){if(!r.ok||!data.ok)throw Error(data.error||data.detail||'Не удалось выполнить действие');return data})})}
function totals(){var total={weight:0,protein:0,fat:0,carbohydrate:0,calories:0};state.rows.forEach(function(row){if(!row.source)return;var factor=digits(row.weight)/100;total.weight+=digits(row.weight);['protein','fat','carbohydrate','calories'].forEach(function(key){total[key]+=Number(row.source[key]||0)*factor})});total.yield=Math.max(0,total.weight-digits(state.shrinkage));return total}
function scale(){var total=totals();return state.portion&&total.yield?Math.min(state.portionG,total.yield)/total.yield:1}
function nutrient(label,value,per100){return'<div class="recipe-nutrient '+(per100?'is-per100':'')+'"><small>'+label+'</small><strong>'+fmt(value,per100?1:1)+'</strong></div>'}
function nutrients(values,per100){return'<div class="recipe-nutrients">'+nutrient('Б',values.protein,per100)+nutrient('Ж',values.fat,per100)+nutrient('У',values.carbohydrate,per100)+nutrient('ккал',values.calories,per100)+'</div>'}function rowNutrients(row){var labels=[['Б','protein'],['Ж','fat'],['У','carbohydrate'],['ккал','calories']],actual=sourceValues(row);return'<div class="recipe-nutrients">'+labels.map(function(item){return'<div class="recipe-nutrient"><small>'+item[0]+' · 100 г: '+fmt(row.source[item[1]],1)+'</small><strong>'+fmt(actual[item[1]],1)+'</strong></div>'}).join('')+'</div>'}
function sourceValues(row){var multiplier=digits(row.weight)/100*scale();return{protein:Number(row.source.protein||0)*multiplier,fat:Number(row.source.fat||0)*multiplier,carbohydrate:Number(row.source.carbohydrate||0)*multiplier,calories:Number(row.source.calories||0)*multiplier}}
function suggestionHtml(row){if(!row.items.length)return'';return'<div class="recipe-suggestions">'+row.items.map(function(item){return'<button type="button" class="recipe-suggestion" data-pick="'+esc(item.id)+'" data-kind="'+esc(item.kind)+'"><b>'+esc(item.name)+'</b><span>Б '+fmt(item.protein,1)+' · Ж '+fmt(item.fat,1)+' · У '+fmt(item.carbohydrate,1)+' · '+fmt(item.calories,0)+' ккал</span></button>'}).join('')+'</div>'}
function ownForm(row){if(state.ownFor!==row.key)return'';return'<div class="recipe-own-form"><input class="recipe-field own-name" value="'+esc(row.term)+'" placeholder="Название"><input class="recipe-field numeric own-protein" inputmode="numeric" placeholder="Б"><input class="recipe-field numeric own-fat" inputmode="numeric" placeholder="Ж"><input class="recipe-field numeric own-carb" inputmode="numeric" placeholder="У"><input class="recipe-field numeric own-kcal" inputmode="numeric" placeholder="ккал"><button type="button" class="recipe-btn primary save-own">Добавить</button></div>'}
function rowHtml(row){var view=row.source?rowNutrients(row):'<div class="recipe-nutrients"><div class="recipe-nutrient"><small>На 100 г / на '+(state.portion?'порцию':'вес')+'</small><strong>—</strong></div></div>';var helper=row.term&&!row.source?'<button type="button" class="recipe-own-trigger">+ Добавить свой продукт</button>':'';return'<div class="recipe-row" data-key="'+row.key+'"><input class="recipe-field product" value="'+esc(row.term)+'" placeholder="Продукт" autocomplete="off"><input class="recipe-field recipe-weight numeric" value="'+esc(row.weight)+'" inputmode="numeric" pattern="[0-9]*" aria-label="Вес в граммах"><div>'+view+'</div><button type="button" class="recipe-remove" title="Удалить строку">×</button>'+suggestionHtml(row)+helper+ownForm(row)+'</div>'}
function totalRow(label,values,kind){return'<div class="recipe-total '+kind+'"><div class="recipe-total-label">'+label+'</div>'+[['Вес','weight'],['Белки','protein'],['Жиры','fat'],['Углеводы','carbohydrate'],['Ккал','calories']].map(function(pair){return'<div class="recipe-total-value"><small>'+pair[0]+'</small><strong>'+fmt(values[pair[1]],kind==='per100'?1:1)+'</strong></div>'}).join('')+'</div>'}
function libraryHtml(){if(!state.library)return'';var recipes=state.recipes.length?state.recipes.map(function(item){return'<div class="recipe-library-item"><button type="button" class="recipe-library-name" data-open="'+item.id+'">'+esc(item.title)+'</button><button type="button" class="recipe-icon-btn" data-delete-recipe="'+item.id+'" title="Удалить">Удалить</button></div>'}).join(''):'<div class="recipe-empty">Пока нет сохранённых блюд.</div>';var products=state.products.length?state.products.map(function(item){return'<div class="recipe-library-item"><div class="recipe-library-name">'+esc(item.name)+'<div class="recipe-library-meta">Б '+fmt(item.protein,1)+' · Ж '+fmt(item.fat,1)+' · У '+fmt(item.carbohydrate,1)+' · '+fmt(item.calories,0)+' ккал</div></div><button type="button" class="recipe-icon-btn" data-delete-product="'+item.id+'" title="Скрыть из поиска">Удалить</button></div>'}).join(''):'<div class="recipe-empty">Своих продуктов пока нет.</div>';return'<div class="recipe-library"><aside class="recipe-library-panel"><div class="recipe-library-head"><h2>Мои блюда и продукты</h2><button type="button" class="recipe-btn close-library">Закрыть</button></div><button type="button" class="recipe-btn primary new-recipe">+ Новое блюдо</button><section class="recipe-library-section"><h3>Мои блюда</h3>'+recipes+'</section><section class="recipe-library-section"><h3>Мои продукты</h3>'+products+'</section></aside></div>'}
function render(){var total=totals();if(!state.portionG&&total.yield)state.portionG=total.yield;if(!state.portionKcal&&total.yield)state.portionKcal=Math.round(total.calories);var all={weight:state.portion?Math.min(state.portionG,total.yield):total.weight,protein:total.protein*scale(),fat:total.fat*scale(),carbohydrate:total.carbohydrate*scale(),calories:total.calories*scale()};var per100=total.yield?{weight:100,protein:total.protein/total.yield*100,fat:total.fat/total.yield*100,carbohydrate:total.carbohydrate/total.yield*100,calories:total.calories/total.yield*100}:{weight:0,protein:0,fat:0,carbohydrate:0,calories:0};root.innerHTML='<main class="recipe-shell"><header class="recipe-top"><input class="recipe-title" value="'+esc(state.title)+'" aria-label="Название блюда"><div class="recipe-actions"><button type="button" class="recipe-btn open-library">Мои блюда</button><button type="button" class="recipe-btn open-account">Личный кабинет</button><button type="button" class="recipe-btn portion '+(state.portion?'active':'')+'">'+(state.portion?'На весь рецепт':'На порцию')+'</button><button type="button" class="recipe-btn primary save">Сохранить</button></div></header><section class="recipe-body"><div class="recipe-columns"><span>Продукт</span><span>Вес, г</span><span>'+ (state.portion?'На порцию':'На введённый вес') +'</span><span></span></div>'+state.rows.map(rowHtml).join('')+'<button type="button" class="recipe-btn recipe-add">+ Добавить продукт</button>'+totalRow(state.portion?'На порцию':'Итого',all,'all')+totalRow('На 100 г',per100,'per100')+'<section class="recipe-bottom"><div class="recipe-bottom-line"><span class="recipe-bottom-label">Выход блюда</span><span class="recipe-compact"><input value="'+total.weight+'" readonly> г до готовки</span><span class="recipe-compact"><input class="numeric shrinkage" inputmode="numeric" value="'+esc(state.shrinkage)+'"> г усушка / утруска</span><span class="recipe-compact"><input value="'+total.yield+'" readonly> г готового</span></div><div class="recipe-bottom-line"><span class="recipe-bottom-label">Порция</span><span class="recipe-compact"><input class="numeric portion-g" inputmode="numeric" value="'+Math.round(state.portionG||0)+'"> г</span><span class="recipe-compact"><input class="numeric portion-kcal" inputmode="numeric" value="'+Math.round(state.portionKcal||0)+'"> ккал</span><div class="recipe-portion-totals">'+nutrient('Б',total.yield?total.protein*state.portionG/total.yield:0,false)+nutrient('Ж',total.yield?total.fat*state.portionG/total.yield:0,false)+nutrient('У',total.yield?total.carbohydrate*state.portionG/total.yield:0,false)+nutrient('ккал',total.yield?total.calories*state.portionG/total.yield:0,false)+'</div></div></section></section></main>'+libraryHtml();bind();restoreFocus()}
function restoreFocus(){if(!state.focus)return;var target=root.querySelector('[data-key="'+state.focus.key+'"] .product');if(target){target.focus();target.setSelectionRange(state.focus.caret,state.focus.caret)}state.focus=null}function numeric(input){input.addEventListener('focus',function(){this.select()});input.addEventListener('keydown',function(e){if(['e','E','+','-','.',',','ArrowUp','ArrowDown'].indexOf(e.key)>=0)e.preventDefault()});input.addEventListener('input',function(){this.value=this.value.replace(/\D/g,'')});input.addEventListener('wheel',function(e){e.preventDefault()},{passive:false})}
function bind(){root.querySelectorAll('.numeric').forEach(numeric);root.querySelectorAll('.recipe-row').forEach(function(el){var row=state.rows.filter(function(item){return item.key===el.dataset.key})[0];var product=el.querySelector('.product');product.oninput=function(){row.term=this.value;row.source=null;state.ownFor=null;if(!row.term.trim()){row.items=[];state.focus={key:row.key,caret:0};render();return}api('/api/apps/recipes/catalog?email='+encodeURIComponent(email())+'&q='+encodeURIComponent(row.term)).then(function(data){row.items=data.items;state.focus={key:row.key,caret:row.term.length};render()}).catch(function(){row.items=[];state.focus={key:row.key,caret:row.term.length};render()})};product.onfocus=function(){if(row.source){row.term=row.source.name;row.source=null;product.select();api('/api/apps/recipes/catalog?email='+encodeURIComponent(email())+'&q='+encodeURIComponent(row.term)).then(function(data){row.items=data.items;state.focus={key:row.key,caret:row.term.length};render()})}};el.querySelector('.recipe-weight').oninput=function(){row.weight=this.value};el.querySelector('.recipe-weight').onchange=render;el.querySelector('.recipe-remove').onclick=function(){state.rows=state.rows.filter(function(item){return item!==row});if(!state.rows.length)state.rows=[blank()];render()};el.querySelectorAll('[data-pick]').forEach(function(button){button.onclick=function(){var picked=row.items.filter(function(item){return item.id===button.dataset.pick&&item.kind===button.dataset.kind})[0];row.source=picked;row.term=picked.name;row.items=[];if(state.rows.indexOf(row)===state.rows.length-1)state.rows.push(blank());render()}});var own=el.querySelector('.recipe-own-trigger');if(own)own.onclick=function(){state.ownFor=row.key;render()};var saveOwn=el.querySelector('.save-own');if(saveOwn)saveOwn.onclick=function(){var form=saveOwn.closest('.recipe-own-form');api('/api/apps/recipes/products',{method:'POST',body:JSON.stringify({email:email(),name:form.querySelector('.own-name').value,protein:form.querySelector('.own-protein').value,fat:form.querySelector('.own-fat').value,carbohydrate:form.querySelector('.own-carb').value,calories:form.querySelector('.own-kcal').value})}).then(function(data){row.source=data.product;row.term=data.product.name;row.items=[];state.ownFor=null;return load()}).then(render).catch(function(error){alert(error.message)})}});root.querySelector('.recipe-add').onclick=function(){state.rows.push(blank());render()};root.querySelector('.portion').onclick=function(){state.portion=!state.portion;render()};root.querySelector('.shrinkage').oninput=function(e){state.shrinkage=e.target.value};root.querySelector('.shrinkage').onchange=render;root.querySelector('.portion-g').oninput=function(e){var total=totals();state.portionG=Math.min(digits(e.target.value),total.yield);state.portionKcal=total.yield?state.portionG/total.yield*total.calories:0};root.querySelector('.portion-g').onchange=render;root.querySelector('.portion-kcal').oninput=function(e){var total=totals();state.portionKcal=digits(e.target.value);state.portionG=total.calories?Math.min(total.yield,state.portionKcal/total.calories*total.yield):0};root.querySelector('.portion-kcal').onchange=render;root.querySelector('.recipe-title').oninput=function(e){state.title=e.target.value};root.querySelector('.save').onclick=save;root.querySelector('.open-library').onclick=function(){state.library=true;load().then(render)};root.querySelector('.open-account').onclick=function(){location.href=accountUrl};root.querySelectorAll('.close-library').forEach(function(button){button.onclick=function(){state.library=false;render()}});root.querySelectorAll('.new-recipe').forEach(function(button){button.onclick=function(){state.recipe=null;state.title='Новое блюдо';state.rows=[blank()];state.shrinkage='0';state.library=false;render()}});root.querySelectorAll('[data-open]').forEach(function(button){button.onclick=function(){api('/api/apps/recipes/'+button.dataset.open+'?email='+encodeURIComponent(email())).then(function(data){apply(data.recipe);state.library=false;render()}).catch(function(error){alert(error.message)})}});root.querySelectorAll('[data-delete-recipe]').forEach(function(button){button.onclick=function(){if(!confirm('Удалить блюдо?'))return;api('/api/apps/recipes/'+button.dataset.deleteRecipe+'?email='+encodeURIComponent(email()),{method:'DELETE'}).then(load).then(render).catch(function(error){alert(error.message)})}});root.querySelectorAll('[data-delete-product]').forEach(function(button){button.onclick=function(){if(!confirm('Скрыть продукт из поиска?'))return;api('/api/apps/recipes/products/'+button.dataset.deleteProduct+'?email='+encodeURIComponent(email()),{method:'DELETE'}).then(load).then(render).catch(function(error){alert(error.message)})}})}
function apply(recipe){state.recipe=recipe;state.title=recipe.title;state.shrinkage=String(recipe.shrinkage);state.rows=recipe.ingredients.map(function(item){return{key:item.id,term:item.source.name,source:Object.assign({},item.source,item.per100),weight:String(item.weight),items:[]}});state.portionG=Number(recipe.totals.yield);state.portionKcal=Number(recipe.totals.all.calories)}
function save(){var title=state.title;var ingredients=state.rows.filter(function(row){return row.source}).map(function(row){return{kind:row.source.kind,sourceId:row.source.id,weight:row.weight}});var body={email:email(),title:title,shrinkage:state.shrinkage,ingredients:ingredients};var request=state.recipe?api('/api/apps/recipes/'+state.recipe.id,{method:'PUT',body:JSON.stringify(Object.assign(body,{version:state.recipe.version}))}):api('/api/apps/recipes',{method:'POST',body:JSON.stringify(body)});request.then(function(data){apply(data.recipe);return load()}).then(render).catch(function(error){alert(error.message)})}
function load(){return Promise.all([api('/api/apps/recipes?email='+encodeURIComponent(email())),api('/api/apps/recipes/products?email='+encodeURIComponent(email()))]).then(function(data){state.recipes=data[0].recipes;state.products=data[1].products})}
load().then(render).catch(function(error){root.innerHTML='<div class="recipe-empty">'+esc(error.message)+'</div>'})
}());
</script>
