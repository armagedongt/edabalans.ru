<div id="masterclass-sales-app" class="eb-sales" aria-live="polite">
  <div class="eb-sales__status">Загружаю актуальные тарифы…</div>
  <div class="eb-sales__grid" hidden></div>
</div>

<style>
  .eb-sales{box-sizing:border-box;width:100%;max-width:1160px;margin:0 auto;padding:24px 16px;color:#282520;font-family:Arial,sans-serif}
  .eb-sales *{box-sizing:border-box}.eb-sales__status{padding:24px;text-align:center;color:#746d63}
  .eb-sales__grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
  .eb-sales__card{display:flex;min-width:0;flex-direction:column;padding:24px;border:1px solid #e1d8ca;border-radius:24px;background:#fffaf2;box-shadow:0 12px 35px rgba(61,46,29,.08)}
  .eb-sales__card[data-price-code="site.masterclass.recipes"]{border-color:#db9258;background:#fff7ed}
  .eb-sales__title{margin:0 0 8px;font:600 clamp(22px,3vw,30px)/1.1 Georgia,serif}.eb-sales__caption{min-height:42px;margin:0 0 20px;color:#746d63;line-height:1.45}
  .eb-sales__old{min-height:22px;color:#938a7f;text-decoration:line-through}.eb-sales__price{margin:2px 0 18px;color:#c55a26;font:700 34px/1 Arial,sans-serif}
  .eb-sales__features{display:grid;gap:9px;margin:0 0 24px;padding:0;list-style:none}.eb-sales__features li{position:relative;padding-left:22px;line-height:1.35}.eb-sales__features li:before{position:absolute;left:0;content:"✓";color:#b9572c;font-weight:800}
  .eb-sales__buy{width:100%;margin-top:auto;padding:14px 18px;border:0;border-radius:14px;background:#2b2824;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.eb-sales__buy:hover{background:#b9572c}.eb-sales__buy:disabled{cursor:wait;opacity:.55}
  .eb-sales__error{padding:20px;border:1px solid #e7b4a4;border-radius:16px;background:#fff2ed;color:#9e321e;text-align:center}
  @media(max-width:820px){.eb-sales__grid{grid-template-columns:1fr}.eb-sales__card{padding:21px}.eb-sales__caption{min-height:0}}
</style>

<script>
(function(){
  'use strict';
  var host=window.EdabalansAppHost||'https://app.edabalans.ru';
  var root=document.getElementById('masterclass-sales-app');
  var grid=root.querySelector('.eb-sales__grid');
  var status=root.querySelector('.eb-sales__status');
  function money(value){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Number(value||0))+' ₽';}
  function esc(value){return String(value||'').replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];});}
  function api(path,options){return fetch(host+path,options||{}).then(function(response){return response.json().catch(function(){return {};}).then(function(body){if(!response.ok)throw new Error(body.detail||'Не удалось загрузить тарифы');return body;});});}
  function buy(button,code){button.disabled=true;button.textContent='Открываю корзину…';api('/api/pricing/site/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({price_code:code})}).then(function(result){location.hash=result.cart_command;button.disabled=false;button.textContent='Купить';}).catch(function(error){button.disabled=false;button.textContent='Повторить';status.hidden=false;status.innerHTML='<div class="eb-sales__error">'+esc(error.message||error)+'</div>';});}
  function render(data){grid.innerHTML=(data.tariffs||[]).map(function(tariff){var old=tariff.compare_at_amount&&Number(tariff.compare_at_amount)>Number(tariff.sale_amount)?money(tariff.compare_at_amount):'&nbsp;';return '<article class="eb-sales__card" data-price-code="'+esc(tariff.code)+'"><h3 class="eb-sales__title">'+esc(tariff.name)+'</h3><p class="eb-sales__caption">'+esc(tariff.descriptor)+'</p><div class="eb-sales__old">'+old+'</div><div class="eb-sales__price">'+money(tariff.sale_amount)+'</div><button class="eb-sales__buy" type="button" data-buy="'+esc(tariff.code)+'">Купить</button></article>';}).join('');status.hidden=true;grid.hidden=false;Array.prototype.forEach.call(grid.querySelectorAll('[data-buy]'),function(button){button.onclick=function(){buy(button,button.getAttribute('data-buy'));};});}
  api('/api/pricing/site').then(render).catch(function(error){status.innerHTML='<div class="eb-sales__error">'+esc(error.message||error)+'</div>';});
}());
</script>
