<div id="personal-access-app"></div>
<style>
  #personal-access-app{font-family:Arial,sans-serif;color:#211f1c;background:#f4eee5;min-height:70vh;padding:18px;box-sizing:border-box}
  .pa{max-width:680px;margin:20px auto}.pa-card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 16px 45px rgba(70,45,20,.10)}
  .pa h1{font-size:clamp(28px,6vw,44px);line-height:1.04;margin:0 0 12px}.pa p{font-size:17px;line-height:1.55}.pa-email{padding:13px 15px;border-radius:13px;background:#f5f2ed;font-weight:700;overflow-wrap:anywhere}
  .pa-items{display:grid;gap:9px;margin:20px 0}.pa-item{padding:14px;border:1px solid #e7ded2;border-radius:14px}.pa-item small{display:block;color:#776d63;margin-top:4px}
  .pa-price-old{text-decoration:line-through;color:#8a8178;font-size:18px}.pa-price{font-size:34px;font-weight:800;margin:4px 0}.pa-saving{color:#a54324;font-weight:700}
  .pa button{width:100%;border:0;border-radius:14px;padding:15px;background:#251f1a;color:#fff;font-size:17px;font-weight:800;cursor:pointer}.pa button:disabled{opacity:.55}.pa-error{color:#a22920}
</style>
<script>
(function(){
  'use strict';
  var root=document.getElementById('personal-access-app'),ctx=window.EdabalansAppContext||{},identity=window.EdabalansIdentity||{};
  var API=/^(localhost|127\.0\.0\.1|app\.edabalans\.ru)$/.test(location.hostname)?location.origin:'https://api.edabalans.ru';
  var token=ctx.linkToken||'',email=identity.email||'';
  function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function money(v){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(v||0))+' ₽';}
  function fail(e){root.innerHTML='<main class="pa"><section class="pa-card"><h1>Ссылка не открылась</h1><p class="pa-error">'+esc(e.message||e)+'</p><p>Убедитесь, что вы вошли в тот аккаунт Tilda, для которого Сергей создал предложение.</p></section></main>';}
  function api(path,options){return fetch(API+path,options).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.detail||'Ошибка сервера');return j;});});}
  function draw(data){
    if(data.status==='claimed'||data.status==='paid'){root.innerHTML='<main class="pa"><section class="pa-card"><h1>Доступ уже оформлен</h1><p>Программы привязаны к аккаунту:</p><div class="pa-email">'+esc(data.email)+'</div><p>Вернитесь в личный кабинет — новые разделы уже должны быть доступны.</p></section></main>';return;}
    var items=(data.resources||[]).map(function(item){return '<div class="pa-item"><b>'+esc(item.name)+'</b><small>'+(item.unlock_mode==='fully_unlocked'?'Все материалы будут открыты сразу':'Обычный порядок прохождения')+'</small></div>';}).join('');
    var price=data.mode==='free'?'<div class="pa-price">Бесплатно</div>':(data.standard_amount!=null?'<div class="pa-price-old">'+money(data.standard_amount)+'</div>':'')+'<div class="pa-price">'+money(data.final_amount)+'</div>'+(data.saving>0?'<div class="pa-saving">Выгода '+money(data.saving)+'</div>':'');
    root.innerHTML='<main class="pa"><section class="pa-card"><h1>'+(data.mode==='free'?'Ваш доступ готов':'Персональное предложение')+'</h1><p>Получатель:</p><div class="pa-email">'+esc(data.email)+'</div><div class="pa-items">'+items+'</div>'+price+'<p>Ссылка работает только внутри этого аккаунта Tilda и не передаёт доступ другому человеку.</p><button id="pa-action">'+(data.mode==='free'?'Получить доступ':'Перейти к оплате')+'</button></section></main>';
    document.getElementById('pa-action').onclick=function(){var button=this;button.disabled=true;button.textContent='Проверяю…';var action=data.mode==='free'?'claim':'checkout';api('/api/access-links/'+encodeURIComponent(token)+'/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})}).then(function(result){if(result.cart_command){location.hash=result.cart_command;return;}draw(result);}).catch(fail);};
  }
  if(!token){fail(new Error('В ссылке нет персонального токена'));return;}
  api('/api/access/registration-seen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})})
    .then(function(){return api('/api/access-links/'+encodeURIComponent(token)+'?email='+encodeURIComponent(email));})
    .then(draw).catch(fail);
}());
</script>
