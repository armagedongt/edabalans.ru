<!doctype html>
<meta charset="utf-8">
<div id="sprints-app"></div>
<style>
  #sprints-app{--ink:#17172b;--muted:#7b8094;--paper:#f5f5f7;--card:#fff;--line:#e7e7ef;--accent:#6f3de8;--accent-soft:#f5f1ff;--radius-large:16px;--radius-small:10px;--radius-control:8px;box-sizing:border-box;min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.5 Inter,Arial,sans-serif}#sprints-app *{box-sizing:border-box}#sprints-app button{font:inherit}.sprint-shell{width:min(1080px,100%);margin:auto;padding:42px 24px 80px}.sprint-back{min-height:36px;border:0;border-radius:8px;padding:7px 10px;background:transparent;color:var(--ink);font-size:14px;font-weight:800;cursor:pointer}.sprint-back:hover{background:var(--accent-soft)}.sprint-kicker{margin:0 0 9px;color:var(--accent);font-size:12px;font-weight:850;letter-spacing:.11em}.sprint-title{margin:0;font-size:clamp(38px,7vw,68px);line-height:.98;letter-spacing:-.045em}.sprint-lead{max-width:720px;margin:18px 0 0;color:var(--muted);font-size:18px}.sprint-section{margin-top:38px}.sprint-section h2{margin:0 0 14px;font-size:clamp(25px,4vw,34px);line-height:1.05;letter-spacing:-.03em}.sprint-active,.sprint-card,.sprint-detail,.sprint-empty{border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 5px 18px rgba(20,20,40,.06)}.sprint-active{padding:22px}.sprint-label,.sprint-state{display:inline-block;padding:7px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:850;letter-spacing:.05em;line-height:1}.sprint-active p{margin:12px 0 0;color:var(--muted)}.sprint-active strong{color:var(--ink)}.sprint-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.sprint-card{display:grid;grid-template-rows:1fr auto;min-height:278px;padding:22px}.sprint-card h3{margin:12px 0 0;font-size:23px;line-height:1.12;letter-spacing:-.025em}.sprint-card p{margin:9px 0 0;color:var(--muted)}.sprint-duration{color:var(--ink)!important;font-size:14px;font-weight:800}.sprint-card button,.sprint-start{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:20px;border:0;border-radius:8px;padding:12px 17px;background:var(--ink);color:#fff;font-size:14px;font-weight:800;cursor:pointer}.sprint-card button:hover{background:#2b2b46}.sprint-state{background:#ededf2;color:#63677a;letter-spacing:0}.sprint-placeholder{opacity:.68}.sprint-placeholder button,.sprint-start{background:#ededf2;color:#7b8094;cursor:default}.sprint-empty{padding:20px;color:var(--muted)}.sprint-detail{max-width:800px;margin-top:22px;padding:clamp(24px,5vw,44px)}.sprint-detail h1{max-width:700px;margin:14px 0 0;font-size:clamp(32px,5.4vw,53px);line-height:1;letter-spacing:-.04em}.sprint-detail p{max-width:690px;margin:14px 0 0;color:var(--muted)}.sprint-detail .sprint-duration{margin-top:18px;color:var(--accent)!important}.sprint-detail h2{margin:32px 0 12px;font-size:24px;line-height:1.1;letter-spacing:-.025em}.sprint-detail ul{display:grid;gap:10px;margin:0;padding-left:21px}.sprint-detail li{padding-left:4px}.sprint-detail .sprint-start{margin-top:30px}.sprint-note{font-size:14px;line-height:1.45}@media(max-width:760px){#sprints-app{font-size:17px}.sprint-shell{padding:28px 16px 65px}.sprint-lead,.sprint-active p,.sprint-card p{font-size:17px}.sprint-grid{grid-template-columns:1fr}.sprint-card{min-height:0}}
</style>
<script>
(function(){'use strict';var root=document.getElementById('sprints-app');var sprints={plate:{title:'Как сделать привычные тарелки на 1% лучше',summary:'Короткая практика по знакомым тарелкам: не искать идеальный рацион, а видеть, что в конкретной еде можно сдвинуть без войны с собой.',body:['Это не новая система питания и не попытка за десять дней собрать безупречное меню. Берём то, что вы уже едите, и учимся замечать небольшое изменение, которое действительно можно оставить в жизни.','Смысл не в том, чтобы каждый день переделывать себя. Смысл — несколько раз увидеть: привычная еда уже даёт место для более удачного решения.'],bullets:['короткие материалы и видео с разбором принципа на обычной еде;','небольшие задания, которые применяются к своим тарелкам, а не к чужому идеальному меню;','живые пояснения и ответы в комментариях канала;','в конце — собрать, что из изменений хочется оставить дальше;','следующий шаг к спринту про правило 30 растений.']},plants:{title:'Как выполнить правило 30 растений',summary:'Считать растения, делиться находками и перестать воспринимать разнообразие как список правильных продуктов.',body:['Правило 30 растений — не соревнование за идеальную цифру и не повод срочно покупать экзотические семена. Это способ посмотреть, насколько разнообразной уже бывает обычная еда, и начать добавлять новые продукты туда, где они правда приживутся.'],bullets:['понятный способ считать растения без занудной бухгалтерии;','рецепты, находки и реальные варианты из обычной жизни;','обсуждение в комментариях и повод сравнить подходы участников;','несколько способов добавить разнообразие без новой сложной готовки.']},movement:{title:'Как добавить движение в обычный день',summary:'Спринт про активность между делами: шаги, короткие упражнения и другие реальные способы больше двигаться, а не обещать себе новую спортивную жизнь.',body:['Не нужно делать вид, что десять минут движения заменяют тренировку. Но и ждать идеального спортивного режима, чтобы начать тратить больше энергии и чувствовать себя бодрее, тоже не обязательно.'],bullets:['простые варианты короткой активности в течение дня;','как связать движение с уже существующими делами и перекусами;','идеи участников, вопросы и разбор того, что не сработало;','свой реалистичный вариант на ближайшее время.']}};function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function card(key,item){return '<article class="sprint-card"><div><span class="sprint-state">Скоро</span><h3>'+esc(item.title)+'</h3><p class="sprint-duration">10 дней</p><p>'+esc(item.summary)+'</p></div><button data-sprint="'+key+'">Посмотреть программу</button></article>'}function stub(n){return '<article class="sprint-card sprint-placeholder"><div><span class="sprint-state">Скоро</span><h3>Спринт №'+n+'</h3><p>Тема и описание появятся здесь позже.</p></div><button disabled>Скоро</button></article>'}function index(){root.innerHTML='<main class="sprint-shell"><header><p class="sprint-kicker">ПОХУДЕНИЕ — ЭТО ЕСТЬ!</p><h1 class="sprint-title">Спринты</h1><p class="sprint-lead">Короткие программы для тех, кто уже прошёл Мастер-класс или хочет вернуться к его идеям через одну понятную практику.</p></header><section class="sprint-section"><article class="sprint-active"><span class="sprint-label">ACTIVE SPRINT</span><p><strong>Сейчас вы ничего не проходите.</strong> Когда начнёте программу, здесь появятся её название и следующий шаг.</p></article></section><section class="sprint-section"><h2>Доступные спринты</h2><div class="sprint-grid">'+Object.keys(sprints).map(function(key){return card(key,sprints[key])}).join('')+stub(4)+stub(5)+stub(6)+'</div></section><section class="sprint-section"><h2>Пройденные</h2><div class="sprint-empty">Здесь появятся завершённые вами спринты и возможность вернуться к их материалам.</div></section></main>';Array.prototype.forEach.call(root.querySelectorAll('[data-sprint]'),function(btn){btn.onclick=function(){detail(btn.getAttribute('data-sprint'))}})}function detail(key){var item=sprints[key];root.innerHTML='<main class="sprint-shell"><button class="sprint-back" data-back>← Все спринты</button><section class="sprint-detail"><span class="sprint-state">Скоро</span><h1>'+esc(item.title)+'</h1><p class="sprint-duration">10 дней</p>'+item.body.map(function(t){return '<p>'+esc(t)+'</p>'}).join('')+'<h2>Как проходит</h2><ul>'+item.bullets.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul><button class="sprint-start" disabled>Начать спринт — скоро</button><p class="sprint-note">После старта материалы будут приходить в выбранный мессенджер по расписанию в течение 10 дней. Новый спринт нельзя начать, пока не завершён текущий и не выполнена обязательная программа, которая откроет к нему доступ.</p></section></main>';root.querySelector('[data-back]').onclick=index}index()}());
</script>
