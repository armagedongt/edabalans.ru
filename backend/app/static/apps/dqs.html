<div id="dqs-app"></div>

<style>
:root{
  --bg:var(--ed-app-bg,#f5f5f7);
  --card:var(--ed-app-card,#ffffff);
  --text:var(--ed-app-text,#17172b);
  --muted:var(--ed-app-muted,#7b8094);
  --line:var(--ed-app-line,#e7e7ef);

  --purple:var(--ed-app-accent,#6f3de8);
  --purple-soft:var(--ed-app-accent-soft,#f5f1ff);

  --shadow:var(--ed-app-shadow,0 5px 18px rgba(20,20,40,.08));

  --score-p2:#cfeec5;
  --score-p1:#e8f3c7;
  --score-0:#f6eabc;
  --score-m1:#f7d8ab;
  --score-m2:#f5c3b4;

  --cat-green:#e8f5de;
  --cat-rose:#f9e4e4;
  --cat-blue:#e6eef9;
  --cat-yellow:#f7eed1;
  --cat-peach:#fae8dc;

  --today-bg:#edf8ec;
  --today-border:#cfe7cb;
  --today-text:#34733a;

  --other-date-bg:#f0f1f4;
  --other-date-border:#e0e2e8;
  --other-date-text:#747988;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

#dqs-app{
  max-width:760px;
  margin:0 auto;
  padding:6px 8px 14px;
  font-family:Arial,sans-serif;
  color:var(--text);
}


/* =========================
   LOGIN
========================= */

.dqs-auth-card{
  margin-top:16px;
  background:#fff;
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:20px;
}

.dqs-title{
  font-size:27px;
  font-weight:800;
  margin:0 0 10px;
}

.dqs-subtitle{
  color:var(--muted);
  font-size:14px;
  line-height:1.45;
  margin-bottom:16px;
}

.dqs-input{
  width:100%;
  padding:13px 15px;
  border:1px solid #d7d9e4;
  border-radius:13px;
  font-size:16px;
  margin-bottom:12px;
  background:#fff;
}

.dqs-btn{
  width:100%;
  border:0;
  border-radius:13px;
  background:var(--purple);
  color:#fff;
  font-size:16px;
  font-weight:700;
  padding:13px 16px;
  cursor:pointer;
}

.dqs-status-err{
  color:#c62828;
  font-size:14px;
  margin-top:10px;
}

.dqs-status-neutral{
  color:#666;
  font-size:14px;
  margin-top:10px;
}


/* =========================
   ОБОЛОЧКА
========================= */

.dqs-shell{
  display:flex;
  flex-direction:column;
  gap:6px;
}


/* =========================
   STICKY ШАПКА
========================= */

.dqs-sticky{
  position:sticky;
  top:0;
  z-index:1000;

  background:var(--bg);

  padding:4px 0 6px;

  display:flex;
  flex-direction:column;
  gap:6px;
}


/* =========================
   ВЕРХНЯЯ СТРОКА
========================= */

.dqs-top{
  display:grid;
  grid-template-columns:1.42fr 1fr .92fr;
  gap:7px;
  align-items:stretch;
}

.dqs-chip{
  height:42px;
  min-height:42px;
  padding:0 9px;

  background:#fff;
  border-radius:13px;
  box-shadow:var(--shadow);

  display:flex;
  align-items:center;
  justify-content:center;

  white-space:nowrap;
}

.dqs-chip-date{
  justify-content:center;
  gap:6px;
  border:1px solid transparent;
}

.dqs-chip-date.is-today{
  background:var(--today-bg);
  border-color:var(--today-border);
  color:var(--today-text);
}

.dqs-chip-date.is-other{
  background:var(--other-date-bg);
  border-color:var(--other-date-border);
  color:var(--other-date-text);
}

.dqs-chip-date-icon{
  font-size:15px;
  line-height:1;
}

.dqs-chip-date-text{
  font-size:12px;
  font-weight:700;
}

.dqs-chip-day{
  font-size:13px;
  font-weight:800;
}

.dqs-chip-score{
  font-size:13px;
  font-weight:800;
  color:var(--purple);
  background:var(--purple-soft);
  border:1px solid #ded3fb;
  cursor:pointer;
}

.dqs-chip-score:active{
  transform:scale(.985);
}


/* =========================
   НИЖНЯЯ СТРОКА
========================= */

.dqs-navline{
  display:grid;
  grid-template-columns:48px 1fr 48px;
  gap:7px;
  align-items:center;
}

.dqs-navbtn{
  height:42px;

  border:0;
  border-radius:12px;

  background:#fff;
  box-shadow:var(--shadow);

  font-size:21px;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0;
}

.dqs-navbtn:active{
  transform:scale(.97);
}

.dqs-navbtn:disabled{
  opacity:.35;
  cursor:default;
}

.dqs-segment{
  height:42px;

  background:#e3e5ec;

  border-radius:13px;

  padding:3px;

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:3px;

  box-shadow:inset 0 1px 2px rgba(0,0,0,.07);
}

.dqs-segment-btn{
  height:36px;

  border:0;
  border-radius:10px;

  font-size:12px;
  font-weight:700;

  cursor:pointer;

  color:#74798a;
  background:transparent;
}

.dqs-segment-btn.active{
  background:#fff;
  color:#29263d;
  box-shadow:0 2px 7px rgba(0,0,0,.08);
}


/* =========================
   ОСНОВНАЯ ТАБЛИЦА
========================= */

.dqs-body-card{
  background:#fff;
  border-radius:17px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.dqs-table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  table-layout:fixed;
}

.dqs-table thead th{
  background:#fbfbfd;

  font-size:11px;
  font-weight:800;

  padding:8px 2px;
  text-align:center;

  border-bottom:1px solid var(--line);
}

.dqs-table thead th + th,
.dqs-table tbody td + td{
  border-left:1px solid var(--line);
}

.dqs-table tbody td{
  border-bottom:1px solid var(--line);
  padding:3px;
  vertical-align:middle;
  background:#fff;
}


/* =========================
   КАТЕГОРИИ
========================= */

.dqs-cat-cell{
  padding:3px !important;
}

.dqs-cat-pill{
  min-height:38px;

  border-radius:9px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:8px;

  padding:4px 6px;

  font-weight:700;
  font-size:12px;

  text-align:center;

  cursor:pointer;
  user-select:none;
}

.dqs-cat-pill:active{
  transform:scale(.985);
}

.dqs-cat-icon{
  font-size:20px;
  line-height:1;

  flex:0 0 auto;

  text-align:center;
}

.dqs-cat-name{
  text-align:center;
}

.dqs-bg-green{
  background:var(--cat-green);
}

.dqs-bg-rose{
  background:var(--cat-rose);
}

.dqs-bg-blue{
  background:var(--cat-blue);
}

.dqs-bg-yellow{
  background:var(--cat-yellow);
}

.dqs-bg-peach{
  background:var(--cat-peach);
}


/* =========================
   ПОРЦИИ
========================= */

.dqs-counter{
  width:126px;
  max-width:100%;

  margin:0 auto;

  display:grid;
  grid-template-columns:32px 50px 32px;
  gap:4px;

  justify-content:center;
  align-items:center;
}

.dqs-counter-btn,
.dqs-counter-value{
  height:31px;

  border-radius:9px;
  border:1px solid #dddfee;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:800;

  background:#fff;
}

.dqs-counter-btn{
  font-size:16px;
  cursor:pointer;
  color:var(--purple);
  user-select:none;
}

.dqs-counter-btn:active{
  background:var(--purple-soft);
}

.dqs-counter-value{
  width:50px;
  min-width:50px;
  max-width:50px;

  font-size:14px;

  white-space:nowrap;
}


/* =========================
   РАЗНООБРАЗИЕ
========================= */

.dqs-mark-cell{
  text-align:center;

  padding-left:1px !important;
  padding-right:1px !important;
}

.dqs-mark-wrap{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:center;
}

.dqs-check{
  width:20px;
  height:20px;

  accent-color:#9ba3b6;

  cursor:pointer;
}


/* =========================
   ИТОГ
========================= */

.dqs-total{
  font-size:13px;
  font-weight:800;

  text-align:center;

  white-space:nowrap;
}

.dqs-total.pos{
  color:#2e8c26;
}

.dqs-total.neg{
  color:#d42017;
}

.dqs-total.zero{
  color:#636b80;
}


/* =========================
   НИЗ КАРТОЧКИ
========================= */

.dqs-foot{
  padding:8px 10px 10px;

  display:flex;
  justify-content:space-between;
  gap:8px;

  align-items:center;

  color:#757b91;

  font-size:10px;
}

.dqs-save-status{
  min-height:13px;
}

.dqs-link-btn{
  border:0;
  background:none;

  color:var(--purple);

  font-size:10px;

  cursor:pointer;

  padding:0;

  font-weight:700;
}


/* =========================
   ЭКРАН БАЛЛОВ
========================= */

.dqs-score-wrap{
  padding:6px;
}

.dqs-matrix{
  width:100%;

  border-collapse:separate;
  border-spacing:2px;

  table-layout:fixed;
}

.dqs-matrix th,
.dqs-matrix td{
  text-align:center;
  border-radius:8px;
  overflow:hidden;
}

.dqs-matrix th{
  font-size:10px;

  padding:5px 1px;

  background:#f4f5f9;

  color:#4d546d;

  font-weight:800;
}

.dqs-matrix .icon-col{
  width:50px;
}

.dqs-matrix .icon-cell{
  padding:0 2px;
  text-align:center;
  cursor:pointer;
}

.dqs-mini-icon{
  width:100%;

  min-height:33px;

  border-radius:8px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;

  margin:0 auto;
}

.dqs-score-cell{
  position:relative;

  height:33px;

  font-size:11px;
  font-weight:800;

  background:#fff;

  border:1px solid #ececf2;
}

.dqs-score-cell::before{
  content:'';

  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:0;

  z-index:0;
}

.dqs-score-cell span{
  position:relative;
  z-index:1;
}

.dqs-score-cell.active-full::before{
  width:100%;
}

.dqs-score-cell.active-partial::before{
  width:var(--fill,50%);
}

.dqs-score-cell.s2::before{
  background:var(--score-p2);
}

.dqs-score-cell.s1::before{
  background:var(--score-p1);
}

.dqs-score-cell.s0::before{
  background:var(--score-0);
}

.dqs-score-cell.sm1::before{
  background:var(--score-m1);
}

.dqs-score-cell.sm2::before{
  background:var(--score-m2);
}


/* =========================
   ПОДСКАЗКА КАТЕГОРИИ
========================= */

.dqs-help-overlay{
  position:fixed;

  inset:0;

  z-index:99999;

  background:var(--bg);

  overflow-y:auto;

  -webkit-overflow-scrolling:touch;
}

.dqs-help-inner{
  max-width:560px;

  min-height:100%;

  margin:0 auto;

  padding:10px 12px 28px;
}

.dqs-help-top{
  position:sticky;

  top:0;

  z-index:2;

  background:var(--bg);

  display:flex;
  align-items:center;

  gap:9px;

  padding:3px 0 9px;
}

.dqs-help-back{
  min-width:88px;
  height:39px;

  flex:0 0 auto;

  border:0;

  border-radius:11px;

  background:#fff;

  box-shadow:var(--shadow);

  font-size:14px;
  font-weight:800;

  cursor:pointer;

  padding:0 11px;

  color:#34384b;
}

.dqs-help-heading{
  display:flex;
  align-items:center;

  gap:9px;

  font-size:20px;
  font-weight:800;

  min-width:0;
}

.dqs-help-icon{
  font-size:25px;
}

.dqs-help-card{
  background:#fff;

  border-radius:17px;

  padding:17px;

  box-shadow:var(--shadow);
}


/* =========================
   ШКАЛА В ПОДСКАЗКЕ
========================= */

.dqs-help-scale{
  margin:0 0 18px;

  overflow:hidden;

  border-radius:11px;

  border:1px solid #ececf2;
}

.dqs-help-scale-row{
  display:grid;

  grid-template-columns:
    58px
    repeat(8,1fr);

  min-height:31px;
}

.dqs-help-scale-row + .dqs-help-scale-row{
  border-top:1px solid #ececf2;
}

.dqs-help-scale-cell{
  display:flex;
  align-items:center;
  justify-content:center;

  min-width:0;

  padding:3px 1px;

  border-left:1px solid #ececf2;

  font-size:10px;
  font-weight:800;
}

.dqs-help-scale-cell:first-child{
  border-left:0;

  background:#f4f5f8;

  color:#666d80;
}

.dqs-help-score-p2{
  background:var(--score-p2);
}

.dqs-help-score-p1{
  background:var(--score-p1);
}

.dqs-help-score-0{
  background:var(--score-0);
}

.dqs-help-score-m1{
  background:var(--score-m1);
}

.dqs-help-score-m2{
  background:var(--score-m2);
}

.dqs-help-section{
  margin:0 0 15px;
}

.dqs-help-section:last-of-type{
  margin-bottom:0;
}

.dqs-help-section-title{
  font-size:15px;
  font-weight:800;

  margin-bottom:4px;
}

.dqs-help-section-text{
  font-size:15px;
  line-height:1.48;
}

.dqs-help-source{
  margin-top:20px;

  padding-top:15px;

  border-top:1px solid #e8e9ee;

  color:#727789;

  font-size:13px;
  line-height:1.45;
}

.dqs-help-source a{
  color:var(--purple);

  font-weight:700;

  text-decoration:none;
}

.dqs-profile-link{
  display:inline-flex;
  width:42px;
  height:42px;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--card);
  color:var(--muted);
  box-shadow:var(--shadow);
  text-decoration:none;
}


/* =========================
   МОДАЛКИ
========================= */

.dqs-modal-overlay{
  position:fixed;

  inset:0;

  z-index:100000;

  background:rgba(24,25,35,.34);

  padding:18px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.dqs-modal-card{
  width:100%;
  max-width:430px;

  max-height:90vh;
  overflow-y:auto;

  background:#fff;

  border-radius:20px;

  padding:21px 19px 18px;

  box-shadow:
    0 20px 60px
    rgba(18,20,35,.22);
}

.dqs-modal-emoji{
  text-align:center;

  font-size:42px;
  line-height:1;

  margin:1px 0 13px;
}

.dqs-modal-title{
  text-align:center;

  font-size:20px;
  line-height:1.25;

  font-weight:800;

  margin-bottom:14px;
}

.dqs-modal-text{
  font-size:14px;
  line-height:1.5;

  color:#42475a;
}

.dqs-modal-text p{
  margin:0 0 12px;
}

.dqs-modal-text p:last-child{
  margin-bottom:0;
}

.dqs-modal-text a{
  color:var(--purple);

  font-weight:800;

  text-decoration:none;
}

.dqs-modal-btn{
  width:100%;

  margin-top:18px;

  height:43px;

  border:0;

  border-radius:12px;

  background:var(--purple);

  color:#fff;

  font-size:14px;
  font-weight:800;

  cursor:pointer;
}


/* =========================
   DQS СВОДКА
========================= */

.dqs-summary-box{
  display:grid;
  gap:8px;
}

.dqs-summary-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;

  background:#f6f6f9;

  border-radius:11px;

  padding:11px 12px;

  font-size:14px;
}

.dqs-summary-row strong{
  font-size:16px;
}

.dqs-summary-row.final{
  background:var(--purple-soft);
  color:var(--purple);
}


/* =========================
   ОБУЧАЛКА
========================= */

.dqs-tutorial-overlay{
  position:fixed;

  inset:0;

  z-index:120000;

  background:rgba(24,25,35,.46);

  padding:12px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.dqs-tutorial-card{
  width:100%;
  max-width:470px;

  max-height:94vh;
  overflow-y:auto;

  background:#fff;

  border-radius:21px;

  padding:16px;

  box-shadow:
    0 22px 70px
    rgba(18,20,35,.28);
}

.dqs-tutorial-progress{
  text-align:center;

  font-size:11px;
  font-weight:800;

  color:#9296a5;

  margin-bottom:9px;
}

.dqs-tutorial-title{
  text-align:center;

  font-size:20px;
  line-height:1.25;

  font-weight:800;

  margin-bottom:13px;
}

.dqs-tutorial-preview{
  background:#f5f5f7;

  border-radius:15px;

  padding:10px;

  margin-bottom:15px;
}

.dqs-tutorial-arrow{
  text-align:center;

  font-size:22px;
  line-height:1;

  margin:7px 0 6px;
}

.dqs-tutorial-note{
  font-size:14px;
  line-height:1.47;

  color:#404557;
}

.dqs-tutorial-note p{
  margin:0 0 11px;
}

.dqs-tutorial-note p:last-child{
  margin-bottom:0;
}

.dqs-tutorial-note strong{
  color:#202336;
}

.dqs-tutorial-actions{
  margin-top:17px;

  display:flex;
  gap:8px;
}

.dqs-tutorial-skip{
  flex:0 0 auto;

  border:0;

  border-radius:12px;

  background:#eff0f4;

  color:#666c7e;

  padding:0 14px;

  font-size:12px;
  font-weight:700;

  cursor:pointer;
}

.dqs-tutorial-next{
  flex:1;

  height:43px;

  border:0;

  border-radius:12px;

  background:var(--purple);

  color:#fff;

  font-size:14px;
  font-weight:800;

  cursor:pointer;
}


/* tutorial previews */

.dqs-tut-top{
  display:grid;

  grid-template-columns:1.42fr 1fr .92fr;

  gap:6px;
}

.dqs-tut-chip{
  min-height:42px;

  border-radius:12px;

  background:#fff;

  box-shadow:0 4px 13px rgba(20,20,40,.07);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:5px;

  text-align:center;

  font-size:11px;
  font-weight:800;
}

.dqs-tut-chip.today{
  background:var(--today-bg);
  color:var(--today-text);
  border:1px solid var(--today-border);
}

.dqs-tut-chip.score{
  background:var(--purple-soft);
  color:var(--purple);
  border:1px solid #ded3fb;
}

.dqs-tut-nav{
  display:grid;

  grid-template-columns:46px 1fr 46px;

  gap:6px;
}

.dqs-tut-hand{
  height:42px;

  background:#fff;

  border-radius:12px;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:0 4px 13px rgba(20,20,40,.07);

  font-size:20px;
}

.dqs-tut-segment{
  height:42px;

  background:#e3e5ec;

  border-radius:12px;

  padding:3px;

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:3px;
}

.dqs-tut-segment span{
  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:9px;

  font-size:11px;
  font-weight:800;

  color:#74798a;
}

.dqs-tut-segment .active{
  background:#fff;
  color:#29263d;
}

.dqs-tut-row{
  display:grid;

  grid-template-columns:1.2fr 1fr .55fr;

  gap:5px;

  align-items:center;
}

.dqs-tut-cat{
  min-height:42px;

  border-radius:9px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:8px;

  padding:5px;

  background:var(--cat-green);

  font-size:12px;
  font-weight:800;
}

.dqs-tut-counter{
  display:grid;
  grid-template-columns:30px 42px 30px;
  gap:3px;
}

.dqs-tut-counter div{
  height:32px;

  background:#fff;

  border:1px solid #dddfee;

  border-radius:8px;

  display:flex;
  align-items:center;

function diversityDefaultArray(){

  return CATEGORIES.map(cat => {

    if(
      cat.diversity === 'self' ||
      cat.diversity === 'leader'
    ){
      return false;
    }

    return null;
  });
}


function emptyDay(){

  return {
    v:2,
    updated:new Date().toISOString(),
    p:new Array(17).fill(0),
    d:diversityDefaultArray()
  };
}


function normalizeDay(day){

  const out = emptyDay();

  if(
    day &&
    Array.isArray(day.p)
  ){

    for(
      let i=0;
      i<17;
      i++
    ){

      const num =
        Number(day.p[i] || 0);

      out.p[i] =
        Number.isFinite(num)
          ? Math.max(
              0,
              Math.round(num * 2) / 2
            )
          : 0;
    }
  }


  if(
    day &&
    Array.isArray(day.d)
  ){

    for(
      let i=0;
      i<17;
      i++
    ){

      const type =
        CATEGORIES[i].diversity;

      if(
        type === 'self' ||
        type === 'leader'
      ){

        out.d[i] =
          day.d[i] === true;

      }else{

        out.d[i] = null;
      }
    }
  }


  out.v =
    day && day.v
      ? day.v
      : 2;

  out.updated =
    day && day.updated
      ? day.updated
      : '';

  return out;
}


function normalizeDays(days){

  const result =
    new Array(DAY_COUNT).fill(null);

  for(
    let i=0;
    i<DAY_COUNT;
    i++
  ){

    if(
      days[i] &&
      !days[i].error
    ){

      result[i] =
        normalizeDay(days[i]);
    }
  }

  return result;
}

function getDayData(dayNumber){

/* =========================
   API
========================= */

function api(params){

  return new Promise(
    (resolve,reject) => {

      const callbackName =
        'dqsCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() *
          100000
        );

      const script =
        document.createElement('script');


      const cleanup = () => {

        try{
          delete window[
            callbackName
          ];
        }catch(e){}

        if(script.parentNode){
          script.parentNode
            .removeChild(script);
        }
      };


      const timeout =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                'Сервис не ответил'
              )
            );

          },
          15000
        );


      window[
        callbackName
      ] = function(data){

        clearTimeout(timeout);

        cleanup();

        resolve(data);
      };


      const query =
        new URLSearchParams({
          ...params,
          callback:callbackName,
          _:Date.now()
        });


      script.src =
        API_URL +
        '?' +
        query.toString();


      script.onerror =
        function(){

          clearTimeout(timeout);

          cleanup();

          reject(
            new Error(
              'Ошибка связи с сервисом'
            )
          );
        };


      document.body
        .appendChild(script);
    }
  );
}

function getPortionStepScore(
  catIndex,
  position
){

  const seq =
    CATEGORIES[
      catIndex
    ].scores;

  if(
    position <=
    seq.length
  ){

    return seq[
      position - 1
    ];
  }

  return seq[
    seq.length - 1
  ];
}


function calcPortionScore(
  catIndex,
  portions
){

  const value =
    Math.max(
      0,
      Number(
        portions || 0
      )
    );

  const whole =
    Math.floor(
      value + 1e-9
    );

  const fraction =
    Math.round(
      (
        value -
        whole
      ) * 2
    ) / 2;

  let sum = 0;


  for(
    let i=1;
    i<=whole;
    i++
  ){

    sum +=
      getPortionStepScore(
        catIndex,
        i
      );
  }


  if(
    fraction > 0
  ){

    sum +=
      fraction *
      getPortionStepScore(
        catIndex,
        whole + 1
      );
  }


  return sum;
}


function calcCategoryTotal(
  day,
  catIndex
){

  let total =
    calcPortionScore(
      catIndex,
      day.p[
        catIndex
      ]
    );


  const cat =
    CATEGORIES[
      catIndex
    ];


  if(
    (
      cat.diversity ===
        'self' ||
      cat.diversity ===
        'leader'
    ) &&
    day.d[
      catIndex
    ] === true
  ){

    total += 1;
  }


  return total;
}


function calcDayTotal(day){

  let total = 0;

  for(
    let i=0;
    i<CATEGORIES.length;
    i++
  ){

    total +=
      calcCategoryTotal(
        day,
        i
      );
  }

  return total;
}


function calcGroupTotal(
  day,
  group
){

  let total = 0;

  for(
    let i=0;
    i<CATEGORIES.length;
    i++
  ){

    if(
      CATEGORIES[i].group ===
      group
    ){

      total +=
        calcCategoryTotal(
          day,
          i
        );
    }
  }

  return total;
}


function scoreClass(score){

  if(score === 2){
    return 's2';
  }

  if(score === 1){
    return 's1';
  }

  if(score === 0){
    return 's0';
  }

  if(score === -1){
    return 'sm1';
  }

  return 'sm2';
}


function helpScoreClass(score){

  if(score === 2){
    return 'dqs-help-score-p2';
  }

  if(score === 1){
    return 'dqs-help-score-p1';
  }

  if(score === 0){
    return 'dqs-help-score-0';
  }

  if(score === -1){
    return 'dqs-help-score-m1';
  }

  return 'dqs-help-score-m2';
}


/* =========================
   ДАТЫ

function parseLocalDate(
  value
){

  const parts =
    value
      .split('-')
      .map(Number);

  return new Date(
    parts[0],
    parts[1] - 1,
    parts[2]
  );
}


function daySerial(
  date
){

  return Date.UTC(
    date.getFullYear(),
    date.getMonth(),
    date.getDate()
  );
}


function getCalendarDayNumber(
  startDate,
  date
){

  const start =
    parseLocalDate(
      startDate
    );

  return (
    Math.round(
      (
        daySerial(date) -
        daySerial(start)
      ) /
      86400000
    ) + 1
  );
}


function getTodayDayNumber(){

  if(
    !currentUser ||
    !currentUser.startDate
  ){
    return 1;
  }

  return getCalendarDayNumber(
    currentUser.startDate,
    new Date()
  );
}


function getMaxAllowedDay(){

  return Math.min(
    DAY_COUNT,
    Math.max(
      1,
      getTodayDayNumber() + 1
    )
  );
}


function getDefaultDay(
  startDate
){

  if(!startDate){
    return 1;
  }

  const dayNumber =
    getCalendarDayNumber(
      startDate,
      new Date()
    );

  return Math.min(
    DAY_COUNT,
    Math.max(
      1,
      dayNumber
    )
  );
}


function getDateForDay(
  startDate,
  dayNumber
){

  if(!startDate){
    return '';
  }

  const date =
    parseLocalDate(
      startDate
    );

  date.setDate(
    date.getDate() +
    dayNumber -
    1
  );

  return date
    .toLocaleDateString(
      'ru-RU',
      {
        day:'numeric',
        month:'long',
        year:'numeric'
      }
    );
}


function isCurrentDayToday(){

  return (
    currentDay ===
    getTodayDayNumber()
  );
}

function buildHelpScale(cat){

  let top = `
    <div class="dqs-help-scale-row">

      <div class="dqs-help-scale-cell">
        Порция
      </div>
  `;

  let bottom = `
    <div class="dqs-help-scale-row">

        Баллы

  `;


  for(
    let i=1;
    i<=8;
    i++
  ){

    top += `
      <div class="dqs-help-scale-cell">
        #${i}
      </div>
    `;

    const score =
      cat.scores[
        i - 1
      ];

    bottom += `
      <div
        class="
          dqs-help-scale-cell
          ${helpScoreClass(score)}
        "
      >
        ${
          score > 0
            ? '+' + score
            : String(score)
        }
      </div>
    `;
  }


  top += `</div>`;
  bottom += `</div>`;


  return `
    <div class="dqs-help-scale">
      ${top}
      ${bottom}
    </div>
  `;
}

    localStorage
      .setItem(
        key,
        '1'
      );
  }
}


async function completeTutorial(){

  if(
    !currentUser ||
    !currentUser.email
  ){
    throw new Error(
      'Не удалось определить пользователя'
    );
  }

  const result =
    await api({
      action:'completeTutorial',
      email:currentUser.email
    });

  if(!result.ok){
    throw new Error(
      result.error ||
      'Не удалось сохранить прохождение инструкции'
    );
  }

  window.dispatchEvent(
    new CustomEvent(
      'edabalans:app-completed',
      {
        detail:{
          app:'dqs',
          completion:'tutorial'
        }
      }
    )
  );
}


function maybeShowTutorial(){

  if(
    !tutorialWasSeen()
  ){

    setTimeout(
      () => {
        openTutorial(0);
      },
      250
    );
  }
}


function openTutorial(
  step = 0
){

  tutorialStep =
    Math.max(
      0,
      Math.min(
        4,
        step
      )
    );

  renderTutorial();
}


window.EdabalansDqsOpenTutorial =
  function(){
    openTutorial(0);
  };


function closeTutorial(
  remember = false
){

  const overlay =
    document
      .getElementById(
        'dqs-tutorial-overlay'
      );

  if(overlay){
    overlay.remove();
  }

  document.body
    .style
    .overflow = '';


  if(remember){
    markTutorialSeen();
  }
}


async function tutorialNext(){

  if(
    tutorialStep >= 4
  ){

    try{

      await completeTutorial();

      closeTutorial(true);

    }catch(error){

      alert(
        error.message ||
        'Не удалось сохранить прохождение инструкции'
      );
    }

    return;
  }

  tutorialStep++;

  renderTutorial();
}


function tutorialSkip(){

  closeTutorial(true);
}

      .getElementById(

    document.body

  document.body

    .overflow = 'hidden';


  const slide =

  overlay.innerHTML = `

      <div class="dqs-tutorial-progress">
        ${tutorialStep + 1} из 5

async function saveStartDate(){

  const startDate =
    document
      .getElementById(
        'dqs-start-date'
      )
      .value;

  const status =
    document
      .getElementById(
        'dqs-start-status'
      );


  if(!startDate){

    status.className =
      'dqs-status-err';

    status.textContent =
      'Выберите дату';

    return;
  }


  status.className =
    'dqs-status-neutral';

  status.textContent =
    'Сохраняю...';


  try{

    const result =
      await api({
        action:'setStartDate',
        email:currentUser.email,
        startDate:startDate
      });


    if(!result.ok){

      throw new Error(
        result.error ||
        'Ошибка'
      );
    }


    currentUser
      .startDate =
        result.startDate;

    currentUser
      .needsStartDate =
        false;


    currentDay =
      getDefaultDay(
        result.startDate
      );


    currentView =
      'diary';


    renderCurrentView(
      false
    );


    maybeShowTutorial();


  }catch(error){

    status.className =
      'dqs-status-err';

    status.textContent =
      error.message;
  }
}

function renderScores(){

  const day =
    getDayData(
      currentDay
    );

  let header = `

    <tr>
      <th class="icon-col"></th>
  `;


  for(
    let i=1;
    i<=8;
    i++
  ){

    header += `

      <th>
        #${i}
      </th>
    `;
  }


  header += `
    </tr>
  `;


  let rows = '';


  for(
    let i=0;
    i<CATEGORIES.length;
    i++
  ){

    const cat =
      CATEGORIES[i];

    const portions =
      Math.max(
        0,
        Number(
          day.p[i] || 0
        )
      );

    const whole =
      Math.floor(
        portions
      );

    const fraction =
      Math.round(
        (
          portions -
          whole
        ) * 2
      ) / 2;

    let cells = '';


    for(
      let col=1;
      col<=8;
      col++
    ){

      const score =
        getPortionStepScore(
          i,
          col
        );

      const scClass =
        scoreClass(
          score
        );

      let activeClass = '';
      let extraStyle = '';


      if(
        col <= whole
      ){

        activeClass =
          'active-full';


      }else if(
        col ===
          whole + 1 &&
        fraction > 0
      ){

        activeClass =
          'active-partial';

        extraStyle =
          `style="--fill:${
            fraction * 100
          }%"`;
      }


      if(
        whole >= 8 &&
        col === 8
      ){

        activeClass =
          'active-full';
      }


      const text =
        score > 0
          ? '+' + score
          : String(score);


      cells += `

        <td
          class="
            dqs-score-cell
            ${scClass}
            ${activeClass}
          "

          ${extraStyle}
        >

          <span>
            ${text}
          </span>

        </td>
      `;
    }


    rows += `

      <tr>


        <td
          class="icon-cell"

          onclick="
            openCategoryHelp(
              ${i}
            )
          "
        >

          <div
            class="
              dqs-mini-icon
              ${cat.bg}
            "
          >
            ${cat.icon}
          </div>

        </td>


        ${cells}

      </tr>
    `;
  }


  const body = `

    <div class="dqs-body-card">

      <div class="dqs-score-wrap">

        <table class="dqs-matrix">

          <thead>
            ${header}
          </thead>

          <tbody>
            ${rows}
          </tbody>

        </table>

      </div>


      <div class="dqs-foot">


        <div
          class="dqs-save-status"
        >
          ${
            escapeHtml(
              saveStatusText ||
              ''
            )
          }
        </div>


        <div>

          ${
            escapeHtml(
              currentUser.email
            )
          }

          &nbsp;•&nbsp;

          <button
            class="dqs-link-btn"
            onclick="logoutUser()"
          >
            Выйти
          </button>

        </div>

      </div>

    </div>

  `;


  document
    .getElementById(
      'dqs-app'
    )
    .innerHTML =
      renderShell(
        body
      );
}


/* =========================
   РЕНДЕР
========================= */

function renderCurrentView(
  preserveScroll = true
){

  if(!currentUser || !currentUser.email){
    redirectToTildaLogin();
    return;
  }

  if(!currentUser.startDate){
    showStartDate();
    return;
  }

  const y =
    window.scrollY;

  if(
    currentView ===
    'scores'
  ){

    renderScores();

  }else{

    renderDiary();
  }


  if(
    preserveScroll
  ){

    requestAnimationFrame(
      () => {

        window.scrollTo(
          0,
          y
        );
      }
    );
  }
}


function setView(view){

  currentView =
    view;

  renderCurrentView(
    false
  );
}


/* =========================
   ИЗМЕНЕНИЯ
========================= */

function changePortion(
  index,
  delta
){

  const day =
    getDayData(
      currentDay
    );

  const next =
    Math.max(
      0,

      Math.round(
        (
          Number(
            day.p[index] ||
            0
          ) +
          delta
        ) * 2
      ) / 2
    );

  day.p[index] =
    next;

  markDayChanged(
    currentDay
  );

  renderCurrentView(
    true
  );
}


function toggleDiversity(
  index,
  checked
){

  const cat =
    CATEGORIES[index];

  if(
    cat.diversity !==
      'self' &&
    cat.diversity !==
      'leader'
  ){

    return;
  }

  const day =
    getDayData(
      currentDay
    );

  day.d[index] =
    checked === true;

  markDayChanged(
    currentDay
  );

  renderCurrentView(
    true
  );
}


/* =========================
   СОХРАНЕНИЕ
========================= */

function markDayChanged(
  dayNumber
){

  const day =
    getDayData(
      dayNumber
    );

  day.updated =
    new Date()
      .toISOString();

  dirtyDays[
    dayNumber
  ] = true;

  saveLocalDay(
    currentUser.email,
    dayNumber,
    day
  );

  saveStatusText =
    'Сохраняю...';

  clearTimeout(
    saveTimer
  );

  saveTimer =
    setTimeout(
      () => {

        saveDayToServer(
          dayNumber
        );

      },
      1200
    );
}


async function saveDayToServer(
  dayNumber
){

  if(
    !dirtyDays[
      dayNumber
    ] ||
    savingDays[
      dayNumber
    ]
  ){

    return;
  }


  const payload =
    clone(
      getDayData(
        dayNumber
      )
    );

  const payloadRevision =
    payload.updated;

  const sessionEmail =
    currentUser && currentUser.email;

  savingDays[
    dayNumber
  ] = true;


  try{

    const result =
      await api({
        action:'saveDay',
        email:sessionEmail,
        day:String(dayNumber),
        data:JSON.stringify(payload)
      });

    if(!currentUser || currentUser.email !== sessionEmail){
      return;
    }


    if(!result.ok){

      throw new Error(
        result.error ||
        'Ошибка сохранения'
      );
    }


    const current =
      getDayData(
        dayNumber
      );


    if(
      current.updated ===
      payloadRevision
    ){

      appDays[
        dayNumber - 1
      ] =
        normalizeDay(
          result.data
        );

      dirtyDays[
        dayNumber
      ] = false;


      saveLocalDay(
        currentUser.email,
        dayNumber,
        appDays[
          dayNumber - 1
        ]
      );

      window.dispatchEvent(
        new CustomEvent(
          'edabalans:app-completed',
          {
            detail:{
              app:'dqs',
              day:dayNumber
            }
          }
        )
      );


      if(
        dayNumber ===
        currentDay
      ){

        saveStatusText =
          'Сохранено';

        renderCurrentView(
          true
        );
      }

    }else{

      dirtyDays[
        dayNumber
      ] = true;
    }


  }catch(error){

    dirtyDays[
      dayNumber
    ] = true;


    if(
      dayNumber ===
      currentDay
    ){

      saveStatusText =
        'Нет связи. Сохранено на устройстве.';

      renderCurrentView(
        true
      );
    }


  }finally{

    savingDays[
      dayNumber
    ] = false;


    if(
      dirtyDays[
        dayNumber
      ]
    ){

      const currentRevision =
        getDayData(
          dayNumber
        ).updated;


      if(
        currentRevision !==
        payloadRevision
      ){

        setTimeout(
          () => {

            saveDayToServer(
              dayNumber
            );

          },
          0
        );
      }
    }
  }
}


function flushCurrentDay(){

  clearTimeout(
    saveTimer
  );

  if(
    dirtyDays[
      currentDay
    ]
  ){

    saveDayToServer(
      currentDay
    );
  }
}


/* =========================
   ДНИ
========================= */

function previousDay(){

  if(
    currentDay <= 1
  ){

    return;
  }

  flushCurrentDay();

  currentDay--;

  saveStatusText = '';

  renderCurrentView(
    false
  );

  window.scrollTo(
    0,
    0
  );
}


function nextDay(){

  if(
    currentDay >=
    DAY_COUNT
  ){

    flushCurrentDay();

    showThirtyDaysModal();

    return;
  }


  const maxAllowedDay =
    getMaxAllowedDay();


  if(
    currentDay >=
    maxAllowedDay
  ){

    showFutureDayWarning();

    return;
  }


  flushCurrentDay();

  currentDay++;

  saveStatusText = '';

  renderCurrentView(
    false
  );

  window.scrollTo(
    0,
    0
  );
}


/* =========================
   LOCAL STORAGE
========================= */

function localDayKey(
  email,
  dayNumber
){

  return (
    STORAGE_PREFIX +
    email +
    '_' +
    String(
      dayNumber
    ).padStart(
      2,
      '0'
    )
  );
}


function saveLocalDay(
  email,
  dayNumber,
  data
){

  localStorage
    .setItem(
      localDayKey(
        email,
        dayNumber
      ),

      JSON.stringify(
        data
      )
    );
}


function loadLocalDay(
  email,
  dayNumber
){

  const raw =
    localStorage
      .getItem(
        localDayKey(
          email,
          dayNumber
        )
      );

  if(!raw){

    return null;
  }

  try{

    return normalizeDay(
      JSON.parse(
        raw
      )
    );

  }catch(e){

    return null;
  }
}


function mergeLocalDays(){

  for(
    let dayNumber=1;
    dayNumber<=DAY_COUNT;
    dayNumber++
  ){

    const local =
      loadLocalDay(
        currentUser.email,
        dayNumber
      );

    if(!local){
      continue;
    }

    const remote =
      appDays[
        dayNumber - 1
      ];


    if(
      !remote ||
      isNewer(
        local.updated,
        remote.updated
      )
    ){

      appDays[
        dayNumber - 1
      ] =
        clone(local);

      dirtyDays[
        dayNumber
      ] = true;
    }
  }


  Object
    .keys(
      dirtyDays
    )
    .forEach(
      day => {

        if(
          dirtyDays[
            day
          ]
        ){

          saveDayToServer(
            Number(day)
          );
        }
      }
    );
}


function isNewer(a,b){

  const ta =
    a
      ? new Date(a).getTime()
      : 0;

  const tb =
    b
      ? new Date(b).getTime()
      : 0;

  return ta > tb;
}


/* =========================
   ФОРМАТ
========================= */

function formatPortion(
  value
){

  const number =
    Number(
      value || 0
    );

  if(
    Number.isInteger(
      number
    )
  ){

    return String(
      number
    );
  }

  return String(number)
    .replace(
      '.',
      ','
    );
}


function formatScore(
  value
){

  const number =
    Math.round(
      (
        Number(
          value || 0
        ) +
        Number.EPSILON
      ) * 10
    ) / 10;

  return number
    .toFixed(1)
    .replace(
      '.',
      ','
    );
}


function formatSignedScore(
  value
){

  const number =
    Math.round(
      (
        Number(
          value || 0
        ) +
        Number.EPSILON
      ) * 10
    ) / 10;

  const formatted =
    number
      .toFixed(1)
      .replace(
        '.',
        ','
      );

  return (
    number > 0
      ? '+' + formatted
      : formatted
  );
}


function escapeHtml(
  value
){

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );
}


/* =========================
   ВЫХОД
========================= */

function logoutUser(){

  flushCurrentDay();

  localStorage
    .removeItem(
      STORAGE_EMAIL
    );

  currentUser = null;
  currentDay = 1;
  currentView = 'diary';

  appDays =
    new Array(
      DAY_COUNT
    ).fill(null);

  dirtyDays = {};
  savingDays = {};

  saveStatusText = '';

  try{
    localStorage.removeItem('edabalans_identity_v1');
  }catch(error){}

  window.EdabalansIdentity = null;

  if(
    typeof window.tma__userbar__sendLogout ===
    'function'
  ){
    window.tma__userbar__sendLogout();
    return;
  }

  location.assign('/members/login?exit=y');
}


/* =========================
   УХОД СО СТРАНИЦЫ
========================= */

document
  .addEventListener(
    'visibilitychange',
    function(){

      if(
        document
          .visibilityState ===
          'hidden' &&
        currentUser
      ){

        flushCurrentDay();
      }
    }
  );


window
  .addEventListener(
    'pagehide',
    function(){

      if(currentUser){
        flushCurrentDay();
      }
    }
  );


/* =========================
   ЗАПУСК
========================= */

(async function initDqs(){

  const tildaIdentity =
    window.EdabalansIdentity || {};

  const tildaEmail =
    tildaIdentity.source === 'tilda'
      ? String(tildaIdentity.email || '')
          .trim()
          .toLowerCase()
      : '';

  if(!tildaEmail){

    redirectToTildaLogin();

    return;
  }

  localStorage
    .setItem(
      STORAGE_EMAIL,
      tildaEmail
    );


  document
    .getElementById(
      'dqs-app'
    )
    .innerHTML =
      `
      <div class="dqs-auth-card">
        Загрузка...
      </div>
      `;


  try{

    const data =
      await api({
        action:'openUser',
        email:tildaEmail
      });


    if(!data.ok){

      localStorage
        .removeItem(
          STORAGE_EMAIL
        );

      showDqsError(
        data.error ||
        'Не удалось открыть DQS'
      );

      return;
    }


    currentUser =
      data;

    appDays =
      normalizeDays(
        data.days || []
      );

    mergeLocalDays();


    if(
      data.needsStartDate
    ){

      showStartDate();

    }else{

      currentDay =
        getDefaultDay(
          data.startDate
        );

      currentView =
        'diary';

      renderCurrentView(
        false
      );

      maybeShowTutorial();
    }


  }catch(error){

    showDqsError(
      error.message
    );
  }

})();
</script>
