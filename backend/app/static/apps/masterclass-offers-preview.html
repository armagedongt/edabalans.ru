<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Дополнительные материалы · предпросмотр</title>
  <link rel="stylesheet" href="../masterclass.css">
  <style>body{margin:0;background:#f5f0e8}</style>
</head>
<body>
  <div id="preview"></div>
  <script>
    (function(){
      var placement=new URLSearchParams(location.search).get('placement')||'day-1-offer';
      var timed=placement!=='day-1-offer'&&placement!=='offers-hub';
      var deadline=timed?new Date(Date.now()+26*60*60*1000):null;
      var products=[
        {title:'Система рецептов',description:'Как научиться собирать здоровые тарелки быстро, просто и вкусно — от выбора продуктов до собственных блюд.',standard:3900,price:1900,details:[['Рецепты и конструктор блюд','Готовые сочетания и понятный способ собирать собственные блюда.'],['Выбор продуктов и готовой еды','Ориентиры для магазина, доставки и еды вне дома.'],['Вкус и организация готовки','Как сделать полезную еду удобной и действительно приятной.']]},
        {title:'Комплект: рецепты и тренировки',description:'Все недостающие самостоятельные материалы одним комплектом.',standard:7800,price:3900,details:[['Система рецептов','Практическая система блюд и сочетаний продуктов.'],['Мини-курс «С дивана до тренировок»','Спокойное начало тренировок без перегруза и гонки за идеальным планом.']]}
      ];
      function money(value){return value.toLocaleString('ru-RU')+' ₽'}
      function included(items){return '<div class="mc-offer-includes"><span class="mc-offer-includes-title">В составе</span><ul>'+items.map(function(item){return '<li><span aria-hidden="true">✓</span><div><strong>'+item[0]+'</strong><p>'+item[1]+'</p></div></li>'}).join('')+'</ul></div>'}
      function timer(){if(!deadline)return '';var exact=deadline.toLocaleString('ru-RU',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}),left=Math.max(0,deadline-new Date()),total=Math.floor(left/60000),days=Math.floor(total/1440),hours=Math.floor(total%1440/60),minutes=total%60;return '<div class="mc-countdown" role="timer"><span>Цена действует до '+exact+' по вашему времени</span><strong>Осталось: '+(days?days+' дн. ':'')+hours+' ч '+minutes+' мин</strong></div>'}
      function render(){document.querySelector('#preview').innerHTML='<main class="mc mc-offer-page"><h1>Можно добавить к мастер-классу</h1><p class="lead">Выберите дополнительные материалы, которые помогут продолжить работу после мастер-класса.</p><section class="mc-offers"><div class="mc-offer-summary'+(deadline?' has-timer':'')+'"><section class="mc-owned"><span class="mc-owned-title">В вашем тарифе</span><ul><li><span aria-hidden="true">✓</span>Мастер-класс по изменению питания и пищевых привычек</li><li><span aria-hidden="true">✓</span>Мини-курс «Калорийный»</li></ul></section>'+timer()+'</div><div class="offer-grid">'+products.map(function(item){var saving=item.standard-item.price,percent=Math.round(saving*100/item.standard);return '<article class="mc-offer-card"><div class="mc-offer-copy"><span class="mc-offer-kind">Дополнение к программе</span><h2>'+item.title+'</h2><p>'+item.description+'</p>'+included(item.details)+'</div><div class="mc-offer-terms"><div class="mc-offer-prices"><span class="offer-old">'+money(item.standard)+'</span><strong class="offer-price">'+money(item.price)+'</strong></div><span class="offer-saving">Выгода '+percent+'% · '+money(saving)+'</span><button type="button">Купить</button></div></article>'}).join('')+'</div></section></main>'}
      render();if(deadline)setInterval(render,60000);
    }());
  </script>
</body>
</html>
