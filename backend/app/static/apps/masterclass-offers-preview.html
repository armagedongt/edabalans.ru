<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Дополнительные материалы · предпросмотр</title>
  <style>
    :root{--ink:#29251f;--muted:#766e63;--paper:#f5efe6;--card:#fffdfa;--line:#dfd4c5;--accent:#d85f3e;--green:#e8f1ea}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Inter,Arial,sans-serif}.wrap{max-width:820px;margin:auto;padding:34px 22px 64px}.eyebrow{margin:0 0 8px;color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}h1{max-width:680px;margin:0;font-size:clamp(38px,5.4vw,52px);font-weight:800;line-height:1.02;letter-spacing:-.035em}.lead{max-width:650px;margin:12px 0 0;color:var(--muted);font-size:17px}.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 14px}.owned{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-radius:11px;background:var(--green);font-size:13px}.owned b{font-weight:600}.owned span{font-weight:600}.timer{padding:9px 12px;border:1px solid #e5a996;border-radius:11px;background:#fff3ee;color:#873d28;font-size:13px;font-weight:600}.grid{display:grid;gap:10px}.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:16px 17px;border:1px solid var(--line);border-radius:17px;background:var(--card);box-shadow:0 7px 20px #3a2e1c09}.card-copy{min-width:0}.kind{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}.card h2{margin:4px 0 5px;font-size:23px;font-weight:800;line-height:1.15}.card p{max-width:520px;margin:0;color:var(--muted);font-size:14px;line-height:1.45}.details{display:inline-block;margin-top:8px;border:0;background:transparent;color:#8e432f;font:600 13px/1.2 inherit;text-decoration:underline;cursor:pointer}.terms{display:grid;justify-items:end;min-width:160px}.prices{display:flex;align-items:baseline;gap:7px}.old{color:var(--muted);font-size:12px;text-decoration:line-through}.price{font-size:21px;font-weight:800}.saving{margin-top:1px;color:#287747;font-size:12px;font-weight:600}.buy,.back{min-width:126px;margin-top:9px;padding:9px 13px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;cursor:pointer}.back{min-width:0;margin:0 0 16px}.detail-list{display:grid;gap:10px;margin-top:22px}.detail-card{padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.detail-card h2{margin:0 0 5px;font-size:18px;font-weight:600}.detail-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}.buy-status{margin:8px 0 0;color:#287747;font-size:12px;font-weight:600}@media(max-width:620px){.wrap{padding:26px 14px 50px}h1{font-size:38px}.lead{font-size:16px}.summary{align-items:stretch;flex-direction:column;margin-top:20px}.owned,.timer{width:max-content;max-width:100%}.card{grid-template-columns:1fr;gap:13px;padding:15px}.terms{grid-template-columns:1fr auto;align-items:end;justify-items:start;gap:10px;min-width:0}.buy{grid-column:2;grid-row:1/3;margin:0}.prices{align-self:end}}
    .detail-card h2{font-size:23px;font-weight:800}
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow" id="stage">Дополнительные материалы</p>
    <h1>Можно добавить к мастер-классу</h1>
    <p class="lead">Здесь собраны только доступные вам дополнения. Уже купленные продукты повторно не показываются.</p>
    <div class="summary"><div class="owned"><b>Уже есть:</b><span>Мастер-класс</span></div><div class="timer">Цена действует ещё 23 ч 48 мин</div></div>
    <section class="grid" id="cards"></section>
  </main>
  <script>
    (function(){
      var placement=new URLSearchParams(location.search).get('placement')||'offers-hub';
      var stages={'day-15-offer':'Дополнения после дня 15','day-17-offer':'Дополнения после дня 17','day-19-offer':'Дополнения после саморевью','day-21-offer':'Дополнения после завершения','offers-hub':'Дополнительные материалы'};
      document.querySelector('#stage').textContent=stages[placement]||'Дополнительные материалы';
      var items=[['Система рецептов','Готовые сочетания продуктов и идеи блюд на каждый день.',4900,3900],['Мини-курс «Калорийный»','Калории как временный инструмент без пожизненного подсчёта.',3900,2900],['С дивана до тренировок','Плавный переход от нулевой активности к силовым тренировкам.',5900,4900]];
      if(placement==='day-19-offer'||placement==='day-21-offer')items.unshift(['Индивидуальная консультация','Личный разбор дневника и ваших выводов по мастер-классу.',7900,6900]);
      function draw(){document.querySelector('.wrap').innerHTML='<p class="eyebrow" id="stage">'+(stages[placement]||'Дополнительные материалы')+'</p><h1>Можно добавить к мастер-классу</h1><p class="lead">Здесь собраны только доступные вам дополнения. Уже купленные продукты повторно не показываются.</p><div class="summary"><div class="owned"><b>Уже есть:</b><span>Мастер-класс</span></div><div class="timer">Цена действует ещё 23 ч 48 мин</div></div><section class="grid" id="cards">'+items.map(function(item,index){return'<article class="card"><div class="card-copy"><span class="kind">Дополнение</span><h2>'+item[0]+'</h2><p>'+item[1]+'</p><button class="details" data-index="'+index+'" type="button">Что входит</button></div><div class="terms"><div class="prices"><span class="old">'+item[2].toLocaleString('ru-RU')+' ₽</span><strong class="price">'+item[3].toLocaleString('ru-RU')+' ₽</strong></div><span class="saving">Выгода '+(item[2]-item[3]).toLocaleString('ru-RU')+' ₽</span><button class="buy" type="button">Купить</button></div></article>'}).join('')+'</section>';document.querySelectorAll('.details').forEach(function(button){button.onclick=function(){showDetails(items[+button.dataset.index])}});document.querySelectorAll('.buy').forEach(function(button){button.onclick=function(){button.textContent='Перейти к оплате';button.insertAdjacentHTML('afterend','<span class="buy-status">Цена проверена</span>')}})}
      function showDetails(item){document.querySelector('.wrap').innerHTML='<button class="back" type="button">← К предложениям</button><p class="eyebrow">Что входит</p><h1>'+item[0]+'</h1><p class="lead">'+item[1]+'</p><div class="detail-list"><section class="detail-card"><h2>Материалы</h2><p>Основная программа и практические примеры собраны в одном последовательном разделе.</p></section><section class="detail-card"><h2>Доступ</h2><p>Материалы останутся в личном кабинете после завершения мастер-класса.</p></section><section class="detail-card"><h2>Поддержка</h2><p>Все условия и формат сопровождения показаны до перехода к оплате.</p></section></div>';document.querySelector('.back').onclick=draw}
      draw();
    }());
  </script>
</body>
</html>
