<script>
(function(){

/* =========================================================
   CONFIG
========================================================= */

var API_URL =
  'https://edabalans.ru/api/apps/strength';

var APP_CONTEXT = window.EdabalansAppContext || {};
var ACCOUNT_URL = String(APP_CONTEXT.accountUrl || '/lk');
var MANAGED_TARGET =
  APP_CONTEXT.mode === 'admin'
  ? String(APP_CONTEXT.targetUserId || '')
  : '';

if(MANAGED_TARGET){
  API_URL = '/api/apps/strength';
}

var root =
  document.getElementById('strength-app');

if(!root){
  return;
}


/* =========================================================
   STATE
========================================================= */

var app = {
  email:'',
  isAdmin:false,

  mode:'loading',
  adminUsers:[],
  selectedUser:null,

  mainTab:'training',
  statsTab:'calendar',

  workoutType:1,
  selectedIndex:0,
  entryMode:'edit',
  selectedPrevious:{},
  workouts:{
    1:null,
    2:null,
    3:null
  },

  calendarMonth:
    new Date().getMonth(),

  calendarYear:
    new Date().getFullYear(),

  statsExerciseId:'',

  modal:null,
  managerDraft:null,
  modalScrollState:null,
  rpeMenu:null,

  saveTimers:{},
  saveRequests:0,
  saving:false,
  saveError:'',

  motivation:''
};


var motivations = [
  'Давай. Ты сможешь.',
  'Сегодня станешь немного сильнее.',
  'Силы с тобой.',
  'Начни с первого подхода.',
  'Ещё одна тренировка в копилку.',
  'Спокойно. Подход за подходом.',
  'Работаем.',
  'Ты уже здесь — половина дела сделана.',
  'Сегодня просто сделай свою работу.',
  'Сильнее, чем в прошлый раз.',
  'Не спеши. Делай качественно.',
  'Один хороший подход за другим.',
  'Сегодняшняя работа — завтрашний результат.',
  'Ты молодец. Продолжай.',
  'Скоро отдохнёшь.',
  'Ещё немного — и готово.',
  'Соберись на этот подход.',
  'Не нужно идеально. Нужно сделать.',
  'Фокус на следующем подходе.',
  'Каждый подход считается.'
];

app.motivation =
  motivations[
    Math.floor(
      Math.random() *
      motivations.length
    )
  ];


/* =========================================================
   HTTP
========================================================= */

function getApi(params){

  var query = [];
  var key;

  if(MANAGED_TARGET){
    params.target_user_id = MANAGED_TARGET;
  }

  for(key in params){

    if(params.hasOwnProperty(key)){

      query.push(
        encodeURIComponent(key) +
        '=' +
        encodeURIComponent(
          params[key]
        )
      );

    }

  }

  return fetch(
    API_URL +
    '?' +
    query.join('&'),
    {
      method:'GET',
      credentials:'include',
      redirect:'follow'
    }
  )
  .then(function(response){

    return response.json();

  })
  .then(function(data){

    if(!data.ok){

      throw new Error(
        data.error ||
        'Ошибка сервера'
      );

    }

    return data;

  });

}


function postApi(body){

  if(MANAGED_TARGET){
    body.target_user_id = MANAGED_TARGET;
  }

  return fetch(
    API_URL,
    {
      method:'POST',
      credentials:'include',

      headers:{
        'Content-Type':
          'text/plain;charset=utf-8'
      },

      body:
        JSON.stringify(body),

      redirect:'follow'
    }
  )
  .then(function(response){

    return response.json();

  })
  .then(function(data){

    if(!data.ok){

      throw new Error(
        data.error ||
        'Ошибка сервера'
      );

    }

    return data;

  });

}


/* =========================================================
   ACCOUNT IDENTITY
========================================================= */

function detectEmail(){
  var identity=window.EdabalansIdentity||{};
  return identity.source==='native'&&identity.email
    ? String(identity.email).trim().toLowerCase()
    : '';

}


/* =========================================================
   HELPERS
========================================================= */

function blank(v){

  return (
    v === '' ||
    v === null ||
    typeof v ===
      'undefined'
  );

}


function esc(value){

  if(
    value === null ||
    typeof value ===
      'undefined'
  ){
    return '';
  }

  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');

}


function pad2(n){

  return (
    Number(n) < 10
    ?
    '0' + Number(n)
    :
    String(Number(n))
  );

}


function formatDate(value){

  var p;

  if(!value){
    return '';
  }

  p =
    String(value)
    .substring(0,10)
    .split('-');

  if(p.length !== 3){
    return value;
  }

  return (
    p[2] +
    '.' +
    p[1] +
    '.' +
    p[0]
  );

}


function weekday(value){

  var p;
  var d;

  var days = [
    'Воскресенье',
    'Понедельник',
    'Вторник',
    'Среда',
    'Четверг',
    'Пятница',
    'Суббота'
  ];

  if(!value){
    return '';
  }

  p =
    String(value)
    .substring(0,10)
    .split('-');

  d =
    new Date(
      Number(p[0]),
      Number(p[1])-1,
      Number(p[2])
    );

  return days[
    d.getDay()
  ];

}


function round1(value){

  return (
    Math.round(
      Number(value) * 10
    ) / 10
  )
  .toFixed(1)
  .replace('.',',');
}


function dateKey(
  year,
  month,
  day
){

  return (
    year +
    '-' +
    pad2(month+1) +
    '-' +
    pad2(day)
  );

}


function currentUserId(){

  return (
    app.selectedUser
    ?
    app.selectedUser.user_id
    :
    ''
  );

}


function currentWorkout(){

  return (
    app.workouts[
      app.workoutType
    ] || {
      workout_types:[],
      exercise_catalog:[],
      sessions:[],
      session_exercises:[],
      sets:[]
    }
  );

}


function copyCatalog(catalog){
  return (catalog || []).map(function(item){
    return {
      exercise_id:String(item.exercise_id || ''),
      exercise_name:String(item.exercise_name || ''),
      active:item.active === true || String(item.active).toLowerCase() === 'true',
      catalog_active:item.catalog_active !== false && String(item.catalog_active).toLowerCase() !== 'false',
      sort_order:Number(item.sort_order || 0),
      source:String(item.source || 'history'),
      muscles:String(item.muscles || ''),
      tips:Array.isArray(item.tips) ? item.tips.slice() : [],
      media_url:String(item.media_url || '')
    };
  });
}


function syncModalLock(){
  var locked = Boolean(app.modal);
  if(locked && !app.modalScrollState){
    app.modalScrollState={
      html:document.documentElement.style.overflow,
      body:document.body.style.overflow
    };
    document.documentElement.style.overflow='hidden';
    document.body.style.overflow='hidden';
  }else if(!locked && app.modalScrollState){
    document.documentElement.style.overflow=app.modalScrollState.html;
    document.body.style.overflow=app.modalScrollState.body;
    app.modalScrollState=null;
  }
}


/* =========================================================
   BACKEND → UI MODEL
========================================================= */

function buildWorkoutModel(raw){

  var sessions = [];
  var sessionMap = {};
  var exerciseMap = {};
  var i;
  var row;
  var s;
  var ex;
  var key;

  raw = raw || {};

  /*
    Sessions
  */

  var rawSessions =
    raw.sessions || [];

  for(
    i=0;
    i<rawSessions.length;
    i++
  ){

    row =
      rawSessions[i];

    s = {
      session_id:
        row.session_id,

      number:
        Number(
          row.session_number
        ),

      date:
        row.date
        ?
        String(row.date)
          .substring(0,10)
        :
        '',

      status:
        row.status || '',

      exercises:[]
    };

    sessions.push(s);

    sessionMap[
      String(
        s.session_id
      )
    ] = s;

  }

  sessions.sort(
    function(a,b){
      return (
        a.number -
        b.number
      );
    }
  );

  /*
    Session exercises
  */

  var rawEx =
    raw.session_exercises ||
    [];

  for(
    i=0;
    i<rawEx.length;
    i++
  ){

    row = rawEx[i];

    s =
      sessionMap[
        String(
          row.session_id
        )
      ];

    if(!s){
      continue;
    }

    ex = {
      id:
        String(
          row.exercise_id
        ),

      name:
        row.exercise_name ||
        '',

      sort_order:
        Number(
          row.sort_order ||
          0
        ),

      note:
        row.note || '',

      sets:[]
    };

    s.exercises.push(ex);

    key =
      String(
        row.session_id
      ) +
      '|' +
      String(
        row.exercise_id
      );

    exerciseMap[key] = ex;

  }

  /*
    Sets
  */

  var rawSets =
    raw.sets || [];

  for(
    i=0;
    i<rawSets.length;
    i++
  ){

    row = rawSets[i];

    key =
      String(
        row.session_id
      ) +
      '|' +
      String(
        row.exercise_id
      );

    ex =
      exerciseMap[key];

    if(!ex){
      continue;
    }

    ex.sets.push({
      set_number:
        Number(
          row.set_number
        ),

      planWeight:
        blank(row.plan_weight)
        ?
        ''
        :
        row.plan_weight,

      planReps:
        blank(row.plan_reps)
        ?
        ''
        :
        row.plan_reps,

      factWeight:
        blank(row.fact_weight)
        ?
        ''
        :
        row.fact_weight,

      factReps:
        blank(row.fact_reps)
        ?
        ''
        :
        row.fact_reps,

      rpe:
        blank(row.rpe)
        ?
        ''
        :
        row.rpe,

      completed:
        row.completed === true ||
        String(row.completed).toLowerCase() === 'true'
    });

  }

  /*
    Sorting
  */

  for(
    i=0;
    i<sessions.length;
    i++
  ){

    sessions[i]
      .exercises
      .sort(
        function(a,b){
          return (
            a.sort_order -
            b.sort_order
          );
        }
      );

    for(
      var j=0;
      j<
      sessions[i].exercises.length;
      j++
    ){

      sessions[i]
        .exercises[j]
        .sets
        .sort(
          function(a,b){
            return (
              a.set_number -
              b.set_number
            );
          }
        );

    }

  }

  return {
    workout_types:
      raw.workout_types ||
      [],

    catalog:
      raw.exercise_catalog ||
      [],

    sessions:sessions
  };

}

========================================================= */

  render();

  getApi({

  })

    app.adminUsers =

      [];

    app.mode =
      'adminList';

    render();

  })
  .catch(showFatal);

}


function loadClient(user){

  app.selectedUser =
    user;

  app.mode =
    'loading';

  render();

  Promise.all([
    getWorkoutType(
      user,
      1

      2

    getWorkoutType(
      user,
      3
    )
  ])
  .then(function(results){

    app.workouts[1] =
      results[0];

    app.workouts[2] =
      results[1];

    app.workouts[3] =
      results[2];

    chooseInitialWorkoutType();

    app.mode =
      'client';

    render();

  })
  .catch(showFatal);

}


function getWorkoutType(
  user,
  type
){

  var params = {
    action:
      'getWorkout',

    type:
      type
  };

  /*
    Админ открывает пользователя
    по user_id.
  */

  if(app.isAdmin){

    params.user_id =
      user.user_id;

    params.admin_email =
      app.email;

  }else{

    params.email =
      app.email;

  }

  return getApi(params)
    .then(function(result){

      return buildWorkoutModel(
        result.workout
      );

    });

}


function chooseInitialWorkoutType(){

  var type;

  // The exercise catalog is shared by all three workout templates, so it
  // cannot tell us which template the user actually works with. Prefer the
  // first template that already has a session; only fall back to the current
  // (normally first) template when the history is still empty.
  for(type=1;type<=3;type++){

    if(
      app.workouts[type] &&
      app.workouts[type]
        .sessions.length
    ){

      app.workoutType =
        type;

      break;
    }

  }

  var sessions =
    currentWorkout()
      .sessions;

  app.selectedIndex =
    sessions.length
    ?
    sessions.length-1
    :
    0;

}


/* =========================================================
   SAVE SESSION
========================================================= */

function sessionPayload(session){

  var result = {
    session_id:
      session.session_id,

    session_number:
      session.number,

    date:
      session.date || '',

    exercises:[]
  };

  var i;
  var j;
  var ex;
  var outEx;

  for(
    i=0;
    i<session.exercises.length;
    i++
  ){

    ex =
      session.exercises[i];

    outEx = {
      exercise_id:
        ex.id,

      exercise_name:
        ex.name,

      sort_order:
        ex.sort_order ||
        i+1,

      note:
        ex.note || '',

      sets:[]
    };

    for(
      j=0;
      j<ex.sets.length;
      j++
    ){

      outEx.sets.push({
        set_number:
          j+1,

        plan_weight:
          ex.sets[j]
            .planWeight,

        plan_reps:
          ex.sets[j]
            .planReps,

        fact_weight:
          ex.sets[j]
            .factWeight,

        fact_reps:
          ex.sets[j]
            .factReps,

        rpe:
          ex.sets[j]
            .rpe,

        completed:
          ex.sets[j]
            .completed === true
      });

    }

    result.exercises.push(
      outEx
    );

  }

  return result;

}


function scheduleSave(
  sessionIndex
){

  var body =
    sessionSaveBody(
      sessionIndex
    );

  if(!body){
    return;
  }

  var timerKey = [
    body.target_user_id || body.email || '',
    body.workout_type,
    body.session.session_id || body.session.session_number
  ].join('|');

  if(app.saveTimers[timerKey]){

    clearTimeout(
      app.saveTimers[timerKey]
    );

  }

  app.saving = true;
  app.saveError = '';

  renderSavingOnly();

  app.saveTimers[timerKey] =
    setTimeout(
      function(){

        delete app.saveTimers[timerKey];
        persistSessionBody(body);

      },
      450
    );

}


function saveSessionNow(
  sessionIndex
){

  var body =
    sessionSaveBody(
      sessionIndex
    );

  if(body){
    persistSessionBody(body);
  }

}


function sessionSaveBody(
  sessionIndex
){

  var workoutType =
    app.workoutType;

  var workout =
    app.workouts[
      workoutType
    ];

  var session =
    workout && workout
      .sessions[
        sessionIndex
      ];

  if(!session){
    return null;
  }

  var body = {
    action:
      'saveSession',

    workout_type:
      workoutType,

    session:
      sessionPayload(
        session
      )
  };

  if(app.isAdmin){

    var targetUserId =
      currentUserId();

    body.user_id =
      targetUserId;

    body.target_user_id =
      targetUserId;

    body.admin_email =
      app.email;

  }else{

    body.email =
      app.email;

  }

  return body;

}


function persistSessionBody(body){

  app.saveRequests += 1;

  postApi(body)
    .then(function(){

      app.saveRequests =
        Math.max(0,app.saveRequests-1);

      app.saving =
        app.saveRequests > 0 ||
        Object.keys(app.saveTimers).length > 0;

      app.saveError = '';

      renderSavingOnly();

    })
    .catch(function(error){

      app.saveRequests =
        Math.max(0,app.saveRequests-1);

      app.saving =
        app.saveRequests > 0 ||
        Object.keys(app.saveTimers).length > 0;

      app.saveError =
        error.message ||
        String(error);

      renderSavingOnly();

    });

}


function renderSavingOnly(){

  var el =
    document.getElementById(
      'st-save-state'
    );

  if(!el){
    return;
  }

  if(app.saveError){

    el.className =
      'st-saving error';

    el.innerHTML =
      'Ошибка сохранения: ' +
      esc(app.saveError);

    return;
  }

  el.className =
    'st-saving';

  el.innerHTML =
    app.saving
    ?
    'Сохраняю…'
    :
    'Сохранено';

}


/* =========================================================
   EXERCISE HELPERS
========================================================= */

function findExercise(
  session,
  id
){

  var i;

  if(!session){
    return null;
  }

  for(
    i=0;
    i<session.exercises.length;
    i++
  ){

    if(
      String(
        session.exercises[i].id
      ) ===
      String(id)
    ){

      return (
        session.exercises[i]
      );

    }

  }

  return null;

}


function previousExercise(
  index,
  id
){

  if(index <= 0){
    return null;
  }

  return findExercise(
    currentWorkout()
      .sessions[
        index-1
      ],
    id
  );

}


function activeCatalog(){

  var catalog =
    currentWorkout()
      .catalog.slice();

  catalog.sort(
    function(a,b){
      return (
        Number(
          a.sort_order ||
          0
        ) -
        Number(
          b.sort_order ||
          0
        )
      );
    }
  );

  return catalog.filter(
    function(item){

      return !(
        item.catalog_active === false ||
        item.active === false ||
        String(
          item.active
        ).toLowerCase() ===
        'false'
      );

    }
  );

}


function catalogItemById(id){
  var catalog = currentWorkout().catalog || [];
  for(var i=0;i<catalog.length;i++){
    if(String(catalog[i].exercise_id) === String(id)){
      return catalog[i];
    }
  }
  return null;
}


function isFilled(session){

  var i;
  var j;

  if(!session){
    return false;
  }

  for(
    i=0;
    i<session.exercises.length;
    i++
  ){

    for(
      j=0;
      j<
      session.exercises[i]
        .sets.length;
      j++
    ){

      if(
        !blank(
          session.exercises[i]
            .sets[j]
            .rpe
        )
      ){

        return true;

      }

    }

  }

  return false;

}


function isLatest(){

  var sessions =
    currentWorkout()
      .sessions;

  return (
    sessions.length &&
    app.selectedIndex ===
      sessions.length-1
  );

}


function clientLocked(index){

  if(app.isAdmin){
    return false;
  }

  var session =
    currentWorkout()
      .sessions[index];

  return (
    !session ||
    !session.date
  );

}

function visibleSessions(){

    currentWorkout()
      .sessions;

  var result = [];

    var i=
      app.selectedIndex-2;
    i<=
      app.selectedIndex;
    i++
  ){

    if(
      i>=0 &&
      i<sessions.length
    ){

      result.push({
        index:i,
        session:sessions[i],
        current:
          i ===
          app.selectedIndex
      });

    }else{

      result.push({
        index:-1,
        session:null,
        current:false
      });

    }

  }

  return result;

}

  var sessions =
    currentWorkout()
      .sessions;

  if(!sessions.length){

  return renderCurrentExercises();

function exerciseHistory(id,name){
  var result = [];
  for(var type=1;type<=3;type++){
    var workout = app.workouts[type];
    if(!workout){ continue; }
    for(var index=0;index<workout.sessions.length;index++){
      if(type === app.workoutType && index === app.selectedIndex){ continue; }
      var session = workout.sessions[index];
      var exercise = findExercise(session,id);
      if(!exercise){
        for(var e=0;e<session.exercises.length;e++){
          if(String(session.exercises[e].name).toLowerCase() === String(name).toLowerCase()){
            exercise = session.exercises[e];
            break;
          }
        }
      }
      if(!exercise){ continue; }
      var filled = exercise.sets.some(function(set){
        return !blank(set.factWeight) || !blank(set.factReps) || !blank(set.rpe);
      });
      if(filled){ result.push({type:type,index:index,session:session,exercise:exercise}); }
    }
  }
  result.sort(function(a,b){
    return String(b.session.date || '').localeCompare(String(a.session.date || '')) || b.session.number-a.session.number;
  });
  return result;
}


function historySetText(set){
  var weight = blank(set.factWeight) ? set.planWeight : set.factWeight;
  var reps = blank(set.factReps) ? set.planReps : set.factReps;
  return (blank(weight) ? '—' : esc(weight)+' кг')+' × '+(blank(reps) ? '—' : esc(reps))+(blank(set.rpe) ? '' : ' · RPE '+esc(set.rpe));
}


function renderPreviousExecutions(exercise){
  var history = exerciseHistory(exercise.id,exercise.name);
  if(!history.length){
    return '<section class="st-previous"><div class="st-previous-title">Было</div><div class="st-history-empty">Истории пока нет</div></section>';
  }
  var key = app.workoutType+'|'+exercise.id;
  var selected = Number(app.selectedPrevious[key] || 0);
  if(selected >= history.length){ selected = 0; }
  var html = '<section class="st-previous"><div class="st-previous-title">Было <small>нажмите, чтобы выбрать</small></div><div class="st-history-strip">';
  for(var i=0;i<history.length;i++){
    var item = history[i];
    html += '<button class="st-history-card '+(i===selected?'selected':'')+'" onclick="ST.choosePrevious(\''+esc(exercise.id)+'\','+i+')"><strong>№ '+esc(item.session.number)+' · '+esc(formatDate(item.session.date)||'без даты')+'</strong>';
    for(var s=0;s<item.exercise.sets.length;s++){
      html += '<span>'+(s+1)+'. '+historySetText(item.exercise.sets[s])+'</span>';
    }
    html += '</button>';
  }
  html += '</div><button class="st-copy-history" onclick="ST.copyPreviousToPlan(\''+esc(exercise.id)+'\')">Перенести выбранное в план</button></section>';
  return html;
}

  var workout = currentWorkout();

    if(!active[String(exercise.id)]){ continue; }
    while(exercise.sets.length < 4){
      exercise.sets.push({set_number:exercise.sets.length+1,planWeight:'',planReps:'',factWeight:'',factReps:'',rpe:''});
    }
    html += '<article class="st-modern-exercise ex'+(i%6)+'">'+
      '<header class="st-modern-head">'+

/* =========================================================
   8RM
========================================================= */

function calculate8RM(
  weight,
  reps,
  rpe
){

  weight =
    Number(weight);

  reps =
    Number(reps);

  rpe =
    Number(rpe);

  if(
    !isFinite(weight) ||
    !isFinite(reps) ||
    !isFinite(rpe) ||
    weight <= 0 ||
    reps <= 0 ||
    rpe < 1 ||
    rpe > 10
  ){

    return null;

  }

  return (
    weight *
    (
      1 +
      (
        reps +
        10 -
        rpe
      ) / 30
    ) /
    (
      1 +
      8 / 30
    )
  );

}


function session8RM(
  session,
  exerciseId
){

  var ex =
    findExercise(
      session,
      exerciseId
    );

  if(
    !ex ||
    ex.sets.length < 2
  ){
    return null;
  }

  var candidates = [];

  /*
    Первый подход исключён.
  */

  for(
    var i=1;
    i<ex.sets.length;
    i++
  ){

    var s =
      ex.sets[i];

    var estimate =
      calculate8RM(
        s.factWeight,
        s.factReps,
        s.rpe
      );

    if(
      estimate === null
    ){
      continue;
    }

    candidates.push({
      weight:
        Number(
          s.factWeight
        ),

      reps:
        Number(
          s.factReps
        ),

      rpe:
        Number(
          s.rpe
        ),

      set:
        i+1,

      estimate:
        estimate
    });

  }

  if(!candidates.length){
    return null;
  }

  var maxWeight =
    candidates[0].weight;

  for(
    i=1;
    i<candidates.length;
    i++
  ){

    if(
      candidates[i].weight >
      maxWeight
    ){

      maxWeight =
        candidates[i].weight;

    }

  }

  var best = null;

  for(
    i=0;
    i<candidates.length;
    i++
  ){

    if(
      candidates[i].weight !==
      maxWeight
    ){
      continue;
    }

    if(
      !best ||
      candidates[i]
        .estimate >
      best.estimate
    ){

      best =
        candidates[i];

    }

  }

  return best;

}


function statsHistory(
  exerciseId
){

  var sessions =
    currentWorkout()
      .sessions;

  var result = [];

  for(
    var i=0;
    i<sessions.length;
    i++
  ){

    if(!sessions[i].date){
      continue;
    }

    var best =
      session8RM(
        sessions[i],
        exerciseId
      );

    if(!best){
      continue;
    }

    result.push({
      date:
        sessions[i].date,

      number:
        sessions[i].number,

      estimate:
        best.estimate,

      weight:
        best.weight,

      reps:
        best.reps,

      rpe:
        best.rpe
    });

  }

  return result;

}

function renderChart(history){

  var W = 820;
  var H = 330;

  var left = 45;
  var right = 18;
  var top = 30;
  var bottom = 52;

  var plotW =
    W-left-right;

  var plotH =
    H-top-bottom;

  var min =
    history[0].estimate;

  var max =
    history[0].estimate;

  var i;

  for(
    i=1;
    i<history.length;
    i++
  ){

    min =
      Math.min(
        min,
        history[i]
          .estimate
      );

    max =
      Math.max(
        max,
        history[i]
          .estimate
      );

  }

  var range =
    Math.max(
      4,
      max-min
    );

  var low =
    min-
    range*.25;

  var high =
    max+
    range*.25;

  function x(index){

    if(
      history.length === 1
    ){
      return (
        left+
        plotW/2
      );
    }

    return (
      left+
      index*
      plotW/
      (
        history.length-1
      )
    );

  }

  function y(value){

    return (
      top+
      (
        high-value
      ) /
      (
        high-low
      ) *
      plotH
    );

  }

  var path = '';

  for(
    i=0;
    i<history.length;
    i++
  ){

    path +=
      (
        i === 0
        ?
        'M '
        :
        ' L '
      )+
      x(i)+
      ' '+
      y(
        history[i]
          .estimate
      );

  }

  var html =
    '<div class="st-card st-chart-card">'+
      '<div class="st-chart-title">Прогресс расчётного максимума ×8</div>'+
      '<div class="st-chart-sub">Одна точка — одна тренировка.</div>'+
      '<svg viewBox="0 0 '+W+' '+H+'">';

  for(
    var g=0;
    g<5;
    g++
  ){

    var gy =
      top+
      g*
      plotH/4;

    var val =
      high-
      g*
      (
        high-low
      )/4;

    html +=
      '<line class="chart-grid" x1="'+left+'" y1="'+gy+'" x2="'+(W-right)+'" y2="'+gy+'"></line>'+
      '<text class="chart-label" x="'+(left-8)+'" y="'+(gy+4)+'" text-anchor="end">'+
        round1(val)+
      '</text>';

  }

  if(
    history.length > 1
  ){

    html +=
      '<path class="chart-line" d="'+path+'"></path>';

  }

  for(
    i=0;
    i<history.length;
    i++
  ){

    html +=
      '<circle class="chart-point" cx="'+x(i)+'" cy="'+y(history[i].estimate)+'" r="6"></circle>'+
      '<text class="chart-value" x="'+x(i)+'" y="'+(y(history[i].estimate)-11)+'" text-anchor="middle">'+
        round1(
          history[i].estimate
        )+
      '</text>'+
      '<text class="chart-label" x="'+x(i)+'" y="'+(H-22)+'" text-anchor="middle">'+
        formatDate(
          history[i].date
        ).slice(0,5)+
      '</text>';

  }

  html +=
      '</svg>'+
    '</div>';

  return html;

}


function renderMethod(){

  return (
    '<div class="st-card st-method">'+
      '<div class="st-method-title">Что такое расчётный максимум ×8</div>'+
      '<div class="st-method-text">'+
        'Это оценка веса, который вы предположительно могли бы выполнить на 8 повторений в свежем рабочем подходе после разминки. Первый подход упражнения в расчёт не входит.'+
      '</div>'+
      '<div class="st-method-text">'+
        'Из остальных подходов сначала выбирается подход с самым большим фактическим весом. Если вес одинаковый — используется подход с более высоким расчётным результатом с учётом повторений и RPE.'+
      '</div>'+
      '<div class="st-formula">'+

        'RPE интерпретируется через повторы в запасе: RPE 10 ≈ 0 повторов в запасе, RPE 9 ≈ 1, RPE 8 ≈ 2. Метрика используется для отслеживания динамики и не является измеренным максимумом.'+
      '</div>'+
      '<div class="st-method-links">'+

        '<a target="_blank" href="https://pubmed.ncbi.nlm.nih.gov/7500624/">Оценка силы по весу и числу повторений</a>'+

function renderManager(){

  var catalog = app.managerDraft || [];

  catalog.sort(
    function(a,b){

      var aActive = a.active === true;
      var bActive = b.active === true;
      if(aActive !== bActive){
        return aActive ? -1 : 1;
      }

      return (
        Number(
          a.sort_order ||
          0
        ) -
        Number(
          b.sort_order ||
          0
        )
      );

    }
  );

  var html =
    '<div class="st-modal-bg" onclick="if(event.target===this) ST.cancelManager()">'+
      '<div class="st-modal st-manager-modal">'+
        '<div class="st-modal-title">Редактировать шаблон '+app.workoutType+'</div>'+
        '<div class="st-modal-sub">Каталог общий для аккаунта. Здесь вы только добавляете упражнения в текущий шаблон, убираете их и меняете порядок.</div>'+
        '<div class="st-manager-scroll"><div class="st-manager-list">';

  for(
    var i=0;
    i<catalog.length;
    i++
  ){

    if(catalog[i].catalog_active === false){
      continue;
    }

    var active =
      !(
        catalog[i].active === false ||
        String(
          catalog[i].active
        ).toLowerCase() ===
        'false'
      );

    html +=
      '<div class="st-manager-row '+(active?'in-template':'out-template')+'">'+
        '<div class="st-manager-name">'+
          esc(
            catalog[i]
              .exercise_name
          )+
        '</div>'+
        '<div class="st-manager-actions">'+
          (active ? '<button class="st-mini" onclick="ST.moveExercise(\''+esc(catalog[i].exercise_id)+'\',-1)" aria-label="Выше">↑</button><button class="st-mini" onclick="ST.moveExercise(\''+esc(catalog[i].exercise_id)+'\',1)" aria-label="Ниже">↓</button>' : '')+
          (catalog[i].source === 'custom' ? '<button class="st-mini" onclick="ST.renameExercise(\''+esc(catalog[i].exercise_id)+'\')">Изменить</button><button class="st-mini danger" onclick="ST.deleteExercise(\''+esc(catalog[i].exercise_id)+'\')">Удалить</button>' : '')+
          '<button class="st-mini" onclick="ST.toggleExercise(\''+esc(catalog[i].exercise_id)+'\')">'+
            (
              active
              ?
              'Убрать'
              :
              'Добавить'
            )+
          '</button>'+
        '</div>'+
      '</div>';

  }

  html +=
        '</div>'+
        '<div class="st-custom-add"><div class="st-custom-add-row"><input id="st-new-exercise" class="st-modal-input" placeholder="Название своего упражнения"><button class="st-modal-btn st-modal-save" onclick="ST.addExercise()">Добавить своё</button></div></div></div>'+
        '<div class="st-modal-actions">'+
          '<button class="st-modal-btn st-modal-close" onclick="ST.cancelManager()">Отмена</button>'+
          '<button class="st-modal-btn st-modal-save" onclick="ST.saveManager()">Готово</button>'+
        '</div>'+
      '</div>'+
    '</div>';

  return html;

}

function saveExerciseSettings(){

  var catalog =
    currentWorkout()
      .catalog;

  var arr = [];

  for(
    var i=0;
    i<catalog.length;
    i++
  ){

    arr.push({
      exercise_id:
        catalog[i]
          .exercise_id,

      active:
        !(
          catalog[i].active === false ||
          String(
            catalog[i].active
          ).toLowerCase() ===
          'false'
        ),

      sort_order:
        Number(
          catalog[i]
            .sort_order ||
          i+1
        )
    });

  }

  var body = {
    action:
      'saveExerciseSettings',

    workout_type:
      app.workoutType,

    exercises:
      arr
  };

  if(app.isAdmin){

    body.user_id =
      currentUserId();

    body.target_user_id =
      currentUserId();

    body.admin_email =
      app.email;

  }else{

    body.email =
      app.email;

  }

  postApi(body)
  .catch(function(error){

    alert(
      'Не удалось сохранить упражнения: '+
      error.message
    );

  });

}

    render();

  },

    app.workoutType =
      Number(type);
    app.entryMode = 'edit';

    var sessions =
      currentWorkout()
        .sessions;

    app.selectedIndex =
      sessions.length
      ?
      sessions.length-1
      :
      0;

    render();

  },


  setEntryMode:function(mode){
    app.entryMode = mode === 'train' ? 'train' : 'edit';
    app.rpeMenu = null;
    render();
    if(mode === 'train' && root.scrollIntoView){
      root.scrollIntoView({behavior:'smooth',block:'start'});
    }
  },

  choosePrevious:function(id,index){
    app.selectedPrevious[app.workoutType+'|'+id] = Number(index);
    render();
  },

  copyPreviousToPlan:function(id){
    var exercise = findExercise(currentWorkout().sessions[app.selectedIndex],id);
    if(!exercise){ return; }
    var history = exerciseHistory(exercise.id,exercise.name);
    var selected = Number(app.selectedPrevious[app.workoutType+'|'+id] || 0);
    var source = history[selected] || history[0];
    if(!source){ return; }
    exercise.sets = source.exercise.sets.map(function(set,index){
      return {set_number:index+1,
        planWeight:blank(set.factWeight)?set.planWeight:set.factWeight,
        planReps:blank(set.factReps)?set.planReps:set.factReps,
        factWeight:'',factReps:'',rpe:''};
    });
    while(exercise.sets.length < 4){
      exercise.sets.push({set_number:exercise.sets.length+1,planWeight:'',planReps:'',factWeight:'',factReps:'',rpe:''});
    }
    scheduleSave(app.selectedIndex);
    render();
  },

  completeSet:function(index,id,setIndex){
    var exercise = findExercise(currentWorkout().sessions[index],id);
    if(!exercise || !exercise.sets[setIndex]){ return; }
    var set = exercise.sets[setIndex];
    if(set.completed === true){
      set.completed = false;
      scheduleSave(index);
      render();
      return;
    }
    if(blank(set.planWeight) || blank(set.planReps)){ return; }
    if(blank(set.factWeight)){ set.factWeight = set.planWeight; }
    if(blank(set.factReps)){ set.factReps = set.planReps; }
    set.completed = true;
    scheduleSave(index);
    render();
  },

  addSet:function(id){
    var exercise = findExercise(currentWorkout().sessions[app.selectedIndex],id);
    if(!exercise){ return; }
    exercise.sets.push({set_number:exercise.sets.length+1,planWeight:'',planReps:'',factWeight:'',factReps:'',rpe:''});
    scheduleSave(app.selectedIndex);
    render();
  },

  removeSet:function(id){
    var exercise = findExercise(currentWorkout().sessions[app.selectedIndex],id);
    if(!exercise || exercise.sets.length <= 1){ return; }
    exercise.sets.pop();
    scheduleSave(app.selectedIndex);
    render();
  },

  changeNote:function(id,value){
    var exercise = findExercise(currentWorkout().sessions[app.selectedIndex],id);
    if(!exercise){ return; }
    exercise.note = value;
    scheduleSave(app.selectedIndex);
  },

      .date =
      value;

    scheduleSave(index);

    render();

  },


  numberClick:function(
    event,
    index
  ){

    if(
      clientLocked(index)
    ){

      event.preventDefault();

      try{
        event.target.blur();
      }catch(e){}

      app.modal = {
        type:'dateWarning'
      };

      render();

      return false;

    }

    if(app.isAdmin){

      setTimeout(
        function(){

          try{
            event.target.select();
          }catch(e){}

        },
        0
      );

    }

    return true;

  },


  changeField:function(
    index,
    id,
    setIndex,
    field,
    value
  ){

    if(
      clientLocked(index)
    ){

      app.modal = {
        type:'dateWarning'
      };

      render();

      return;

    }

    var ex =
      findExercise(
        currentWorkout()
          .sessions[index],
        id
      );

    if(
      !ex ||
      !ex.sets[setIndex]
    ){
      return;
    }

    ex.sets[setIndex][field] =
      value === ''
      ?
      ''
      :
      Number(value);

    scheduleSave(index);

    render();

  },


  openRpe:function(
    event,
    index,
    id,
    setIndex
  ){

    event.preventDefault();
    event.stopPropagation();

    if(
      clientLocked(index)
    ){

      app.modal = {
        type:'dateWarning'
      };

      render();

      return;

    }

    var rect =
      event.currentTarget
        .getBoundingClientRect();

    var height = 330;

    var top =
      rect.bottom+4;

    if(
      top+height >
      window.innerHeight
    ){

      top =
        Math.max(
          5,
          rect.top-height-4
        );

    }

    var left =
      rect.left+
      rect.width/2-
      35;

    left =
      Math.max(
        5,
        Math.min(
          left,
          window.innerWidth-75
        )
      );

    app.rpeMenu = {
      index:index,
      id:id,
      setIndex:setIndex,
      left:left,
      top:top
    };

    render();

  },


  setRpe:function(value){

    if(!app.rpeMenu){
      return;
    }

    var m =
      app.rpeMenu;

    var ex =
      findExercise(
        currentWorkout()
          .sessions[
            m.index
          ],
        m.id
      );

    if(!ex){
      return;
    }

    ex.sets[
      m.setIndex
    ].rpe =
      Number(value);

    app.rpeMenu = null;

    scheduleSave(
      m.index
    );

    render();

  },


  openNote:function(
    index,
    id
  ){

    if(
      clientLocked(index)
    ){

      app.modal = {
        type:'dateWarning'
      };

      render();

      return;

    }

    app.modal = {
      type:'note',
      sessionIndex:index,
      exerciseId:id
    };

    render();

  },


  saveNote:function(){

    if(
      app.isAdmin ||
      !app.modal ||
      app.modal.type !==
      'note'
    ){
      return;
    }

    var textarea =
      document.getElementById(
        'st-note-text'
      );

    var ex =
      findExercise(
        currentWorkout()
          .sessions[
            app.modal
              .sessionIndex
          ],
        app.modal
          .exerciseId
      );

    if(!ex){
      return;
    }

    ex.note =
      textarea
      ?
      textarea.value
      :
      '';

    var index =
      app.modal
        .sessionIndex;

    app.modal = null;

    scheduleSave(index);

    render();

  },


  openManager:function(){

    app.managerDraft = copyCatalog(currentWorkout().catalog);
    app.modal = {
      type:'manager'
    };

    render();

  },


  hideExercise:function(id){

    var catalog =
      currentWorkout()
        .catalog;

    for(
      var i=0;
      i<catalog.length;
      i++
    ){

      if(
        String(
          catalog[i]
            .exercise_id
        ) ===
        String(id)
      ){

        catalog[i]
          .active = false;

        break;

      }

    }

    saveExerciseSettings();

    render();

  },


  toggleExercise:function(id){

    var catalog = app.managerDraft || [];

    for(
      var i=0;
      i<catalog.length;
      i++
    ){

      if(
        String(
          catalog[i]
            .exercise_id
        ) ===
        String(id)
      ){

        var active =
          !(
            catalog[i].active ===
              false ||
            String(
              catalog[i].active
            ).toLowerCase() ===
              'false'
          );

        catalog[i].active =
          !active;

        break;

      }

    }

    render();

  },


  moveExercise:function(
    id,
    direction
  ){

    var catalog = app.managerDraft || [];

    catalog.sort(
      function(a,b){

        return (
          Number(
            a.sort_order ||
            0
          ) -
          Number(
            b.sort_order ||
            0
          )
        );

      }
    );

    var index = -1;

    for(
      var i=0;
      i<catalog.length;
      i++
    ){

      if(
        String(
          catalog[i]
            .exercise_id
        ) ===
        String(id)
      ){

        index = i;
        break;

      }

    }

    var target = index + Number(direction);
    while(
      target >= 0 &&
      target < catalog.length &&
      (catalog[target].active !== true || catalog[target].catalog_active === false)
    ){
      target += Number(direction);
    }

    if(
      index < 0 ||
      target < 0 ||
      target >=
        catalog.length
    ){
      return;
    }

    var temp =
      catalog[index];

    catalog[index] =
      catalog[target];

    catalog[target] =
      temp;

    for(
      i=0;
      i<catalog.length;
      i++
    ){

      catalog[i]
        .sort_order =
        i+1;

    }

    render();

  },


  addExercise:function(){

    var input =
      document.getElementById(
        'st-new-exercise'
      );

    var name =
      input
      ?
      String(
        input.value ||
        ''
      ).trim()
      :
      '';

    if(!name){
      return;
    }

    var id = 'custom-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
    app.managerDraft.push({
      exercise_id:id,
      exercise_name:name,
      active:true,
      catalog_active:true,
      sort_order:app.managerDraft.length+1,
      source:'custom',
      muscles:'',
      tips:[],
      media_url:''
    });
    render();

  },


  renameExercise:function(id){
    var catalog = app.managerDraft || [];
    for(var i=0;i<catalog.length;i++){
      if(String(catalog[i].exercise_id) !== String(id) || catalog[i].source !== 'custom'){
        continue;
      }
      var name = window.prompt('Новое название упражнения',catalog[i].exercise_name);
      if(name === null){ return; }
      name = String(name).trim();
      if(name){ catalog[i].exercise_name = name; }
      render();
      return;
    }
  },


  deleteExercise:function(id){
    var catalog = app.managerDraft || [];
    for(var i=0;i<catalog.length;i++){
      if(String(catalog[i].exercise_id) !== String(id) || catalog[i].source !== 'custom'){
        continue;
      }
      if(!window.confirm('Удалить своё упражнение из каталога? Старая история останется сохранена.')){
        return;
      }
      catalog[i].active = false;
      catalog[i].catalog_active = false;
      render();
      return;
    }
  },


  cancelManager:function(){
    app.managerDraft = null;
    app.modal = null;
    render();
  },


  saveManager:function(){
    var catalog = app.managerDraft || [];
    var body = {
      action:'saveExerciseCatalog',
      workout_type:app.workoutType,
      exercises:catalog.map(function(item,index){
        return {
          exercise_id:item.exercise_id,
          exercise_name:item.exercise_name,
          active:item.active === true,
          catalog_active:item.catalog_active !== false,
          sort_order:index+1,
          source:item.source
        };
      })
    };
    if(app.isAdmin){
      body.target_user_id = currentUserId();
      body.admin_email = app.email;
    }else{
      body.email = app.email;
    }

    var workout = currentWorkout();
    workout.catalog = copyCatalog(catalog);
    var active = catalog.filter(function(item){ return item.catalog_active !== false && item.active === true; });
    var session = workout.sessions[app.selectedIndex];
    if(!session && active.length){
      session = {session_id:'',number:1,date:'',exercises:[]};
      workout.sessions.push(session);
      app.selectedIndex = 0;
    }
    if(session){
      var existing = {};
      session.exercises.forEach(function(item){ existing[String(item.id)] = item; });
      active.forEach(function(item,index){
        var exercise = existing[String(item.exercise_id)];
        if(!exercise){
          exercise = {id:item.exercise_id,name:item.exercise_name,note:'',sets:[]};
          for(var setIndex=0;setIndex<4;setIndex++){
            exercise.sets.push({set_number:setIndex+1,planWeight:'',planReps:'',factWeight:'',factReps:'',rpe:'',completed:false});
          }
          session.exercises.push(exercise);
        }
        exercise.name = item.exercise_name;
        exercise.sort_order = index+1;
      });
      session.exercises.sort(function(a,b){ return Number(a.sort_order || 999)-Number(b.sort_order || 999); });
    }

    var sessionBody = session ? sessionSaveBody(app.selectedIndex) : null;
    postApi(body)
      .then(function(){ return sessionBody ? postApi(sessionBody) : null; })
      .then(function(){
        return Promise.all([getWorkoutType(app.selectedUser,1),getWorkoutType(app.selectedUser,2),getWorkoutType(app.selectedUser,3)]);
      })
      .then(function(results){
        app.workouts[1]=results[0]; app.workouts[2]=results[1]; app.workouts[3]=results[2];
        app.managerDraft=null; app.modal=null;
        var sessions=currentWorkout().sessions;
        app.selectedIndex=sessions.length?sessions.length-1:0;
        render();
      })
      .catch(function(error){ alert('Не удалось сохранить шаблон: '+error.message); });
  },


  openTutorial:function(){
    app.modal={type:'tutorial'};
    render();
  },


  openExerciseInfo:function(id){
    app.modal={type:'exerciseInfo',exerciseId:id};
    render();
  },


  createFirstSession:function(){

    var catalog =
      activeCatalog();

    var exercises = [];

    for(
      var i=0;
      i<catalog.length;
      i++
    ){

      exercises.push({
        id:
          catalog[i]
            .exercise_id,

        name:
          catalog[i]
            .exercise_name,

        sort_order:
          catalog[i]
            .sort_order,

        note:'',

        sets:[
          {
            set_number:1,
            planWeight:'',
            planReps:'',
            factWeight:'',
            factReps:'',
            rpe:''
          }
        ]
      });

    }

    currentWorkout()
      .sessions
      .push({
        session_id:'',
        number:1,
        date:'',
        exercises:
          exercises
      });

    app.selectedIndex = 0;

    saveSessionNow(0);

    render();

  },


  copyNext:function(mode){

    if(
      !isLatest()
    ){
      return;
    }

    var workout =
      currentWorkout();

    var source =
      workout.sessions[
        app.selectedIndex
      ];

    var next = {
      session_id:'',
      number:
        source.number+1,
      date:'',
      exercises:[]
    };

    for(
      var i=0;
      i<source.exercises.length;
      i++
    ){

      var old =
        source.exercises[i];

      var ne = {
        id:old.id,
        name:old.name,
        sort_order:
          old.sort_order,
        note:'',
        sets:[]
      };

      for(
        var j=0;
        j<old.sets.length;
        j++
      ){

        ne.sets.push({
          set_number:j+1,

          planWeight:
            mode === 'fact'
            ?
            old.sets[j]
              .factWeight
            :
            old.sets[j]
              .planWeight,

          planReps:
            mode === 'fact'
            ?
            old.sets[j]
              .factReps
            :
            old.sets[j]
              .planReps,

          factWeight:'',
          factReps:'',
          rpe:''
        });

      }

      next.exercises.push(
        ne
      );

    }

    workout.sessions.push(
      next
    );

    app.selectedIndex =
      workout.sessions.length-1;

    saveSessionNow(
      app.selectedIndex
    );

    render();

  },


  prevMonth:function(){

    app.calendarMonth--;

    if(
      app.calendarMonth < 0
    ){

      app.calendarMonth = 11;
      app.calendarYear--;

    }

    render();

  },


  nextMonth:function(){

    app.calendarMonth++;

    if(
      app.calendarMonth > 11
    ){

      app.calendarMonth = 0;
      app.calendarYear++;

    }

    render();

  },


  openCalendarDay:function(date){

    app.modal = {
      type:'calendarDay',
      date:date
    };

    render();

  },


  jumpToSession:function(
    type,
    index
  ){

    app.workoutType =
      Number(type);

    app.selectedIndex =
      Number(index);

    app.mainTab =
      'training';

    app.modal = null;

    render();

  },


  setStatsExercise:function(id){

    app.statsExerciseId =
      id;

    render();

  },


  closeModal:function(){

    app.modal = null;

    render();

  }

};


/* =========================================================
   GLOBAL CLICK
========================================================= */

document.addEventListener(
  'click',
  function(event){

    if(
      app.modal &&
      event.target &&
      event.target.classList &&
      event.target.classList.contains('st-modal-bg')
    ){
      ST.closeModal();
      return;
    }

    if(!app.rpeMenu){
      return;
    }

    var el =
      event.target;

    while(el){

      if(
        el.className &&
        (
          String(
            el.className
          ).indexOf(
            'st-rpe-floating'
          ) > -1 ||
          String(
            el.className
          ).indexOf(
            'st-rpe-button'
          ) > -1 ||
          String(
            el.className
          ).indexOf(
            'st-rpe-option'
          ) > -1
        )
      ){

        return;

      }

      el =
        el.parentNode;

    }

    app.rpeMenu = null;

    render();

  }
);


/* =========================================================
   ERROR
========================================================= */

function showFatal(error){

  root.innerHTML =
    '<div class="st-error">'+
      '<b>Ошибка приложения</b>'+
      '<div style="margin-top:8px;">'+
        esc(
          error &&
          error.message
          ?
          error.message
          :
          String(error)
        )+
      '</div>'+
    '</div>';

}


/* =========================================================
   INIT
========================================================= */

function init(){

  if(MANAGED_TARGET){
    app.email = '';
    app.isAdmin = false;
    getApi({action:'openUser'})
      .then(function(result){loadClient(result.user);})
      .catch(showFatal);
    return;
  }

  app.email =
    detectEmail();

  if(!app.email){

    showFatal(
      new Error(
        'Требуется вход в личный кабинет.'
      )
    );

    location.replace('/lk');
    return;

  }

  app.email =
    String(app.email)
      .trim()
      .toLowerCase();

  app.isAdmin = false;

  getApi({
    action:'openUser',
    email:app.email
  })
  .then(function(result){

    loadClient(
      result.user
    );

  })
  .catch(showFatal);

}


try{

  init();

}catch(error){

  showFatal(error);

}

})();
</script>
