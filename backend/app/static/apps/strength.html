var MANAGED_TARGET =

if(MANAGED_TARGET){

initialLoadReady.catch(function(){});
if(window.EdabalansEmbed)window.EdabalansEmbed.waitUntilReady(root,initialLoadReady);
var clientLoadGeneration=0;

/* =========================================================

/* =========================================================
   HTTP
========================================================= */

function getApi(params){

  var query = [];
  var key;

  if(MANAGED_TARGET){
    params.target_user_id = MANAGED_TARGET;
  }

  for(key in params){

    if(params.hasOwnProperty(key)){

      query.push(
        encodeURIComponent(key) +
        '=' +
        encodeURIComponent(
          params[key]
        )
      );

    }

  }

  var readController=new AbortController(),readTimer=setTimeout(function(){readController.abort();},15000);
  return fetch(
    API_URL +
    '?' +
    query.join('&'),
    {
      method:'GET',
      credentials:'include',
      redirect:'follow',
      signal:readController.signal
    }
  )
  .then(function(response){

    return response.json();

  })
  .then(function(data){

    if(!data.ok){

      throw new Error(
        data.error ||
        'Ошибка сервера'
      );

    }

    return data;

  }).catch(function(error){if(error.name==='AbortError')throw new Error('Сервер не ответил вовремя. Повторите загрузку.');throw error;}).finally(function(){clearTimeout(readTimer);});

}


function postApi(body){
  var controller=new AbortController(),timer=setTimeout(function(){controller.abort();},20000);

  if(MANAGED_TARGET){
    body.target_user_id = MANAGED_TARGET;
  }

  return fetch(
    API_URL,
    {
      method:'POST',
      signal:controller.signal,
      credentials:'include',

      headers:{
        'Content-Type':
          'text/plain;charset=utf-8'
      },

      body:
        JSON.stringify(body),

      redirect:'follow'
    }
  )
  .then(function(response){

    return response.json();

  })
  .then(function(data){

    if(!data.ok){

      throw new Error(
        data.error ||
        'Ошибка сервера'
      );

    }

    return data;

  }).catch(function(error){
    if(error.name==='AbortError')throw new Error('Сервер не ответил вовремя. Изменения ожидают повторного сохранения.');
    if(error instanceof TypeError)throw new Error('Нет связи с сервером. Изменения ожидают повторного сохранения.');
    throw error;
  }).finally(function(){clearTimeout(timer);});

}


/* =========================================================

========================================================= */

function detectEmail(){
  var identity=window.EdabalansIdentity||{};
  return identity.source==='native'&&identity.email
    ? String(identity.email).trim().toLowerCase()
    : '';

}


/* =========================================================
   HELPERS
========================================================= */

function blank(v){

  return (
    v === '' ||
    v === null ||
    typeof v ===
      'undefined'
  );

}


function esc(value){

  if(
    value === null ||
    typeof value ===
      'undefined'
  ){
    return '';
  }

  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');

}


function pad2(n){

  return (
    Number(n) < 10
    ?
    '0' + Number(n)
    :
    String(Number(n))
  );

}


function todayKey(){

  var date = new Date();

  return (
    date.getFullYear() +
    '-' +
    pad2(date.getMonth()+1) +
    '-' +
    pad2(date.getDate())
  );

}


function formatDate(value){

  var p;

  if(!value){
    return '';
  }

  p =
    String(value)
    .substring(0,10)
    .split('-');

  if(p.length !== 3){
    return value;
  }

  return (
    p[2] +
    '.' +
    p[1] +
    '.' +
    p[0]
  );

}


function weekday(value){

  var p;
  var d;

  var days = [
    'Воскресенье',
    'Понедельник',
    'Вторник',
    'Среда',
    'Четверг',
    'Пятница',
    'Суббота'
  ];

  if(!value){
    return '';
  }

  p =
    String(value)
    .substring(0,10)
    .split('-');

  d =
    new Date(
      Number(p[0]),
      Number(p[1])-1,
      Number(p[2])
    );

  return days[
    d.getDay()
  ];

}


function round1(value){

  return (
    Math.round(
      Number(value) * 10
    ) / 10
  )
  .toFixed(1)
  .replace('.',',');
}


function dateKey(
  year,
  month,
  day
){

  return (
    year +
    '-' +
    pad2(month+1) +
    '-' +
    pad2(day)
  );

}


function currentUserId(){

  return (
    app.selectedUser
    ?
    app.selectedUser.user_id
    :
    ''
  );

}


function currentWorkout(){

  if(app.globalWorkout){
    return app.globalWorkout;
  }

  return (
    app.workouts[
      app.workoutType
    ] || {
      workout_types:[],
      exercise_catalog:[],
      sessions:[],
      session_exercises:[],
      sets:[]
    }
  );

}


function templateWorkout(){
  return app.workouts[app.workoutType] || {
    workout_types:[], catalog:[], sessions:[]
  };
}


function templateSessionIndices(type){
  type = Number(type || app.workoutType);
  var indices = [];
  currentWorkout().sessions.forEach(function(session,index){
    if(Number(session.workoutType || type) === type){ indices.push(index); }
  });
  return indices;
}

function selectLatestTemplateSession(){
  var indices = templateSessionIndices();
  app.selectedIndex = indices.length ? indices[indices.length-1] : -1;
  app.axisTargetSession=app.selectedIndex>=0?currentWorkout().sessions[app.selectedIndex].session_id:null;
}

function adjacentTemplateSession(direction){
  var indices = templateSessionIndices();
  var position = indices.indexOf(app.selectedIndex);
  return position >= 0 && indices[position+direction] !== undefined ? indices[position+direction] : -1;
}


function selectGlobalSession(index){
  var sessions = currentWorkout().sessions;
  if(index < 0 || index >= sessions.length){ return false; }
  app.selectedIndex = index;
  app.axisTargetSession=sessions[index].session_id;
  app.workoutType = Number(sessions[index].workoutType || app.workoutType);
  return true;
}


function cloneValue(value){
  return JSON.parse(JSON.stringify(value));
}


function newSessionId(){
  if(window.crypto && window.crypto.randomUUID){
    return window.crypto.randomUUID();
  }
  return 'new-'+Date.now()+'-'+Math.random().toString(16).slice(2);
}


function rememberUndo(){
  if(!app.globalWorkout){ return; }
  app.undoStack.push({
    sessions:cloneValue(app.globalWorkout.sessions),
    selectedIndex:app.selectedIndex,
    workoutType:app.workoutType
  });
  if(app.undoStack.length > 30){ app.undoStack.shift(); }
  app.redoStack = [];
}


function restoreUndo(snapshot){
  if(!snapshot || !app.globalWorkout){ return; }
  app.globalWorkout.sessions = cloneValue(snapshot.sessions);
  for(var type of Object.keys(app.workouts).map(Number)){
    if(app.workouts[type]){
      app.workouts[type].sessions = app.globalWorkout.sessions.filter(function(session){ return Number(session.workoutType) === type; });
    }
  }
  app.workoutType = Number(snapshot.workoutType || app.workoutType);
  app.selectedIndex = Math.max(0,Math.min(Number(snapshot.selectedIndex || 0),app.globalWorkout.sessions.length-1));
  if(templateSessionIndices().indexOf(app.selectedIndex) < 0){ selectLatestTemplateSession(); }
  app.axisTargetSession=app.selectedIndex>=0 && app.globalWorkout.sessions[app.selectedIndex]?app.globalWorkout.sessions[app.selectedIndex].session_id:null;
}


function sessionChanged(before,after){
  return JSON.stringify(before || null) !== JSON.stringify(after || null);
}


function deleteSessionNow(session){
  if(!session || !session.session_id){ return; }
  var body = {
    action:'saveSession',
    workout_type:Number(session.workoutType || app.workoutType),
    version:app.version,
    session:{session_id:String(session.session_id),deleted:true}
  };
  if(app.isAdmin){
    body.target_user_id = currentUserId();
    body.admin_email = app.email;
  }else{
    body.email = app.email;
  }
  persistSessionBody(body);
}


function cancelPendingSaveForSession(session){
  if(!session){ return; }
  var suffix = '|'+String(session.session_id || session.number || '');
  Object.keys(app.saveTimers).forEach(function(key){
    if(key.slice(-suffix.length) === suffix){
      clearTimeout(app.saveTimers[key]);
      delete app.saveTimers[key];
    }
  });
}


function persistUndoDelta(beforeSessions){
  var afterSessions = currentWorkout().sessions;
  var afterById = {};
  var beforeById = {};
  beforeSessions.forEach(function(session){ if(session.session_id){ beforeById[String(session.session_id)] = session; } });
  afterSessions.forEach(function(session){ if(session.session_id){ afterById[String(session.session_id)] = session; } });
  beforeSessions.forEach(function(session){
    if(session.session_id && !afterById[String(session.session_id)]){
      cancelPendingSaveForSession(session);
      deleteSessionNow(session);
    }
  });
  afterSessions.forEach(function(session,index){
    var before = session.session_id ? beforeById[String(session.session_id)] : null;
    if(!before || sessionChanged(before,session)){
      cancelPendingSaveForSession(before || session);
      saveSessionNow(index,!before);
    }
  });
}


function copyCatalog(catalog){
  return (catalog || []).map(function(item){
    return {
      exercise_id:String(item.exercise_id || ''),
      exercise_name:String(item.exercise_name || ''),
      short_name:String(item.short_name || item.exercise_name || ''),
      full_name:String(item.full_name || item.exercise_name || ''),
      active:item.active === true || String(item.active).toLowerCase() === 'true',
      catalog_active:item.catalog_active !== false && String(item.catalog_active).toLowerCase() !== 'false',
      sort_order:Number(item.sort_order || 0),
      source:String(item.source || 'history'),
      muscles:String(item.muscles || ''),
      tips:Array.isArray(item.tips) ? item.tips.slice() : [],
      media_url:String(item.media_url || ''),
      guide:item.guide ? cloneValue(item.guide) : null,
      training:item.training ? cloneValue(item.training) : null
    };
  });
}


function syncModalLock(){
  var locked = Boolean(app.modal);
  if(locked && !app.modalScrollState){
    app.modalScrollState={
      html:document.documentElement.style.overflow,
      body:document.body.style.overflow
    };
    document.documentElement.style.overflow='hidden';
    document.body.style.overflow='hidden';
  }else if(!locked && app.modalScrollState){
    document.documentElement.style.overflow=app.modalScrollState.html;
    document.body.style.overflow=app.modalScrollState.body;
    app.modalScrollState=null;
  }
}

   BACKEND → UI MODEL
========================================================= */

function buildWorkoutModel(raw){

  var sessions = [];
  var sessionMap = {};
  var exerciseMap = {};
  var i;
  var row;
  var s;
  var ex;
  var key;

  raw = raw || {};

  /*
    Sessions
  */

  var rawSessions =
    raw.sessions || [];

  for(
    i=0;
    i<rawSessions.length;
    i++
  ){

    row =
      rawSessions[i];

    s = {
      session_id:
        row.session_id,

      number:
        Number(
          row.session_number
        ),

      date:
        row.date
        ?
        String(row.date)
          .substring(0,10)
        :
        '',

      status:
        row.status || '',

      workoutType:
        Number(row.workout_type || 1),

      exercises:[]
    };

    sessions.push(s);

    sessionMap[
      String(
        s.session_id
      )
    ] = s;

  }

  sessions.sort(
    function(a,b){
      return (
        a.number -
        b.number
      );
    }
  );

  /*
    Session exercises
  */

  var rawEx =
    raw.session_exercises ||
    [];

  for(
    i=0;
    i<rawEx.length;
    i++
  ){

    row = rawEx[i];

    s =
      sessionMap[
        String(
          row.session_id
        )
      ];

    if(!s){
      continue;
    }

    ex = {
      id:
        String(
          row.exercise_id
        ),

      name:
        row.exercise_name ||
        '',

      sort_order:
        Number(
          row.sort_order ||
          0
        ),

      note:
        row.note || '',

      coachNote:row.coach_note || '',

      sets:[]
    };

    s.exercises.push(ex);

    key =
      String(
        row.session_id
      ) +
      '|' +
      String(
        row.exercise_id
      );

    exerciseMap[key] = ex;

  }

  /*
    Sets
  */

  var rawSets =
    raw.sets || [];

  for(
    i=0;
    i<rawSets.length;
    i++
  ){

    row = rawSets[i];

    key =
      String(
        row.session_id
      ) +
      '|' +
      String(
        row.exercise_id
      );

    ex =
      exerciseMap[key];

    if(!ex){
      continue;
    }

    ex.sets.push({
      role:row.role === 'warmup' ? 'warmup' : 'work',
      set_number:
        Number(
          row.set_number
        ),

      planWeight:
        blank(row.plan_weight)
        ?
        ''
        :
        row.plan_weight,

      planReps:
        blank(row.plan_reps)
        ?
        ''
        :
        row.plan_reps,

      factWeight:
        blank(row.fact_weight)
        ?
        ''
        :
        row.fact_weight,

      factReps:
        blank(row.fact_reps)
        ?
        ''
        :
        row.fact_reps,

      rpe:
        blank(row.rpe)
        ?
        ''
        :
        row.rpe,

      completed:
        row.completed === true ||
        String(row.completed).toLowerCase() === 'true'
    });

  }

  /*
    Sorting
  */

  for(
    i=0;
    i<sessions.length;
    i++
  ){

    sessions[i]
      .exercises
      .sort(
        function(a,b){
          return (
            a.sort_order -
            b.sort_order
          );
        }
      );

    for(
      var j=0;
      j<
      sessions[i].exercises.length;
      j++
    ){

      sessions[i]
        .exercises[j]
        .sets
        .sort(
          function(a,b){
            return (
              a.set_number -
              b.set_number
            );
          }
        );

    }

  }

  return {
    workout_types:
      raw.workout_types ||
      [],

    catalog:
      raw.exercise_catalog ||
      [],

    sessions:sessions,
    version:Number(raw.version || 0)
  };

}

function loadClient(user){
  var generation=++clientLoadGeneration;
  Object.keys(app.saveTimers).forEach(function(key){clearTimeout(app.saveTimers[key]);});
  app.saveTimers={};app.sessionSaveQueues={};app.managerSavePending=null;app.saving=false;app.creatingSession=false;app.saveError='';
  app.selectedUser=user;app.mode='loading';app.workouts={};app.templateLoads={};app.templateErrors={};app.progressionPanels={};render();
  return getWorkoutType(user,0,'initial').then(function(first){
    if(generation!==clientLoadGeneration)return;
    app.templates=(first.workout_types.length?first.workout_types:[1,2,3].map(function(id){return {workout_type:id,title:'Шаблон '+id,active:true,sort_order:id};})).sort(function(a,b){return Number(a.sort_order)-Number(b.sort_order);});
    app.globalWorkout={sessions:first.sessions || []};app.version=first.version;app.accountCatalog=copyCatalog(first.catalog);
    app.workoutType=first.initialType;
    app.workouts[app.workoutType]=first;
    selectLatestTemplateSession();app.mode='client';render();initialLoadResolve();
    // The first journal is usable before other template catalogues are requested.
    setTimeout(function(){
      if(generation!==clientLoadGeneration)return;
      app.templates.filter(function(t){return t.active!==false && Number(t.workout_type)!==app.workoutType;}).reduce(function(queue,t){return queue.then(function(){return ensureTemplate(Number(t.workout_type)).catch(function(){});});},Promise.resolve());
    },0);
  }).catch(showFatal);
}

function ensureTemplate(type){
  if(app.workouts[type])return Promise.resolve(app.workouts[type]);
  if(app.templateLoads[type])return app.templateLoads[type];
  var generation=clientLoadGeneration;
  delete app.templateErrors[type];
  function readCatalogue(){
    if(generation!==clientLoadGeneration)return Promise.resolve(null);
    if(app.managerSaveRunning || app.managerSavePending)return new Promise(function(resolve){setTimeout(resolve,50);}).then(readCatalogue);
    var epoch=app.catalogEditEpoch;
    return getWorkoutType(app.selectedUser,type,'catalog').then(function(workout){return epoch===app.catalogEditEpoch?workout:readCatalogue();});
  }
  var request=readCatalogue().then(function(workout){
    if(generation!==clientLoadGeneration)return;
    workout.sessions=app.globalWorkout.sessions.filter(function(session){return Number(session.workoutType)===type;});
    app.workouts[type]=workout;
    if(app.workoutType===type)renderWithoutViewportJump();
    return workout;
  }).catch(function(error){
    if(generation===clientLoadGeneration){app.templateErrors[type]=error.message || String(error);if(app.workoutType===type)renderWithoutViewportJump();}
    throw error;
  }).finally(function(){if(generation===clientLoadGeneration)delete app.templateLoads[type];});
  app.templateLoads[type]=request;
  return request;
}

function getWorkoutType(
  user,
  type,
  scope
){

  var params = {
    action:
      'getWorkout',

    type:
      type
  };
  if(scope==='initial')params.initial=1;
  if(scope==='catalog')params.catalog_only=1;

  /*
    Админ открывает пользователя
    по user_id.
  */

  if(app.isAdmin){

    params.user_id =
      user.user_id;

    params.admin_email =
      app.email;

  }else{

    params.email =
      app.email;

  }

  return getApi(params)
    .then(function(result){

      var workout=buildWorkoutModel(result.workout);
      workout.initialType=Number(result.workout.selected_type || type || 1);
      return workout;

    });

}


function chooseInitialWorkoutType(){

  app.workoutType=chosen?Number(chosen.workout_type):0;selectLatestTemplateSession();
}

function sessionPayload(session){

  var result = {
    session_id:
      session.session_id,

    session_number:
      session.number,

    date:
      session.date || '',

    exercises:[]
  };

  var i;
  var j;
  var ex;
  var outEx;

  for(
    i=0;
    i<session.exercises.length;
    i++
  ){

    ex =
      session.exercises[i];

    outEx = {
      exercise_id:
        ex.id,

      exercise_name:
        ex.name,

      sort_order:
        ex.sort_order ||
        i+1,

      note:
        ex.note || '',

      coach_note:ex.coachNote || '',

      sets:[]
    };

    for(
      j=0;
      j<ex.sets.length;
      j++
    ){

      outEx.sets.push({
        role:ex.sets[j].role === 'warmup' ? 'warmup' : 'work',
        set_number:
          j+1,

        plan_weight:
          ex.sets[j]
            .planWeight,

        plan_reps:
          ex.sets[j]
            .planReps,

        fact_weight:
          ex.sets[j]
            .factWeight,

        fact_reps:
          ex.sets[j]
            .factReps,

        rpe:
          ex.sets[j]
            .rpe,

        completed:
          ex.sets[j]
            .completed === true
      });

    }

    result.exercises.push(
      outEx
    );

  }

  return result;

}


function scheduleSave(
  sessionIndex
){

  var body =
    sessionSaveBody(
      sessionIndex
    );

  if(!body){
    return;
  }

  var timerKey = [
    body.target_user_id || body.email || '',
    body.workout_type,
    body.session.session_id || body.session.session_number
  ].join('|');

  if(app.saveTimers[timerKey]){

    clearTimeout(
      app.saveTimers[timerKey]
    );

  }

  app.saving = true;
  if(!hasSaveConflict()){ app.saveError = ''; }

  app.saveTimers[timerKey] =
    setTimeout(
      function(){

        delete app.saveTimers[timerKey];
        persistSessionBody(body);

      },
      450
    );

  renderSavingOnly();

}


function saveSessionNow(
  sessionIndex,
  restoreNumber
){

  var body =
    sessionSaveBody(
      sessionIndex
    );

  if(body){
    if(restoreNumber){ body.restore_session_number = true; }
    persistSessionBody(body);
  }

}


function sessionSaveBody(
  sessionIndex,
  workoutTypeOverride
){

  var workout = currentWorkout();

  var session =
    workout && workout
      .sessions[
        sessionIndex
      ];

  if(!session){
    return null;
  }

  var workoutType = Number(workoutTypeOverride || session.workoutType || app.workoutType);

  var body = {
    action:
      'saveSession',

    workout_type:
      workoutType,

    version:app.version,

    session:
      sessionPayload(
        session
      )
  };

  if(app.isAdmin){

    var targetUserId =
      currentUserId();

    body.user_id =
      targetUserId;

    body.target_user_id =
      targetUserId;

    body.admin_email =
      app.email;

  }else{

    body.email =
      app.email;

  }

  return body;

}


function persistSessionBody(body){

  var timerKey = [body.target_user_id || body.email || '', 'state'].join('|');

  var queue = app.sessionSaveQueues[timerKey] || {
    running:false,
    pending:[],
    retryCount:0
  };
  var pendingIndex = queue.pending.findIndex(function(item){
    return String(item.session.session_id || item.session.session_number) === String(body.session.session_id || body.session.session_number) && Number(item.workout_type) === Number(body.workout_type);
  });
  if(pendingIndex >= 0){
    if(queue.pending[pendingIndex].restore_session_number){ body.restore_session_number = true; }
    queue.pending[pendingIndex] = body;
  }
  else{ queue.pending.push(body); }
  queue.retryCount = 0;
  app.sessionSaveQueues[timerKey] = queue;
  flushSessionSave(timerKey);

}


function syncPersistedSession(body,saved){

  if(!saved){
    return;
  }

  var workout = currentWorkout();
  if(!workout){
    return;
  }

  var session = null;
  var selectedBeforeSave = workout.sessions[app.selectedIndex];
  for(var index=0;index<workout.sessions.length;index++){
    var candidate = workout.sessions[index];
    if(
      (body.session.session_id && String(candidate.session_id) === String(body.session.session_id)) ||
      (!body.session.session_id && !candidate.session_id && Number(candidate.number) === Number(body.session.session_number))
    ){
      session = candidate;
      break;
    }
  }

  if(!session){
    return;
  }

  session.session_id = String(saved.session_id || session.session_id || '');
  session.number = Number(saved.session_number || session.number);
  session.date = String(saved.date || session.date || '').substring(0,10);
  session.status = saved.status || session.status || '';
  session.workoutType = Number(saved.workout_type || body.workout_type || session.workoutType || app.workoutType);
  workout.sessions.sort(function(a,b){ return Number(a.number)-Number(b.number); });
  app.selectedIndex = selectedBeforeSave ? workout.sessions.indexOf(selectedBeforeSave) : -1;

}


function flushSessionSave(timerKey){

  var queue = app.sessionSaveQueues[timerKey];
  if(!queue || queue.running || !queue.pending.length || app.managerSaveRunning || app.templateSaveRunning || app.saveRequests > 0 || hasSaveConflict()){
    return;
  }

  var body = queue.pending.shift();
  queue.running = true;
  app.saveError = '';
  body.version = app.version;

  app.saveRequests += 1;
  app.saving=true;
  renderSavingOnly();

  postApi(body)
    .then(function(result){

      var createdSession = app.creatingSession && String(app.creatingSession) === String(body.session.session_id || '');
      syncPersistedSession(body,result.session);
      app.version = Number(result.version || app.version);
      if(createdSession){
        app.creatingSession = false;
      }

      app.saveRequests =
        Math.max(0,app.saveRequests-1);

      queue.running = false;

      app.saving =
        app.saveRequests > 0 ||
        Object.keys(app.saveTimers).length > 0 ||
        app.managerSaveRunning ||
        Boolean(app.managerSavePending);

      app.saveError = '';

      if(!queue.pending.length){ delete app.sessionSaveQueues[timerKey]; }
      renderSavingOnly();
      renderManagerSavingOnly();
      if(createdSession){
        render();
      }

      flushTemplateSave();
      flushManagerSave();
      Object.keys(app.sessionSaveQueues).forEach(function(key){ flushSessionSave(key); });

    })
    .catch(function(error){

      app.saveRequests =
        Math.max(0,app.saveRequests-1);

      queue.running = false;
      if(body.restore_session_number){
        queue.pending.forEach(function(item){
          if(String(item.session.session_id) === String(body.session.session_id) && Number(item.workout_type) === Number(body.workout_type) && !item.session.deleted){ item.restore_session_number = true; }
        });
      }
      if(!queue.pending.some(function(item){
        return String(item.session.session_id || item.session.session_number) === String(body.session.session_id || body.session.session_number) && Number(item.workout_type) === Number(body.workout_type);
      })){
        queue.pending.unshift(body);
      }
      queue.retryCount = Number(queue.retryCount || 0)+1;

      app.saving =
        app.saveRequests > 0 ||
        Object.keys(app.saveTimers).length > 0 ||
        app.managerSaveRunning ||
        Boolean(app.managerSavePending);

      app.saveError =
        error.message ||
        String(error);

      renderSavingOnly();
      renderManagerSavingOnly();

      if(String(app.saveError).indexOf('STRENGTH_STATE_CONFLICT') >= 0){
        return;
      }
      if(queue.retryCount <= 2){
        setTimeout(function(){ flushSessionSave(timerKey); },queue.retryCount*700);
      }else{
        setTimeout(function(){ flushSessionSave(timerKey); },10000);
      }

    });

}


function hasSaveConflict(){
  return String(app.saveError).indexOf('STRENGTH_STATE_CONFLICT') >= 0;
}

function saveErrorText(){
  return hasSaveConflict() ? 'Данные изменились в другой вкладке. Загрузите актуальную версию перед продолжением.' : app.saveError;
}

function renderSavingOnly(){
  flushTemplateSave();

  updateTelegramButton();

  var el =
    document.getElementById(
      'st-save-state'
    );

  if(!el){
    return;
  }

  if(app.saveError){

    el.className =
      'st-saving error';

    el.title='Ошибка сохранения';

    el.innerHTML =
      'Ошибка сохранения: ' +
      esc(saveErrorText()) +
      (hasSaveConflict() ? '' : ' <button class="st-save-retry" onclick="ST.retrySave()">Повторить</button>')+
      (String(app.saveError).indexOf('STRENGTH_STATE_CONFLICT') >= 0 ? ' <button class="st-save-retry" onclick="ST.reloadCurrent()">Загрузить актуальное</button>' : '');

    return;
  }

  el.className =
    'st-saving'+(app.saving || app.templateSaveRunning ? ' loading' : '');
  el.title=app.saving ? 'Сохранение в процессе' : 'Сохранено';

  el.innerHTML =
    app.saving
    ?
    'Сохраняю…'
    :
    'Сохранено';

}

function findExercise(
  session,
  id
){

  var i;

  if(!session){
    return null;
  }

  for(
    i=0;
    i<session.exercises.length;
    i++
  ){

    if(
      String(
        session.exercises[i].id
      ) ===
      String(id)
    ){

      return (
        session.exercises[i]
      );

    }

  }

  return null;

}


function exerciseForDisplay(session,id){
  var exercise = findExercise(session,id);
  if(exercise && exercise.sets.length){ return exercise; }
  if(!session || !templateIncludesExercise(id)){ return null; }
  var item = catalogItemById(id);
  return Object.assign({id:String(id),name:item.exercise_name,sort_order:item.sort_order,note:''},exercise || {},{sets:
    [1,2,3,4].map(function(number){
      return {set_number:number,planWeight:'',planReps:'',factWeight:'',factReps:'',rpe:'',completed:false};
    })
  });
}

function materializeExercise(session,exercise){
  var existing = findExercise(session,exercise.id);
  if(!existing){ session.exercises.push(exercise); }
  else if(existing !== exercise){ session.exercises[session.exercises.indexOf(existing)] = exercise; }
  return exercise;
}

function newExerciseSets(id){
  var sessions=currentWorkout().sessions;
  for(var i=sessions.length-1;i>=0;i--){
    var previous=findExercise(sessions[i],id);
    if(previous && previous.sets.length)return StrengthJournalModel.blankSets(previous.sets);
  }
  return StrengthJournalModel.blankSets([]);
}


function previousExercise(
  index,
  id
){

  if(index <= 0){
    return null;
  }

  var sessions = currentWorkout().sessions;
  var indices = templateSessionIndices(sessions[index].workoutType);
  var position = indices.indexOf(index);
  return position > 0 ? findExercise(sessions[indices[position-1]],id) : null;

}


function activeCatalog(){

          b.sort_order ||
          0
        )
      );
    }
  );

  return catalog.filter(

      return !(
        item.catalog_active === false ||
        item.active === false ||

          item.active
        ).toLowerCase() ===
        'false'
      );

    }
  );

}


function catalogItemById(id){
  var catalog = templateWorkout().catalog || [];
  for(var i=0;i<catalog.length;i++){
    if(String(catalog[i].exercise_id) === String(id)){
      return catalog[i];
    }
  }
  return null;
}

function isFilled(session){

  var i;
  var j;

  if(!session){
    return false;
  }

  for(
    i=0;
    i<session.exercises.length;
    i++
  ){

    for(
      j=0;
      j<
      session.exercises[i]
        .sets.length;
      j++
    ){

      var set = session.exercises[i].sets[j];
      if(
        !blank(set.factWeight) ||
        !blank(set.factReps) ||
        !blank(set.rpe) ||
        set.completed === true
      ){

        return true;

      }

    }

  }

  return false;

}

var screenHistory=null,screenOwner=String(Date.now())+Math.random(),journalWidthObserver=null,resizeJournal=null;
function screenView(){return {mainTab:app.mainTab,modal:app.modal?cloneValue(app.modal):null};}
function screenKey(view){return JSON.stringify(view);}
function screenUrl(view){
  var url=new URL(location.href);
  if(view.mainTab==='stats')url.searchParams.set('view','stats');else url.searchParams.delete('view');
  return url.pathname+url.search+url.hash;
}
function screenState(position){
  return Object.assign({},history.state || {},{edStrengthScreen:{owner:screenOwner,position:position}});
}
function syncScreenHistory(){
  var view=screenView(),key=screenKey(view);
  if(!screenHistory){
    screenHistory={entries:[{view:view,scrollY:window.scrollY}],position:0,restoring:false,pending:false};
    history.replaceState(screenState(0),'',screenUrl(view));return;
  }
  if(screenHistory.restoring || screenHistory.pending)return;
  var current=screenHistory.entries[screenHistory.position];
  if(screenKey(current.view)===key)return;
  current.scrollY=window.scrollY;
  var previous=-1;
  for(var i=screenHistory.position-1;i>=0;i--){if(screenKey(screenHistory.entries[i].view)===key){previous=i;break;}}
  if(previous>=0){screenHistory.pending=true;history.go(previous-screenHistory.position);return;}
  if(!view.modal && view.mainTab==='training'){
    screenHistory.entries=[{view:view,scrollY:window.scrollY}];screenHistory.position=0;
    history.replaceState(screenState(0),'',screenUrl(view));return;
  }
  screenHistory.entries=screenHistory.entries.slice(0,screenHistory.position+1);
  screenHistory.entries.push({view:view,scrollY:0});screenHistory.position++;
  history.pushState(screenState(screenHistory.position),'',screenUrl(view));
}
window.addEventListener('popstate',function(event){
  var state=event.state && event.state.edStrengthScreen;
  if(!root.isConnected || !screenHistory || !state)return;
  if(state.owner!==screenOwner){
    app.mainTab=new URLSearchParams(location.search).get('view')==='stats'?'stats':'training';
    app.modal=null;app.rpeMenu=null;screenHistory=null;screenOwner=String(Date.now())+Math.random();render();return;
  }
  var entry=screenHistory.entries[state.position];if(!entry)return;
  var previousView=screenHistory.entries[screenHistory.position].view;
  var tutorialReturn=previousView.modal && previousView.modal.type==='tutorial' && !entry.view.modal;
  screenHistory.position=state.position;screenHistory.pending=false;screenHistory.restoring=true;
  app.mainTab=entry.view.mainTab;app.modal=entry.view.modal?cloneValue(entry.view.modal):null;app.rpeMenu=null;
  if(app.modal && app.modal.type==='manager'){
    app.managerDraft=copyCatalog(templateWorkout().catalog);app.managerUndoStack=[];
    app.managerReturnToTemplates=screenHistory.entries.slice(0,state.position).some(function(item){return item.view.modal && item.view.modal.type==='templates';});
  }else{app.managerDraft=null;app.managerUndoStack=[];}
  render();screenHistory.restoring=false;
  requestAnimationFrame(function(){
    window.scrollTo(0,entry.scrollY);
    if(tutorialReturn){
      var helpButton=root.querySelector('.st-help');
      if(helpButton)helpButton.focus({preventScroll:true});
    }
  });
});
function applyJournalWidth(){
  var style=getComputedStyle(root),previous=app.trainingColumnWidth;
  var width=app.journalView==='training' && matchMedia('(max-width:700px)').matches
    ? root.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight) : 228;
  if(previous && previous!==width && app.journalView==='training' && !app.axisTargetSession){
    app.axisTargetSession=app.trainingAnchor;
  }
  if(app.journalView==='training')app.trainingColumnWidth=width;
  root.style.setProperty('--st-history-width',width+'px');
}
function rememberTrainingAnchor(axis){
  if(axis.dataset.axis!=='training' || Math.abs(axis.clientWidth-app.trainingViewportWidth)>1)return;
  var indices=templateSessionIndices(),style=getComputedStyle(root);
  var width=parseFloat(style.getPropertyValue('--st-history-width')),stride=width+parseFloat(style.getPropertyValue('--st-history-gap'));
  var position=Math.min(indices.length-1,Math.max(0,Math.round((axis.scrollLeft+axis.clientWidth-width)/stride)));
  var session=currentWorkout().sessions[indices[Math.max(0,position)]];
  app.trainingAnchor=session?session.session_id:null;
}
function observeJournalWidth(){
  if(journalWidthObserver || !window.ResizeObserver)return;
  var previous=root.clientWidth;
  journalWidthObserver=new ResizeObserver(function(){
    if(!root.isConnected){journalWidthObserver.disconnect();return;}
    if(previous===root.clientWidth)return;
    previous=root.clientWidth;
    if(app.mainTab==='training' && resizeJournal)resizeJournal();
  });
  journalWidthObserver.observe(root);
}

function bindJournalAxes(){
  var axes=Array.from(root.querySelectorAll('[data-axis]')),bar=root.querySelector('.st-history-bottom-bar'),syncing=false;
  var templateStrip=root.querySelector('.st-types');if(templateStrip)templateStrip.scrollLeft=app.templateScroll || 0;
  function activeAxis(){return axes.find(function(axis){return axis.dataset.axis===app.activeAxis;}) || axes[0];}
  function syncBar(axis){
    if(!bar || !axis)return;
    syncing=true;bar.firstElementChild.style.width=(axis.scrollWidth+Math.max(0,bar.clientWidth-axis.clientWidth))+'px';bar.scrollLeft=axis.scrollLeft;syncing=false;
  }
  function syncDate(axis){
    if(axis.dataset.axis!=='training')return;
    var viewport=root.querySelector('.st-date-viewport');
    if(viewport)viewport.scrollLeft=axis.scrollLeft;
  }
  function alignTraining(axis){
    if(axis.dataset.axis!=='training' || !app.axisTargetSession)return;
    var indices=templateSessionIndices(),target=indices.findIndex(function(index){return String(currentWorkout().sessions[index].session_id)===String(app.axisTargetSession);});
    var width=parseFloat(getComputedStyle(root).getPropertyValue('--st-history-width')),gap=parseFloat(getComputedStyle(root).getPropertyValue('--st-history-gap'));
    if(target>=0)axis.scrollLeft=target*(width+gap)+width-axis.clientWidth;
  }
  axes.forEach(function(axis){
    axis.scrollLeft=app.axisResetRight || app.axisPositions[axis.dataset.axis]===undefined?axis.scrollWidth:app.axisPositions[axis.dataset.axis];
    alignTraining(axis);
    axis.addEventListener('pointerdown',function(){app.activeAxis=axis.dataset.axis;syncBar(axis);});
    axis.addEventListener('scroll',function(){app.axisPositions[axis.dataset.axis]=axis.scrollLeft;app.activeAxis=axis.dataset.axis;rememberTrainingAnchor(axis);syncDate(axis);if(!syncing)syncBar(axis);},{passive:true});
    app.trainingViewportWidth=axis.clientWidth;rememberTrainingAnchor(axis);
    syncDate(axis);
  });
  app.axisTargetSession=null;app.axisResetRight=false;
  resizeJournal=function(){
    applyJournalWidth();
    axes.forEach(function(axis){
      alignTraining(axis);app.axisPositions[axis.dataset.axis]=axis.scrollLeft;
      app.trainingViewportWidth=axis.clientWidth;rememberTrainingAnchor(axis);syncDate(axis);
    });
    app.axisTargetSession=null;syncBar(activeAxis());
  };
  if(bar)bar.addEventListener('scroll',function(){if(syncing)return;var axis=activeAxis();if(axis){syncing=true;axis.scrollLeft=bar.scrollLeft;app.axisPositions[axis.dataset.axis]=axis.scrollLeft;syncDate(axis);syncing=false;}},{passive:true});
  syncBar(activeAxis());

}

/* =========================================================
   8RM
========================================================= */

function calculate8RM(
  weight,
  reps,
  rpe
){

  weight =
    Number(weight);

  reps =
    Number(reps);

  rpe =
    Number(rpe);

  if(
    !isFinite(weight) ||
    !isFinite(reps) ||
    !isFinite(rpe) ||
    weight <= 0 ||
    reps <= 0 ||
    rpe < 1 ||
    rpe > 10
  ){

    return null;

  }

  return (
    weight *
    (
      1 +
      (
        reps +
        10 -
        rpe
      ) / 30
    ) /
    (
      1 +
      8 / 30
    )
  );

}


function session8RM(
  session,
  exerciseId
){

  var ex =
    findExercise(
      session,
      exerciseId
    );

  if(
    !ex ||
    ex.sets.length < 2
  ){
    return null;
  }

  var candidates = [];

  /*
    Первый подход исключён.
  */

  for(
    var i=1;
    i<ex.sets.length;
    i++
  ){

    var s =
      ex.sets[i];

    var estimate =
      calculate8RM(
        s.factWeight,
        s.factReps,
        s.rpe
      );

    if(
      estimate === null
    ){
      continue;
    }

    candidates.push({
      weight:
        Number(
          s.factWeight
        ),

      reps:
        Number(
          s.factReps
        ),

      rpe:
        Number(
          s.rpe
        ),

      set:
        i+1,

      estimate:
        estimate
    });

  }

  if(!candidates.length){
    return null;
  }

  var maxWeight =
    candidates[0].weight;

  for(
    i=1;
    i<candidates.length;
    i++
  ){

    if(
      candidates[i].weight >
      maxWeight
    ){

      maxWeight =
        candidates[i].weight;

    }

  }

  var best = null;

  for(
    i=0;
    i<candidates.length;
    i++
  ){

    if(
      candidates[i].weight !==
      maxWeight
    ){
      continue;
    }

    if(
      !best ||
      candidates[i]
        .estimate >
      best.estimate
    ){

      best =
        candidates[i];

    }

  }

  return best;

}


function statsHistory(
  exerciseId
){

  var sessions =
    currentWorkout()
      .sessions;

  var result = [];

  for(
    var i=0;
    i<sessions.length;
    i++
  ){

    if(!sessions[i].date){
      continue;
    }

    var best =
      session8RM(
        sessions[i],
        exerciseId
      );

    if(!best){
      continue;
    }

    result.push({
      date:
        sessions[i].date,

      number:
        sessions[i].number,

      estimate:
        best.estimate,

      weight:
        best.weight,

      reps:
        best.reps,

      rpe:
        best.rpe
    });

  }

  return result;

}

function renderChart(history){

  var W = 820;
  var H = 330;

  var left = 45;
  var right = 18;
  var top = 30;
  var bottom = 52;

  var plotW =
    W-left-right;

  var plotH =
    H-top-bottom;

  var min =
    history[0].estimate;

  var max =
    history[0].estimate;

  var i;

  for(
    i=1;
    i<history.length;
    i++
  ){

    min =
      Math.min(
        min,
        history[i]
          .estimate
      );

    max =
      Math.max(
        max,
        history[i]
          .estimate
      );

  }

  var range =
    Math.max(
      4,
      max-min
    );

  var low =
    min-
    range*.25;

  var high =
    max+
    range*.25;

  function x(index){

    if(
      history.length === 1
    ){
      return (
        left+
        plotW/2
      );
    }

    return (
      left+
      index*
      plotW/
      (
        history.length-1
      )
    );

  }

  function y(value){

    return (
      top+
      (
        high-value
      ) /
      (
        high-low
      ) *
      plotH
    );

  }

  var path = '';

  for(
    i=0;
    i<history.length;
    i++
  ){

    path +=
      (
        i === 0
        ?
        'M '
        :
        ' L '
      )+
      x(i)+
      ' '+
      y(
        history[i]
          .estimate
      );

  }

  var html =
    '<div class="st-card st-chart-card">'+
      '<div class="st-chart-title">Прогресс расчётного максимума ×8</div>'+
      '<div class="st-chart-sub">Одна точка — одна тренировка.</div>'+
      '<svg viewBox="0 0 '+W+' '+H+'">';

  for(
    var g=0;
    g<5;
    g++
  ){

    var gy =
      top+
      g*
      plotH/4;

    var val =
      high-
      g*
      (
        high-low
      )/4;

    html +=
      '<line class="chart-grid" x1="'+left+'" y1="'+gy+'" x2="'+(W-right)+'" y2="'+gy+'"></line>'+
      '<text class="chart-label" x="'+(left-8)+'" y="'+(gy+4)+'" text-anchor="end">'+
        round1(val)+
      '</text>';

  }

  if(
    history.length > 1
  ){

    html +=
      '<path class="chart-line" d="'+path+'"></path>';

  }

  for(
    i=0;
    i<history.length;
    i++
  ){

    html +=
      '<circle class="chart-point" cx="'+x(i)+'" cy="'+y(history[i].estimate)+'" r="6"></circle>'+
      '<text class="chart-value" x="'+x(i)+'" y="'+(y(history[i].estimate)-11)+'" text-anchor="middle">'+
        round1(
          history[i].estimate
        )+
      '</text>'+
      '<text class="chart-label" x="'+x(i)+'" y="'+(H-22)+'" text-anchor="middle">'+
        formatDate(
          history[i].date
        ).slice(0,5)+
      '</text>';

  }

  html +=
      '</svg>'+
    '</div>';

  return html;

}


function renderMethod(){

  return (
    '<div class="st-card st-method">'+
      '<div class="st-method-title">Что такое расчётный максимум ×8</div>'+
      '<div class="st-method-text">'+
        'Это оценка веса, который вы предположительно могли бы выполнить на 8 повторений в свежем рабочем подходе после разминки. Первый подход упражнения в расчёт не входит.'+
      '</div>'+
      '<div class="st-method-text">'+
        'Из остальных подходов сначала выбирается подход с самым большим фактическим весом. Если вес одинаковый — используется подход с более высоким расчётным результатом с учётом повторений и RPE.'+
      '</div>'+
      '<div class="st-formula">'+
        '8RM = вес × [1 + (повторы + 10 − RPE) / 30] ÷ [1 + 8 / 30]'+
      '</div>'+
      '<div class="st-method-text">'+
        'RPE интерпретируется через повторы в запасе: RPE 10 ≈ 0 повторов в запасе, RPE 9 ≈ 1, RPE 8 ≈ 2. Метрика используется для отслеживания динамики и не является измеренным максимумом.'+
      '</div>'+
      '<div class="st-method-links">'+
        '<a target="_blank" href="https://pubmed.ncbi.nlm.nih.gov/26049792/">Zourdos et al. — RPE и repetitions in reserve</a>'+
        '<a target="_blank" href="https://pubmed.ncbi.nlm.nih.gov/27531969/">Helms et al. — RIR-based RPE</a>'+
        '<a target="_blank" href="https://pubmed.ncbi.nlm.nih.gov/7500624/">Оценка силы по весу и числу повторений</a>'+
      '</div>'+
    '</div>'
  );

}

  var body = {
    action:'saveExerciseCatalog',
    workout_type:app.workoutType,
    version:app.version,
    exercises:catalog.slice().sort(function(a,b){return Number(a.sort_order)-Number(b.sort_order);}).map(function(item,index){
      return {
        exercise_id:item.exercise_id,
        exercise_name:item.exercise_name,
        active:item.active === true,
        catalog_active:item.catalog_active !== false,
        sort_order:index+1,
        source:item.source
      };
    })
  };
  if(app.isAdmin){
    body.target_user_id = currentUserId();
    body.admin_email = app.email;
  }else{
    body.email = app.email;
  }
  return body;
}


function applyManagerDraft(catalog){
  app.catalogEditEpoch++;
  for(var workoutType of Object.keys(app.workouts).map(Number)){
    var accountWorkout = app.workouts[workoutType];
    if(!accountWorkout){ continue; }
    accountWorkout.catalog = accountWorkout.catalog || [];
    var byId = {};
    (accountWorkout.catalog || []).forEach(function(item){
      byId[String(item.exercise_id)] = item;
    });
    catalog.forEach(function(item,index){
      var local = byId[String(item.exercise_id)];
      if(!local){
        local = copyCatalog([item])[0];
        local.active = workoutType === app.workoutType ? item.active === true : false;
        local.sort_order = workoutType === app.workoutType ? index+1 : accountWorkout.catalog.length+1;
        accountWorkout.catalog.push(local);
        byId[String(item.exercise_id)] = local;
      }
      local.exercise_name = item.exercise_name;
      local.short_name = item.short_name;
      local.full_name = item.full_name;
      local.catalog_active = item.catalog_active !== false;
      local.source = item.source;
      local.muscles = item.muscles;
      local.tips = Array.isArray(item.tips) ? item.tips.slice() : [];
      local.media_url = item.media_url;
      local.guide = item.guide ? cloneValue(item.guide) : null;
      local.training = item.training ? cloneValue(item.training) : null;
      if(workoutType === app.workoutType){
        local.active = item.active === true;
        local.sort_order = index+1;
      }
      (accountWorkout.sessions || []).forEach(function(savedSession){
        (savedSession.exercises || []).forEach(function(savedExercise){
          if(String(savedExercise.id) === String(item.exercise_id) && item.source === 'custom'){
            savedExercise.name = item.exercise_name;
          }
        });
      });
    });
  }
  // Template editing deliberately does not change saved sessions. A template
  // controls the visible exercises; historical exercise instances remain intact.
}


function renderManagerSavingOnly(){
  var el = document.getElementById('st-manager-save-state');
  if(!el){ return; }
  el.className = 'st-manager-save-state'+(app.saveError?' error':'');
  el.textContent = app.saveError
    ? 'Не удалось сохранить'
    : (app.managerSaveRunning || app.managerSavePending || app.saveRequests > 0 ? 'Сохраняю…' : 'Сохранено');
}


function latestManagerSessionBody(pending){
  var workout = app.workouts[pending.workoutType];
  var sessions = workout ? workout.sessions : [];
  var index = -1;
  for(var i=0;i<sessions.length;i++){
    if(String(sessions[i].id || sessions[i].session_id || '') === String(pending.sessionId || '')){
      index = i;
      break;
    }
  }
  if(index < 0 && pending.sessionIndex < sessions.length){
    index = pending.sessionIndex;
  }
  return index < 0 ? null : sessionSaveBody(index,pending.workoutType);
}


function flushManagerSave(){
  if(app.managerSaveRunning || app.templateSaveRunning || !app.managerSavePending || app.saveRequests > 0 || hasSaveConflict()){
    return;
  }
  var pending = app.managerSavePending.shift();
  if(!app.managerSavePending.length){ app.managerSavePending = null; }
  app.managerSaveRunning = true;
  app.saveError = '';
  app.saving = true;
  renderManagerSavingOnly();
  renderSavingOnly();
  // Names and catalog visibility belong to the account, including edits made in another template while this request waited.
  pending.catalogBody.exercises = managerCatalogBody(copyCatalog(app.workouts[pending.workoutType].catalog || [])).exercises;
  pending.catalogBody.version = app.version;
  postApi(pending.catalogBody)
    .then(function(result){
      app.version = Number(result.version || app.version);
    })
    .then(function(){
      app.managerSaveRunning = false;
      app.saveError = '';
      app.saving = app.saveRequests > 0 || Object.keys(app.saveTimers).length > 0 || Boolean(app.managerSavePending);
      renderManagerSavingOnly();
      renderSavingOnly();
      flushTemplateSave();
      flushManagerSave();
      Object.keys(app.sessionSaveQueues).forEach(function(key){ flushSessionSave(key); });
    })
    .catch(function(error){
      app.managerSaveRunning = false;
      if(!app.templates.some(function(item){return Number(item.workout_type)===pending.workoutType && item.active!==false;})){
        app.saveError='';
        renderSavingOnly();
        flushTemplateSave();
        flushManagerSave();
        return;
      }
      app.saveError = error.message || String(error);
      app.saving = true;
      renderManagerSavingOnly();
      renderSavingOnly();
      app.managerSavePending = app.managerSavePending || [];
      if(!app.managerSavePending.some(function(item){ return item.workoutType === pending.workoutType; })){
        app.managerSavePending.unshift(pending);
      }
      if(hasSaveConflict()){ return; }
      if(app.managerSavePending[0] !== pending){
        flushManagerSave();
        return;
      }
      pending.retryCount = Number(pending.retryCount || 0)+1;
      if(pending.retryCount <= 2){
        setTimeout(flushManagerSave,pending.retryCount*700);
      }else{
        setTimeout(flushManagerSave,10000);
      }
    });
}


function queueManagerSave(){
  var catalog = copyCatalog(app.managerDraft || []);
  app.managerDraft = catalog;
  applyManagerDraft(catalog);
  if(!hasSaveConflict()){ app.saveError = ''; }
  var pending = {
    catalogBody:managerCatalogBody(catalog),
    workoutType:app.workoutType,
    retryCount:0
  };
  app.managerSavePending = app.managerSavePending || [];
  var pendingIndex = app.managerSavePending.findIndex(function(item){ return item.workoutType === pending.workoutType; });
  if(pendingIndex >= 0){ app.managerSavePending[pendingIndex] = pending; }
  else{ app.managerSavePending.push(pending); }
  flushManagerSave();
}

  nextSession:function(){
    var index = adjacentTemplateSession(1);
    if(index >= 0){ selectGlobalSession(index); render(); }
  },


  selectSession:function(index){

    if(index < 0 || index >= currentWorkout().sessions.length){
      return;
    }

    selectGlobalSession(index);
    app.entryMode = 'edit';
    render();

  },


  deleteSession:function(index){
    index=index===undefined?app.selectedIndex:Number(index);
    if(!Number.isInteger(index)||index<0||index>=currentWorkout().sessions.length)return;
    if(app.creatingSession || !app.workouts[app.workoutType]){ return; }
    var sessions = currentWorkout().sessions;
    var session = sessions[index];
    if(!session || !window.confirm('Удалить тренировку №'+session.number+' ('+(formatDate(session.date)||'без даты')+') со всеми упражнениями, планом и фактом?' )){ return; }
    rememberUndo();
    cancelPendingSaveForSession(session);
    sessions.splice(index,1);
    selectLatestTemplateSession();
    deleteSessionNow(session);
    app.entryMode = 'edit';
    render();
  },


  createNextSession:function(){

    if(app.creatingSession){
      return;
    }

    rememberUndo();

    var workout = currentWorkout();
    var template = templateWorkout();
    var catalog = activeCatalog();
    var maxNumber = 0;

    for(var sessionIndex=0;sessionIndex<workout.sessions.length;sessionIndex++){
      maxNumber = Math.max(maxNumber,Number(workout.sessions[sessionIndex].number || 0));
    }

    var exercises = catalog.map(function(item,index){
      var sets = newExerciseSets(item.exercise_id);
      return {
        id:item.exercise_id,
        name:item.exercise_name,
        sort_order:index+1,
        note:'',
        sets:sets
      };
    });

    workout.sessions.push({
      session_id:newSessionId(),
      number:maxNumber+1,
      date:'',
      status:'planned',
      workoutType:app.workoutType,
      exercises:exercises
    });

    app.selectedIndex = workout.sessions.length-1;
    app.axisTargetSession=workout.sessions[app.selectedIndex].session_id;
    app.entryMode = 'edit';
    app.creatingSession = workout.sessions[app.selectedIndex].session_id;
    saveSessionNow(app.selectedIndex);
    render();
    var axis=root.querySelector('[data-axis="exercise-history"]');
    if(axis)axis.scrollLeft=axis.scrollWidth;

  },


  openDate:function(id){

    var input =
      document.getElementById(id);

    if(!input){
      return;
    }

    try{

      if(input.showPicker){
        input.showPicker();
      }else{
        input.click();
      }

    }catch(e){

      input.click();

    }

  },


  setDateText:function(index,field){
    var value=StrengthJournalModel.parseRussianDate(field.value);
    if(value===null){field.setCustomValidity('Введите существующую дату в формате дд.мм.гггг');field.reportValidity();return;}
    field.setCustomValidity('');ST.setDate(index,value);
  },

  setDate:function(
    index,
    value
  ){

    rememberUndo();

    currentWorkout()
      .sessions[index]
      .date =
      value;

    scheduleSave(index);

    render();

  },


  numberClick:function(event,index,isPlan){
  if(!isPlan && clientLocked(index)){event.preventDefault();event.target.blur();app.modal={type:'dateWarning'};render();return false;}
  var field=event.target,selectAll=event.pointerType==='mouse' || (!event.pointerType && window.matchMedia('(pointer:fine)').matches);
  function placeCursor(){if(field.isConnected){try{if(selectAll)field.select();else{var end=field.value.length;field.setSelectionRange(end,end);}}catch(e){}}}
  if(event.type==='focus'){if(selectAll)placeCursor();}else requestAnimationFrame(placeCursor);return true;
},


  changeField:function(
    index,
    id,
    setIndex,
    field,
    value
  ){

    if(
      (field === 'factWeight' || field === 'factReps') && clientLocked(index)
    ){

      app.modal = {
        type:'dateWarning'
      };

      render();

      return;

    }

    var ex =
      exerciseForDisplay(
        currentWorkout()
          .sessions[index],
        id
      );

    if(
      !ex ||
      !ex.sets[setIndex]
    ){
      return;
    }

    rememberUndo();
    materializeExercise(currentWorkout().sessions[index],ex);

    ex.sets[setIndex][field] =
      value === ''
      ?
      ''
      :
      Number(String(value).replace(',', '.'));

    scheduleSave(index);

    updateEditedSet(index,ex,setIndex,field);

  },


  openRpe:function(
    event,
    index,
    id,
    setIndex
  ){

    event.preventDefault();
    event.stopPropagation();

    if(
      clientLocked(index)
    ){

      app.modal = {
        type:'dateWarning'
      };

      render();

      return;

    }

    var rect =
      event.currentTarget
        .getBoundingClientRect();

    var scale=app.journalView==='exercise'?app.scale/100:1;
    var height = 200*scale;

    var top =
      rect.bottom+4*scale;

    if(
      top+height >
      window.innerHeight
    ){

      top =
        Math.max(
          5,
          rect.top-height-4*scale
        );

    }

    var left =
      rect.left+
      rect.width/2-
      35*scale;

    left =
      Math.max(
        5,
        Math.min(
          left,
          window.innerWidth-75*scale
        )
      );

    app.rpeMenu = {
      index:index,
      id:id,
      setIndex:setIndex,
      left:left/scale,
      top:top/scale
    };

    render();

  },


  setRpe:function(value){

    if(!app.rpeMenu){
      return;
    }

    var m =
      app.rpeMenu;

    var ex =
      exerciseForDisplay(
        currentWorkout()
          .sessions[
            m.index
          ],
        m.id
      );

    if(!ex){
      return;
    }

    rememberUndo();
    materializeExercise(currentWorkout().sessions[m.index],ex);

    ex.sets[
      m.setIndex
    ].rpe =
      Number(value);

    app.rpeMenu = null;

    scheduleSave(
      m.index
    );

    render();

  },


  openNote:function(
    index,
    id
  ){

    app.modal = {
      type:'note',
      sessionIndex:index,
      exerciseId:id
    };

    render();

  },


  saveNote:function(){

    if(
      !app.modal ||
      app.modal.type !==
      'note'
    ){
      return;
    }

    var textarea =
      document.getElementById(
        'st-note-text'
      );

    var ex =
      exerciseForDisplay(
        currentWorkout()
          .sessions[
            app.modal
              .sessionIndex
          ],
        app.modal
          .exerciseId
      );

    if(!ex){
      return;
    }

    rememberUndo();
    materializeExercise(currentWorkout().sessions[app.modal.sessionIndex],ex);

    ex.note =
      textarea
      ?
      textarea.value
      :
      '';

    ex.coachNote=document.getElementById('st-coach-note-text').value;

    var index =
      app.modal
        .sessionIndex;

    app.modal = null;

    scheduleSave(index);

    render();

  },


  openManager:function(type){
    if(type && !app.workouts[Number(type)]){ensureTemplate(Number(type)).then(function(){ST.openManager(type);}).catch(function(error){showDeliveryNotice(error.message,true);});return;}

    app.managerReturnToTemplates = !!(app.modal && app.modal.type==='templates');

    if(type && app.workouts[Number(type)]){
      app.workoutType = Number(type);
      selectLatestTemplateSession();
      app.statsExerciseId = '';
    }

    app.managerDraft = copyCatalog(templateWorkout().catalog);
    app.managerUndoStack = [];
    app.modal = {
      type:'manager'
    };

    render();

  },


  hideExercise:function(id){

    var catalog =
      templateWorkout()
        .catalog;

    for(
      var i=0;
      i<catalog.length;
      i++
    ){

      if(
        String(
          catalog[i]
            .exercise_id
        ) ===
        String(id)
      ){

        catalog[i]
          .active = false;

        break;

      }

    }

    saveExerciseSettings();

    render();

  },


  hideExerciseFromSession:function(id,index){
    var sessions = currentWorkout().sessions;
    var session = sessions[Number(index)];
    if(!session || isFilled(session)){ return; }
    var exerciseIndex = session.exercises.findIndex(function(exercise){ return String(exercise.id) === String(id); });
    if(exerciseIndex < 0){ return; }
    rememberUndo();
    session.exercises.splice(exerciseIndex,1);
    scheduleSave(Number(index));
    render();
  },


  toggleExercise:function(id){

    var catalog = app.managerDraft || [];

    for(
      var i=0;
      i<catalog.length;
      i++
    ){

      if(
        String(
          catalog[i]
            .exercise_id
        ) ===
        String(id)
      ){

        rememberManagerChange();

        var active =
          !(
            catalog[i].active ===
              false ||
            String(
              catalog[i].active
            ).toLowerCase() ===
              'false'
          );

        catalog[i].active =
          !active;

        break;

      }

    }

    queueManagerSave();
    render();

  },


  moveExercise:function(
    id,
    direction
  ){

    var catalog = app.managerDraft || [];

    catalog.sort(
      function(a,b){

        return (
          Number(
            a.sort_order ||
            0
          ) -
          Number(
            b.sort_order ||
            0
          )
        );

      }
    );

    var index = -1;

    for(
      var i=0;
      i<catalog.length;
      i++
    ){

      if(
        String(
          catalog[i]
            .exercise_id
        ) ===
        String(id)
      ){

        index = i;
        break;

      }

    }

    var target = index + Number(direction);
    while(
      target >= 0 &&
      target < catalog.length &&
      (catalog[target].active !== true || catalog[target].catalog_active === false)
    ){
      target += Number(direction);
    }

    if(
      index < 0 ||
      target < 0 ||
      target >=
        catalog.length
    ){
      return;
    }

    rememberManagerChange();

    var temp =
      catalog[index];

    catalog[index] =
      catalog[target];

    catalog[target] =
      temp;

    for(
      i=0;
      i<catalog.length;
      i++
    ){

      catalog[i]
        .sort_order =
        i+1;

    }

    queueManagerSave();
    render();

  },


  addExercise:function(){

    var input =
      document.getElementById(
        'st-new-exercise'
      );

    var name =
      input
      ?
      String(
        input.value ||
        ''
      ).trim()
      :
      '';

    if(!name){
      return;
    }

    rememberManagerChange();

    var id = 'custom-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
    app.managerDraft.push({
      exercise_id:id,
      exercise_name:name,
      active:true,
      catalog_active:true,
      sort_order:app.managerDraft.length+1,
      source:'custom',
      muscles:'',
      tips:[],
      media_url:''
    });
    queueManagerSave();
    render();

  },


  renameExercise:function(id){
    var catalog = app.managerDraft || [];
    for(var i=0;i<catalog.length;i++){
      if(String(catalog[i].exercise_id) !== String(id) || catalog[i].source !== 'custom'){
        continue;
      }
      var name = window.prompt('Новое название упражнения',catalog[i].exercise_name);
      if(name === null){ return; }
      name = String(name).trim();
      if(name){
        rememberManagerChange();
        catalog[i].exercise_name = name;
        catalog[i].short_name = name;
        catalog[i].full_name = name;
        queueManagerSave();
      }
      render();
      return;
    }
  },


  deleteExercise:function(id){
    var catalog = app.managerDraft || [];
    for(var i=0;i<catalog.length;i++){
      if(String(catalog[i].exercise_id) !== String(id) || catalog[i].source !== 'custom'){
        continue;
      }
      if(!window.confirm('Удалить своё упражнение из каталога? Старая история останется сохранена.')){
        return;
      }
      rememberManagerChange();
      catalog[i].active = false;
      catalog[i].catalog_active = false;
      queueManagerSave();
      render();
      return;
    }
  },


  closeManager:function(){
    app.managerDraft = null;
    app.managerUndoStack = [];
    app.modal = app.managerReturnToTemplates ? {type:'templates'} : null;
    app.managerReturnToTemplates = false;
    render();
  },


  undoManagerChange:function(){

    if(!app.managerUndoStack.length){
      return;
    }

    app.managerDraft = app.managerUndoStack.pop();
    queueManagerSave();
    render();

  },


  cancelManager:function(){
    this.closeManager();
  },


  saveManager:function(){
    queueManagerSave();
    this.closeManager();
  },


  openTutorial:function(){
    app.modal={type:'tutorial'};
    render();
  },


  openExerciseInfo:function(id){
    app.modal={type:'exerciseInfo',exerciseId:id};
    render();
    var close = document.querySelector('.st-guide-close');
    if(close){ close.focus(); }
  },


  createFirstSession:function(){

    var catalog =
      activeCatalog();

    var exercises = [];

    for(
      var i=0;
      i<catalog.length;
      i++
    ){

      exercises.push({
        id:
          catalog[i]
            .exercise_id,

        name:
          catalog[i]
            .exercise_name,

        sort_order:
          catalog[i]
            .sort_order,

        note:'',

        sets:newExerciseSets(catalog[i].exercise_id)
      });

    }

    currentWorkout()
      .sessions
      .push({
        session_id:newSessionId(),
        number:1,
        date:'',
        exercises:
          exercises
      });

    app.selectedIndex = 0;

    saveSessionNow(0);

    render();

  },


  copyNext:function(mode){

    if(
      !isLatest()
    ){
      return;
    }

    var workout =
      currentWorkout();

    var source =
      workout.sessions[
        app.selectedIndex
      ];

    var next = {
      session_id:newSessionId(),
      number:
        source.number+1,
      date:'',
      exercises:[]
    };

    for(
      var i=0;
      i<source.exercises.length;
      i++
    ){

      var old =
        source.exercises[i];

      var ne = {
        id:old.id,
        name:old.name,
        sort_order:
          old.sort_order,
        note:'',
        sets:[]
      };

      for(
        var j=0;
        j<old.sets.length;
        j++
      ){

        ne.sets.push({
          set_number:j+1,
          role:old.sets[j].role === 'warmup' ? 'warmup' : 'work',

          planWeight:
            mode === 'fact'
            ?
            old.sets[j]
              .factWeight
            :
            old.sets[j]
              .planWeight,

          planReps:
            mode === 'fact'
            ?
            old.sets[j]
              .factReps
            :
            old.sets[j]
              .planReps,

          factWeight:'',
          factReps:'',
          rpe:''
        });

      }

      next.exercises.push(
        ne
      );

    }

    workout.sessions.push(
      next
    );

    app.selectedIndex =
      workout.sessions.length-1;

    saveSessionNow(
      app.selectedIndex
    );

    render();

  },


  prevMonth:function(){

    app.calendarMonth--;

    if(
      app.calendarMonth < 0
    ){

      app.calendarMonth = 11;
      app.calendarYear--;

    }

    render();

  },


  nextMonth:function(){

    app.calendarMonth++;

    if(
      app.calendarMonth > 11
    ){

      app.calendarMonth = 0;
      app.calendarYear++;

    }

    render();

  },


  openCalendarDay:function(date){

    app.modal = {
      type:'calendarDay',
      date:date
    };

    render();

  },


  jumpToSession:function(sessionId){

    var global = currentWorkout();
    var index = global && global.sessions
      ? global.sessions.findIndex(function(session){ return String(session.session_id) === String(sessionId); })
      : -1;

    if(index < 0){ return; }

    app.workoutType = Number(global.sessions[index].workoutType || 1);
    app.selectedIndex = index;

    app.mainTab =
      'training';

    app.modal = null;

    render();

  },


  openExerciseStats:function(id){
    app.statsExerciseId = id;
    app.mainTab = 'stats';
    app.modal = null;
    render();
  },


  setStatsExercise:function(id){

    app.statsExerciseId =
      id;

    render();

  },


  closeModal:function(){
    var infoId = app.modal && app.modal.type === 'exerciseInfo' ? app.modal.exerciseId : null;
    app.modal = null;

    render();
    if(infoId !== null){
      var buttons = document.querySelectorAll('.st-exercise-info');
      for(var i=0;i<buttons.length;i++){
        if(buttons[i].dataset.exerciseId === String(infoId) && buttons[i].getClientRects().length){ buttons[i].focus({preventScroll:true}); break; }
      }
    }

  }

};


/* =========================================================
   GLOBAL CLICK
========================================================= */

document.addEventListener(
  'click',
  function(event){

    if(
      app.modal &&
      event.target &&
      event.target.classList &&
      event.target.classList.contains('st-modal-bg')
    ){
      ST.closeModal();
      return;
    }

    if(!app.rpeMenu){
      return;
    }

    var el =
      event.target;

    while(el){

      if(
        el.className &&
        (
          String(
            el.className
          ).indexOf(
            'st-rpe-floating'
          ) > -1 ||
          String(
            el.className
          ).indexOf(
            'st-rpe-button'
          ) > -1 ||
          String(
            el.className
          ).indexOf(
            'st-rpe-option'
          ) > -1
        )
      ){

        return;

      }

      el =
        el.parentNode;

    }

    app.rpeMenu = null;

    render();

  }
);


document.addEventListener('keydown',function(event){
  if(app.modal && app.modal.type === 'tutorial' && event.key === 'Escape'){
    event.preventDefault(); ST.closeModal(); return;
  }
  if(app.modal && app.modal.type === 'exerciseInfo' && document.querySelector('.st-exercise-guide')){
    if(event.key === 'Escape'){ event.preventDefault(); ST.closeModal(); return; }
    if(event.key === 'Tab'){
      var guideTargets = document.querySelectorAll('.st-exercise-guide button, .st-exercise-guide [tabindex="0"], .st-exercise-guide a[href]');
      var firstGuideTarget = guideTargets[0];
      var lastGuideTarget = guideTargets[guideTargets.length-1];
      if(event.shiftKey && document.activeElement === firstGuideTarget){
        event.preventDefault(); lastGuideTarget.focus();
      }else if(!event.shiftKey && document.activeElement === lastGuideTarget){
        event.preventDefault(); firstGuideTarget.focus();
      }
      return;
    }
  }
  if(!(event.ctrlKey || event.metaKey) || event.altKey){ return; }
  var key = String(event.key).toLowerCase();
  var isZ = event.code === 'KeyZ' || key === 'z';
  var isY = event.code === 'KeyY' || key === 'y';
  if(!isZ && !isY){ return; }
  var redo = isY || event.shiftKey;
  var selector = redo ? 'button[onclick="ST.redo()"]' : 'button[onclick="ST.undo()"]';
  if(app.modal){
    if(app.modal.type !== 'manager' || redo){ return; }
    selector = '.st-manager-undo';
  }else if(app.mode !== 'client' || app.mainTab !== 'training'){
    return;
  }
  var target = event.target;
  var editable = target && target.closest && target.closest('input,textarea,[contenteditable="true"]');
  if(editable && !root.contains(editable)){ return; }
  event.preventDefault();
  // Clicking an editor button commits the focused field before applying undo.
  if(editable && editable.blur){
    editable.blur();
    if(!app.modal){ render(); }
  }
  var button = root.querySelector(selector);
  if(button){ button.click(); }
});


/* =========================================================
   ERROR
========================================================= */

function showFatal(error){
  initialLoadReject(error);

  root.innerHTML =
    '<div class="st-error">'+
      '<b>Ошибка приложения</b>'+
      '<div style="margin-top:8px;">'+
        esc(
          error &&
          error.message
          ?
          error.message
          :
          String(error)
        )+
      '</div>'+
    '</div>';

}


/* =========================================================
   INIT
========================================================= */

function init(){
  app.mainTab=new URLSearchParams(location.search).get('view')==='stats'?'stats':'training';

  if(MANAGED_TARGET){
    app.email = '';
    app.isAdmin = false;
    getApi({action:'openUser'})
      .then(function(result){loadClient(result.user);})
      .catch(showFatal);
    return;
  }

  app.email =
    detectEmail();

  if(!app.email){

    showFatal(
      new Error(
        'Требуется вход в личный кабинет.'
      )
    );

    location.replace('/lk');
    return;

  }

  app.email =
    String(app.email)
      .trim()
      .toLowerCase();

  app.isAdmin = false;

  getApi({
    action:'openUser',
    email:app.email
  })
  .then(function(result){

    loadClient(
      result.user
    );

  })
  .catch(showFatal);

}


try{

  init();

}catch(error){

  showFatal(error);

}

})();
</script>
