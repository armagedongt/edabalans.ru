/* =========================================================

function getApi(params){

  var query = [];
  var key;

  for(key in params){

    if(params.hasOwnProperty(key)){

      query.push(
        encodeURIComponent(key) +
        '=' +
        encodeURIComponent(
          params[key]
        )
      );

    }

  }

  return fetch(
    API_URL +
    '?' +
    query.join('&'),
    {
      method:'GET',
      redirect:'follow'
    }
  )
  .then(function(response){

    return response.json();

  })
  .then(function(data){

    if(!data.ok){

      throw new Error(
        data.error ||
        'Ошибка сервера'
      );

    }

    return data;

  });

}


function postApi(body){

  return fetch(
    API_URL,
    {
      method:'POST',

      /*
        text/plain специально,
        чтобы браузер не делал
        CORS preflight к Apps Script.
      */

      headers:{
        'Content-Type':
          'text/plain;charset=utf-8'
      },

      body:
        JSON.stringify(body),

      redirect:'follow'
    }
  )
  .then(function(response){

    return response.json();

  })
  .then(function(data){

    if(!data.ok){

      throw new Error(
        data.error ||

      );

    }

    return data;

  });

}


/* =========================================================
   TILDA EMAIL
========================================================= */

function detectEmail(){

  var result = [];
  var i;
  var inputs;
  var matches;

  function collect(text){

    if(!text){
      return;
    }

    matches =
      String(text).match(
        /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi
      );

    if(!matches){
      return;
    }

    for(
      var j=0;
      j<matches.length;
      j++
    ){

      if(
        result.indexOf(
          matches[j]
        ) === -1
      ){

        result.push(
          matches[j]
        );

      }

    }

  }

  try{

    inputs =
      document.querySelectorAll(
        'input'
      );

    for(
      i=0;
      i<inputs.length;
      i++
    ){

      if(
        String(
          inputs[i].name ||
          ''
        )
        .toLowerCase()
        .indexOf('email') > -1
      ){

        collect(
          inputs[i].value
        );

      }

    }

    collect(
      document.body.innerText
    );

  }catch(e){}

  return (
    result.length
    ?
    result[0]
    :
    ''
  );

}


/* =========================================================
   HELPERS
========================================================= */

function blank(v){

  return (
    v === '' ||
    v === null ||
    typeof v ===
      'undefined'
  );

}


function esc(value){

  if(
    value === null ||
    typeof value ===
      'undefined'
  ){
    return '';
  }

  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');

}


function pad2(n){

  return (
    Number(n) < 10
    ?
    '0' + Number(n)
    :
    String(Number(n))
  );

}


function formatDate(value){

  var p;

  if(!value){
    return '';
  }

  p =
    String(value)
    .substring(0,10)
    .split('-');

  if(p.length !== 3){
    return value;
  }

  return (
    p[2] +
    '.' +
    p[1] +
    '.' +
    p[0]
  );

}


function weekday(value){

  var p;
  var d;

  var days = [
    'Воскресенье',
    'Понедельник',
    'Вторник',
    'Среда',
    'Четверг',
    'Пятница',
    'Суббота'
  ];

  if(!value){
    return '';
  }

  p =
    String(value)
    .substring(0,10)
    .split('-');

  d =
    new Date(
      Number(p[0]),
      Number(p[1])-1,
      Number(p[2])
    );

  return days[
    d.getDay()
  ];

}


function round1(value){

  return (
    Math.round(
      Number(value) * 10
    ) / 10
  )
  .toFixed(1)
  .replace('.',',');
}


function dateKey(
  year,
  month,
  day
){

  return (
    year +
    '-' +
    pad2(month+1) +
    '-' +
    pad2(day)
  );

}

/* =========================================================
   BACKEND → UI MODEL
========================================================= */

function buildWorkoutModel(raw){

  var sessions = [];
  var sessionMap = {};
  var exerciseMap = {};
  var i;
  var row;
  var s;
  var ex;
  var key;

  raw = raw || {};

  /*
    Sessions
  */

  var rawSessions =
    raw.sessions || [];

  for(
    i=0;
    i<rawSessions.length;
    i++
  ){

    row =
      rawSessions[i];

    s = {
      session_id:
        row.session_id,

      number:
        Number(
          row.session_number
        ),

      date:
        row.date
        ?
        String(row.date)
          .substring(0,10)
        :
        '',

      status:
        row.status || '',

      exercises:[]
    };

    sessions.push(s);

    sessionMap[
      String(
        s.session_id
      )
    ] = s;

  }

  sessions.sort(
    function(a,b){
      return (
        a.number -
        b.number
      );
    }
  );

  /*
    Session exercises
  */

  var rawEx =
    raw.session_exercises ||
    [];

  for(
    i=0;
    i<rawEx.length;
    i++
  ){

    row = rawEx[i];

    s =
      sessionMap[
        String(
          row.session_id
        )
      ];

    if(!s){
      continue;
    }

    ex = {
      id:
        String(
          row.exercise_id
        ),

      name:
        row.exercise_name ||
        '',

      sort_order:
        Number(
          row.sort_order ||
          0
        ),

      note:
        row.note || '',

      sets:[]
    };

    s.exercises.push(ex);

    key =
      String(
        row.session_id
      ) +
      '|' +
      String(
        row.exercise_id
      );

    exerciseMap[key] = ex;

  }

  /*
    Sets
  */

  var rawSets =
    raw.sets || [];

  for(
    i=0;
    i<rawSets.length;
    i++
  ){

    row = rawSets[i];

    key =
      String(
        row.session_id
      ) +
      '|' +
      String(
        row.exercise_id
      );

    ex =
      exerciseMap[key];

    if(!ex){
      continue;
    }

    ex.sets.push({
      set_number:
        Number(
          row.set_number
        ),

      planWeight:
        blank(row.plan_weight)
        ?
        ''
        :
        row.plan_weight,

      planReps:
        blank(row.plan_reps)
        ?
        ''
        :
        row.plan_reps,

      factWeight:
        blank(row.fact_weight)
        ?
        ''
        :
        row.fact_weight,

      factReps:
        blank(row.fact_reps)
        ?
        ''
        :
        row.fact_reps,

      rpe:
        blank(row.rpe)
        ?
        ''
        :
        row.rpe
    });

  }

  /*
    Sorting
  */

  for(
    i=0;
    i<sessions.length;
    i++
  ){

    sessions[i]
      .exercises
      .sort(
        function(a,b){
          return (
            a.sort_order -
            b.sort_order
          );
        }
      );

    for(
      var j=0;
      j<
      sessions[i].exercises.length;
      j++
    ){

      sessions[i]
        .exercises[j]
        .sets
        .sort(
          function(a,b){
            return (
              a.set_number -
              b.set_number
            );
          }
        );

    }

  }

  return {
    workout_types:
      raw.workout_types ||
      [],

    catalog:
      raw.exercise_catalog ||
      [],

    sessions:sessions
  };

}

/* =========================================================
   SAVE SESSION
========================================================= */

function sessionPayload(session){

  var result = {
    session_id:
      session.session_id,

    session_number:
      session.number,

    date:
      session.date || '',

    exercises:[]
  };

  var i;
  var j;
  var ex;
  var outEx;

  for(
    i=0;
    i<session.exercises.length;
    i++
  ){

    ex =
      session.exercises[i];

    outEx = {
      exercise_id:
        ex.id,

      exercise_name:
        ex.name,

      sort_order:
        ex.sort_order ||
        i+1,

      note:
        ex.note || '',

      sets:[]
    };

    for(
      j=0;
      j<ex.sets.length;
      j++
    ){

      outEx.sets.push({
        set_number:
          j+1,

        plan_weight:
          ex.sets[j]
            .planWeight,

        plan_reps:
          ex.sets[j]
            .planReps,

        fact_weight:
          ex.sets[j]
            .factWeight,

        fact_reps:
          ex.sets[j]
            .factReps,

        rpe:
          ex.sets[j]
            .rpe
      });

    }

    result.exercises.push(
      outEx
    );

  }

  return result;

}


function scheduleSave(
  sessionIndex
){

  if(app.saveTimer){

    clearTimeout(
      app.saveTimer
    );

  }

  app.saving = true;
  app.saveError = '';

  renderSavingOnly();

  app.saveTimer =
    setTimeout(
      function(){

        saveSessionNow(
          sessionIndex
        );

      },
      450
    );

}


function saveSessionNow(
  sessionIndex
){

  var workout =
    currentWorkout();

  var session =
    workout
      .sessions[
        sessionIndex
      ];

  if(!session){
    return;
  }

  var body = {
    action:
      'saveSession',

    workout_type:
      app.workoutType,

    session:
      sessionPayload(
        session
      )
  };

  if(app.isAdmin){

    body.user_id =
      currentUserId();

    body.target_user_id =
      currentUserId();

    body.admin_email =
      app.email;

  }else{

    body.email =
      app.email;

  }

  postApi(body)
    .then(function(){

      app.saving = false;
      app.saveError = '';

      renderSavingOnly();

    })
    .catch(function(error){

      app.saving = false;

      app.saveError =
        error.message ||
        String(error);

      renderSavingOnly();

    });

}


function renderSavingOnly(){

  var el =
    document.getElementById(
      'st-save-state'
    );

  if(!el){
    return;
  }

  if(app.saveError){

    el.className =
      'st-saving error';

    el.innerHTML =
      'Ошибка сохранения: ' +
      esc(app.saveError);

    return;
  }

  el.className =
    'st-saving';

  el.innerHTML =
    app.saving
    ?
    'Сохраняю…'
    :
    'Сохранено';

}


/* =========================================================
   EXERCISE HELPERS
========================================================= */

function findExercise(
  session,
  id
){

  var i;

  if(!session){
    return null;
  }

  for(
    i=0;
    i<session.exercises.length;
    i++
  ){

    if(
      String(
        session.exercises[i].id
      ) ===
      String(id)
    ){

      return (
        session.exercises[i]
      );

    }

  }

  return null;

}


function previousExercise(
  index,
  id
){

  if(index <= 0){
    return null;
  }

  return findExercise(
    currentWorkout()
      .sessions[
        index-1
      ],
    id
  );

}


function activeCatalog(){

  var catalog =
    currentWorkout()
      .catalog.slice();

  catalog.sort(
    function(a,b){
      return (
        Number(
          a.sort_order ||
          0
        ) -
        Number(
          b.sort_order ||
          0
        )
      );
    }
  );

  return catalog.filter(
    function(item){

      return !(
        item.active === false ||
        String(
          item.active
        ).toLowerCase() ===
        'false'
      );

    }
  );

}


function isFilled(session){

  var i;
  var j;

  if(!session){
    return false;
  }

  for(
    i=0;
    i<session.exercises.length;
    i++
  ){

    for(
      j=0;
      j<
      session.exercises[i]
        .sets.length;
      j++
    ){

      if(
        !blank(
          session.exercises[i]
            .sets[j]
            .rpe
        )
      ){

        return true;

      }

    }

  }

  return false;

}


function isLatest(){

  var sessions =
    currentWorkout()
      .sessions;

  return (
    sessions.length &&
    app.selectedIndex ===
      sessions.length-1
  );

}


function clientLocked(index){

  if(app.isAdmin){
    return false;
  }

  var session =
    currentWorkout()
      .sessions[index];

  return (
    !session ||
    !session.date
  );

}

function planClass(
  plan,
  previous
){

  if(
    blank(plan) ||
    blank(previous)
  ){
    return '';
  }

  if(
    Number(plan) >
    Number(previous)
  ){
    return 'plan-up';
  }

  if(
    Number(plan) <
    Number(previous)
  ){
    return 'plan-down';
  }

  return '';

}

/* =========================================================
   8RM
========================================================= */

function calculate8RM(
  weight,
  reps,
  rpe
){

  weight =
    Number(weight);

  reps =
    Number(reps);

  rpe =
    Number(rpe);

  if(
    !isFinite(weight) ||
    !isFinite(reps) ||
    !isFinite(rpe) ||
    weight <= 0 ||
    reps <= 0 ||
    rpe < 1 ||
    rpe > 10
  ){

    return null;

  }

  return (
    weight *
    (
      1 +
      (
        reps +
        10 -
        rpe
      ) / 30
    ) /
    (
      1 +
      8 / 30
    )
  );

}


function session8RM(
  session,
  exerciseId
){

  var ex =
    findExercise(
      session,
      exerciseId
    );

  if(
    !ex ||
    ex.sets.length < 2
  ){
    return null;
  }

  var candidates = [];

  /*
    Первый подход исключён.
  */

  for(
    var i=1;
    i<ex.sets.length;
    i++
  ){

    var s =
      ex.sets[i];

    var estimate =
      calculate8RM(
        s.factWeight,
        s.factReps,
        s.rpe
      );

    if(
      estimate === null
    ){
      continue;
    }

    candidates.push({
      weight:
        Number(
          s.factWeight
        ),

      reps:
        Number(
          s.factReps
        ),

      rpe:
        Number(
          s.rpe
        ),

      set:
        i+1,

      estimate:
        estimate
    });

  }

  if(!candidates.length){
    return null;
  }

  var maxWeight =
    candidates[0].weight;

  for(
    i=1;
    i<candidates.length;
    i++
  ){

    if(
      candidates[i].weight >
      maxWeight
    ){

      maxWeight =
        candidates[i].weight;

    }

  }

  var best = null;

  for(
    i=0;
    i<candidates.length;
    i++
  ){

    if(
      candidates[i].weight !==
      maxWeight
    ){
      continue;
    }

    if(
      !best ||
      candidates[i]
        .estimate >
      best.estimate
    ){

      best =
        candidates[i];

    }

  }

  return best;

}


function statsHistory(
  exerciseId
){

  var sessions =
    currentWorkout()
      .sessions;

  var result = [];

  for(
    var i=0;
    i<sessions.length;
    i++
  ){

    if(!sessions[i].date){
      continue;
    }

    var best =
      session8RM(
        sessions[i],
        exerciseId
      );

    if(!best){
      continue;
    }

    result.push({
      date:
        sessions[i].date,

      number:
        sessions[i].number,

      estimate:
        best.estimate,

      weight:
        best.weight,

      reps:
        best.reps,

      rpe:
        best.rpe
    });

  }

  return result;

}

    html +=

          '<div class="st-metric-value">'+
            (
              latest.estimate -
              first.estimate >
              0
              ?
              '+'
              :
              ''
            )+
            round1(
              latest.estimate -
              first.estimate
            )+
            '<span class="st-metric-unit">кг</span>'+
          '</div>'+
        '</div>'+
        '<div class="st-metric">'+

          '<div class="st-metric-value">'+
            latest.weight+

function renderChart(history){

  var W = 820;
  var H = 330;

  var left = 45;
  var right = 18;
  var top = 30;
  var bottom = 52;

  var plotW =
    W-left-right;

  var plotH =
    H-top-bottom;

  var min =
    history[0].estimate;

  var max =
    history[0].estimate;

  var i;

  for(
    i=1;
    i<history.length;
    i++
  ){

    min =
      Math.min(
        min,
        history[i]
          .estimate
      );

    max =
      Math.max(
        max,
        history[i]
          .estimate
      );

  }

  var range =
    Math.max(
      4,
      max-min
    );

  var low =
    min-
    range*.25;

  var high =
    max+
    range*.25;

  function x(index){

    if(
      history.length === 1
    ){
      return (
        left+
        plotW/2
      );
    }

    return (
      left+
      index*
      plotW/
      (
        history.length-1
      )
    );

  }

  function y(value){

    return (
      top+
      (
        high-value
      ) /
      (
        high-low
      ) *
      plotH
    );

  }

  var path = '';

  for(
    i=0;
    i<history.length;
    i++
  ){

    path +=
      (
        i === 0
        ?
        'M '
        :
        ' L '
      )+
      x(i)+
      ' '+
      y(
        history[i]
          .estimate
      );

  }

  var html =
    '<div class="st-card st-chart-card">'+
      '<div class="st-chart-title">Прогресс расчётного максимума ×8</div>'+
      '<div class="st-chart-sub">Одна точка — одна тренировка.</div>'+
      '<svg viewBox="0 0 '+W+' '+H+'">';

  for(
    var g=0;
    g<5;
    g++
  ){

    var gy =
      top+
      g*
      plotH/4;

    var val =
      high-
      g*
      (
        high-low
      )/4;

    html +=
      '<line class="chart-grid" x1="'+left+'" y1="'+gy+'" x2="'+(W-right)+'" y2="'+gy+'"></line>'+
      '<text class="chart-label" x="'+(left-8)+'" y="'+(gy+4)+'" text-anchor="end">'+
        round1(val)+
      '</text>';

  }

  if(
    history.length > 1
  ){

    html +=
      '<path class="chart-line" d="'+path+'"></path>';

  }

  for(
    i=0;
    i<history.length;
    i++
  ){

    html +=
      '<circle class="chart-point" cx="'+x(i)+'" cy="'+y(history[i].estimate)+'" r="6"></circle>'+
      '<text class="chart-value" x="'+x(i)+'" y="'+(y(history[i].estimate)-11)+'" text-anchor="middle">'+
        round1(
          history[i].estimate
        )+
      '</text>'+
      '<text class="chart-label" x="'+x(i)+'" y="'+(H-22)+'" text-anchor="middle">'+
        formatDate(
          history[i].date
        ).slice(0,5)+
      '</text>';

  }

  html +=
      '</svg>'+
    '</div>';

  return html;

}


function renderMethod(){

  return (
    '<div class="st-card st-method">'+
      '<div class="st-method-title">Что такое расчётный максимум ×8</div>'+
      '<div class="st-method-text">'+

function saveExerciseSettings(){

  var catalog =
    currentWorkout()
      .catalog;

  var arr = [];

  for(
    var i=0;
    i<catalog.length;
    i++
  ){

    arr.push({
      exercise_id:
        catalog[i]
          .exercise_id,

      active:
        !(
          catalog[i].active === false ||
          String(
            catalog[i].active
          ).toLowerCase() ===
          'false'
        ),

      sort_order:
        Number(
          catalog[i]
            .sort_order ||
          i+1
        )
    });

  }

  postApi({
    action:
      'saveExerciseSettings',

    user_id:
      currentUserId(),

    target_user_id:
      currentUserId(),

    admin_email:
      app.email,

    workout_type:
      app.workoutType,

    exercises:
      arr
  })
  .catch(function(error){

    alert(
      'Не удалось сохранить упражнения: '+
      error.message
    );

  });

}

  moveExercise:function(
    id,
    direction
  ){

    var catalog =
      currentWorkout()
        .catalog;

    catalog.sort(
      function(a,b){

        return (
          Number(
            a.sort_order ||
            0
          ) -
          Number(
            b.sort_order ||
            0
          )
        );

      }
    );

    var index = -1;

    for(
      var i=0;
      i<catalog.length;
      i++
    ){

      if(
        String(
          catalog[i]
            .exercise_id
        ) ===
        String(id)
      ){

        index = i;
        break;

      }

    }

    var target =
      index+
      Number(direction);

    if(
      index < 0 ||
      target < 0 ||
      target >=
        catalog.length
    ){
      return;
    }

    var temp =
      catalog[index];

    catalog[index] =
      catalog[target];

    catalog[target] =
      temp;

    for(
      i=0;
      i<catalog.length;
      i++
    ){

      catalog[i]
        .sort_order =
        i+1;

    }

    saveExerciseSettings();

    render();

  },

      exercises.push({
        id:
          catalog[i]
            .exercise_id,

        name:
          catalog[i]
            .exercise_name,

        sort_order:
          catalog[i]
            .sort_order,

        note:'',

        sets:[
          {
            set_number:1,
            planWeight:'',
            planReps:'',
            factWeight:'',
            factReps:'',
            rpe:''
          }
        ]
      });

    }

    currentWorkout()
      .sessions
      .push({
        session_id:'',
        number:1,
        date:'',
        exercises:
          exercises
      });

    app.selectedIndex = 0;

    saveSessionNow(0);

    render();

  },


  copyNext:function(mode){

    if(
      !app.isAdmin ||
      !isLatest()
    ){
      return;
    }

    var workout =
      currentWorkout();

    var source =
      workout.sessions[
        app.selectedIndex
      ];

    var next = {
      session_id:'',
      number:
        source.number+1,
      date:'',
      exercises:[]
    };

    for(
      var i=0;
      i<source.exercises.length;
      i++
    ){

      var old =
        source.exercises[i];

      var ne = {
        id:old.id,
        name:old.name,
        sort_order:
          old.sort_order,
        note:'',
        sets:[]
      };

      for(
        var j=0;
        j<old.sets.length;
        j++
      ){

        ne.sets.push({
          set_number:j+1,

          planWeight:
            mode === 'fact'
            ?
            old.sets[j]
              .factWeight
            :
            old.sets[j]
              .planWeight,

          planReps:
            mode === 'fact'
            ?
            old.sets[j]
              .factReps
            :
            old.sets[j]
              .planReps,

          factWeight:'',
          factReps:'',
          rpe:''
        });

      }

      next.exercises.push(
        ne
      );

    }

    workout.sessions.push(
      next
    );

    app.selectedIndex =
      workout.sessions.length-1;

    saveSessionNow(
      app.selectedIndex
    );

    render();

  },


  prevMonth:function(){

    app.calendarMonth--;

    if(
      app.calendarMonth < 0
    ){

      app.calendarMonth = 11;
      app.calendarYear--;

    }

    render();

  },


  nextMonth:function(){

    app.calendarMonth++;

    if(
      app.calendarMonth > 11
    ){

      app.calendarMonth = 0;
      app.calendarYear++;

    }

    render();

  },


  openCalendarDay:function(date){

    app.modal = {
      type:'calendarDay',
      date:date
    };

    render();

  },


  jumpToSession:function(
    type,
    index
  ){

    app.workoutType =
      Number(type);

    app.selectedIndex =
      Number(index);

    app.mainTab =
      'training';

    app.modal = null;

    render();

  },


  setStatsExercise:function(id){

    app.statsExerciseId =
      id;

    render();

  },


  closeModal:function(){

    app.modal = null;

    render();

  }

};


/* =========================================================
   GLOBAL CLICK
========================================================= */

document.addEventListener(
  'click',
  function(event){

    if(!app.rpeMenu){
      return;
    }

    var el =
      event.target;

    while(el){

      if(
        el.className &&
        (
          String(
            el.className
          ).indexOf(
            'st-rpe-floating'
          ) > -1 ||
          String(
            el.className
          ).indexOf(
            'st-rpe-button'
          ) > -1 ||
          String(
            el.className
          ).indexOf(
            'st-rpe-option'
          ) > -1
        )
      ){

        return;

      }

      el =
        el.parentNode;

    }

    app.rpeMenu = null;

    render();

  }
);


/* =========================================================
   ERROR
========================================================= */

function showFatal(error){

  root.innerHTML =
    '<div class="st-error">'+
      '<b>Ошибка приложения</b>'+
      '<div style="margin-top:8px;">'+
        esc(
          error &&
          error.message
          ?
          error.message
          :
          String(error)
        )+
      '</div>'+
    '</div>';

}


/* =========================================================
   INIT
========================================================= */

function init(){

  app.email =
    detectEmail();

  if(!app.email){

    showFatal(
      new Error(
        'Не удалось определить email пользователя Tilda.'
      )
    );

    return;

  }

  app.email =
    String(app.email)
      .trim()
      .toLowerCase();

  app.isAdmin =
    app.email ===
    ADMIN_EMAIL
      .toLowerCase();

  if(app.isAdmin){

    loadAdminUsers();

    return;

  }

  getApi({
    action:'openUser',
    email:app.email
  })
  .then(function(result){

    loadClient(
      result.user
    );

  })
  .catch(showFatal);

}


try{

  init();

}catch(error){

  showFatal(error);

}

})();
</script>
