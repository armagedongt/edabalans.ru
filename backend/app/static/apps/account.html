<div id="account-app"></div>
<style>
  #account-app{--ink:#25241f;--muted:#716e67;--paper:#f5f0e7;--card:#fffdf8;--line:#ddd4c5;--accent:#dc6748;box-sizing:border-box;min-height:100vh;margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Inter,Arial,sans-serif}
  #account-app *{box-sizing:border-box}.account-shell{width:min(1080px,100%);margin:auto;padding:42px 24px 80px}.account-visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}.account-head{max-width:760px;margin-bottom:28px}.account-kicker{margin:0 0 9px;color:var(--accent);font-size:12px;font-weight:850;letter-spacing:.11em;text-transform:uppercase}.account-head h1{margin:0;font-size:clamp(38px,7vw,68px);line-height:.98;letter-spacing:-.045em}.account-session{margin:12px 0 0;color:var(--muted);font-size:14px}.account-session-email{color:var(--ink);overflow-wrap:anywhere}.account-logout{border:0;padding:0;background:none;color:var(--ink);font:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer}.account-logout:hover{text-decoration-thickness:2px}.account-section{margin-top:38px}.account-section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:14px}.account-section h2{margin:0;font-size:clamp(25px,4vw,34px);line-height:1.05;letter-spacing:-.03em}.account-section-note{max-width:460px;margin:0;color:var(--muted);font-size:14px;text-align:right}.account-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.account-card{display:grid;grid-template-rows:1fr auto;min-height:230px;padding:22px;border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:0 12px 35px #50351b0d}.account-card.available-card{border-color:#a8c6b2;background:#f7fbf7}.account-card.featured{border-color:#e3a38f;background:#fff5ef;box-shadow:0 15px 38px #8f3f2417}.account-card h3{margin:12px 0 0;font-size:23px;line-height:1.12;letter-spacing:-.025em}.account-card p{margin:9px 0 0;color:var(--muted)}.account-state{display:inline-block;width:max-content;padding:8px 12px;border-radius:999px;background:#eee7dd;color:#6d665d;font-size:12px;font-weight:800;line-height:1}.account-state.owned{background:#e5f0e9;color:#315c43}.account-state.preparing{background:#fff0d6;color:#7c5716}.account-open{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:20px;border:0;border-radius:14px;padding:12px 17px;background:var(--ink);color:#fff;font-size:14px;font-weight:800;white-space:nowrap;cursor:pointer}.account-open.available{background:#287747}.account-open.purchase{background:var(--accent)}.account-open:disabled{background:#ded9cf;color:#858078;cursor:default}.account-review{margin:0 0 30px;padding:22px 24px;border:1px solid #e3a38f;border-radius:22px;background:#fff5ef}.account-review h2{margin:0 0 8px;font-size:24px;line-height:1.1}.account-review p{max-width:780px;margin:0;color:#684c43}.account-contact{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.account-contact a{border-radius:12px;padding:10px 14px;background:var(--ink);color:#fff;text-decoration:none;font-size:14px;font-weight:800}.application-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.application-card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;min-height:112px;padding:17px 18px;border:1px solid var(--line);border-radius:17px;background:#fbf8f2}.application-card h3{margin:0;font-size:17px;line-height:1.2}.application-card p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.35}.application-card .account-open{width:124px;min-height:42px;margin:0;padding:8px 12px}.legacy-card{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 20px;border:1px solid var(--line);border-radius:17px;background:#fbf8f2}.legacy-card h3{margin:0;font-size:18px}.legacy-card p{margin:4px 0 0;color:var(--muted);font-size:14px}.legacy-link{flex:0 0 auto;border-radius:12px;padding:11px 15px;background:var(--ink);color:#fff;text-decoration:none;font-size:14px;font-weight:800}.account-logout:focus-visible,.account-open:focus-visible,.legacy-link:focus-visible,.account-contact a:focus-visible{outline:3px solid #e3a38f;outline-offset:2px}.account-legal{margin:0 0 20px;padding:28px 24px 24px;border:1px solid #e3a38f;border-radius:24px;background:#fff5ef}.account-legal h2{margin:0;text-align:center;font-size:clamp(25px,4vw,34px);line-height:1.05;letter-spacing:-.03em}.account-legal>p{max-width:720px;margin:11px auto 21px;color:#684c43;text-align:center;font-size:16px}.legal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.legal-card{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:19px;border:1px solid #ead4ca;border-radius:16px;background:#fffdf9}.legal-card input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent)}.legal-copy>strong,.legal-copy>span{display:block}.legal-copy>strong{font-size:17px;line-height:1.3}.legal-copy>span{margin-top:7px;color:var(--muted);font-size:15px;line-height:1.5}.legal-copy>.legal-paragraph+.legal-paragraph{margin-top:12px}.legal-card a{display:inline-block;margin-top:11px;color:#94412d;font-size:15px;font-weight:800}.legal-actions{text-align:center}.legal-action{margin-top:18px;border:0;border-radius:14px;padding:14px 22px;background:var(--ink);color:#fff;font-size:15px;font-weight:850;cursor:pointer}.legal-action:disabled{background:#d8d1c7;color:#817b73;cursor:default}.legal-error{margin:10px 0 0!important;color:#9b3725!important;text-align:center;font-size:14px}.account-course{min-height:100vh}.account-error{padding:28px;color:#9b3725}.tlk-userbar,.tlk-userbar__popup,.tlk-userbar__user-icon,.t-userbar,[class^="tlk-userbar"],[class*=" tlk-userbar"]{display:none!important}
  @media(max-width:760px){.account-shell{padding:28px 16px 65px}.account-grid,.application-grid,.legal-grid{grid-template-columns:1fr}.account-card{min-height:0}.account-section-head{display:block}.account-section-note{margin-top:7px;text-align:left}.account-legal{padding:19px 16px}}
  @media(max-width:480px){.application-card,.legacy-card{display:block}.application-card .account-open{width:100%;margin-top:14px}.legacy-link{display:block;margin-top:14px;text-align:center}}
</style>
<script>
(function(){
  'use strict';
  var root=document.getElementById('account-app'),host=window.EdabalansAppHost||'https://app.edabalans.ru',identity=window.EdabalansIdentity||{};
  function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function accountBaseUrl(){var url=new URL(location.href);url.searchParams.delete('course_day');url.searchParams.delete('course_material');url.searchParams.delete('calories_stage');url.searchParams.delete('calories_material');url.hash='';return url.toString()}
  function accountHeader(){return '<header class="account-head"><p class="account-kicker">Похудение — это есть!</p><h1>Личный кабинет</h1><p class="account-session">Вы вошли как <strong class="account-session-email">'+esc(identity.email)+'</strong> · <a class="account-logout" href="/members/login?exit=y">Выйти</a></p></header>'}
  function bindLogout(){var link=root.querySelector('.account-logout');if(!link)return;link.onclick=function(event){event.preventDefault();try{localStorage.removeItem('edabalans_identity_v1');localStorage.removeItem('dqs_email')}catch(error){}if(typeof window.tma__userbar__sendLogout==='function'){window.tma__userbar__sendLogout();return;}location.assign(link.href)}}
  function requestedCourseApp(){var params=new URL(location.href).searchParams;if(params.has('calories_stage')||params.has('calories_material'))return'calories-course';if(params.has('course_day')||params.has('course_material'))return'masterclass-course';return''}
  function openAccountApp(app){root.innerHTML='<div class="account-course" data-edabalans-app="'+esc(app)+'" data-edabalans-account-url="'+esc(accountBaseUrl())+'"></div>';window.EdabalansEmbed.load(root.firstElementChild)}
  function openRequestedCourse(data){var app=requestedCourseApp();if(!app||data.state!=='ready'||(data.legal&&data.legal.required))return false;var available=(data.courses||[]).some(function(item){return item.app===app&&item.owned&&item.ready});if(!available)return false;openAccountApp(app);return true}
  function reviewBanner(data){if(data.state!=='review_required')return'';return '<section class="account-review"><h2>Пока доступы не подключены</h2><p>'+esc(data.message)+' После проверки эта же страница обновится — повторно регистрироваться не потребуется.</p><div class="account-contact"><a href="https://t.me/FitnessSergey" target="_blank" rel="noopener">Написать в Telegram</a><a href="https://max.ru/u/f9LHodD0cOJjmbADdxMaO0UzEfR_55NRvOSwSuS3C6mWE5T27DPcpczbvEw" target="_blank" rel="noopener">Написать в MAX</a></div></section>'}
  function card(item,locked,purchasable){var canOpen=Boolean(item.app)&&!locked,canBuy=!item.owned&&!locked&&purchasable.indexOf(item.product_code)>=0,label=item.owned?(item.ready?'Доступ открыт':'Куплен, готовится'):item.catalog_status==='planned'?'В разработке':'Доступ закрыт',cls=item.owned?(item.ready?'owned':'preparing'):item.catalog_status==='planned'?'preparing':'',cardCls=canOpen?' available-card':canBuy&&item.product_code==='consultation'?' featured':'';var tariff=item.tariff?'<p><strong>Ваш тариф: '+esc(item.tariff)+'</strong></p>':'',action=canOpen?'<button class="account-open available" data-app="'+esc(item.app)+'">Открыть</button>':canBuy?'<button class="account-open purchase" data-offer-product="'+esc(item.product_code)+'">Купить</button>':'<button class="account-open" disabled>'+esc(locked?'Доступ закрыт':item.owned?'Программа готовится к открытию':item.catalog_status==='planned'?'В разработке':'Доступ закрыт')+'</button>';return '<article class="account-card'+cardCls+'"><div><span class="account-state '+cls+'">'+esc(label)+'</span><h3>'+esc(item.title)+'</h3>'+tariff+'<p>'+esc(item.summary)+'</p></div>'+action+'</article>'}
  function applicationCard(item,locked){var canOpen=Boolean(item.app)&&item.ready&&!locked,label=item.ready?(item.owned?'Открыть':'Доступ закрыт'):'Скоро',action=canOpen?'<button class="account-open available" data-app="'+esc(item.app)+'">Открыть</button>':'<button class="account-open" disabled>'+esc(label)+'</button>';return '<article class="application-card"><div><h3>'+esc(item.title)+'</h3><p>'+esc(item.summary)+'</p></div>'+action+'</article>'}
  function legacyPortal(data){if(!data.legacy_portal||!data.legacy_portal.available)return'';return '<section class="account-section"><h2 class="account-visually-hidden">Архивные материалы</h2><div class="legacy-card"><div><h3>Старый личный кабинет</h3><p>Архивные версии ранее приобретённых курсов на Tilda.</p></div><a class="legacy-link" href="'+esc(data.legacy_portal.url)+'">Открыть старый кабинет</a></div></section>'}
  function legalSummary(value){return String(value||'').split(/\n\s*\n/).map(function(paragraph){return '<span class="legal-paragraph">'+esc(paragraph)+'</span>'}).join('')}
  function legalGate(data){if(data.state!=='ready'||!data.legal||!data.legal.required)return'';return '<section class="account-legal"><p>Чтобы пользоваться личным кабинетом, прочитайте дисклеймер и политику обработки персональных данных.</p><div class="legal-grid">'+data.legal.documents.map(function(item){return '<label class="legal-card"><input type="checkbox" data-legal="'+esc(item.code)+'" '+(item.accepted?'checked disabled':'')+'><span class="legal-copy"><strong>'+esc(item.title)+'</strong>'+legalSummary(item.summary)+'<a href="'+esc(host+item.url)+'" target="_blank" rel="noopener">Читать полностью ↗</a></span></label>'}).join('')+'</div><div class="legal-actions"><button class="legal-action" id="accept-legal" disabled>Принять и продолжить</button><p class="legal-error" id="legal-error"></p></div></section>'}
  function bindLegal(data){var button=root.querySelector('#accept-legal');if(!button)return;var boxes=Array.prototype.slice.call(root.querySelectorAll('[data-legal]')),error=root.querySelector('#legal-error');function update(){button.disabled=!boxes.every(function(box){return box.checked})}boxes.forEach(function(box){box.onchange=update});update();button.onclick=function(){button.disabled=true;error.textContent='Сохраняю подтверждение…';fetch(host+'/api/account/legal-acceptances',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:identity.email,document_codes:boxes.map(function(box){return box.getAttribute('data-legal')})})}).then(function(response){return response.json().then(function(payload){if(!response.ok)throw new Error(payload.detail||'Не удалось сохранить подтверждение');return payload})}).then(function(payload){dashboard(payload,window.__accountOfferContext||{})}).catch(function(cause){error.textContent=String(cause.message||cause);update()})}}
  function dashboard(data,offerContext){window.__accountOfferContext=offerContext||{};var locked=data.state!=='ready'||Boolean(data.legal&&data.legal.required),purchasable=(offerContext&&offerContext.focusable_product_codes)||[];root.innerHTML='<main class="account-shell">'+accountHeader()+reviewBanner(data)+legalGate(data)+'<section class="account-section"><div class="account-section-head"><h2>Курсы и программы</h2></div><div class="account-grid '+(locked?'locked':'')+'">'+(data.courses||[]).map(function(item){return card(item,locked,purchasable)}).join('')+'</div></section><section class="account-section"><div class="account-section-head"><h2>Приложения</h2><p class="account-section-note">Чтобы худеть было проще.</p></div><div class="application-grid">'+(data.applications||[]).map(function(item){return applicationCard(item,locked)}).join('')+'</div></section>'+legacyPortal(data)+'</main>';bindLogout();bindLegal(data);Array.prototype.forEach.call(root.querySelectorAll('[data-app]'),function(button){button.onclick=function(){var app=button.getAttribute('data-app');if(!app||button.disabled)return;openAccountApp(app)}});Array.prototype.forEach.call(root.querySelectorAll('[data-offer-product]'),function(button){button.onclick=function(){var product=button.getAttribute('data-offer-product');if(!product||button.disabled)return;root.innerHTML='<div class="account-course" data-edabalans-app="masterclass-offers" data-edabalans-account-offer="true" data-edabalans-focus-product="'+esc(product)+'" data-edabalans-account-url="'+esc(accountBaseUrl())+'"></div>';window.EdabalansEmbed.load(root.firstElementChild)}})}
  function offerContext(data){if(data.state!=='ready')return Promise.resolve({});return fetch(host+'/api/masterclass/account-offers?email='+encodeURIComponent(identity.email)).then(function(response){return response.ok?response.json():{}}).catch(function(){return{}})}
  fetch(host+'/api/access/registration-seen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:identity.email})}).catch(function(){}).then(function(){return fetch(host+'/api/account?email='+encodeURIComponent(identity.email))}).then(function(response){return response.json().then(function(data){if(!response.ok)throw new Error(data.detail||'Не удалось загрузить кабинет');return data})}).then(function(data){if(openRequestedCourse(data))return;return offerContext(data).then(function(context){dashboard(data,context)})}).catch(function(error){root.innerHTML='<div class="account-error">Не удалось загрузить личный кабинет: '+esc(error.message||error)+'</div>'});
}());
</script>
