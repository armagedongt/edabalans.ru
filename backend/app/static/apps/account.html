<div id="account-app"></div>

<link rel="stylesheet" href="/assets/account-visual.css?v=20260921-compact-messengers">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:ital,wght@0,700;0,800;1,800&display=swap">
<link rel="stylesheet" href="/assets/account-theme.css?v=20260921-offers-ui">

<script src="/assets/course-product-popup.js?v=20260925"></script>
<script>
(function(){
  'use strict';
  var root=document.getElementById('account-app'),host=window.EdabalansAppHost||'https://edabalans.ru',identity=window.EdabalansIdentity||{};
  function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function orderedCourses(courses){
    function rank(item){return item.code==='masterclass'?0:item.ready?1:2}
    return (courses||[]).slice().sort(function(left,right){return rank(left)-rank(right)})
  }
  function accountBaseUrl(){var url=new URL(location.href);url.searchParams.delete('course_day');url.searchParams.delete('course_material');url.searchParams.delete('calories_stage');url.searchParams.delete('calories_material');url.hash='';return url.toString()}
  function plainAccountUrl(){var url=new URL(accountBaseUrl());url.searchParams.delete('open');return url.toString()}
  function accountHeader(){return '<header class="account-head"><p class="account-kicker">Похудение — это есть!</p><div class="account-title-row"><h1>Личный кабинет</h1><p class="account-session"><strong class="account-session-email">'+esc(identity.email)+'</strong><span aria-hidden="true"> · </span><a class="account-logout" href="/lk">Выйти</a></p></div><div id="account-messengers" class="account-messengers" hidden></div></header>'}
  function bindLogout(){var link=root.querySelector('.account-logout');if(!link)return;link.onclick=function(event){event.preventDefault();try{localStorage.removeItem('edabalans_identity_v1');localStorage.removeItem('dqs_email')}catch(error){}fetch(host+'/api/account-auth/logout',{method:'POST',credentials:'same-origin'}).finally(function(){location.assign('/lk')})}}
  function messengerRequest(path,options){return fetch(host+'/api/masterclass'+path,Object.assign({credentials:'same-origin',headers:{'Content-Type':'application/json'}},options||{})).then(function(response){return response.json().then(function(payload){if(!response.ok)throw new Error(typeof payload.detail==='string'?payload.detail:'Не удалось обновить мессенджеры');return payload})})}
  function messengerLine(summary){var parts=[];parts.push('Telegram: '+(summary.linked.telegram.linked?'подключён':'не подключён'));parts.push('MAX: '+(summary.linked.max.linked?'подключён':'не подключён'));if(summary.preferred_platform)parts.push('основной — '+(summary.preferred_platform==='telegram'?'Telegram':'MAX'));return parts.join(' · ')}
  function renderAccountMessengers(summary,editing,links){var panel=root.querySelector('#account-messengers');if(!panel)return;panel.hidden=false;if(!editing){panel.innerHTML='<button class="account-messengers-summary" type="button" data-messenger-edit aria-label="Открыть настройки подключённых мессенджеров"><span class="account-messengers-heading">Подключённые мессенджеры</span><span class="account-messengers-line">'+esc(messengerLine(summary))+'</span><span class="account-messengers-chevron" aria-hidden="true">›</span></button>';panel.querySelector('[data-messenger-edit]').onclick=function(){openAccountMessengerEditor(summary)};return}var actions=['telegram','max'].map(function(platform){var state=summary.linked[platform],label=platform==='telegram'?'Telegram':'MAX';if(state.linked)return '<span class="messenger-state connected">✓ '+label+(state.preferred?' — основной':'')+'</span>';return '<a class="messenger-connect" href="'+esc((links&&links[platform])||'#')+'">Подключить '+label+'</a>'}).join('');var preferred='';if(summary.linked.telegram.linked&&summary.linked.max.linked){preferred='<div class="messenger-preferred"><span>Основной:</span><button type="button" data-account-preferred="telegram" '+(summary.preferred_platform==='telegram'?'disabled':'')+'>Telegram</button><button type="button" data-account-preferred="max" '+(summary.preferred_platform==='max'?'disabled':'')+'>MAX</button></div>'}panel.innerHTML='<div class="messenger-editor"><div><strong>Подключённые мессенджеры</strong><span>'+esc(messengerLine(summary))+'</span></div><div class="messenger-actions">'+actions+'</div>'+preferred+'<p>Подключите минимум один. Если поменялся номер или аккаунт, напишите мне в личные сообщения.</p><button type="button" data-messenger-close>Готово</button></div>';panel.querySelector('[data-messenger-close]').onclick=function(){loadAccountMessengerState(false)};Array.prototype.forEach.call(panel.querySelectorAll('[data-account-preferred]'),function(button){button.onclick=function(){button.disabled=true;messengerRequest('/messengers/preferred',{method:'POST',body:JSON.stringify({email:identity.email,platform:button.getAttribute('data-account-preferred')})}).then(function(next){renderAccountMessengers(next,true,links)}).catch(function(error){button.disabled=false;window.alert(error.message)})}})}
  function openAccountMessengerEditor(summary){var missing=['telegram','max'].filter(function(platform){return !summary.linked[platform].linked});Promise.all(missing.map(function(platform){return messengerRequest('/messenger-links',{method:'POST',body:JSON.stringify({email:identity.email,platform:platform})})})).then(function(rows){var links={};rows.forEach(function(row){links[row.platform]=row.deep_link});renderAccountMessengers(summary,true,links)}).catch(function(error){window.alert(error.message)})}
  function loadAccountMessengerState(editing){return messengerRequest('/messengers?email='+encodeURIComponent(identity.email)).then(function(summary){renderAccountMessengers(summary,Boolean(editing),{})}).catch(function(){var panel=root.querySelector('#account-messengers');if(panel)panel.hidden=true})}
  function loadAccountMessengers(data){var owns=(data.courses||[]).some(function(item){return item.code==='masterclass'&&item.owned});if(owns&&data.state==='ready')loadAccountMessengerState(false)}
  root.addEventListener('click',function(event){var button=event.target.closest('[data-dqs-send]');if(!button||button.disabled)return;event.preventDefault();var platform=button.getAttribute('data-dqs-send'),status=button.closest('.application-actions').querySelector('.application-resend-status');button.disabled=true;status.textContent='Готовлю отправку…';fetch(host+'/api/masterclass/dqs/send-link',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:identity.email,platform:platform})}).then(function(response){return response.json().then(function(payload){if(!response.ok){var detail=payload.detail||{};throw new Error(detail.reason==='retry_later'?'Повторите через минуту':(typeof detail==='string'?detail:'Не удалось отправить ссылку'))}return payload})}).then(function(payload){if(payload.deep_link){status.textContent='Откройте бота и нажмите Старт';location.assign(payload.deep_link);return}status.textContent='Ссылка поставлена в отправку в '+(platform==='telegram'?'Telegram':'MAX')}).catch(function(error){button.disabled=false;status.textContent=String(error.message||error)})});
  function requestedCourseApp(){var params=new URL(location.href).searchParams;if(params.has('recipes_section')||params.has('recipes_material'))return'recipes-course';if(params.has('calories_stage')||params.has('calories_material'))return'calories-course';if(params.has('course_day')||params.has('course_material'))return'masterclass-course';return''}
  function requestedResourceTarget(){return String(new URL(location.href).searchParams.get('open')||'').trim()}
  var nestedLoad;
  function openAccountApp(app){root.innerHTML='<div class="account-course" data-edabalans-app="'+esc(app)+'" data-edabalans-account-url="'+esc(accountBaseUrl())+'"></div>';nestedLoad=window.EdabalansEmbed.load(root.firstElementChild);return nestedLoad}
  function openRequestedCourse(data){var app=requestedCourseApp();if(!app||data.state!=='ready'||(data.legal&&data.legal.required))return false;var available=(data.courses||[]).some(function(item){return item.app===app&&item.owned&&item.ready});if(!available)return false;openAccountApp(app);return true}
  function resourceGate(result){var action=result.action_app?'<button class="account-open available" data-resource-action="'+esc(result.action_app)+'">'+esc(result.action_label||'Продолжить')+'</button>':'';root.innerHTML='<main class="account-shell">'+accountHeader()+'<section class="account-review"><h2>'+esc(result.title||'Материал пока недоступен')+'</h2><p>'+esc(result.explanation||'Этот материал пока нельзя открыть.')+'</p>'+action+'<p><a href="'+esc(plainAccountUrl())+'">Вернуться в личный кабинет</a></p></section></main>';bindLogout();var button=root.querySelector('[data-resource-action]');if(button)button.onclick=function(){var url=new URL(plainAccountUrl());history.replaceState({},'',url.pathname+url.search+url.hash);openAccountApp(button.getAttribute('data-resource-action'))}}
  function openRequestedResource(data){var target=requestedResourceTarget();if(!target||data.state!=='ready'||(data.legal&&data.legal.required))return Promise.resolve(false);return fetch(host+'/api/account/resource-link?target='+encodeURIComponent(target),{credentials:'same-origin'}).then(function(response){return response.json().then(function(payload){if(!response.ok)throw new Error(payload.detail||'Не удалось открыть материал');return payload})}).then(function(result){if(result.action==='open'){var url=new URL(location.href);url.searchParams.delete('open');Object.keys(result.params||{}).forEach(function(key){url.searchParams.set(key,String(result.params[key]))});history.replaceState({},'',url.pathname+url.search+url.hash);openAccountApp(result.app);return true}if(result.action==='offer'){root.innerHTML='<div class="account-course" data-edabalans-app="masterclass-offers" data-edabalans-account-offer="true" data-edabalans-public-masterclass="'+(result.public_masterclass?'true':'false')+'" data-edabalans-focus-product="'+esc(result.product_code)+'" data-edabalans-account-url="'+esc(plainAccountUrl())+'" data-edabalans-purchase-return-url="'+esc(location.href)+'"></div>';window.EdabalansEmbed.load(root.firstElementChild);return true}resourceGate(result);return true}).catch(function(error){resourceGate({title:'Не удалось открыть материал',explanation:String(error.message||error)});return true})}
  function reviewBanner(data){if(data.state!=='review_required')return'';return '<section class="account-review"><h2>Пока доступы не подключены</h2><p>'+esc(data.message)+' После проверки эта же страница обновится — повторно регистрироваться не потребуется.</p><div class="account-contact"><a href="https://t.me/FitnessSergey" target="_blank" rel="noopener">Написать в Telegram</a><a href="https://max.ru/u/f9LHodD0cOJjmbADdxMaO0UzEfR_55NRvOSwSuS3C6mWE5T27DPcpczbvEw" target="_blank" rel="noopener">Написать в MAX</a></div></section>'}
  function card(item,locked,purchasable){
    var canOpen=Boolean(item.app)&&!locked&&!item.maintenance,canBuy=!item.owned&&!locked&&!item.maintenance&&purchasable.indexOf(item.product_code)>=0;
    var publicTariffs=!item.owned&&!locked&&!item.maintenance&&item.purchase_mode==='public_masterclass_tariffs';
    var label=item.state==='masterclass_locked'?'После мастер-класса':item.maintenance?'На ремонте':item.ready?(item.owned?'Доступ открыт':'Доступ закрыт'):'Скоро';
    var cls=item.maintenance?'preparing':item.owned?(item.ready?'owned':'preparing'):!item.ready?'preparing':'';
    var cardCls=canOpen?' available-card':canBuy&&item.product_code==='consultation'?' featured':'';
    var tariff=item.tariff?' <span class="account-tariff-inline">('+esc(item.tariff)+')</span>':'';
    var action=canOpen?'<button class="account-open available" data-app="'+esc(item.app)+'">Открыть</button>':canBuy?'<button class="account-open purchase" data-offer-product="'+esc(item.product_code)+'">Купить</button>':publicTariffs?'<button class="account-open purchase" data-offer-product="masterclass" data-public-masterclass="true">Приобрести</button>':'<button class="account-open" disabled>'+esc(item.state==='masterclass_locked'?'После мастер-класса':item.maintenance?'На ремонте':locked?'Доступ закрыт':item.ready?'Доступ закрыт':'Скоро')+'</button>';
    return '<article class="account-card'+cardCls+'"><div><span class="account-state '+cls+'">'+esc(label)+'</span><h3>'+esc(item.title)+tariff+'</h3><p>'+esc(item.summary)+'</p></div>'+action+'</article>';
  }
  function applicationIcon(code){var icons={dqs:'<path d="M6 5.5h12M6 12h12M6 18.5h12"/><circle cx="4" cy="5.5" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18.5" r="1"/>',strength:'<path d="M3 9v6m3-8v10m12-10v10m3-8v6M6 12h12"/>',recipes:'<path d="M5 10h14v2a7 7 0 0 1-14 0v-2Z"/><path d="M8 6c0-1 1-1.5 1-2.5M12 6c0-1 1-1.5 1-2.5M16 6c0-1 1-1.5 1-2.5M7 20h10"/>',metabolism:'<path d="M13.5 3.5c.7 3-1.6 4.2-2.6 6.2-.8 1.6-.2 3.1 1.1 4.1-.1-2 1.3-3 2.8-4.4 1.5 1.6 2.2 3.4 2.2 5.2A5 5 0 0 1 7 14c0-3.5 2.1-6.3 6.5-10.5Z"/>'};return '<span class="application-icon application-icon-'+esc(code)+'" aria-hidden="true"><svg viewBox="0 0 24 24">'+(icons[code]||icons.dqs)+'</svg></span>'}
  function applicationCard(item,locked){var canOpen=Boolean(item.app)&&item.ready&&!locked&&!item.maintenance,canContinue=item.state==='entitled_locked'&&!locked&&Boolean(item.action_app),label=item.state==='masterclass_locked'?'После мастер-класса':item.state==='entitled_locked'?'Откроется в Мастер-классе':item.maintenance?'На ремонте':item.ready?(item.owned?'Открыть':'Доступ закрыт'):'Скоро',primary=canOpen?'<button class="account-open available" data-app="'+esc(item.app)+'">'+esc(item.action_label||'Открыть')+'</button>':canContinue?'<button class="account-open available" data-app="'+esc(item.action_app)+'">'+esc(item.action_label||'Продолжить Мастер-класс')+'</button>':'<button class="account-open" disabled>'+esc(label)+'</button>',resend=item.code==='dqs'&&item.can_resend_link?'<div class="application-send-links"><span>Отправить ссылку:</span><button type="button" class="application-resend" data-dqs-send="telegram">в Telegram</button><button type="button" class="application-resend" data-dqs-send="max">в MAX</button></div><span class="application-resend-status" aria-live="polite"></span>':'',action='<div class="application-actions">'+primary+resend+'</div>';return '<article class="application-card">'+applicationIcon(item.code)+'<div><h3>'+esc(item.title)+'</h3><p>'+esc(item.summary)+'</p></div>'+action+'</article>'}
  function legacyPortal(data){return ''}
  function legalSummary(value){return String(value||'').split(/\n\s*\n/).map(function(paragraph){return '<span class="legal-paragraph">'+esc(paragraph)+'</span>'}).join('')}
  function legalGate(data){if(data.state!=='ready'||!data.legal||!data.legal.required)return'';return '<section class="account-legal"><p>Чтобы пользоваться личным кабинетом, прочитайте дисклеймер и политику обработки персональных данных.</p><div class="legal-grid">'+data.legal.documents.map(function(item){return '<label class="legal-card"><input type="checkbox" data-legal="'+esc(item.code)+'" '+(item.accepted?'checked disabled':'')+'><span class="legal-copy"><strong>'+esc(item.title)+'</strong>'+legalSummary(item.summary)+'<a href="'+esc('https://похудение-это-есть.рф'+item.url)+'" target="_blank" rel="noopener">Читать полностью ↗</a></span></label>'}).join('')+'</div><div class="legal-actions"><button class="legal-action" id="accept-legal" disabled>Принять и продолжить</button><p class="legal-error" id="legal-error"></p></div></section>'}
  function bindLegal(data){var button=root.querySelector('#accept-legal');if(!button)return;var boxes=Array.prototype.slice.call(root.querySelectorAll('[data-legal]')),error=root.querySelector('#legal-error');function update(){button.disabled=!boxes.every(function(box){return box.checked})}boxes.forEach(function(box){box.onchange=update});update();button.onclick=function(){button.disabled=true;error.textContent='Сохраняю подтверждение…';fetch(host+'/api/account-auth/legal-acceptances',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({document_codes:boxes.map(function(box){return box.getAttribute('data-legal')})})}).then(function(response){return response.json().then(function(payload){if(!response.ok)throw new Error(payload.detail||'Не удалось сохранить подтверждение');return payload})}).then(function(payload){dashboard(payload,window.__accountOfferContext||{})}).catch(function(cause){error.textContent=String(cause.message||cause);update()})}}
  function dashboard(data,offerContext){window.__accountOfferContext=offerContext||{};var locked=data.state!=='ready'||Boolean(data.legal&&data.legal.required),purchasable=(offerContext&&offerContext.focusable_product_codes)||[];root.innerHTML='<main class="account-shell">'+accountHeader()+reviewBanner(data)+legalGate(data)+'<section class="account-section"><div class="account-section-head"><h2>Курсы и программы</h2></div><div class="account-grid '+(locked?'locked':'')+'">'+orderedCourses(data.courses).map(function(item){return card(item,locked,purchasable)}).join('')+'</div></section><section class="account-section"><div class="account-section-head"><h2>Приложения</h2></div><div class="application-grid">'+(data.applications||[]).map(function(item){return applicationCard(item,locked)}).join('')+'</div></section>'+legacyPortal(data)+'</main>';bindLogout();bindLegal(data);Array.prototype.forEach.call(root.querySelectorAll('[data-app]'),function(button){button.onclick=function(){var app=button.getAttribute('data-app');if(!app||button.disabled)return;openAccountApp(app)}});Array.prototype.forEach.call(root.querySelectorAll('[data-dqs-resend]'),function(button){button.onclick=function(){var status=button.parentNode.querySelector('.application-resend-status');button.disabled=true;status.textContent='Отправляю…';fetch(host+'/api/masterclass/dqs/link-to-telegram',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:identity.email})}).then(function(response){return response.json().then(function(payload){if(!response.ok){var detail=payload.detail||{};throw new Error(detail.reason==='telegram_not_linked'?'Сначала подключите Telegram в Мастер-классе':(typeof detail==='string'?detail:'Не удалось отправить ссылку'))}return payload})}).then(function(){status.textContent='Ссылка отправлена в Telegram'}).catch(function(error){button.disabled=false;status.textContent=String(error.message||error)})}});Array.prototype.forEach.call(root.querySelectorAll('[data-offer-product]'),function(button){button.onclick=function(){var product=button.getAttribute('data-offer-product'),publicMasterclass=button.getAttribute('data-public-masterclass')==='true';if(!product||button.disabled)return;root.innerHTML='<div class="account-course" data-edabalans-app="masterclass-offers" data-edabalans-account-offer="true" data-edabalans-public-masterclass="'+(publicMasterclass?'true':'false')+'" data-edabalans-focus-product="'+esc(product)+'" data-edabalans-account-url="'+esc(accountBaseUrl())+'"></div>';window.EdabalansEmbed.load(root.firstElementChild)}})}
  function offerContext(data){var ownsMasterclass=(data.courses||[]).some(function(item){return item.code==='masterclass'&&item.owned});if(data.state!=='ready'||!ownsMasterclass)return Promise.resolve({});return fetch(host+'/api/masterclass/account-offers?email='+encodeURIComponent(identity.email)).then(function(response){return response.ok?response.json():{}}).catch(function(){return{}})}
  var initialAccount=window.EdabalansAccountPayload;window.EdabalansAccountPayload=null;
  var accountRequest=initialAccount&&initialAccount.email===identity.email?Promise.resolve(initialAccount):fetch(host+'/api/account-auth/account',{credentials:'same-origin'}).then(function(response){return response.json().then(function(data){if(!response.ok)throw new Error(data.detail||'Не удалось загрузить кабинет');return data})});
  function refreshOffers(data,context){
    var grid=root.querySelector('.account-grid');
    if(!grid||!grid.isConnected)return;
    window.__accountOfferContext=context||{};
    var purchasable=(context&&context.focusable_product_codes)||[],locked=data.state!=='ready'||Boolean(data.legal&&data.legal.required);
    orderedCourses(data.courses).forEach(function(item,index){
      var canBuy=!item.owned&&!locked&&!item.maintenance&&purchasable.indexOf(item.product_code)>=0;
      if(!canBuy)return;
      var cardElement=grid.children[index],button=cardElement&&cardElement.querySelector('.account-open');
      if(!button)return;
      if(item.product_code==='consultation')cardElement.classList.add('featured');
      button.disabled=false;button.className='account-open purchase';button.textContent='Купить';
      button.setAttribute('data-offer-product',item.product_code);
      button.onclick=function(){root.innerHTML='<div class="account-course" data-edabalans-app="masterclass-offers" data-edabalans-account-offer="true" data-edabalans-focus-product="'+esc(item.product_code)+'" data-edabalans-account-url="'+esc(accountBaseUrl())+'"></div>';window.EdabalansEmbed.load(root.firstElementChild)};
    });
  }
  var accountReady=accountRequest.then(function(data){
    return openRequestedResource(data).then(function(opened){if(opened)return nestedLoad;if(openRequestedCourse(data))return nestedLoad;dashboard(data,{});loadAccountMessengers(data);offerContext(data).then(function(context){refreshOffers(data,context);var buy=new URL(location.href).searchParams.get('buy');if(buy)Array.prototype.some.call(root.querySelectorAll('[data-offer-product]'),function(button){if(button.getAttribute('data-offer-product')===buy&&!button.disabled){button.click();return true}return false})});var product=new URL(location.href).searchParams.get('product');if(product)window.EdabalansProductPopup.show(product);return null});
  });
  window.EdabalansEmbed.waitUntilReady(root,accountReady);
}());
</script>
