<div id="account-app"></div>
<style>
  #account-app{--ink:#25241f;--muted:#716e67;--paper:#f5f0e7;--card:#fffdf8;--line:#ddd4c5;--accent:#dc6748;box-sizing:border-box;min-height:100vh;margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Inter,Arial,sans-serif}
  #account-app *{box-sizing:border-box}.account-shell{width:min(1080px,100%);margin:auto;padding:42px 24px 80px}.account-kicker{margin:0 0 9px;color:var(--accent);font-size:12px;font-weight:850;letter-spacing:.11em;text-transform:uppercase}.account-head h1{max-width:700px;margin:0;font-size:clamp(38px,7vw,68px);line-height:.98;letter-spacing:-.045em}.account-lead{max-width:680px;margin:18px 0 34px;color:var(--muted);font-size:18px}.account-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.account-card{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;min-height:150px;padding:22px;border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:0 12px 35px #50351b0d}.account-card h2{margin:0;font-size:23px;letter-spacing:-.025em}.account-card p{margin:8px 0 0;color:var(--muted)}.account-state{display:inline-block;margin-top:14px;padding:5px 9px;border-radius:999px;background:#eee7dd;color:#6d665d;font-size:11px;font-weight:850}.account-state.available{background:#e5f0e9;color:#315c43}.account-state.preparing{background:#fff0d6;color:#7c5716}.account-open{min-width:126px;border:0;border-radius:14px;padding:13px 17px;background:var(--ink);color:#fff;font-weight:850;cursor:pointer}.account-open:disabled{background:#ded9cf;color:#858078;cursor:default}.account-review{max-width:680px;padding:25px;border:1px solid #e3a38f;border-radius:24px;background:#fff5ef}.account-review h1{margin:0 0 12px;font-size:clamp(30px,6vw,48px);line-height:1}.account-review p{color:#684c43;font-size:17px}.account-contact{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.account-contact a{border-radius:13px;padding:12px 16px;background:var(--ink);color:#fff;text-decoration:none;font-weight:800}.account-course{min-height:100vh}.account-error{padding:28px;color:#9b3725}.tlk-userbar,.tlk-userbar__popup,.tlk-userbar__user-icon,.t-userbar,[class^="tlk-userbar"],[class*=" tlk-userbar"]{display:none!important}
  @media(max-width:700px){.account-shell{padding:28px 16px 65px}.account-grid{grid-template-columns:1fr}.account-card{grid-template-columns:1fr;min-height:0}.account-open{width:100%}.account-lead{font-size:16px}}
</style>
<script>
(function(){
  'use strict';
  var root=document.getElementById('account-app'),host=window.EdabalansAppHost||'https://app.edabalans.ru',identity=window.EdabalansIdentity||{};
  function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function review(data){root.innerHTML='<main class="account-shell"><section class="account-review"><p class="account-kicker">Личный кабинет</p><h1>Нужно уточнить доступ</h1><p>'+esc(data.message)+'</p><p><b>'+esc(identity.email)+'</b></p><div class="account-contact"><a href="https://t.me/FitnessSergey" target="_blank" rel="noopener">Написать в Telegram</a><a href="https://max.ru/u/f9LHodD0cOJjmbADdxMaO0UzEfR_55NRvOSwSuS3C6mWE5T27DPcpczbvEw" target="_blank" rel="noopener">Написать в MAX</a></div></section></main>'}
  function card(item){var label=item.state==='available'?'Доступно':item.state==='preparing'?'Куплено · раздел готовится':'Пока недоступно',cls=item.state==='available'?'available':item.state==='preparing'?'preparing':'';return '<article class="account-card"><div><h2>'+esc(item.title)+'</h2><p>'+esc(item.summary)+'</p><span class="account-state '+cls+'">'+esc(label)+'</span></div><button class="account-open" data-app="'+esc(item.app)+'" '+(item.app?'':'disabled')+'>'+esc(item.app?'Открыть':'Скоро')+'</button></article>'}
  function dashboard(data){root.innerHTML='<main class="account-shell"><header class="account-head"><p class="account-kicker">Похудение — это есть!</p><h1>Личный кабинет</h1><p class="account-lead">Все ваши программы находятся здесь. Tilda отвечает только за вход, а покупки, доступы и прогресс проверяет сервер.</p></header><section class="account-grid">'+data.courses.map(card).join('')+'</section></main>';Array.prototype.forEach.call(root.querySelectorAll('[data-app]'),function(button){button.onclick=function(){var app=button.getAttribute('data-app');if(!app)return;root.innerHTML='<div class="account-course" data-edabalans-app="'+esc(app)+'" data-edabalans-account-url="'+esc(location.href.split('#')[0])+'"></div>';window.EdabalansEmbed.load(root.firstElementChild)}})}
  fetch(host+'/api/access/registration-seen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:identity.email})}).catch(function(){}).then(function(){return fetch(host+'/api/account?email='+encodeURIComponent(identity.email))}).then(function(response){return response.json().then(function(data){if(!response.ok)throw new Error(data.detail||'Не удалось загрузить кабинет');return data})}).then(function(data){data.state==='review_required'?review(data):dashboard(data)}).catch(function(error){root.innerHTML='<div class="account-error">Не удалось загрузить личный кабинет: '+esc(error.message||error)+'</div>'});
}());
</script>
