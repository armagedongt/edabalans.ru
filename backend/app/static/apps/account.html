<div id="account-app"></div>
<style>
  #account-app{--ink:#25241f;--muted:#716e67;--paper:#f5f0e7;--card:#fffdf8;--line:#ddd4c5;--accent:#dc6748;box-sizing:border-box;min-height:100vh;margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Inter,Arial,sans-serif}
  #account-app *{box-sizing:border-box}.account-shell{width:min(1080px,100%);margin:auto;padding:42px 24px 80px}.account-kicker{margin:0 0 9px;color:var(--accent);font-size:12px;font-weight:850;letter-spacing:.11em;text-transform:uppercase}.account-head h1{max-width:700px;margin:0;font-size:clamp(38px,7vw,68px);line-height:.98;letter-spacing:-.045em}.account-lead{max-width:720px;margin:18px 0 32px;color:var(--muted);font-size:18px}.account-legal{margin:0 0 20px;padding:28px 24px 24px;border:1px solid #e3a38f;border-radius:24px;background:#fff5ef}.account-legal h2{margin:0;text-align:center;font-size:clamp(25px,4vw,34px);line-height:1.05;letter-spacing:-.03em}.account-legal>p{max-width:720px;margin:11px auto 21px;color:#684c43;text-align:center;font-size:16px}.legal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.legal-card{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:19px;border:1px solid #ead4ca;border-radius:16px;background:#fffdf9}.legal-card input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent)}.legal-copy>strong,.legal-copy>span{display:block}.legal-copy>strong{font-size:17px;line-height:1.3}.legal-copy>span{margin-top:7px;color:var(--muted);font-size:15px;line-height:1.5}.legal-card a{display:inline-block;margin-top:11px;color:#94412d;font-size:15px;font-weight:800}.legal-actions{text-align:center}.legal-action{margin-top:18px;border:0;border-radius:14px;padding:14px 22px;background:var(--ink);color:#fff;font-size:15px;font-weight:850;cursor:pointer}.legal-action:disabled{background:#d8d1c7;color:#817b73;cursor:default}.legal-error{margin:10px 0 0!important;color:#9b3725!important;text-align:center;font-size:14px}.account-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.account-grid.locked{opacity:.58}.account-card{display:grid;grid-template-rows:1fr auto;min-height:230px;padding:22px;border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:0 12px 35px #50351b0d}.account-card h2{margin:12px 0 0;font-size:23px;line-height:1.12;letter-spacing:-.025em}.account-card p{margin:9px 0 0;color:var(--muted)}.account-state{display:inline-block;width:max-content;padding:8px 12px;border-radius:999px;background:#eee7dd;color:#6d665d;font-size:12px;font-weight:800;line-height:1}.account-state.owned{background:#e5f0e9;color:#315c43}.account-state.closed{background:#eef0f4;color:#59616e}.account-state.preparing{background:#fff0d6;color:#7c5716}.account-open{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:20px;border:0;border-radius:14px;padding:12px 17px;background:var(--ink);color:#fff;font-size:14px;font-weight:800;cursor:pointer}.account-open.purchase{background:var(--accent)}.account-open:disabled{background:#ded9cf;color:#858078;cursor:default}.account-review{max-width:680px;padding:25px;border:1px solid #e3a38f;border-radius:24px;background:#fff5ef}.account-review h1{margin:0 0 12px;font-size:clamp(30px,6vw,48px);line-height:1}.account-review p{color:#684c43;font-size:17px}.account-contact{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.account-contact a{border-radius:13px;padding:12px 16px;background:var(--ink);color:#fff;text-decoration:none;font-weight:800}.account-course{min-height:100vh}.account-error{padding:28px;color:#9b3725}.tlk-userbar,.tlk-userbar__popup,.tlk-userbar__user-icon,.t-userbar,[class^="tlk-userbar"],[class*=" tlk-userbar"]{display:none!important}
  @media(max-width:700px){.account-shell{padding:28px 16px 65px}.account-grid,.legal-grid{grid-template-columns:1fr}.account-card{min-height:0}.account-lead{font-size:16px}.account-legal{padding:19px 16px}}
</style>
<script>
(function(){
  'use strict';
  var root=document.getElementById('account-app'),host=window.EdabalansAppHost||'https://app.edabalans.ru',identity=window.EdabalansIdentity||{};
  function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function review(data){root.innerHTML='<main class="account-shell"><section class="account-review"><p class="account-kicker">Личный кабинет</p><h1>Нужно уточнить доступ</h1><p>'+esc(data.message)+'</p><p><b>'+esc(identity.email)+'</b></p><div class="account-contact"><a href="https://t.me/FitnessSergey" target="_blank" rel="noopener">Написать в Telegram</a><a href="https://max.ru/u/f9LHodD0cOJjmbADdxMaO0UzEfR_55NRvOSwSuS3C6mWE5T27DPcpczbvEw" target="_blank" rel="noopener">Написать в MAX</a></div></section></main>'}
  function card(item,locked,purchasable){var canOpen=Boolean(item.app)&&!locked,canBuy=!item.owned&&!locked&&purchasable.indexOf(item.product_code)>=0,label=item.owned?(item.ready?'Куплен':'Куплен, пока закрыт'):item.catalog_status==='planned'?'В разработке':'Недоступен',cls=item.owned?(item.ready?'owned':'closed'):item.catalog_status==='planned'?'preparing':'';var tariff=item.tariff?'<p><strong>Ваш тариф: '+esc(item.tariff)+'</strong></p>':'',action=canOpen?'<button class="account-open" data-app="'+esc(item.app)+'">Открыть</button>':canBuy?'<button class="account-open purchase" data-offer-product="'+esc(item.product_code)+'">Посмотреть варианты</button>':'<button class="account-open" disabled>'+esc(locked?'Сначала подтвердите документы':item.owned?'Программа готовится к открытию':item.catalog_status==='planned'?'Раздел ещё в разработке':'Пока недоступно для покупки')+'</button>';return '<article class="account-card"><div><span class="account-state '+cls+'">'+esc(label)+'</span><h2>'+esc(item.title)+'</h2>'+tariff+'<p>'+esc(item.summary)+'</p></div>'+action+'</article>'}
  function legalGate(data){if(!data.legal||!data.legal.required)return'';return '<section class="account-legal"><h2>Пара важных вещей</h2><p>Прочитайте короткие пояснения и отметьте обе галочки. Полные тексты можно открыть по ссылкам в карточках.</p><div class="legal-grid">'+data.legal.documents.map(function(item){return '<label class="legal-card"><input type="checkbox" data-legal="'+esc(item.code)+'" '+(item.accepted?'checked disabled':'')+'><span class="legal-copy"><strong>'+esc(item.title)+'</strong><span>'+esc(item.summary)+'</span><a href="'+esc(host+item.url)+'" target="_blank" rel="noopener">Читать полностью ↗</a></span></label>'}).join('')+'</div><div class="legal-actions"><button class="legal-action" id="accept-legal" disabled>Принимаю и продолжаю</button><p class="legal-error" id="legal-error"></p></div></section>'}
  function bindLegal(data){var button=root.querySelector('#accept-legal');if(!button)return;var boxes=Array.prototype.slice.call(root.querySelectorAll('[data-legal]')),error=root.querySelector('#legal-error');function update(){button.disabled=!boxes.every(function(box){return box.checked})}boxes.forEach(function(box){box.onchange=update});update();button.onclick=function(){button.disabled=true;error.textContent='Сохраняю подтверждение…';fetch(host+'/api/account/legal-acceptances',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:identity.email,document_codes:data.legal.documents.map(function(item){return item.code})})}).then(function(response){return response.json().then(function(payload){if(!response.ok)throw new Error(payload.detail||'Не удалось сохранить подтверждение');return payload})}).then(dashboard).catch(function(failure){error.textContent=String(failure.message||failure);update()})}}
  function dashboard(data,offerContext){var locked=Boolean(data.legal&&data.legal.required),purchasable=(offerContext&&offerContext.focusable_product_codes)||[];root.innerHTML='<main class="account-shell"><header class="account-head"><p class="account-kicker">Похудение — это есть!</p><h1>Личный кабинет</h1><p class="account-lead">Здесь собраны ваши приобретённые курсы и программы, доступные для покупки.</p></header>'+legalGate(data)+'<section class="account-grid '+(locked?'locked':'')+'">'+data.courses.map(function(item){return card(item,locked,purchasable)}).join('')+'</section></main>';bindLegal(data);Array.prototype.forEach.call(root.querySelectorAll('[data-app]'),function(button){button.onclick=function(){var app=button.getAttribute('data-app');if(!app||button.disabled)return;root.innerHTML='<div class="account-course" data-edabalans-app="'+esc(app)+'" data-edabalans-account-url="'+esc(location.href.split('#')[0])+'"></div>';window.EdabalansEmbed.load(root.firstElementChild)}});Array.prototype.forEach.call(root.querySelectorAll('[data-offer-product]'),function(button){button.onclick=function(){var product=button.getAttribute('data-offer-product');if(!product||button.disabled)return;root.innerHTML='<div class="account-course" data-edabalans-app="masterclass-offers" data-edabalans-account-offer="true" data-edabalans-focus-product="'+esc(product)+'" data-edabalans-account-url="'+esc(location.href.split('#')[0])+'"></div>';window.EdabalansEmbed.load(root.firstElementChild)}})}
  function offerContext(data){if(data.state!=='ready'||(data.legal&&data.legal.required))return Promise.resolve({focusable_product_codes:[]});return fetch(host+'/api/masterclass/account-offers?email='+encodeURIComponent(identity.email)).then(function(response){return response.ok?response.json():{focusable_product_codes:[]}}).catch(function(){return {focusable_product_codes:[]}})}
  fetch(host+'/api/access/registration-seen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:identity.email})}).catch(function(){}).then(function(){return fetch(host+'/api/account?email='+encodeURIComponent(identity.email))}).then(function(response){return response.json().then(function(data){if(!response.ok)throw new Error(data.detail||'Не удалось загрузить кабинет');return data})}).then(function(data){if(data.state==='review_required'){review(data);return;}return offerContext(data).then(function(context){dashboard(data,context)})}).catch(function(error){root.innerHTML='<div class="account-error">Не удалось загрузить личный кабинет: '+esc(error.message||error)+'</div>'});
}());
</script>
