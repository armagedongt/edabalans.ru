<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Личный кабинет · Похудение — это есть!</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Manrope,Inter,Arial,sans-serif;color:#173f70;background:#7b8da0}
    .auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,rgba(19,54,88,.24),rgba(65,88,113,.58))}.auth-card{width:min(100%,370px);padding:27px 25px 25px;border:1px solid rgba(255,255,255,.78);border-radius:21px;background:#fff;box-shadow:0 21px 48px rgba(12,37,61,.25)}
    .auth-kicker{margin:0 0 9px;color:#239fe9;font-size:12px;font-weight:850;letter-spacing:.07em;text-transform:uppercase}.auth-card h1{margin:0;color:#173f70;font-size:26px;line-height:1.15;letter-spacing:-.035em}.auth-lead{margin:8px 0 21px;color:#647b91;font-size:14px;line-height:1.45}.auth-field{display:block;margin-top:14px;color:#173f70;font-size:12px;font-weight:850}.auth-field input{display:block;width:100%;height:48px;margin-top:7px;padding:0 14px;border:1px solid #cbd9e5;border-radius:11px;background:#fff;color:#173f70;font:600 16px Manrope,Inter,Arial,sans-serif}.auth-field input::placeholder{color:#91a2b1}.auth-field input:focus{outline:0;border-color:#239fe9;box-shadow:0 0 0 3px rgba(35,159,233,.2)}.auth-submit{width:100%;min-height:46px;margin-top:19px;border:0;border-radius:13px;background:#ff682e;color:#fff;font:850 15px Manrope,Inter,Arial,sans-serif;cursor:pointer;box-shadow:0 12px 24px rgba(255,104,46,.24)}.auth-submit:hover,.auth-submit:focus-visible{background:#f05b24;transform:translateY(-1px)}.auth-submit:focus-visible{outline:3px solid rgba(35,159,233,.34)}.auth-submit:disabled{opacity:.65;cursor:wait;transform:none}.auth-error{min-height:20px;margin:11px 0 0;color:#b2452c;font-size:12px;text-align:center}.auth-help{margin:14px 0 0;color:#6d8294;font-size:12px;line-height:1.45;text-align:center}.auth-help+.auth-help{margin-top:8px}.auth-help a{color:#176ba3;font-weight:850}.loading{padding:40px;color:#fff;text-align:center}
    @media(max-width:520px){.auth-shell{padding:14px}.auth-card{padding:25px 20px 22px}.auth-card h1{font-size:25px}}
  </style>
</head>
<body>
  <main id="portal"><div class="loading">Проверяю вход…</div></main>
  <script src="/embed.js"></script>
  <script>
  (function(){
    'use strict';
    var portal=document.getElementById('portal');
    function esc(value){return String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    function login(){
      portal.innerHTML='<section class="auth-shell"><form class="auth-card" id="login-form"><p class="auth-kicker">Похудение — это есть!</p><h1>Личный кабинет</h1><p class="auth-lead">Введите электронную почту, указанную при покупке, и пароль из сообщения бота.</p><label class="auth-field">Электронная почта<input name="email" type="email" autocomplete="username" required placeholder="primer@pochta.ru"></label><label class="auth-field">Пароль<input name="password" type="password" autocomplete="current-password" required minlength="8"></label><button class="auth-submit" type="submit">Войти</button><p class="auth-error" aria-live="polite"></p><p class="auth-help">Нет личного кабинета? <a href="/lk?mode=register">Зарегистрироваться</a></p><p class="auth-help">Не получается войти? <a href="https://t.me/FitnessSergey" target="_blank" rel="noopener">Напишите мне</a></p></form></section>';
      var form=document.getElementById('login-form'),button=form.querySelector('button'),error=form.querySelector('.auth-error');
      form.onsubmit=function(event){event.preventDefault();button.disabled=true;error.textContent='Проверяю…';fetch('/api/account-auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.email.value,password:form.password.value})}).then(function(response){return response.json().then(function(payload){if(!response.ok)throw new Error(payload.detail||'Не удалось войти');return payload})}).then(openAccount).catch(function(cause){error.textContent=String(cause.message||cause);button.disabled=false})};
    }
    function register(){
      portal.innerHTML='<section class="auth-shell"><form class="auth-card" id="register-form"><p class="auth-kicker">Похудение — это есть!</p><h1>Создайте личный кабинет</h1><p class="auth-lead">Укажите электронную почту. На неё придёт письмо с выбором Telegram или MAX. В мессенджере вы получите логин и пароль.</p><label class="auth-field">Электронная почта<input name="email" type="email" autocomplete="email" required placeholder="primer@pochta.ru"></label><button class="auth-submit" type="submit">Зарегистрироваться</button><p class="auth-error" aria-live="polite"></p><p class="auth-help">Материалы появятся в кабинете после покупки.</p><p class="auth-help">Уже есть логин и пароль? <a href="/lk">Войти</a></p></form></section>';
      var form=document.getElementById('register-form'),button=form.querySelector('button'),error=form.querySelector('.auth-error');
      form.onsubmit=function(event){event.preventDefault();button.disabled=true;error.textContent='Отправляю письмо…';fetch('/api/account-auth/register',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.email.value})}).then(function(response){return response.json().then(function(payload){if(!response.ok)throw new Error(payload.detail||'Не удалось начать регистрацию');return payload})}).then(function(payload){form.innerHTML='<p class="auth-kicker">Похудение — это есть!</p><h1>Проверьте почту</h1><p class="auth-lead">'+esc(payload.message)+'</p><p class="auth-help"><a href="/lk">Вернуться ко входу</a></p>';}).catch(function(cause){error.textContent=String(cause.message||cause);button.disabled=false})};
    }
    function openAccount(session){
      window.EdabalansIdentity={email:session.email,source:'native'};
      window.EdabalansAppHost=location.origin;
      portal.innerHTML='<div data-edabalans-app="account"></div>';
      window.EdabalansEmbed.load(portal.firstElementChild);
    }
    fetch('/api/account-auth/session',{credentials:'same-origin'}).then(function(response){return response.json()}).then(function(session){if(session.authenticated)openAccount(session);else if(new URL(location.href).searchParams.get('mode')==='register')register();else login()}).catch(function(){if(new URL(location.href).searchParams.get('mode')==='register')register();else login()});
  }());
  </script>
</body>
</html>
