<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Отзывы — голосовые и скриншоты</title>
  <style>
    @font-face{
      font-family:Montserrat;
      src:url('/preview/homepage-mobile/montserrat-cyrillic.woff2') format('woff2');
      font-style:normal;
      font-weight:100 900;
      font-display:swap;
    }
    *{box-sizing:border-box}
    html{min-width:320px;background:#f3faff}
    body{
      margin:0;
      min-width:320px;
      min-height:100vh;
      overflow-x:clip;
      color:#17212b;
      font-family:Montserrat,Arial,sans-serif;
      background:
        radial-gradient(ellipse 61% 8% at -4% 5%,rgba(35,168,246,.28),transparent 66%),
        radial-gradient(ellipse 56% 7% at 104% 15%,rgba(103,203,255,.24),transparent 66%),
        radial-gradient(ellipse 65% 8% at -5% 27%,rgba(91,195,251,.2),transparent 68%),
        radial-gradient(ellipse 58% 8% at 105% 38%,rgba(31,162,239,.25),transparent 66%),
        radial-gradient(ellipse 62% 8% at -4% 50%,rgba(115,207,255,.23),transparent 68%),
        radial-gradient(ellipse 54% 7% at 104% 61%,rgba(39,174,245,.22),transparent 66%),
        radial-gradient(ellipse 65% 8% at -5% 72%,rgba(80,190,249,.24),transparent 67%),
        radial-gradient(ellipse 58% 8% at 105% 84%,rgba(28,164,241,.27),transparent 66%),
        radial-gradient(ellipse 62% 8% at -4% 96%,rgba(105,204,255,.24),transparent 68%),
        linear-gradient(180deg,#fbfdff 0%,#f4fbff 30%,#eef9ff 61%,#eaf7ff 100%);
    }
    body.reviews-wall--locked{overflow:hidden}
    .reviews-flow{width:100%;overflow:hidden}
    .reviews-voice{
      width:min(100%,800px);
      margin:0 auto;
      padding:22px 20px clamp(70px,13vw,112px);
    }
    .telegram-chat{
      width:min(100%,430px);
      margin:0 auto;
      overflow:hidden;
      border:1px solid rgba(20,80,117,.13);
      border-radius:18px;
      background:#b9d7c9;
      box-shadow:0 20px 52px rgba(32,88,120,.2);
    }
    .telegram-chat__header{
      height:60px;
      display:grid;
      grid-template-columns:28px 42px minmax(0,1fr) 28px;
      align-items:center;
      gap:9px;
      padding:0 13px 0 11px;
      color:#fff;
      background:#517da2;
    }
    .telegram-chat__icon{
      width:24px;
      height:24px;
      fill:none;
      stroke:currentColor;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .telegram-chat__avatar,
    .telegram-voice__avatar{
      display:grid;
      place-items:center;
      flex:none;
      border-radius:50%;
      color:#fff;
      font-weight:700;
      line-height:1;
      background:linear-gradient(145deg,#ffb268,#e16b62);
    }
    .telegram-chat__avatar{width:42px;height:42px;font-size:16px}
    .telegram-chat__identity{min-width:0}
    .telegram-chat__title{
      overflow:hidden;
      font-size:15px;
      font-weight:700;
      line-height:1.25;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .telegram-chat__status{margin-top:2px;font-size:12px;line-height:1.2;opacity:.78}
    .telegram-chat__body{
      min-height:420px;
      display:flex;
      flex-direction:column;
      gap:11px;
      padding:13px 9px 14px;
      background-color:#d7e6df;
      background-image:
        radial-gradient(circle at 18px 18px,rgba(83,122,105,.08) 0 2px,transparent 2.5px),
        radial-gradient(circle at 46px 38px,transparent 0 8px,rgba(83,122,105,.06) 8.5px 9.5px,transparent 10px),
        linear-gradient(135deg,transparent 46%,rgba(83,122,105,.045) 47% 53%,transparent 54%);
      background-size:64px 64px,78px 78px,86px 86px;
    }
    .telegram-chat__date{
      align-self:center;
      margin-bottom:1px;
      padding:5px 10px;
      border-radius:999px;
      color:#fff;
      background:rgba(71,104,91,.48);
      box-shadow:0 1px 2px rgba(22,60,46,.12);
      font-size:11px;
      font-weight:700;
      line-height:1;
    }
    .telegram-voice{
      width:100%;
      display:flex;
      align-items:flex-end;
      gap:7px;
    }
    .telegram-voice__avatar{width:34px;height:34px;font-size:12px}
    .telegram-voice--blue .telegram-voice__avatar{background:linear-gradient(145deg,#7fcde7,#438ccd)}
    .telegram-voice--green .telegram-voice__avatar{background:linear-gradient(145deg,#a6d56e,#5ca76f)}
    .telegram-voice__bubble{
      position:relative;
      width:min(79%,286px);
      min-height:68px;
      display:grid;
      grid-template-columns:46px minmax(0,1fr);
      grid-template-rows:auto auto;
      column-gap:8px;
      padding:8px 10px 7px 8px;
      border-radius:11px 11px 11px 4px;
      background:#fff;
      box-shadow:0 1px 2px rgba(20,62,46,.18);
    }
    .telegram-voice__bubble::before{
      content:"";
      position:absolute;
      left:-7px;
      bottom:0;
      width:10px;
      height:15px;
      background:#fff;
      clip-path:polygon(100% 0,100% 100%,0 100%);
    }
    .telegram-voice__play{
      grid-row:1 / 3;
      align-self:center;
      width:46px;
      height:46px;
      display:grid;
      place-items:center;
      border-radius:50%;
      color:#fff;
      background:#3390ec;
    }
    .telegram-voice__play svg{width:22px;height:22px;fill:currentColor;transform:translateX(1px)}
    .telegram-voice__wave{
      align-self:end;
      width:100%;
      height:30px;
      color:#9bb4c7;
    }
    .telegram-voice__wave rect{fill:currentColor}
    .telegram-voice__meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-top:1px;
      color:#6d7f8c;
      font-size:10px;
      line-height:1;
    }
    .telegram-chat__composer{
      height:54px;
      display:grid;
      grid-template-columns:26px minmax(0,1fr) 26px;
      align-items:center;
      gap:7px;
      padding:6px 10px;
      color:#87939c;
      background:#fff;
      border-top:1px solid rgba(42,74,94,.1);
    }
    .telegram-chat__composer span{font-size:14px}
    .telegram-chat__composer .telegram-chat__icon{width:22px;height:22px}
    .reviews-featured{
      width:min(100%,800px);
      margin:0 auto;
      padding:22px 20px clamp(76px,14vw,124px);
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      align-items:start;
      gap:clamp(10px,3vw,18px);
    }
    .reviews-wall{
      width:min(100%,800px);
      margin:0 auto;
      padding:22px 20px 34px;
      columns:2;
      column-gap:clamp(10px,3vw,18px);
    }
    .reviews-featured__item,
    .reviews-wall__item{
      display:block;
      width:100%;
      padding:0;
      border:0;
      break-inside:avoid;
      appearance:none;
      background:transparent;
      cursor:zoom-in;
      transform:rotate(var(--tilt));
      transform-origin:50% 50%;
      filter:drop-shadow(0 7px 13px rgba(25,73,108,.18));
    }
    .reviews-featured__item{margin:0}
    .reviews-wall__item{margin:0 0 clamp(10px,3vw,17px)}
    .reviews-featured__item:focus-visible,
    .reviews-wall__item:focus-visible{
      outline:3px solid #247fd3;
      outline-offset:4px;
    }
    .reviews-featured__item img,
    .reviews-wall__item img{
      display:block;
      width:100%;
      height:auto;
      border-radius:clamp(7px,2vw,12px);
      background:#fff;
    }
    .review-lightbox[hidden]{display:none}
    .review-lightbox{
      position:fixed;
      inset:0;
      z-index:1000;
      display:grid;
      place-items:center;
      padding:max(12px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
      background:rgba(6,22,35,.94);
    }
    .review-lightbox__panel{
      position:relative;
      width:100%;
      height:100%;
      min-width:0;
      min-height:0;
      display:grid;
      place-items:center;
    }
    .review-lightbox__stage{
      width:100%;
      height:100%;
      min-width:0;
      min-height:0;
      display:grid;
      place-items:center;
      padding:52px 44px 48px;
      overflow:hidden;
      touch-action:pan-y;
      user-select:none;
      cursor:grab;
    }
    .review-lightbox__stage:active{cursor:grabbing}
    .review-lightbox__image{
      display:block;
      width:100%;
      height:100%;
      min-width:0;
      min-height:0;
      object-fit:contain;
      filter:drop-shadow(0 18px 28px rgba(0,0,0,.28));
      pointer-events:none;
    }
    .review-lightbox__image[hidden],
    .review-lightbox__control[hidden],
    .review-lightbox__counter[hidden]{display:none}
    .review-lightbox__cta[hidden]{display:none}
    .review-lightbox__cta{
      width:min(100%,480px,calc((100svh - 300px) * 1.03));
      height:auto;
      max-height:100%;
      min-width:0;
      min-height:0;
      display:grid;
      grid-template-rows:auto auto auto;
      gap:14px;
      padding:16px;
      overflow:hidden;
      border-radius:24px;
      background:linear-gradient(145deg,#16a9f2 0%,#087bc7 100%);
      box-shadow:0 24px 56px rgba(0,87,145,.42);
      user-select:none;
    }
    .review-lightbox__cta img{
      display:block;
      width:100%;
      height:auto;
      min-height:0;
      aspect-ratio:800/776;
      object-fit:cover;
      border:2px solid rgba(255,255,255,.82);
      border-radius:17px;
      pointer-events:none;
      -webkit-user-drag:none;
    }
    .review-lightbox__cta-copy{
      margin:0;
      color:#fff;
      font-size:clamp(32px,9vw,54px);
      font-weight:900;
      line-height:1;
      text-align:center;
      letter-spacing:-.04em;
    }
    .review-lightbox__cta-button{
      min-height:58px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 22px;
      border-radius:16px;
      color:#fff;
      background:#ff684b;
      box-shadow:0 16px 30px -17px rgba(255,104,75,.72);
      font-size:16px;
      font-weight:900;
      text-decoration:none;
      transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
    }
    .review-lightbox__cta-button:hover,
    .review-lightbox__cta-button:focus-visible{
      background:linear-gradient(135deg,#ffd47d,#e8ae45);
      box-shadow:0 20px 32px -15px rgba(232,174,69,.82);
      transform:rotate(-1deg) translateY(-2px);
      outline:3px solid #fff;
      outline-offset:3px;
    }
    .review-lightbox__control{
      position:absolute;
      z-index:2;
      width:46px;
      height:46px;
      display:grid;
      place-items:center;
      padding:0;
      border:1px solid rgba(255,255,255,.28);
      border-radius:50%;
      color:#fff;
      background:rgba(255,255,255,.14);
      cursor:pointer;
      backdrop-filter:blur(8px);
    }
    .review-lightbox__control:hover{background:rgba(255,255,255,.24)}
    .review-lightbox__control:disabled{opacity:.28;cursor:default}
    .review-lightbox__control:disabled:hover{background:rgba(255,255,255,.14)}
    .review-lightbox__control:focus-visible{
      outline:3px solid #65c7ff;
      outline-offset:3px;
    }
    .review-lightbox__control svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .review-lightbox__close{top:4px;right:4px}
    .review-lightbox__prev{left:2px;top:50%;transform:translateY(-50%)}
    .review-lightbox__next{right:2px;top:50%;transform:translateY(-50%)}
    .review-lightbox__counter{
      position:absolute;
      z-index:2;
      left:50%;
      bottom:6px;
      transform:translateX(-50%);
      min-width:66px;
      padding:7px 12px;
      border-radius:999px;
      color:#fff;
      background:rgba(255,255,255,.14);
      font-size:13px;
      font-weight:700;
      line-height:1;
      text-align:center;
      letter-spacing:.03em;
      backdrop-filter:blur(8px);
    }
    @media (min-width:768px){
      .reviews-voice{padding:38px 28px 120px}
      .reviews-featured{padding:38px 28px 132px}
      .reviews-wall{padding:38px 28px 52px}
      .reviews-featured__item,
      .reviews-wall__item{filter:drop-shadow(0 10px 18px rgba(25,73,108,.17))}
      .review-lightbox__stage{padding:58px 78px 52px}
      .review-lightbox__prev{left:14px}
      .review-lightbox__next{right:14px}
    }
    @media (max-height:520px) and (orientation:landscape){
      .review-lightbox__stage{padding:44px 58px 12px}
      .review-lightbox__cta{
        width:min(100%,560px);
        height:100%;
        max-height:280px;
        grid-template-columns:minmax(0,1fr) minmax(180px,.9fr);
        grid-template-rows:minmax(0,1fr) auto;
        gap:10px;
        padding:12px;
      }
      .review-lightbox__cta img{
        grid-column:1;
        grid-row:1 / 3;
        width:100%;
        height:100%;
        aspect-ratio:auto;
        object-fit:cover;
      }
      .review-lightbox__cta-copy{
        align-self:end;
        font-size:clamp(28px,7vh,42px);
      }
      .review-lightbox__cta-button{min-height:50px;padding-inline:14px;font-size:14px}
    }
    @media (prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      .review-lightbox__cta-button{transition:none}
    }
  </style>
</head>

        </article>
        <article class="telegram-voice telegram-voice--green">
          <div class="telegram-voice__avatar">3</div>

  <script>
    (() => {
      const groups = {
        featured: [...document.querySelectorAll('.reviews-featured__item')],
        wall: [...document.querySelectorAll('.reviews-wall__item')],
      };
      const wallSection = document.querySelector('[data-homepage-block="reviews-wall"]');
      const lightbox = document.querySelector('[data-review-lightbox]');
      const stage = lightbox.querySelector('[data-review-stage]');
      const activeImage = lightbox.querySelector('[data-review-image]');
      const cta = lightbox.querySelector('[data-review-cta]');
      const ctaButton = cta.querySelector('.review-lightbox__cta-button');
      const counter = lightbox.querySelector('[data-review-counter]');
      const closeButton = lightbox.querySelector('[data-review-close]');
      const previousButton = lightbox.querySelector('[data-review-prev]');
      const nextButton = lightbox.querySelector('[data-review-next]');
      let activeGroup = 'featured';
      let activeIndex = 0;
      let activeMode = 'image';
      let previousFocus = null;
      let pointerStart = null;

      const updateControls = () => {
        const triggers = groups[activeGroup];
        const onCta = activeMode === 'cta';
        previousButton.disabled = !onCta && activeIndex === 0;
        previousButton.hidden = false;
        nextButton.hidden = onCta;
        if (onCta) return;
        const onLast = activeIndex === triggers.length - 1;
        nextButton.setAttribute('aria-label', onLast
          ? activeGroup === 'featured'
            ? 'Продолжить к следующим отзывам'
            : 'Показать финальную карточку'
          : 'Следующий отзыв');
      };

      const showImage = (index) => {
        const triggers = groups[activeGroup];
        activeMode = 'image';
        activeIndex = Math.max(0, Math.min(index, triggers.length - 1));
        const sourceImage = triggers[activeIndex].querySelector('img');
        activeImage.src = sourceImage.currentSrc || sourceImage.src;
        activeImage.alt = sourceImage.alt;
        activeImage.hidden = false;
        cta.hidden = true;
        counter.hidden = false;
        counter.textContent = `${activeIndex + 1} / ${triggers.length}`;
        [activeIndex - 1, activeIndex + 1].forEach((neighborIndex) => {
          const image = triggers[neighborIndex]?.querySelector('img');
          image?.decode?.().catch(() => {});
        });
        updateControls();
      };

      const showCta = () => {
        const moveFocusToCta = document.activeElement === nextButton;
        activeMode = 'cta';
        activeImage.hidden = true;
        activeImage.removeAttribute('src');
        cta.hidden = false;
        counter.hidden = true;
        updateControls();
        if (moveFocusToCta) ctaButton.focus();
      };

      const open = (group, index) => {
        previousFocus = document.activeElement;
        activeGroup = group;
        showImage(index);
        lightbox.hidden = false;
        document.body.classList.add('reviews-wall--locked');
        closeButton.focus();
      };

      const close = ({ restoreFocus = true } = {}) => {
        lightbox.hidden = true;
        activeImage.removeAttribute('src');
        document.body.classList.remove('reviews-wall--locked');
        if (restoreFocus) previousFocus?.focus();
      };

      const continueBelow = () => {
        close({ restoreFocus: false });
        wallSection.scrollIntoView({
          behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
          block: 'start',
        });
        groups.wall[0].focus({ preventScroll: true });
      };

      const step = (direction) => {
        if (activeMode === 'cta') {
          if (direction < 0) showImage(groups.wall.length - 1);
          return;
        }
        const triggers = groups[activeGroup];
        const targetIndex = activeIndex + direction;
        if (targetIndex < 0) return;
        if (targetIndex < triggers.length) {
          showImage(targetIndex);
          return;
        }
        if (activeGroup === 'featured') {
          continueBelow();
          return;
        }
        showCta();
      };

      Object.entries(groups).forEach(([group, triggers]) => {
        triggers.forEach((trigger, index) => trigger.addEventListener('click', () => open(group, index)));
      });
      closeButton.addEventListener('click', close);
      previousButton.addEventListener('click', () => step(-1));
      nextButton.addEventListener('click', () => step(1));
      stage.addEventListener('pointerdown', (event) => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        if (event.target.closest('a')) return;
        pointerStart = { id: event.pointerId, x: event.clientX, y: event.clientY };
        try { stage.setPointerCapture(event.pointerId); } catch {}
      });
      stage.addEventListener('pointerup', (event) => {
        if (!pointerStart || pointerStart.id !== event.pointerId) return;
        const deltaX = event.clientX - pointerStart.x;
        const deltaY = event.clientY - pointerStart.y;
        pointerStart = null;
        if (Math.abs(deltaX) < 48 || Math.abs(deltaX) <= Math.abs(deltaY)) return;
        step(deltaX < 0 ? 1 : -1);
      });
      stage.addEventListener('pointercancel', () => { pointerStart = null; });

      document.addEventListener('keydown', (event) => {
        if (lightbox.hidden) return;
        if (event.key === 'Escape') {
          event.preventDefault();
          close();
        }
        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          step(-1);
        }
        if (event.key === 'ArrowRight') {
          event.preventDefault();
          step(1);
        }
        if (event.key !== 'Tab') return;
        const controls = [closeButton, previousButton, nextButton, ...lightbox.querySelectorAll('a')]
          .filter((control) => !control.hidden && !control.disabled && control.offsetParent !== null);
        const current = controls.indexOf(document.activeElement);
        event.preventDefault();
        if (current === -1) {
          controls[event.shiftKey ? controls.length - 1 : 0].focus();
          return;
        }
        controls[(current + (event.shiftKey ? -1 : 1) + controls.length) % controls.length].focus();
      });
    })();
  </script>
