    ? `${plainOpening}<h2 class="edb-di-section-lead edb-di-approach-heading">${esc(CONTENT.accent)}</h2>`
    : CONTENT.openingStyle==='hero-split'
      ? `<h1 class="edb-di-hero-split"><span class="edb-di-hero-split-main">${esc(CONTENT.headingLines[0])}</span><span class="edb-di-hero-accent">${esc(CONTENT.headingLines[1])}</span></h1>${paragraph(CONTENT.intro.slice(0,1))}${paragraph(CONTENT.intro.slice(1),'edb-di-offer')}${paragraph(CONTENT.reason,'edb-di-offer')}<h2 class="edb-di-hero--main edb-di-hero-turn">${HERO_HTML}</h2>`
    : CONTENT.openingStyle==='hero-stack'
      ? `<h1 class="edb-di-hero-stack">${CONTENT.headingLines.map(line=>`<span>${esc(line)}</span>`).join('')}</h1>${paragraph(CONTENT.intro)}${paragraph(CONTENT.reason,'edb-di-offer')}<h2 class="edb-di-hero-stack edb-di-hero-stack--approach">${esc(CONTENT.accent)}</h2>`
    : CONTENT.openingStyle==='content-only'
      ? `${paragraph(CONTENT.intro)}`
    : CONTENT.openingStyle==='plain-accent'
      ? `${plainOpening}<h2 class="edb-di-hero--main edb-di-hero-turn">${HERO_HTML}</h2>`
      : `${paragraph(CONTENT.intro)}${paragraph(CONTENT.reason,'edb-di-offer')}<h1 class="edb-di-hero--main edb-di-hero-turn">${HERO_HTML}</h1>`;
  const configured=value=>/^https:\/\//i.test(value)&&!value.includes('__REQUIRED_');
  const assetUrl=name=>location.protocol==='file:'?`./${name}`:(location.hostname==='127.0.0.1'||location.hostname==='localhost'||location.hostname==='app.edabalans.ru'?`/preview/homepage-mobile/${name}`:`https://app.edabalans.ru/preview/homepage-mobile/${name}?v=1`);
  const maxLogoUrl=assetUrl('max-full-colored-official.png');
  const icon=kind=>kind==='telegram'?'<svg class="edb-di-telegram-icon" viewBox="190 270 580 510" aria-hidden="true"><path fill="#fff" d="M226.328 494.722c145.761-63.505 242.957-105.372 291.589-125.6 138.855-57.755 167.708-67.787 186.514-68.119 4.137-.072 13.385.953 19.375 5.814 5.059 4.105 6.451 9.65 7.117 13.541.666 3.892 1.495 12.757.836 19.683-7.525 79.062-40.084 270.924-56.648 359.475-7.009 37.469-20.81 50.032-34.17 51.261-29.036 2.672-51.085-19.189-79.208-37.624-44.006-28.847-68.867-46.804-111.583-74.953-49.366-32.531-17.364-50.411 10.769-79.631 7.363-7.647 135.296-124.012 137.772-134.568.31-1.32.597-6.241-2.326-8.84-2.924-2.599-7.239-1.71-10.353-1.003-4.413 1.002-74.714 47.468-210.902 139.399-19.954 13.703-38.029 20.379-54.223 20.029-17.853-.386-52.194-10.094-77.723-18.393-31.313-10.178-56.2-15.56-54.032-32.846 1.128-9.004 13.527-18.212 37.196-27.624Z"/></svg>':`<img class="edb-di-max-logo" src="${maxLogoUrl}" alt="MAX">`;
  const button=(kind,label,url,note='',position='primary',notePlacement='inside')=>`<div class="edb-di-action-wrap"><a class="edb-di-button edb-di-button--${kind}" data-edb-channel="${kind}" data-cta-position="${position}" aria-label="${esc(label)}${note?`. ${esc(note)}`:''}" href="${configured(url)?esc(url):'#'}" rel="noopener noreferrer"${configured(url)?'':' aria-disabled="true"'}>${icon(kind)}${kind==='max'?'':`<span>${esc(label)}</span>${note&&notePlacement==='inside'?`<span class="edb-di-button-note">${esc(note)}</span>`:''}`}</a>${note&&notePlacement==='below'?`<p class="edb-di-note">${esc(note)}</p>`:''}</div>`;
  const qrOption=(kind,label,selected)=>`<button class="edb-di-qr-option" type="button" role="option" data-edb-qr="${kind}" aria-selected="${selected}" tabindex="${selected?'0':'-1'}"><span class="edb-di-qr-heading"><span>${esc(label)}</span><span class="edb-di-qr-state">${selected?'QR открыт':'QR скрыт'}</span></span><span class="edb-di-qr-frame"><img class="edb-di-qr-code" src="${assetUrl(`direct-intensive-${kind}-qr.svg`)}" data-edb-destination="" alt="QR-код для ${esc(label)}"><span class="edb-di-qr-cover" aria-hidden="${selected?'true':'false'}">Нажмите, чтобы показать этот QR-код</span></span></button>`;
  const ctaArrows=CONTENT.splitArrows?'<span class="edb-di-cta-arrows" aria-hidden="true"><span>👇</span><span>👇</span></span>':'';
  const ctaLead=CONTENT.ctaLeadLines.length||ctaArrows
    ?`<p class="edb-di-section-lead edb-di-cta-lead">${CONTENT.ctaLeadLines.map(line=>`<span>${esc(line)}</span>`).join('')}${ctaArrows}</p>`
    :'';
  const usesOriginalInlineActions=CONTENT.actionsMode==='inline';
  const inlineTelegramNote=usesOriginalInlineActions?'только с VPN':CONTENT.telegramNote;
  root.dataset.landingVariant=ACTIVE_VARIANT;
  root.dataset.actionsMode=CONTENT.actionsMode||'sticky';
  root.innerHTML=`<main class="edb-di-shell"><section class="edb-di-hero-stage">${openingHtml}${(CONTENT.body||[]).map(item=>paragraph(item,'edb-di-offer')).join('')}${paragraph(CONTENT.offer,'edb-di-offer')}${finalCta}</section>${pointList}${afterList}${ctaLead}<div class="edb-di-actions edb-di-actions--inline">${button('telegram',CONTENT.telegramLabel,CONTENT.links.telegramUrl,inlineTelegramNote,'primary',usesOriginalInlineActions?'below':'inside')}${button('max',CONTENT.maxLabel,CONTENT.links.maxUrl)}</div><section class="edb-di-qr" aria-label="QR-коды мессенджеров"><p class="edb-di-qr-intro">Если на компьютере нет мессенджера, отсканируйте QR-код телефоном.</p><div class="edb-di-qr-options" role="listbox" aria-label="Выберите мессенджер">${qrOption('telegram',CONTENT.telegramLabel,true)}${qrOption('max',CONTENT.maxLabel,false)}</div></section><footer class="edb-di-legal"><span class="edb-di-legal-line"><span>${esc(CONTENT.legal.business)} · ${esc(CONTENT.legal.inn)}</span><span aria-hidden="true">·</span><a href="${esc(CONTENT.legal.privacyUrl)}" target="_blank" rel="noopener noreferrer">${esc(CONTENT.legal.privacyLabel)}</a><span aria-hidden="true">·</span><span>${esc(CONTENT.legal.disclaimer)}</span></span></footer></main><nav class="edb-di-sticky-actions" aria-label="Открыть интенсив в мессенджере">${button('telegram',CONTENT.telegramLabel,CONTENT.links.telegramUrl,CONTENT.telegramNote,'sticky')}${button('max',CONTENT.maxLabel,CONTENT.links.maxUrl,'','sticky')}</nav>`;

  let robots=document.head&&document.head.querySelector('meta[name="robots"]');
  if(!robots&&document.head){robots=document.createElement('meta');robots.name='robots';document.head.appendChild(robots)}
  if(robots)robots.content='noindex, nofollow';

  const attributionKeys=new Set(['utm_source','utm_medium','utm_campaign','utm_content','utm_term','yclid']);
  const attributionKey=key=>attributionKeys.has(key.toLowerCase());
  const storageKey='edb_direct_intensive_attribution_v1';
  let attribution={};
  try{
    const stored=JSON.parse(sessionStorage.getItem(storageKey)||'{}')||{};
    Object.entries(stored).forEach(([key,value])=>{const normalized=key.toLowerCase();if(attributionKey(normalized)&&value)attribution[normalized]=String(value).slice(0,500)});
  }catch(_){attribution={}}
  const query=new URLSearchParams(location.search);
  query.forEach((value,key)=>{const normalized=key.toLowerCase();if(attributionKey(normalized)&&value)attribution[normalized]=value.slice(0,500)});
  try{if(Object.keys(attribution).length)sessionStorage.setItem(storageKey,JSON.stringify(attribution))}catch(_){}

  const channelConfig={
    telegram:{apiMessenger:'tg',fallbackUrl:CONTENT.links.telegramUrl,allowedHost:'t.me',pathPrefix:'/Fitness_Talks_bot'},
    max:{apiMessenger:'max',fallbackUrl:CONTENT.links.maxUrl,allowedHost:'max.ru',pathPrefix:'/id230409966750_bot'}
  };
  const qrImage=(channel,url)=>{
    const image=root.querySelector(`[data-edb-qr="${channel}"] .edb-di-qr-code`);
    if(!image)return;
    image.dataset.edbDestination=url;
    if(typeof window.qrcode!=='function')return;
    try{
      window.qrcode.stringToBytes=window.qrcode.stringToBytesFuncs['UTF-8'];
      const code=window.qrcode(0,'M');
      code.addData(url);
      code.make();
      image.src=`data:image/svg+xml;charset=utf-8,${encodeURIComponent(code.createSvgTag({cellSize:6,margin:24,scalable:true}))}`;
    }catch(_){}
  };
  const validDeepLink=(channel,value)=>{
    if(typeof value!=='string')return false;
    try{
      const url=new URL(value);
      const expected=channelConfig[channel];
      return url.protocol==='https:'&&url.hostname===expected.allowedHost&&url.pathname===expected.pathPrefix&&/^U[A-Za-z0-9_-]+$/.test(url.searchParams.get('start')||'');
    }catch(_){return false}
  };
  const validQrLink=value=>{
    if(typeof value!=='string')return false;
    try{
      const url=new URL(value);
      return url.protocol==='https:'&&url.hostname==='edabalans.ru'&&/^\/q\/U[A-Za-z0-9_-]+$/.test(url.pathname);
    }catch(_){return false}
  };
  const prepare=(channel,entry)=>{
    const config=channelConfig[channel];
    const state={status:'pending',url:config.fallbackUrl,payload:null,clickUrl:null,promise:null};
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),2500);
    state.promise=fetch(CONTENT.links.apiUrl,{
      method:'POST',
      mode:'cors',
      credentials:'omit',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messenger:config.apiMessenger,entry,alias:CONTENT.links.alias,landing_variant:ACTIVE_VARIANT,...attribution}),
      signal:controller.signal
    }).then(response=>{
      if(!response.ok)throw new Error(`start-link ${response.status}`);
      return response.json();
    }).then(payload=>{
      const destination=entry==='qr'?payload.qr_url:payload.deep_link;
      const valid=entry==='qr'?validQrLink(destination):validDeepLink(channel,destination);
      if(payload.messenger!==config.apiMessenger||payload.entry!==entry||!valid)throw new Error('invalid start-link response');
      state.status='ready';
      state.url=destination;
      state.payload=payload.payload;
      state.clickUrl=payload.click_url;
      return destination;
    }).catch(()=>config.fallbackUrl).finally(()=>clearTimeout(timer));
    return state;
  };
  const states={};
  Object.entries(channelConfig).forEach(([channel,config])=>{
    const links=[...root.querySelectorAll(`[data-edb-channel="${channel}"]`)];
    links.forEach(link=>{link.href=config.fallbackUrl});
    qrImage(channel,config.fallbackUrl);
    states[channel]={button:prepare(channel,'button'),qr:prepare(channel,'qr')};
    states[channel].button.promise.then(destination=>{links.forEach(link=>{link.href=destination})});
    states[channel].qr.promise.then(destination=>{qrImage(channel,destination)});
  });

  const eventReady=name=>name&&!name.includes('__REQUIRED_');
  const emit=(name,details={})=>{
    if(!eventReady(name))return;
    const payload={event:name,landing_version:'direct-intensive-t123-v1',landing_variant:ACTIVE_VARIANT,page_path:location.pathname,...attribution,...details};
    window.dispatchEvent(new CustomEvent('edb:landing-event',{detail:payload}));
    window.dataLayer=window.dataLayer||[];
    window.dataLayer.push(payload);
    if(typeof window.ym==='function')window.ym(CONTENT.analytics.counterId,'reachGoal',name,payload);
  };

  root.querySelectorAll('[data-edb-channel]').forEach(link=>{
    const channel=link.dataset.edbChannel;
    link.addEventListener('click',async event=>{
      event.preventDefault();
      const state=states[channel].button;
      let destination=state.url;
      if(state.status==='pending')destination=await Promise.race([state.promise,new Promise(resolve=>setTimeout(()=>resolve(channelConfig[channel].fallbackUrl),500))]);
      if(!validDeepLink(channel,destination))destination=channelConfig[channel].fallbackUrl;
      if(state.payload&&state.clickUrl){
        fetch(state.clickUrl,{
          method:'POST',mode:'cors',credentials:'omit',keepalive:true,
          headers:{'Content-Type':'application/json'},body:JSON.stringify({payload:state.payload})
        }).catch(()=>{});
      }
      emit(channel==='telegram'?CONTENT.analytics.telegramClickEvent:CONTENT.analytics.maxClickEvent,{channel,cta_position:link.dataset.ctaPosition,destination_host:new URL(destination).host,link_kind:destination.includes('?start=U')?'prepared':'fallback'});
      location.assign(destination);
    });
  });
  const desktopQr=window.matchMedia('(min-width:900px)');
  const qrOptions=[...root.querySelectorAll('[data-edb-qr]')];
  const selectQr=(option,track=true)=>{
    if(!desktopQr.matches)return;
    if(option.getAttribute('aria-selected')==='true')return;
    qrOptions.forEach(item=>{
      const selected=item===option;
      item.setAttribute('aria-selected',String(selected));
      item.tabIndex=selected?0:-1;
      item.querySelector('.edb-di-qr-state').textContent=selected?'QR открыт':'QR скрыт';
      item.querySelector('.edb-di-qr-cover').setAttribute('aria-hidden',String(selected));
    });
    if(track){
      emit(CONTENT.analytics.qrShownEvent,{channel:option.dataset.edbQr});
      emit(CONTENT.analytics.qrSelectedEvent,{channel:option.dataset.edbQr});
    }
  };
  qrOptions.forEach((option,index)=>{
    option.addEventListener('click',()=>selectQr(option));
    option.addEventListener('keydown',event=>{
      let next=index;
      if(event.key==='ArrowRight'||event.key==='ArrowDown')next=(index+1)%qrOptions.length;
      else if(event.key==='ArrowLeft'||event.key==='ArrowUp')next=(index-1+qrOptions.length)%qrOptions.length;
      else if(event.key==='Home')next=0;
      else if(event.key==='End')next=qrOptions.length-1;
      else return;
      event.preventDefault();
      selectQr(qrOptions[next]);
      qrOptions[next].focus();
    });
  });
  let qrWasVisible=false;
  const trackQrVisibility=()=>{
    if(desktopQr.matches&&!qrWasVisible){
      const selected=root.querySelector('[data-edb-qr][aria-selected="true"]');
      emit(CONTENT.analytics.qrShownEvent,{channel:selected?selected.dataset.edbQr:'telegram'});
    }
    qrWasVisible=desktopQr.matches;
  };
  if(typeof desktopQr.addEventListener==='function')desktopQr.addEventListener('change',trackQrVisibility);
  else if(typeof desktopQr.addListener==='function')desktopQr.addListener(trackQrVisibility);
  trackQrVisibility();
  emit(CONTENT.analytics.viewEvent);
})();
</script>
