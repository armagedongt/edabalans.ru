  #edb-direct-intensive-v1[data-design-variant="3"] .edb-di-list{counter-reset:edb-di-point}

  #edb-direct-intensive-v1 .edb-di-button{display:flex;min-width:0;align-items:center;justify-content:center;gap:clamp(6px,2vw,9px);width:100%;height:58px;padding:8px clamp(7px,2.4vw,11px);overflow:hidden;border:0;border-radius:14px;text-align:center;text-decoration:none;font:800 clamp(13px,3.7vw,17px)/1 Manrope,Montserrat,Arial,sans-serif;box-shadow:0 9px 16px -10px rgba(0,46,78,.76);transition:transform .18s ease,box-shadow .18s ease}
  #edb-direct-intensive-v1 .edb-di-button--telegram{background:linear-gradient(180deg,#2aabee,#229ed9);color:#fff}
  #edb-direct-intensive-v1 .edb-di-button--max{background:#0d001a;color:#fff}
  #edb-direct-intensive-v1 .edb-di-telegram-icon{display:block;width:clamp(27px,8vw,34px);height:clamp(27px,8vw,34px);flex:0 0 auto}

  #edb-direct-intensive-v1 .edb-di-button:hover,#edb-direct-intensive-v1 .edb-di-button:focus-visible{box-shadow:0 13px 21px -10px rgba(0,46,78,.88);transform:translateY(-2px) rotate(-1deg)}
  #edb-direct-intensive-v1 .edb-di-button:active{transform:translateY(1px) rotate(0)}
  #edb-direct-intensive-v1 .edb-di-button:focus-visible{outline:3px solid rgba(255,107,54,.38);outline-offset:3px}
  #edb-direct-intensive-v1 .edb-di-button[aria-disabled="true"]{cursor:not-allowed}
  #edb-direct-intensive-v1 .edb-di-note{margin:8px 0 0;color:var(--edb-muted);font-size:11px;line-height:1.35;text-align:center}
  #edb-direct-intensive-v1 .edb-di-legal{display:flex;flex-wrap:wrap;justify-content:center;gap:3px 9px;margin:22px 0 0;padding-top:15px;border-top:1px solid rgba(22,87,128,.11);color:#6b7a86;font-size:10px;line-height:1.4;text-align:center}
  #edb-direct-intensive-v1 .edb-di-legal a{color:inherit;text-underline-offset:2px}
  #edb-direct-intensive-v1 .edb-di-legal-disclaimer{flex-basis:100%}
  @media (min-width:560px){#edb-direct-intensive-v1 .edb-di-shell{padding-top:44px;padding-bottom:30px}#edb-direct-intensive-v1 .edb-di-actions{gap:12px;align-items:start}#edb-direct-intensive-v1 .edb-di-item{padding:15px 17px 15px 51px}#edb-direct-intensive-v1 .edb-di-item::before{left:16px;top:15px}}
  @media (min-width:900px){#edb-direct-intensive-v1 .edb-di-shell{padding-top:58px;padding-bottom:34px}#edb-direct-intensive-v1 .edb-di-list{grid-template-columns:1fr 1fr}#edb-direct-intensive-v1 .edb-di-item{min-height:104px}}
  @media (prefers-reduced-motion:reduce){#edb-direct-intensive-v1 .edb-di-button{transition:none}}
</style>
<script>
(()=>{
  const root=document.getElementById('edb-direct-intensive-v1');
  if(!root||root.dataset.initialized==='true')return;
  root.dataset.initialized='true';

  const CONTENT={
    eyebrow:'Бесплатный интенсив',
    introHtml:'Чтобы ваше похудение перестало держаться только на силе воли, подсчёте калорий и банальном везении, я написал бесплатный интенсив <strong class="edb-di-marker">«Последнее похудение».</strong>',
    listLead:'Вы узнаете:',
    points:[
      '✅ Три ошибки в начале похудения, которые сразу ставят на нём жирный крест!',
      '✅ Почему вам вечно нужно себя ограничивать, чтобы хотя бы не толстеть, пока другие едят всё подряд и ходят худые?',
      '✅ От чего зависят ваши пищевые привычки и как начать их менять!',
      '✅ Как выглядит пошаговый план похудения, который поможет потом удержать вес навсегда!'
    ],
    ctaLead:'Хватит откладывать — читайте и меняйтесь прямо сейчас 👇',
    telegramLabel:'Telegram',
    maxLabel:'MAX',
    telegramNote:'Откроется только с VPN',
    legal:{copyright:'© 2026 Сергей Воронцов',inn:'ИНН 230409966750',privacyLabel:'Политика обработки ПД',privacyUrl:'https://go.похудение-это-есть.рф/legal/privacy',disclaimer:'Не является медицинской услугой.'},
    links:{telegramUrl:'__REQUIRED_GO_ALIAS__',maxUrl:'https://max.ru/id230409966750_bot'},
    analytics:{counterId:97331502,viewEvent:'direct_intensive_view',telegramClickEvent:'direct_intensive_telegram_click',maxClickEvent:'direct_intensive_max_click'}
  };

  const HERO_HTML='<span class="edb-di-hero-line">Когда каждая попытка</span><span class="edb-di-hero-line edb-di-marker">взять себя в руки</span><span class="edb-di-hero-line">заканчивается срывом…</span><span class="edb-di-hero-accent">пора менять подход!</span>';
  const DESIGN_VARIANTS=['1','2','3'];
  const FONT_VARIANTS=['1','2','3'];

  const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const configured=value=>/^https:\/\//i.test(value)&&!value.includes('__REQUIRED_');
  const maxLogoUrl=location.protocol==='file:'?'./max-full-colored-official.png':'https://app.edabalans.ru/preview/homepage-mobile/max-full-colored-official.png?v=1';
  const icon=kind=>kind==='telegram'?'<svg class="edb-di-telegram-icon" viewBox="190 270 580 510" aria-hidden="true"><path fill="#fff" d="M226.328 494.722c145.761-63.505 242.957-105.372 291.589-125.6 138.855-57.755 167.708-67.787 186.514-68.119 4.137-.072 13.385.953 19.375 5.814 5.059 4.105 6.451 9.65 7.117 13.541.666 3.892 1.495 12.757.836 19.683-7.525 79.062-40.084 270.924-56.648 359.475-7.009 37.469-20.81 50.032-34.17 51.261-29.036 2.672-51.085-19.189-79.208-37.624-44.006-28.847-68.867-46.804-111.583-74.953-49.366-32.531-17.364-50.411 10.769-79.631 7.363-7.647 135.296-124.012 137.772-134.568.31-1.32.597-6.241-2.326-8.84-2.924-2.599-7.239-1.71-10.353-1.003-4.413 1.002-74.714 47.468-210.902 139.399-19.954 13.703-38.029 20.379-54.223 20.029-17.853-.386-52.194-10.094-77.723-18.393-31.313-10.178-56.2-15.56-54.032-32.846 1.128-9.004 13.527-18.212 37.196-27.624Z"/></svg>':`<img class="edb-di-max-logo" src="${maxLogoUrl}" alt="MAX">`;
  const button=(kind,label,url,note='')=>`<div class="edb-di-action-wrap"><a class="edb-di-button edb-di-button--${kind}" data-edb-channel="${kind}" data-cta-position="primary" aria-label="${esc(label)}" href="${configured(url)?esc(url):'#'}" target="_blank" rel="noopener noreferrer"${configured(url)?'':' aria-disabled="true"'}>${icon(kind)}${kind==='max'?'':`<span>${esc(label)}</span>`}</a>${note?`<p class="edb-di-note">${esc(note)}</p>`:''}</div>`;
  const selectedDesignKey=DESIGN_VARIANTS.includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'1';
  const selectedFontKey=FONT_VARIANTS.includes(new URLSearchParams(location.search).get('font'))?new URLSearchParams(location.search).get('font'):'1';
  const isLocalPreview=location.protocol==='file:'||location.hostname==='127.0.0.1'||location.hostname==='localhost';
  const variantSwitcher=isLocalPreview?`<div class="edb-di-preview-controls"><nav class="edb-di-variant-switcher" aria-label="Локальные варианты страницы"><span>Вариант</span>${DESIGN_VARIANTS.map(key=>`<button class="edb-di-variant-button" type="button" data-design-variant="${key}" aria-pressed="${key===selectedDesignKey}">${key}</button>`).join('')}</nav><nav class="edb-di-variant-switcher" aria-label="Варианты шрифта акцентных строк"><span>Шрифт</span>${FONT_VARIANTS.map(key=>`<button class="edb-di-variant-button" type="button" data-font-variant="${key}" aria-pressed="${key===selectedFontKey}">${key}</button>`).join('')}</nav></div>`:'';
  root.dataset.designVariant=selectedDesignKey;
  root.dataset.fontVariant=selectedFontKey;
  root.innerHTML=`<main class="edb-di-shell">${variantSwitcher}<section class="edb-di-hero-stage"><p class="edb-di-eyebrow">${esc(CONTENT.eyebrow)}</p><h1 class="edb-di-hero--main">${HERO_HTML}</h1><p class="edb-di-lead">${CONTENT.introHtml}</p></section><p class="edb-di-section-lead edb-di-list-lead">${esc(CONTENT.listLead)}</p><ul class="edb-di-list">${CONTENT.points.map(point=>`<li class="edb-di-item">${esc(point.replace(/^✅\s*/,''))}</li>`).join('')}</ul><p class="edb-di-section-lead edb-di-cta-lead">${esc(CONTENT.ctaLead)}</p><div class="edb-di-actions">${button('telegram',CONTENT.telegramLabel,CONTENT.links.telegramUrl,CONTENT.telegramNote)}${button('max',CONTENT.maxLabel,CONTENT.links.maxUrl)}</div><footer class="edb-di-legal"><span>${esc(CONTENT.legal.copyright)}</span><span>${esc(CONTENT.legal.inn)}</span><a href="${esc(CONTENT.legal.privacyUrl)}" target="_blank" rel="noopener noreferrer">${esc(CONTENT.legal.privacyLabel)}</a><span class="edb-di-legal-disclaimer">${esc(CONTENT.legal.disclaimer)}</span></footer></main>`;
  root.querySelectorAll('[data-design-variant]').forEach(control=>control.addEventListener('click',()=>{
    const key=control.dataset.designVariant;
    root.dataset.designVariant=key;
    root.querySelectorAll('[data-design-variant]').forEach(button=>button.setAttribute('aria-pressed',String(button===control)));
    const url=new URL(location.href);url.searchParams.delete('hero');url.searchParams.delete('cards');url.searchParams.set('variant',key);history.replaceState(null,'',url);
  }));
  root.querySelectorAll('[data-font-variant]').forEach(control=>control.addEventListener('click',()=>{
    const key=control.dataset.fontVariant;
    root.dataset.fontVariant=key;
    root.querySelectorAll('[data-font-variant]').forEach(button=>button.setAttribute('aria-pressed',String(button===control)));
    const url=new URL(location.href);url.searchParams.set('font',key);history.replaceState(null,'',url);
  }));

  let robots=document.head&&document.head.querySelector('meta[name="robots"]');
  if(!robots&&document.head){robots=document.createElement('meta');robots.name='robots';document.head.appendChild(robots)}
  if(robots)robots.content='noindex, nofollow';

  const allowed=['utm_source','utm_medium','utm_campaign','utm_content','utm_term','yclid'];
  const storageKey='edb_direct_intensive_attribution_v1';
  let attribution={};
  try{attribution=JSON.parse(sessionStorage.getItem(storageKey)||'{}')||{}}catch(_){attribution={}}
  const query=new URLSearchParams(location.search);
  allowed.forEach(key=>{const value=query.get(key);if(value)attribution[key]=value.slice(0,500)});
  try{if(Object.keys(attribution).length)sessionStorage.setItem(storageKey,JSON.stringify(attribution))}catch(_){}

  const eventReady=name=>name&&!name.includes('__REQUIRED_');
  const emit=(name,details={})=>{
    if(!eventReady(name))return;
    const payload={event:name,landing_version:'direct-intensive-t123-v1',page_path:location.pathname,...attribution,...details};
    window.dispatchEvent(new CustomEvent('edb:landing-event',{detail:payload}));
    window.dataLayer=window.dataLayer||[];
    window.dataLayer.push(payload);
    if(typeof window.ym==='function')window.ym(CONTENT.analytics.counterId,'reachGoal',name,payload);
  };

  root.querySelectorAll('[data-edb-channel]').forEach(link=>{
    const channel=link.dataset.edbChannel;
    const rawUrl=CONTENT.links[`${channel}Url`];
    if(configured(rawUrl)&&channel==='telegram'){
      const destination=new URL(rawUrl);
      if(destination.hostname.toLowerCase()==='go.похудение-это-есть.рф')allowed.forEach(key=>{if(attribution[key])destination.searchParams.set(key,attribution[key])});
      link.href=destination.toString();
    }
    link.addEventListener('click',event=>{
      if(!configured(rawUrl)){event.preventDefault();return}
      emit(channel==='telegram'?CONTENT.analytics.telegramClickEvent:CONTENT.analytics.maxClickEvent,{channel,cta_position:link.dataset.ctaPosition,destination_host:new URL(link.href).host});
    });
  });
  emit(CONTENT.analytics.viewEvent);
})();
</script>
