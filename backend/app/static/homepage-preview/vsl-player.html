<script>
(function(){
  const root = document.getElementById('modular-video-player');
  if (!root || root.dataset.ready) return;
  root.dataset.ready = '1';

  /* РЕЖИМ ПЛЕЕРА — меняется одной строкой:
     'engagement' = автостарт без звука + аналитика + ускоренная шкала + только текущее время
     'standard'   = обычный запуск + обычная шкала + полное время + без аналитики */
  const PLAYER_MODE = 'engagement';

  const MODE_PRESETS = {
    engagement: { autoplay:true,  analytics:true,  acceleratedProgress:true },
    standard:   { autoplay:false, analytics:false, acceleratedProgress:false }
  };
  const MODULES = { ...(MODE_PRESETS[PLAYER_MODE] || MODE_PRESETS.standard) };

  /* Внешний плеер показывает плавный опережающий прогресс. Видео при этом
     идёт с реальной скоростью и не перематывается. */
  const PROGRESS_CONFIG = {
    boost: 7
  };

  /* Варианты качества. Для каждого дополнительного качества укажи прямую ссылку.
     Строки без url автоматически не показываются. */
  const QUALITY_OPTIONS = [
    { id:'original', label:'Исходное', url:null }
    // { id:'1080', label:'1080p', url:'https://site.ru/video-1080.mp4' },
    // { id:'720',  label:'720p',  url:'https://site.ru/video-720.mp4' }
  ];

  /*
    Настройки аналитики.
    Для реальной отправки на сервер укажи endpoint.
  */
  const ANALYTICS_CONFIG = {
    endpoint: '/api/public/video-analytics',
    videoId: 'homepage-vsl-2026-02-13',
    bucketSizeSec: 5,
    completionThreshold: 0.95,
    heartbeatSec: 15
  };

  const video = root.querySelector('.mvp__video');
  if (video && /\.m3u8(?:[?#].*)?$/i.test(video.getAttribute('src') || '') && window.Hls && window.Hls.isSupported()) {
    const source = video.getAttribute('src');
    video.removeAttribute('src');
    const hls = new window.Hls({ enableWorker:true, lowLatencyMode:false });
    hls.loadSource(source);
    hls.attachMedia(video);
    root._hls = hls;
  }
  const bigPlay = root.querySelector('.mvp__big-play');
  const soundCard = root.querySelector('.mvp__sound-card');
  const playBtn = root.querySelector('.mvp__play');
  const muteBtn = root.querySelector('.mvp__mute');
  const volumeSlider = root.querySelector('.mvp__volume');
  const captionsBtn = root.querySelector('.mvp__captions');
  const pipBtn = root.querySelector('.mvp__pip');
  const loader = root.querySelector('.mvp__loader');
  const speedInline = root.querySelector('.mvp__speed-inline');
  const settingsBtn = root.querySelector('.mvp__settings-btn');
  const settingsPanel = root.querySelector('.mvp__settings');
  const speedRow = root.querySelector('.mvp__speed-row');
  const qualityRow = root.querySelector('.mvp__quality-row');
  const speedValue = root.querySelector('.mvp__speed-value');
  const qualityValue = root.querySelector('.mvp__quality-value');
  const speedPanel = root.querySelector('.mvp__speed-panel');
  const qualityPanel = root.querySelector('.mvp__quality-panel');
  const qualityList = root.querySelector('.mvp__quality-list');
  const speedList = root.querySelector('.mvp__speed-list');
  const fullscreenBtn = root.querySelector('.mvp__fullscreen');
  const progress = root.querySelector('.mvp__progress');
  const progressFill = root.querySelector('.mvp__progress-fill');
  const current = root.querySelector('.mvp__current');
  const duration = root.querySelector('.mvp__duration');
  const timeBox = root.querySelector('.mvp__time');

  function formatTime(value){
    const s = Math.max(0, Math.floor(Number(value) || 0));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = String(s % 60).padStart(2,'0');
    return h ? `${h}:${String(m).padStart(2,'0')}:${sec}` : `${m}:${sec}`;
  }

  function applyModules(){
    timeBox.hidden = false;
    if (MODULES.acceleratedProgress) {
      root.querySelector('.mvp__sep').hidden = true;
      root.querySelector('.mvp__duration').hidden = true;
    } else {
      root.querySelector('.mvp__sep').hidden = false;
      root.querySelector('.mvp__duration').hidden = false;
    }

    if (MODULES.autoplay) {
      video.muted = true;
      soundCard.hidden = false;
      bigPlay.hidden = true;
      root.classList.add('mvp--awaiting-sound');

      const start = () => {
        video.play().catch(()=>{});
      };

      if (video.readyState >= 2) start();
      else video.addEventListener('canplay', start, {once:true});
    } else {
      soundCard.hidden = true;
      bigPlay.hidden = false;
    }

    if (MODULES.analytics) analyticsApi = initAnalytics();
  }

  function visualProgress(realRatio){
    const x = Math.max(0, Math.min(1, realRatio));

    if (!MODULES.acceleratedProgress) return x;

    const boost = Math.max(0, Number(PROGRESS_CONFIG.boost) || 0);
    return x * (1 + boost) / (1 + boost * x);
  }

  function updatePlayUI(){
    const playing = !video.paused && !video.ended;
    root.classList.toggle('mvp--playing', playing);
    playBtn.innerHTML = playing
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8c0-1.2 1.3-1.9 2.3-1.2l10.2 7.2c.9.6.9 1.9 0 2.5L9.3 20.5C8.3 21.2 7 20.5 7 19.3V4.8z"/></svg>';

    bigPlay.hidden = !soundEngaged || playing;
    if (!playing && soundEngaged) showControls(false);
  }

  function togglePlay(){
    if(video.paused) video.play().catch(()=>{});
    else video.pause();
  }

  let soundEngaged = false;

  function updateProgress(){
    const d = video.duration;
    const t = video.currentTime || 0;

    current.textContent = formatTime(t);
    duration.textContent = Number.isFinite(d) ? formatTime(d) : '0:00';

    if(Number.isFinite(d) && d > 0){
      const realRatio = Math.max(0, Math.min(1, t / d));
      const shownRatio = visualProgress(realRatio);
      progressFill.style.width = `${shownRatio * 100}%`;
    }

  }

  let analyticsApi = { markEngaged(){} };
  let controlsTimer = null;

  function showControls(scheduleHide = true){
    root.classList.remove('mvp--controls-hidden');
    clearTimeout(controlsTimer);
    if (scheduleHide && soundEngaged && !video.paused && !video.ended) {
      controlsTimer = setTimeout(()=>root.classList.add('mvp--controls-hidden'), 3000);
    }
  }

  function enableSoundAndWatch(){
    if (soundEngaged) return;
    soundEngaged = true;
    video.currentTime = 0;
    video.muted = false;
    soundCard.hidden = true;
    root.classList.remove('mvp--awaiting-sound');
    analyticsApi.markEngaged();
    video.play().catch(()=>{});
    showControls(true);
  }

  bigPlay.addEventListener('click', ()=>{
    if (!soundEngaged) return;
    togglePlay();
  });
  playBtn.addEventListener('click', ()=>{
    if (!soundEngaged) return;
    togglePlay();
  });
  video.addEventListener('click', ()=>{
    if (!soundEngaged) return;
    if (root.classList.contains('mvp--controls-hidden')) showControls(true);
    else togglePlay();
  });
  soundCard.addEventListener('click', enableSoundAndWatch);

  video.addEventListener('play', ()=>{ updatePlayUI(); if (soundEngaged) showControls(true); });
  video.addEventListener('pause', ()=>{ updatePlayUI(); showControls(false); });
  video.addEventListener('ended', ()=>{ updatePlayUI(); showControls(false); });
  video.addEventListener('timeupdate', updateProgress);
  video.addEventListener('loadedmetadata', updateProgress);

  root.addEventListener('pointermove', ()=>{ if (soundEngaged) showControls(true); });
  root.addEventListener('focusin', ()=>{ if (soundEngaged) showControls(true); });
  root.addEventListener('touchstart', ()=>{ if (soundEngaged) showControls(true); }, {passive:true});

  if (new URLSearchParams(location.search).get('context') === 'anya-placeholder') {
    root.style.touchAction = 'pan-y';
    let drag = null;
    let suppressClick = false;
    root.addEventListener('pointerdown', (event)=>{
      if (event.pointerType !== 'touch') return;
      drag = { id:event.pointerId, startX:event.clientX, startY:event.clientY, lastX:event.clientX, active:false };
    });
    root.addEventListener('pointermove', (event)=>{
      if (!drag || drag.id !== event.pointerId) return;
      const distanceX = event.clientX - drag.startX;
      const distanceY = event.clientY - drag.startY;
      if (!drag.active && Math.abs(distanceX) > 8 && Math.abs(distanceX) > Math.abs(distanceY)) {
        drag.active = true;
        try { root.setPointerCapture?.(event.pointerId); } catch (_) {}
      }
      if (!drag.active) return;
      parent.postMessage({ type:'edabalans:anya-drag', phase:'move', delta:drag.lastX - event.clientX }, location.origin);
      drag.lastX = event.clientX;
    });
    const finishDrag = (event)=>{
      if (!drag || drag.id !== event.pointerId) return;
      if (drag.active) {
        suppressClick = true;
        parent.postMessage({ type:'edabalans:anya-drag', phase:'end' }, location.origin);
        setTimeout(()=>{ suppressClick = false; }, 250);
      }
      drag = null;
    };
    root.addEventListener('pointerup', finishDrag);
    root.addEventListener('pointercancel', finishDrag);
    root.addEventListener('click', (event)=>{
      if (!suppressClick) return;
      event.preventDefault();
      event.stopImmediatePropagation();
    }, true);
  }

  muteBtn.addEventListener('click', ()=>{
    video.muted = !video.muted;
    volumeSlider.value = video.muted ? 0 : video.volume;
  });

  volumeSlider.addEventListener('input', ()=>{
    video.volume = Number(volumeSlider.value);
    video.muted = video.volume === 0;
  });

  progress.addEventListener('click', event=>{
    if (PLAYER_MODE === 'engagement') return;
    if (!Number.isFinite(video.duration) || video.duration <= 0) return;
    const box = progress.getBoundingClientRect();
    video.currentTime = Math.max(0, Math.min(1, (event.clientX-box.left)/box.width)) * video.duration;
  });

  captionsBtn.addEventListener('click', ()=>{
    const tracks = [...video.textTracks];
    const enable = !tracks.some(track=>track.mode === 'showing');
    tracks.forEach((track,index)=>{ track.mode = enable && index === 0 ? 'showing' : 'disabled'; });
    captionsBtn.classList.toggle('is-active', enable && tracks.length > 0);
  });

  pipBtn.addEventListener('click', async()=>{
    try {
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      else if (document.pictureInPictureEnabled) await video.requestPictureInPicture();
    } catch(e) {}
  });

  video.addEventListener('waiting', ()=>{ loader.hidden = false; });
  video.addEventListener('seeking', ()=>{ loader.hidden = false; });
  ['playing','canplay','seeked','error'].forEach(eventName=>{
    video.addEventListener(eventName, ()=>{ loader.hidden = true; });
  });

  const speedOptions = [
    {v:1,l:'x 1'},
    {v:1.25,l:'x 1.25'},
    {v:1.5,l:'x 1.5'},
    {v:1.75,l:'x 1.75'},
    {v:2,l:'x 2'}
  ];

  speedList.innerHTML = speedOptions.map(s=>`
    <button class="mvp__speed-option ${s.v===1?'is-active':''}" type="button" data-speed="${s.v}">
      <span>${s.l}</span>
    </button>
  `).join('');

  const speedButtons = [...root.querySelectorAll('.mvp__speed-option')];

  const initialSource = video.currentSrc || video.getAttribute('src');
  const qualityOptions = QUALITY_OPTIONS
    .map(item=>({ ...item, url:item.url || (item.id === 'original' ? initialSource : '') }))
    .filter(item=>item.url);

  qualityList.innerHTML = qualityOptions.map((item,index)=>`
    <button class="mvp__quality-option ${index===0?'is-active':''}" type="button" data-quality="${item.id}">
      <span>${item.label}</span>
    </button>
  `).join('');
  const qualityButtons = [...root.querySelectorAll('.mvp__quality-option')];

  function closeSettingsPanels(){
    settingsPanel.hidden = true;
    speedPanel.hidden = true;
    qualityPanel.hidden = true;
  }

  function setSpeed(value){
    video.playbackRate = value;
    const item = speedOptions.find(s=>s.v===value) || speedOptions[0];
    speedValue.textContent = item.l + ' ›';
    speedInline.textContent = `x ${value}`;
    speedButtons.forEach(btn=>btn.classList.toggle('is-active', Number(btn.dataset.speed)===value));
    speedPanel.hidden = true;
  }

  function setQuality(id){
    const item = qualityOptions.find(option=>option.id===id);
    if (!item || item.url === (video.currentSrc || video.src)) {
      qualityPanel.hidden = true;
      return;
    }

    const savedTime = video.currentTime || 0;
    const wasPlaying = !video.paused;
    const wasMuted = video.muted;
    const savedRate = video.playbackRate;
    video.src = item.url;
    video.load();
    video.addEventListener('loadedmetadata', ()=>{
      video.currentTime = Math.min(savedTime, Number.isFinite(video.duration) ? video.duration : savedTime);
      video.muted = wasMuted;
      video.playbackRate = savedRate;
      if (wasPlaying) video.play().catch(()=>{});
    }, {once:true});
    qualityValue.textContent = item.label + ' ›';
    qualityButtons.forEach(btn=>btn.classList.toggle('is-active', btn.dataset.quality===id));
    qualityPanel.hidden = true;
  }

  speedInline.addEventListener('click', ()=>{
    settingsPanel.hidden = true;
    qualityPanel.hidden = true;
    speedPanel.hidden = !speedPanel.hidden;
  });

  settingsBtn.addEventListener('click', ()=>{
    speedPanel.hidden = true;
    qualityPanel.hidden = true;
    settingsPanel.hidden = !settingsPanel.hidden;
  });

  speedRow.addEventListener('click', ()=>{
    settingsPanel.hidden = true;
    qualityPanel.hidden = true;
    speedPanel.hidden = false;
  });

  qualityRow.addEventListener('click', ()=>{
    settingsPanel.hidden = true;
    speedPanel.hidden = true;
    qualityPanel.hidden = false;
  });

  speedButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>setSpeed(Number(btn.dataset.speed)));
  });

  qualityButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>setQuality(btn.dataset.quality));
  });

  fullscreenBtn.addEventListener('click', ()=>{
    if(document.fullscreenElement) document.exitFullscreen?.();
    else root.requestFullscreen?.();
  });

  document.addEventListener('click', event=>{
    if (!root.contains(event.target)) closeSettingsPanels();
  });
  document.addEventListener('keydown', event=>{
    if (event.key === 'Escape') {
      closeSettingsPanels();
    }
  });

  function initAnalytics(){
    const STORAGE_PREFIX = 'mvp_analytics_v1';
    const viewerKey = `${STORAGE_PREFIX}:viewer_id`;
    const randomUuid = ()=>{
      if (window.crypto?.randomUUID) return window.crypto.randomUUID();
      const bytes = new Uint8Array(16);
      if (window.crypto?.getRandomValues) window.crypto.getRandomValues(bytes);
      else bytes.forEach((_,index)=>{ bytes[index]=Math.floor(Math.random()*256); });
      bytes[6] = (bytes[6] & 0x0f) | 0x40;
      bytes[8] = (bytes[8] & 0x3f) | 0x80;
      const hex = [...bytes].map(value=>value.toString(16).padStart(2,'0')).join('');
      return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
    };
    const sessionId = randomUuid();
    const stateKey = `${STORAGE_PREFIX}:${ANALYTICS_CONFIG.videoId}`;

    let viewerId = localStorage.getItem(viewerKey);

    function ensureViewerId(){
      if (!viewerId) {
        viewerId = randomUuid();
        localStorage.setItem(viewerKey, viewerId);
      }
      return viewerId;
    }

    const state = { sessionId };
    const watched = new Set();
    let engaged = false;
    let lastT = null;
    let heartbeat = 0;

    function persist(){
      state.lastPosition = Math.floor((video.currentTime || 0)/5)*5;
      state.maxPosition = Math.max(state.maxPosition || 0, state.lastPosition);
      state.watchedBuckets = [...watched].sort((a,b)=>a-b);
      localStorage.setItem(stateKey, JSON.stringify(state));
    }

    function send(event, extra={}){
      persist();
      const payload = {
        event,
        viewer_id: ensureViewerId(),
        session_id: sessionId,
        video_id: ANALYTICS_CONFIG.videoId,
        page_path: (()=>{
          try { return new URL(document.referrer).pathname || location.pathname; }
          catch(e) { return location.pathname; }
        })(),
        last_position_sec: state.lastPosition || 0,
        max_position_sec: state.maxPosition || 0,
        watched_buckets_5s: state.watchedBuckets || [],
        ...extra
      };

      root.dispatchEvent(new CustomEvent('mvp:analytics', {detail:payload}));
      if (ANALYTICS_CONFIG.endpoint) {
        fetch(ANALYTICS_CONFIG.endpoint, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(payload),
          keepalive:true
        }).catch(()=>{});
      }
    }

    function markEngaged(){
      if (engaged) return;
      engaged = true;
      lastT = video.currentTime || 0;
      heartbeat = Date.now();
      send('video_engaged');
    }

    video.addEventListener('timeupdate', ()=>{
      const t = video.currentTime || 0;

      if (engaged && !video.paused && lastT !== null) {
        const delta = t - lastT;
        if (delta > 0 && delta <= 2) {
          const from = Math.floor(lastT / ANALYTICS_CONFIG.bucketSizeSec);
          const to = Math.floor(t / ANALYTICS_CONFIG.bucketSizeSec);
          for(let b=from;b<=to;b++) watched.add(b*ANALYTICS_CONFIG.bucketSizeSec);
        }
      }

      lastT = t;
      if (engaged) persist();

      if (engaged && Date.now() - heartbeat >= ANALYTICS_CONFIG.heartbeatSec * 1000) {
        heartbeat = Date.now();
        send('video_progress');
      }

      if (engaged && Number.isFinite(video.duration) && video.duration > 0) {
        if (!state.completed && t / video.duration >= ANALYTICS_CONFIG.completionThreshold) {
          state.completed = true;
          send('video_complete');
        }
      }
    });

    window.addEventListener('pagehide', ()=>{
      if (engaged) send('video_exit');
    });

    return { markEngaged };
  }

  applyModules();
  updatePlayUI();
  updateProgress();
})();
</script>
