<details class="blog-search">
  <summary>Поиск</summary>
  <form role="search" action="{{SEARCH_ACTION}}" method="get">
    <label for="blog-search-input">Поиск по статьям</label>
    <div class="blog-search-fields">
      <input id="blog-search-input" type="search" name="q" value="{{SEARCH_QUERY}}" maxlength="200" placeholder="Например, белок или шаги" required>
      <button type="submit">Найти</button>
    </div>
  </form>
</details>
