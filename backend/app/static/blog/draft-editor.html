<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="/blog/assets/blog.css?v=20260920a">
  <link rel="stylesheet" href="/blog/assets/article-typography.css?v=20260920a">
  <link rel="stylesheet" href="/blog/assets/article-note.css?v=20260920a">
  <link rel="stylesheet" href="/blog/assets/draft-editor.css?v=20260920b">
  <title>Редактор статьи · Похудение — это есть</title>
</head>
<body class="draft-editor-page">
  <main class="draft-editor-shell">
    <header class="draft-editor-head">
      <div><a href="/blog">← Редакция блога</a><p class="eyebrow">Markdown-редактор</p><h1 id="draft-title">Загрузка…</h1><p id="draft-meta"></p></div>
      <a id="open-preview" class="editor-link" href="#">Открыть статью</a>
    </header>
    <div id="draft-notice" class="draft-message notice" hidden></div>
    <div id="draft-error" class="draft-message error" role="alert" hidden></div>
    <section class="draft-toolbar" aria-label="Действия с материалом">
      <button id="draft-preview" class="secondary" type="button">Предпросмотр</button>
      <button id="draft-save" type="button" disabled>Сохранить</button>
      <span id="draft-status">Загрузка…</span>
    </section>
    <div class="draft-workspace">
      <section class="draft-result"><h2>Как в блоге</h2><div class="draft-preview"><article id="article" class="article"></article></div></section>
      <section class="draft-source"><h2>Markdown</h2><textarea id="draft-markdown" spellcheck="true" aria-label="Markdown статьи"></textarea></section>
    </div>
  </main>
  <script src="/blog/assets/draft-editor.js?v=20260920b"></script>
</body></html>
