<!doctype html>
<html lang="ru" data-theme="light">
<head>
<link rel="preload" href="/assets/fonts/manrope-cyrillic-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/manrope-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/unbounded-800-cyrillic-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/unbounded-800-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site-typography.css?v=20261018-brand-hero">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="/favicon.png?v=20260910a">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260910a">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="{{HERO_ABSOLUTE}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <link rel="stylesheet" href="/blog/assets/article-typography.css?v=20261018-typography">
  <link rel="stylesheet" href="/blog/assets/article-note.css?v=20261008-unified">
  <link rel="stylesheet" href="/blog/assets/blog.css?v=20261018-brand-hero">
  <link rel="stylesheet" href="/blog/assets/reader-navigation.css?v=20261021-lower-top">
  <title>{{SEO_TITLE}} · Похудение — это есть</title>
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
  <script type="application/ld+json">{{BREADCRUMB_DATA}}</script>
  <link rel="stylesheet" href="/public-site-assets/site-menu.css?v=20261019-blog">
  <link rel="stylesheet" href="/blog/assets/blog-unified.css?v=20261021-menu-icon">
</head>
<body data-page="article">
<!-- BLOG_HEADER -->

  <main>
    <article class="article-shell">
      <header class="article-hero">
        {{BREADCRUMBS}}
        <h1>{{TITLE}}</h1>
        <div class="article-meta">
          {{AUTHOR_BYLINE}}
          {{ARTICLE_DATES}}
        </div>
        {{HERO}}
      </header>
      <div class="article-layout">
        <div class="article-body" id="article"{{SUBSCRIPTION_SLOT}}>{{ARTICLE_BODY}}</div>
      </div>
    </article>

    <section class="shell related-section" aria-labelledby="related-title">
      <h2 id="related-title">Читайте также</h2>
      <div class="article-grid">{{RELATED_CARDS}}</div>
    </section>
  </main>

  {{READER_NAVIGATION}}
  <div id="contacts" data-edabalans-site-footer></div>
  <script src="/site-footer.js" defer></script>
  <script src="/cookie-notice.js" defer></script>
  <script src="/blog/assets/blog.js?v=20261019-header-contacts" defer></script>
  <script src="/blog/assets/reader-navigation.js?v=20261019-navigation2" defer></script>
  <script src="/public-site-assets/site-menu.js?v=20261019-blog" defer></script>
  <script src="/blog/assets/blog-unified.js?v=20261019-release" defer></script>
</body>
</html>
