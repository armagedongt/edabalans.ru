<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="/favicon.png?v=20260910a">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260910a">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="{{HERO_ABSOLUTE}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <link rel="stylesheet" href="/blog/assets/article-typography.css?v=20260917a">
  <link rel="stylesheet" href="/blog/assets/article-note.css?v=20260917a">
  <link rel="stylesheet" href="/blog/assets/blog.css?v=20260921b">
  <title>{{TITLE}} · Похудение — это есть</title>
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
</head>
<body data-page="article">
  <header class="site-header site-header--public">
    <div class="shell header-inner">
      <a class="brand" href="https://похудение-это-есть.рф/blog">
        <img class="brand-icon" src="/blog/assets/brain-logo.png?v=20260921b" alt="" width="28" height="28">
        <span class="brand-copy"><strong>Похудение — это есть.рф</strong><span>Блог Сергея Воронцова</span></span>
      </a>
      <button class="mobile-nav-toggle" type="button" aria-expanded="false" aria-controls="public-blog-nav" aria-label="Открыть меню">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav" id="public-blog-nav" aria-label="Основная навигация">
        <a href="https://похудение-это-есть.рф/blog" aria-current="page">Блог</a>
        <a href="https://похудение-это-есть.рф/">Мастер-класс</a>
        <a class="nav-intensive" href="https://похудение-это-есть.рф/intensive">Бесплатный интенсив</a>
        <div class="nav-contact">
          <button class="nav-contact-trigger" type="button" aria-expanded="false" aria-haspopup="true" aria-controls="blog-contact-panel">
            Контакты<span class="nav-contact-chevron" aria-hidden="true"></span>
          </button>
          <div class="nav-contact-panel" id="blog-contact-panel" hidden>
            <a href="https://t.me/FitnessSergey" target="_blank" rel="noopener">Написать в ЛС в Telegram</a>
            <a href="https://max.ru/u/f9LHodD0cOJjmbADdxMaO0UzEfR_55NRvOSwSuS3C6mWE5T27DPcpczbvEw" target="_blank" rel="noopener">Написать в ЛС в MAX</a>
            <a href="https://t.me/Fitness_Talks" target="_blank" rel="noopener">Telegram-канал</a>
            <a href="https://max.ru/id230409966750_biz" target="_blank" rel="noopener">Канал в MAX</a>
          </div>
        </div>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Включить тёмную тему" title="Включить тёмную тему">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>
      </button>
    </div>
  </header>

  <main>
    <article class="article-shell">
      <header class="article-hero">
        <div class="article-tools">
          <a class="back-link" href="https://похудение-это-есть.рф/blog">← Все статьи</a>
          {{TOC_MOBILE}}
        </div>
        <span class="article-category">{{CATEGORY}}</span>
        <h1>{{TITLE}}</h1>
        {{HERO}}
      </header>
      <div class="article-layout">
        <div class="article-body" id="article">{{ARTICLE_BODY}}</div>
        {{TOC_DESKTOP}}
      </div>
    </article>

    <section class="shell related-section" aria-labelledby="related-title">
      <h2 id="related-title">Читайте также</h2>
      <div class="article-grid">{{RELATED_CARDS}}</div>
    </section>
  </main>

  <div id="contacts" data-edabalans-site-footer></div>
  <script src="https://edabalans.ru/site-footer.js" defer></script>
  <script src="https://edabalans.ru/cookie-notice.js" defer></script>
  <script src="/blog/assets/blog.js?v=20260921b" defer></script>
</body>
</html>
