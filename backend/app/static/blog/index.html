<!doctype html>
<html lang="ru" data-theme="light">
<head>
<link rel="preload" href="/assets/fonts/manrope-cyrillic-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/manrope-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/unbounded-800-cyrillic-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/unbounded-800-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site-typography.css?v=20261018-brand-hero">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Авторский блог Сергея Воронцова о питании, похудении и пищевых привычках.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="/favicon.png?v=20260910a">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260910a">
  <link rel="canonical" href="{{CATALOG_CANONICAL}}">
  <link rel="stylesheet" href="/blog/assets/blog.css?v=20261018-brand-hero">
  <title>{{CATALOG_TITLE}}</title>
  <link rel="stylesheet" href="/public-site-assets/site-menu.css?v=20261019-blog">
  <link rel="stylesheet" href="/blog/assets/blog-unified.css?v=20261021-footer-grid">
</head>
<body data-page="home">
<!-- BLOG_HEADER -->

  <main>
    <!-- BLOG_OWNER_PANEL -->
    <section class="shell hero" aria-labelledby="blog-title">
      <div class="hero-copy">
        <h1 id="blog-title"><span>Блог о похудении</span><span>Сергея Воронцова</span></h1>
        <p class="lead">Пишу о питании, похудении и пищевых привычках, чтобы сделать ваше похудение проще.</p>
      </div>
      <figure class="hero-photo">
        <img src="/blog/assets/sergey-author-bright.webp" alt="Сергей Воронцов — автор блога" loading="eager" decoding="async" fetchpriority="high">
      </figure>
    </section>

    <!-- BLOG_STARTER -->

    <section class="shell articles-section" id="articles" aria-label="Статьи блога" data-blog-server-catalog>
      <h2 class="catalog-title">Все материалы</h2>
      <ul class="categories" aria-label="Категории блога"><!-- BLOG_CATEGORIES --></ul>
      <!-- BLOG_SEARCH_RESULTS -->
      <div class="article-grid"><!-- BLOG_CARDS --></div>
      <p class="empty-state" {{EMPTY_HIDDEN}}>{{EMPTY_MESSAGE}}</p>
      <nav class="pagination" aria-label="Навигация по страницам блога"><!-- BLOG_PAGINATION --></nav>
    </section>
  </main>

  <div id="contacts" data-edabalans-site-footer></div>
  <script src="/site-footer.js" defer></script>
  <script src="/cookie-notice.js" defer></script>
  <script src="/blog/assets/blog.js?v=20261019-header-contacts" defer></script>
  <script src="/public-site-assets/site-menu.js?v=20261019-blog" defer></script>
  <script src="/blog/assets/blog-unified.js?v=20261019-release" defer></script>
</body>
</html>
