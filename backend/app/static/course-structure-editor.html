<!doctype html>
<html lang="ru">
<head>
<link rel="preload" href="/assets/fonts/manrope-cyrillic-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/manrope-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site-typography.css?v=20261018-typography">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Структура курса</title>
  <link rel="icon" type="image/svg+xml" href="/admin/static/admin-favicon.svg">
  <link rel="stylesheet" href="/admin/static/course-structure-editor.css?v=20261018-typography">
  <link rel="stylesheet" href="/admin/static/admin-shell.css?v=20261018-typography">
</head>
<body>
  <main class="shell wide">
    <header class="page-head">
      <div>
        <p><a href="/admin/courses">← Курсы</a></p>
        <h1 id="course-heading">Структура курса</h1>
      </div>
      <div class="save-box">
        <button id="save" class="button" disabled>Сохранить и применить</button>
        <small id="status">Загрузка…</small>
      </div>
    </header>
    <div id="error" class="error" hidden></div>
    <section id="launch-control" class="group" hidden>
      <label class="row"><input id="launch-ready" type="checkbox"> Открыть курс участникам после публикации всех материалов</label>
      <small>Даже при включённом переключателе курс останется закрыт, пока не опубликованы все видимые статьи.</small>
    </section>
    <section id="days"></section>
    <details class="history">
      <summary>Предыдущие редакции</summary>
      <div id="history"></div>
    </details>
  </main>
  <script src="/admin/static/admin-shell.js"></script>
  <script src="/admin/static/course-structure-editor.js"></script>
</body>
</html>
