<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Доска</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='50' text-anchor='middle' font-size='52'%3E%E2%8F%B3%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="/assets/fonts/manrope-cyrillic-v1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/manrope-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/site-typography.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="week-board-final">
  <div class="board-top">
  <header class="toolbar">
    <button type="button" data-filter="all" aria-pressed="true">Все</button>
    <div class="category-picker">
      <button type="button" data-categories aria-expanded="false" aria-controls="category-tags"><span>Категории</span><span aria-hidden="true">⌄</span></button>
      <nav id="category-tags" class="category-filters" aria-label="Категории"></nav>
    </div>
    <button type="button" class="primary" data-import hidden title="Вставить изменения" aria-label="Добавить изменения из JSON">Добавить</button>
    <details class="tools-menu">
      <summary aria-label="Меню доски" title="Меню доски">⋯</summary>
      <div class="tools-panel">
      <button type="button" data-add hidden>Вставить вручную</button>
      <button type="button" id="today">Сегодня</button>
      <button type="button" data-past aria-expanded="false">Прошедшее</button>
      <div class="view-options" role="group" aria-label="Вид доски" hidden>
        <button type="button" data-mode="table">Таблица</button>
        <button type="button" data-mode="compact">Компактно</button>
        <button type="button" data-mode="titles">Значок + заголовок</button>
      </div>
      <button type="button" data-reset>Сбросить ширину</button>
      <a id="login" href="/admin?next=/timeboard/" hidden>Войти для правок</a>
      <div class="group" id="history-actions" role="group" aria-label="История правок" hidden>
        <button type="button" data-history="undo" title="Ctrl+Z" aria-keyshortcuts="Control+Z" disabled>Отменить</button>
        <button type="button" data-history="redo" title="Ctrl+Y" aria-keyshortcuts="Control+Y Control+Shift+Z" disabled>Повторить</button>
        <a href="api/state" title="Текущее состояние доски">JSON</a>
      </div>
      </div>
    </details>
  </header>
  <div class="column-heads"></div>
  </div>
  <p class="status" id="status" role="status"></p>
  <div class="scroll"><div class="sheet"></div></div>
  <button id="legacy-export" type="button" hidden>Скачать записи из этого браузера</button>
  <dialog class="editor" aria-labelledby="editor-title">
    <div class="detail-head">
      <strong id="editor-title"></strong>
      <button type="button" data-close-editor>Отменить</button>
    </div>
    <div class="editor-content"></div>
    <p class="status" id="editor-status" role="status"></p>
  </dialog>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
