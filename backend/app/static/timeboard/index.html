<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="robots" content="noindex, nofollow, noarchive"><title>Доска</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="toolbar"><h1>Доска</h1><button id="today" class="secondary">Сегодня</button><input type="search" id="search" placeholder="Поиск" aria-label="Найти запись"><button id="new-entry" class="primary">+ Запись</button><button id="export" class="secondary">Скачать</button><span id="save-status" role="status">Сохранение в браузере</span></header>
<main id="board-scroll" class="board-scroll" tabindex="0" aria-label="Дни. Прокрутка по горизонтали"><div id="board" class="board"></div></main>
<dialog id="editor"><form id="entry-form"><div class="dialog-head"><span id="dialog-title">Новая запись</span><button type="button" class="icon-button" id="close-editor" aria-label="Закрыть">×</button></div><label>Что планируем?<input name="title" required maxlength="180" placeholder="Например, обсудить новый проект" autocomplete="off"></label><div class="form-grid"><label>День<input name="date" type="date" required min="1900-01-01" max="9999-12-31"></label><label>Категория<select name="category"><option value="tasks">Дела</option><option value="meetings">Встречи</option><option value="consultations">Консультации</option></select></label><label>Начало<input name="time" type="time"></label><label>Длительность, минут<input name="duration" type="number" min="5" max="1440" step="5" placeholder="60"></label></div><label>Подробности<textarea name="notes" rows="3" maxlength="3000" placeholder="Ссылка, место или короткая заметка"></textarea></label><label class="completed-label"><input name="done" type="checkbox"> Выполнено</label><div class="dialog-actions"><button type="button" id="delete-entry" class="danger">Удалить</button><button type="button" id="cancel-editor" class="secondary">Отмена</button><button type="submit" class="primary">Сохранить</button></div></form></dialog>
<div class="toast" id="toast" role="status" hidden></div><script type="module" src="app.js"></script>
</body></html>
