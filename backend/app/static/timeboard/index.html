<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Доска</title>
  <link rel="preload" href="/assets/fonts/manrope-cyrillic-v1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/manrope-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/site-typography.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="week-board-final">
  <header class="toolbar">
    <div class="group">
      <div class="group pager" aria-label="Навигация по неделям">
        <button type="button" id="previous" aria-label="Предыдущая неделя">←</button>
        <strong id="week-label"></strong>
        <button type="button" id="next" aria-label="Следующая неделя">→</button>
        <button type="button" id="today">Сегодня</button>
      </div>
      <div class="view-options" role="group" aria-label="Вид доски">
        <button type="button" data-mode="table">Таблица</button>
        <button type="button" data-mode="compact">Компактно</button>
      </div>
    </div>
    <div class="group">
      <button type="button" data-reset>Сбросить ширину</button>
      <a href="api/state">Данные JSON</a>
      <a id="login" href="/admin?next=/timeboard/" hidden>Войти для правок</a>
      <button type="button" data-import hidden>Вставить изменения</button>
      <button type="button" class="primary" data-add hidden>+ Запись</button>
    </div>
  </header>
  <p class="status" id="status" role="status"></p>
  <div class="scroll"><div class="sheet"></div></div>
  <button id="legacy-export" type="button" hidden>Скачать записи из этого браузера</button>
  <dialog class="editor" aria-labelledby="editor-title">
    <div class="detail-head">
      <strong id="editor-title"></strong>
      <button type="button" data-close-editor>Закрыть</button>
    </div>
    <div class="editor-content"></div>
    <p class="status" id="editor-status" role="status"></p>
  </dialog>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
