<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Админка · edabalans</title>
  <link rel="stylesheet" href="/admin/static/admin.css">

  <style>
    .admin-empty.compact{margin-bottom:12px;padding:20px}.admin-help{margin:9px 0 0;color:var(--muted);font-size:11px}
    .dqs-admin-periods{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:12px}.dqs-admin-periods button,.dqs-admin-periods input{height:34px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:#fff;color:var(--muted)}.dqs-admin-periods button{cursor:pointer}.dqs-admin-periods button.active{border-color:var(--green);background:var(--soft);color:var(--green)}
    .dqs-admin-title{margin:18px 0 9px}.dqs-admin-chart{display:flex;align-items:end;gap:4px;min-height:128px;padding:12px;border-radius:12px;background:#f7f8f6;overflow-x:auto}.dqs-admin-bar{display:grid;align-items:end;justify-items:center;gap:4px;min-width:18px}.dqs-admin-bar i{display:block;width:10px;border-radius:5px 5px 2px 2px;background:var(--green)}.dqs-admin-bar small{color:var(--muted);font-size:8px}
    .dqs-admin-categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.dqs-admin-category{display:grid;grid-template-columns:minmax(0,1fr) auto 42px;gap:8px;padding:8px 10px;border-radius:9px;background:#f7f8f6}.dqs-admin-category b,.dqs-admin-category em{font-size:11px}.dqs-admin-category em{color:var(--green);font-style:normal;text-align:right}
    .dqs-admin-matrix{margin-top:16px}.dqs-admin-matrix summary{color:var(--green);font-weight:700;cursor:pointer}.dqs-admin-matrix>div{margin-top:8px;overflow:auto}.dqs-admin-matrix table{border-collapse:collapse;font-size:9px}.dqs-admin-matrix th,.dqs-admin-matrix td{min-width:62px;padding:6px;border:1px solid var(--line);text-align:center}.dqs-admin-feed{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.dqs-admin-feed small{display:block;color:var(--muted)}.dqs-admin-feed p{margin:4px 0 0;color:var(--muted);font-size:10px}.dqs-admin-feed>strong{font-size:18px;color:var(--green)}
    .content-source-tabs{display:flex;gap:8px;margin-bottom:14px}.content-source-tabs a{display:flex;align-items:center;gap:9px;padding:11px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);font-weight:700}.content-source-tabs a.active{border-color:#91aa97;background:var(--soft);color:var(--green)}.content-source-tabs b{display:grid;place-items:center;min-width:25px;height:22px;padding:0 6px;border-radius:99px;background:#fff;font-size:10px}.content-toolbar select{height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}.content-preview-metrics{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:7px;color:var(--muted);font-size:10px}.content-preview-metrics span:not(.admin-badge){padding:5px 8px;border-radius:8px;background:#f5f7f4}.content-preview-metrics b{color:var(--ink)}
    .content-post-text{white-space:normal;line-height:1.62}.content-block{margin:0 0 13px;white-space:pre-wrap}.content-block a,.content-visible-url,.content-link a{color:var(--green);text-decoration:underline;overflow-wrap:anywhere}.content-quote{display:block;margin:7px 0;padding:8px 12px;border-left:3px solid #9db7a3;background:#f5f8f3}.content-media-marker{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;padding:11px 12px;border:1px dashed #9fb2a2;border-radius:10px;background:#f7faf5;color:var(--green)}.content-media-marker span{color:var(--muted);font-size:11px}.content-poll{display:grid;gap:6px;margin:9px 0;padding:12px;border-radius:10px;background:#f5f7f4}.content-poll span{padding:6px 8px;border-radius:7px;background:#fff}
    .content-primary-link{display:grid;gap:4px;margin-bottom:12px;padding:12px;border-radius:11px;background:var(--soft)}.content-primary-link small{color:var(--muted);font-size:9px;font-weight:800}.content-primary-link a{color:var(--green);font-weight:700;overflow-wrap:anywhere;text-decoration:underline}.content-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}.content-metrics div{padding:9px;border-radius:9px;background:#f7f8f6}.content-metrics small,.content-metrics b{display:block}.content-metrics small{color:var(--muted);font-size:9px}.content-metrics b{margin-top:2px;font-size:15px}.content-section{display:grid;gap:6px;margin-top:16px}.content-section h4{margin:0}.content-visible-url{display:block;font-size:11px}.content-link{display:grid;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}.content-link b{font-size:11px}.content-link a{font-size:10px}
    .content-comments{margin-top:12px}.content-comments-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.content-comments-head h3,.content-comments-head p{margin:0}.content-comments-head p{color:var(--muted);font-size:11px}.content-comment{margin-top:9px;margin-left:calc(var(--depth) * 18px);padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff}.content-comment.owner{border-color:#9db7a3;background:#fbfef9}.content-comment>div{display:flex;justify-content:space-between;gap:10px}.content-comment span{color:var(--muted);font-size:10px}.content-comment p{margin:8px 0;white-space:pre-wrap}.content-comment>a{color:var(--green);font-size:10px}
    @media(max-width:760px){.dqs-admin-categories{grid-template-columns:1fr}}
    @media(max-width:760px){.content-toolbar{flex-wrap:wrap}.content-toolbar select{flex:1}.content-preview-metrics{justify-content:flex-start}.content-metrics{grid-template-columns:repeat(2,1fr)}.content-media-marker,.content-comments-head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
