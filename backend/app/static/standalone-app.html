<!doctype html>
<html lang="ru">
<head>
<link rel="preload" href="/assets/fonts/manrope-cyrillic-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/manrope-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/unbounded-800-cyrillic-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/unbounded-800-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site-typography.css?v=20261018-brand-hero">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>{{APP_TITLE}} · Похудение — это есть!</title>
  <link rel="icon" href="{{APP_FAVICON}}">
  <script>
    // Messenger bridges are needed only inside their mini apps, never for a normal browser visit.
    (function () {
      var launch = location.search + location.hash;
      var source = /(?:[?&#])tgWebApp/i.test(launch) ? 'https://telegram.org/js/telegram-web-app.js?63'
        : /(?:[?&#])WebApp/i.test(launch) ? 'https://st.max.ru/js/max-web-app.js' : '';
      window.EdabalansStandaloneBridge = source ? new Promise(function (resolve) {
        var script = document.createElement('script');
        var timer = setTimeout(function () { resolve(false); }, 8000);
        script.src = source; script.async = true;
        script.onload = function () { clearTimeout(timer); resolve(true); };
        script.onerror = function () { clearTimeout(timer); resolve(false); };
        document.head.appendChild(script);
      }) : Promise.resolve(true);
    }());
  </script>
  <style>
    html,body{margin:0;min-height:100%;background:#f4f4f6}
    .standalone-loading{min-height:100vh;display:grid;place-items:center;color:#64748b;font:600 15px/1.4 var(--ed-font-body, Manrope, Arial, sans-serif)}
  </style>
</head>
<body>
  <main data-edabalans-app="{{APP_CODE}}"><div class="standalone-loading">Открываю приложение…</div></main>
  <script src="/embed.js" defer></script>
</body>
</html>
