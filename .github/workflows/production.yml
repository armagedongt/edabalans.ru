name: Test and deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: edabalans-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          # Impact analysis compares the complete pushed range, which can contain
          # more than one commit.
          fetch-depth: 0

      - name: Install tools test dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/requirements-test.txt

      - name: Classify change impact
        id: impact
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            before="HEAD^"
          fi

          read -r migration startup_data backend telegram caddy compose < <(
            bash infra/deploy/classify-deploy-impact "$PWD" "$before" "$GITHUB_SHA"
          )
          echo "migration=$migration" >> "$GITHUB_OUTPUT"
          echo "startup_data=$startup_data" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "telegram=$telegram" >> "$GITHUB_OUTPUT"
          echo "caddy=$caddy" >> "$GITHUB_OUTPUT"
          echo "compose=$compose" >> "$GITHUB_OUTPUT"
          echo "Impact: backend=$backend telegram=$telegram caddy=$caddy compose=$compose migration=$migration startup_data=$startup_data"

      - name: Test module inventory
        run: python3 -m unittest discover -s tools/tests -v

      - name: Build module inventory for tests
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            before="HEAD^"
          fi
          # The map is a build output, not a second source of truth. Recreate it from
          # this exact commit before tests and the Docker build instead of rejecting a
          # normal feature only because a parallel commit changed generated files.
          python3 tools/module_inventory.py --tracked-only --base "$before" --head "$GITHUB_SHA"

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Build backend
        if: steps.impact.outputs.backend == 'true'
        run: docker build --file ./backend/Dockerfile --tag edabalans-backend-test .

      - name: Run backend tests
        if: steps.impact.outputs.backend == 'true'
        shell: bash
        run: |
          set -o pipefail
          test_log="$RUNNER_TEMP/backend-pytest.log"
          if docker run --rm \
              --user root \
              --env PYTHONPATH=/app \
              --env DATABASE_URL=postgresql+psycopg://test:test@127.0.0.1:5432/test \
              --volume "$PWD/backend/tests:/app/backend/tests:ro" \
              --volume "$PWD/backend/requirements-dev.txt:/app/backend/requirements-dev.txt:ro" \
              edabalans-backend-test \
              sh -c "pip install --quiet -r requirements-dev.txt && python -m pytest -q" \
              2>&1 | tee "$test_log"; then
            exit 0
          fi

          # Public check annotations retain the useful pytest tail even when the
          # repository's complete Actions log is unavailable to an operator.
          message="$(tail -n 60 "$test_log")"
          message="${message//'%'/'%25'}"
          message="${message//$'\r'/'%0D'}"
          message="${message//$'\n'/'%0A'}"
          echo "::error title=Backend pytest failed::$message"
          exit 1

      - name: Build Telegram service
        if: steps.impact.outputs.telegram == 'true'
        run: docker build --file ./telegram-bot/service/Dockerfile --tag edabalans-telegram-test ./telegram-bot

      - name: Run Telegram service tests
        if: steps.impact.outputs.telegram == 'true'
        run: |
          docker run --rm \
            --user root \
            --env PYTHONPATH=/app \
            --volume "$PWD/telegram-bot/service/tests:/app/tests:ro" \
            --volume "$PWD/telegram-bot/service/requirements-dev.txt:/app/requirements-dev.txt:ro" \
            edabalans-telegram-test \
            sh -c "pip install --quiet -r requirements-dev.txt && python -m pytest -q"

      - name: Block automatic database migrations
        if: steps.impact.outputs.migration == 'true'
        shell: bash
        run: |
          echo "A database migration was detected. Automatic production deployment is blocked." >&2
          exit 1
