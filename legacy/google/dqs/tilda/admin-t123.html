<div id="dqs-admin-app"></div>

<style>
:root{
  --bg:#f5f5f7;
  --card:#fff;
  --text:#242235;
  --muted:#7b8094;
  --line:#e5e5ec;

  --purple:#7042e8;
  --purple-soft:#f0ebff;

  --green-light:#dff2db;
  --green-bright:#5cf05e;
  --yellow:#f7e7ad;
  --orange:#f7a73d;
  --orange-soft:#fde1ae;
  --blue:#b9d9ef;

  --score-p2:#c9edc0;
  --score-p1:#e2f1c7;
  --score-0:#f6e8b8;
  --score-m1:#f6d5a5;
  --score-m2:#f2b7aa;

  --shadow:0 6px 22px rgba(30,30,55,.07);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
}

#dqs-admin-app{
  max-width:1180px;
  margin:0 auto;
  padding:8px;
  font-family:Arial,sans-serif;
  color:var(--text);
}

button,input{
  font-family:inherit;
}

.da-card{
  background:var(--card);
  border-radius:17px;
  box-shadow:var(--shadow);
}

/* HEADER */

.da-header{
  position:sticky;
  top:0;
  z-index:100;
  padding:4px 0 7px;
  background:var(--bg);
}

.da-header-card{
  min-height:54px;
  padding:8px 13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.da-header-title{
  font-size:18px;
  font-weight:800;
}

.da-header-email{
  margin-top:3px;
  font-size:9px;
  color:var(--muted);
}

.da-header-actions{
  display:flex;
  gap:6px;
  align-items:center;
}

.da-btn-light{
  height:34px;
  border:0;
  border-radius:10px;
  padding:0 12px;
  background:#eff0f5;
  color:#555b6d;
  font-size:10px;
  font-weight:800;
  cursor:pointer;
}

.da-btn-link{
  height:34px;
  border:0;
  background:transparent;
  padding:0 8px;
  color:var(--purple);
  font-size:10px;
  font-weight:800;
  cursor:pointer;
}

/* LOGIN */

.da-login{
  max-width:440px;
  margin:45px auto;
  padding:22px;
}

.da-login-title{
  font-size:24px;
  font-weight:800;
}

.da-login-sub{
  margin-top:6px;
  font-size:11px;
  color:var(--muted);
}

.da-input{
  width:100%;
  height:44px;
  margin-top:15px;
  padding:0 13px;
  border:1px solid #dcdde5;
  border-radius:12px;
  outline:none;
  font-size:14px;
}

.da-primary{
  width:100%;
  height:42px;
  margin-top:8px;
  border:0;
  border-radius:12px;
  background:var(--purple);
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.da-error{
  margin-top:10px;
  color:#bb3838;
  font-size:11px;
}

.da-loading{
  max-width:500px;
  margin:40px auto;
  padding:24px;
  text-align:center;
  font-size:12px;
  color:var(--muted);
}

/* USERS */

.da-search-box{
  padding:13px;
  margin-top:5px;
}

.da-search-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:10px;
}

.da-search-title{
  font-size:18px;
  font-weight:800;
}

.da-search-count{
  font-size:9px;
  color:var(--muted);
}

.da-search{
  width:100%;
  height:42px;
  margin-top:10px;
  padding:0 13px;
  border:1px solid #dcdde5;
  border-radius:12px;
  outline:none;
  font-size:13px;
}

.da-results{

}

.da-user{

.da-user:hover{

.da-user-email{

}

.da-user-stats{

}

.da-user-stat{

}

.da-user-value{

  font-weight:800;
}

.da-user-label{

}

.da-empty{

  font-size:11px;

}

/* PROFILE */

.da-profile{

.da-back{

.da-profile-email{

.da-tab{

.da-tab.active{

/* PERIOD */

.da-period-fast{

.da-period-btn{

}

.da-period-btn.active{

}

.da-period-dates{
  display:flex;
  align-items:center;

.da-date{

.da-date-label{

/* COMMON */

.da-common{

}

.da-kpis{

  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.da-kpi{

}

.da-kpi-value{

  font-weight:800;
}

.da-kpi-label{
  margin-top:7px;
  font-size:8px;

}

.da-section{
  margin-top:6px;
  padding:12px;
}

.da-section-title{
  font-size:14px;
  font-weight:800;
}

.da-section-sub{
  margin-top:4px;
  font-size:8px;
  color:var(--muted);
}

.da-change{
  margin-top:9px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.da-change-item{
  padding:9px;
  border-radius:10px;

}

.da-change-value{
  font-size:15px;
  font-weight:800;
}

.da-change-label{
  margin-top:3px;

/* CHART */

.da-chart-wrap{
  margin-top:8px;
  width:100%;

.da-chart{

}

.da-chart-legend{

.da-dot{

  border-radius:50%;
  margin-right:4px;
}

.da-dot.actual{background:var(--purple)}

/* MAP */

.da-map-page{
  margin-top:6px;
}

.da-map-card{

}

.da-map-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:15px;
  margin-bottom:8px;

.da-map-title{
  font-size:17px;
  font-weight:800;
}

.da-map-sub{
  margin-top:3px;
  font-size:8px;
  color:var(--muted);
}

.da-map-score{
  text-align:right;
}

.da-map-score-label{
  font-size:8px;
  color:var(--muted);
}

.da-map-score-value{
  margin-top:2px;
  font-size:25px;
  font-weight:800;
  color:var(--purple);
}

.da-average-table{
  width:100%;
  min-width:850px;
  border-collapse:separate;
  border-spacing:0 3px;

}

.da-average-table th{

  text-align:left;
  font-size:7px;

.da-average-table th:nth-child(3),

.da-average-name{

.da-average-num,

.da-average-num,

/* PORTION STRIPS */

.da-portion-strip,

  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:2px;
}

.da-portion-cell{
  height:20px;
}

.da-feed-cell{
  height:17px;
}

.da-portion-cell,
.da-feed-cell{

  overflow:hidden;
  border-radius:4px;
  background:#ececf1;
}

.da-portion-fill,
.da-feed-fill{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
}

.s2 .da-portion-fill,
.s2 .da-feed-fill{background:var(--score-p2)}

.s1 .da-portion-fill,
.s1 .da-feed-fill{background:var(--score-p1)}

.s0 .da-portion-fill,
.s0 .da-feed-fill{background:var(--score-0)}

.sm1 .da-portion-fill,

.sm2 .da-portion-fill,
.sm2 .da-feed-fill{background:var(--score-m2)}

.da-days-matrix-page{

.da-matrix-card{

.da-matrix-title{

.da-matrix-table{

.da-matrix-table th{

  background:#f6f6f8;

.da-matrix-table td{

  padding:2px;
  border:1px solid #e7e7eb;

}

.da-matrix-day{width:40px}
.da-matrix-date{width:70px}
.da-matrix-dqs{width:50px;font-weight:800}
.da-matrix-div{width:45px;font-weight:800}
.da-matrix-cat{width:49px}

.da-th-icon{

}

.da-th-name{

  font-size:6px;
}

.da-day-empty td{
  background:#fafafa;
  color:#bbb;
}

.cell-promote-zero{background:var(--yellow)!important}
.cell-promote-low{background:var(--green-light)!important}
.cell-question{background:var(--blue)!important}
.cell-warning{background:var(--orange-soft)!important}

.cell-div0{background:#cfa9cf!important}
.cell-div1{background:#e5d5df!important}
.cell-div2{background:#eee8c7!important}
.cell-div3{background:#cce7c5!important}
.cell-div4{background:var(--green-bright)!important;font-weight:800}

/* FEED */

.da-feed{
  margin-top:6px;
  display:grid;
  gap:6px;
}

.da-day-card{
  overflow:hidden;
}

.da-day-head{
  padding:9px 11px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.da-day-title{
  font-size:12px;
  font-weight:800;
}

.da-day-date{
  margin-top:2px;
  font-size:8px;
  color:var(--muted);
}

.da-day-score{
  padding:6px 8px;
  border-radius:9px;
  background:var(--purple-soft);
  color:var(--purple);
  font-size:11px;
  font-weight:800;
}

.da-day-score.empty{
  background:#f1f1f4;
  color:#999;
}

.da-day-body{
  padding:0 8px 8px;
  display:grid;
  gap:2px;
}

.da-feed-row{
  display:grid;
  grid-template-columns:125px 1fr 55px;
  gap:5px;
  align-items:center;
  min-height:27px;
}

.da-feed-name{
  display:flex;
  gap:5px;
  align-items:center;
  font-size:9px;
  font-weight:700;
}

.da-feed-portions{
  text-align:right;
  font-size:8px;
  font-weight:800;
}

.da-diversity{
  display:block;
  font-size:6px;
  color:var(--purple);
}

.da-footer{
  padding:13px 5px 8px;
  text-align:center;
  font-size:8px;
  color:#9a9daa;
}

@media(max-width:700px){

  #dqs-admin-app{
    padding:5px;
  }

  .da-tabs{
    grid-template-columns:repeat(2,1fr);
    min-height:82px;
  }

  .da-period{
    display:block;
  }

  .da-period-dates{
    margin-top:7px;
  }

  .da-kpis{
    grid-template-columns:repeat(2,1fr);
  }

  .da-change{
    grid-template-columns:1fr;
  }

  .da-feed-row{
    grid-template-columns:92px 1fr 47px;
  }
}

<script>
(function(){

var API_URL='<REDACTED_LEGACY_APPS_SCRIPT_URL>';

var ADMIN_KEY='dqs_admin_email';

var root=document.getElementById('dqs-admin-app');

var adminEmail='';
var users=[];
var search='';
var currentUser=null;

var currentTab='common';
var periodMode='all';
var periodFrom='';
var periodTo='';

var CATS=[
  {name:'Фрукты',short:'Фрукты',icon:'🍏',scores:[2,2,2,1,0,0,0,-1],approx:[120,120],unit:'г',promote:true},
  {name:'Овощи',short:'Овощи',icon:'🍆',scores:[2,2,2,1,0,0,0,-1],approx:[120,120],unit:'г',promote:true},
  {name:'Зелень',short:'Зелень',icon:'🌿',scores:[2,2,2,1,0,0,0,-1],approx:[10,30],unit:'г',promote:true},
  {name:'Мясо',short:'Мясо',icon:'🥩',scores:[2,2,1,0,0,-1,-2,-2],approx:[120,120],unit:'г',promote:true},
  {name:'Молочка',short:'Молочка',icon:'🥛',scores:[2,2,1,0,-1,-2,-2,-2],approx:[120,250],unit:'г/мл',promote:true},
  {name:'Сыры',short:'Сыры',icon:'🧀',scores:[2,0,-1,-2,-2,-2,-2,-2],approx:[15,45],unit:'г',limited:true},
  {name:'Орехи',short:'Орехи',icon:'🥜',scores:[2,0,-1,-2,-2,-2,-2,-2],approx:[10,10],unit:'г',nuts:true},
  {name:'Масло',short:'Масло',icon:'🧈',scores:[1,0,0,-1,-2,-2,-2,-2],approx:[6,15],unit:'г',limited:true},
  {name:'ЦЗ',short:'ЦЗ',icon:'🌾',scores:[2,2,1,0,-1,-1,-1,-2],approx:[120,180],unit:'г',promote:true},
  {name:'Бобовые',short:'Бобовые',icon:'🌱',scores:[2,2,1,0,-1,-1,-1,-2],approx:[170,220],unit:'г',promote:true},
  {name:'Картофель',short:'Картоф.',icon:'🥔',scores:[2,2,1,0,-1,-1,-1,-2],approx:[180,250],unit:'г',promote:true},
  {name:'Др. гарниры',short:'Др. гар.',icon:'🍚',scores:[0,-1,-2,-2,-2,-2,-2,-2],approx:[120,180],unit:'г',limited:true},
  {name:'Сладости',short:'Сладкое',icon:'🍰',scores:[-2,-2,-2,-2,-2,-2,-2,-2],approx:[30,120],unit:'г',harmful:true},
  {name:'Напитки',short:'Напитки',icon:'🥤',scores:[-2,-2,-2,-2,-2,-2,-2,-2],approx:[200,500],unit:'мл',drinks:true},
  {name:'Алкоголь',short:'Алко',icon:'🍺',scores:[-2,-2,-2,-2,-2,-2,-2,-2],approx:[8,8],unit:'г этанола',harmful:true},
  {name:'Жареное',short:'Жареное',icon:'🍟',scores:[-2,-2,-2,-2,-2,-2,-2,-2],approx:[60,120],unit:'г',harmful:true},
  {name:'Типа мясо',short:'Типа мясо',icon:'🌭',scores:[-2,-2,-2,-2,-2,-2,-2,-2],approx:[60,120],unit:'г',harmful:true}
];

/* API */

function api(params){

  return new Promise(function(resolve,reject){

    var callback='dqsAdmin_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    var script=document.createElement('script');
    var finished=false;

    function clean(){
      try{delete window[callback]}catch(e){}
      if(script.parentNode){
        script.parentNode.removeChild(script);
      }
    }

    var timer=setTimeout(function(){
      if(finished)return;
      finished=true;
      clean();
      reject(new Error('Google не ответил'));
    },20000);

    window[callback]=function(data){
      if(finished)return;
      finished=true;
      clearTimeout(timer);
      clean();
      resolve(data);
    };

    var q=new URLSearchParams();

    Object.keys(params).forEach(function(key){
      q.set(key,params[key]);
    });

    q.set('callback',callback);
    q.set('_',Date.now());

    script.src=API_URL+'?'+q.toString();

    script.onerror=function(){
      if(finished)return;
      finished=true;
      clearTimeout(timer);
      clean();
      reject(new Error('Ошибка связи с Google'));
    };

    document.body.appendChild(script);

  });
}

/* LOGIN */

function showLogin(error){

  root.innerHTML=
    '<div class="da-card da-login">'+
      '<div class="da-login-title">DQS — админка</div>'+
      '<div class="da-login-sub">Введите email администратора.</div>'+
      '<input id="login-email" class="da-input" type="email" placeholder="Email" value="'+esc(localStorage.getItem(ADMIN_KEY)||'')+'">'+
      '<button class="da-primary" onclick="DQSADM.login()">Войти</button>'+
      (error?'<div class="da-error">'+esc(error)+'</div>':'')+
    '</div>';
}

function loading(text){
  root.innerHTML='<div class="da-card da-loading">'+esc(text)+'</div>';
}

async function login(){

  var input=document.getElementById('login-email');
  var email=String(input?input.value:'').trim().toLowerCase();

  if(!email){
    showLogin('Введите email');
    return;
  }

  loading('Проверяю доступ...');

  try{

    var result=await api({
      action:'adminLogin',
      email:email
    });

    if(!result.ok){
      showLogin(result.error||'Нет доступа');
      return;
    }

    adminEmail=email;
    localStorage.setItem(ADMIN_KEY,email);

    await loadUsers();

  }catch(e){
    showLogin(e.message);
  }
}

function logout(){

  localStorage.removeItem(ADMIN_KEY);

  adminEmail='';
  users=[];
  currentUser=null;

  showLogin('');
}

/* CLIENT LIST */

async function loadUsers(){

  loading('Загружаю клиентов...');

  try{

    var result=await api({
      action:'adminListUsers',
      email:adminEmail
    });

    if(!result.ok){
      throw new Error(result.error||'Не удалось загрузить клиентов');
    }

    users=Array.isArray(result.users)?result.users:[];

    renderUsers();

  }catch(e){

    root.innerHTML=
      '<div class="da-card da-login">'+
        '<div class="da-login-title">Ошибка</div>'+
        '<div class="da-login-sub">'+esc(e.message)+'</div>'+
        '<button class="da-primary" onclick="DQSADM.reload()">Повторить</button>'+
      '</div>';
  }
}

function getFilteredUsers(){

  var q=String(search||'').trim().toLowerCase();

  if(!q){
    return users.slice();
  }

  return users.filter(function(user){
    return String(user.email||'').toLowerCase().indexOf(q)!==-1;
  });
}

function renderUsers(){

  currentUser=null;

  var found=getFilteredUsers();

  var cards='';

  for(var i=0;i<found.length;i++){
    cards+=renderUserCard(found[i]);
  }

  if(!cards){

  periodMode=mode;
  periodFrom='';
  periodTo='';

  renderProfile();
}

function setDateFrom(value){

  periodMode='custom';
  periodFrom=value;

  if(periodTo && periodFrom>periodTo){
    periodTo=periodFrom;
  }

  renderProfile();
}

function setDateTo(value){

  periodMode='custom';
  periodTo=value;

  if(periodFrom && periodTo<periodFrom){
    periodFrom=periodTo;
  }

  renderProfile();
}

function getAvailableBounds(){

  var total=currentUser.days.length||30;
  var first=currentUser.startDate||'';
  var last=first?addDays(first,total-1):'';

  return {
    min:first,
    max:last
  };
}

function currentPeriodBounds(){

  var bounds=getAvailableBounds();

  if(!bounds.min){
    return {from:'',to:''};
  }

  if(periodMode==='all'){
    return {
      from:bounds.min,
      to:bounds.max
    };
  }

  if(periodMode==='custom'){
    return {
      from:periodFrom||bounds.min,
      to:periodTo||bounds.max
    };
  }

  var count=Number(periodMode);

  var end=getLastFilledDate()||bounds.max;
  var start=addDays(end,-(count-1));

  if(start<bounds.min){
    start=bounds.min;
  }

  return {
    from:start,
    to:end
  };
}

function getFilteredEntries(){

  var range=currentPeriodBounds();
  var entries=[];

  for(var i=0;i<currentUser.days.length;i++){

    var date=currentUser.startDate?addDays(currentUser.startDate,i):'';

    if(date && range.from && date<range.from)continue;
    if(date && range.to && date>range.to)continue;

    entries.push({
      dayNumber:i+1,
      date:date,
      day:currentUser.days[i],
      filled:isFilled(currentUser.days[i])
    });
  }

  return entries;
}

function getFilledEntries(){

  return getFilteredEntries().filter(function(entry){
    return entry.filled;
  });
}

function categoryStats(entries){

  var result=[];

  for(var c=0;c<CATS.length;c++){

    var portions=0;
    var points=0;

    for(var i=0;i<entries.length;i++){

      portions+=Number(
        entries[i].day &&
        entries[i].day.p &&
        entries[i].day.p[c] || 0
      );

      points+=categoryTotal(entries[i].day,c);
    }

    result.push({
      avgPortions:entries.length?round1(portions/entries.length):0,
      avgPoints:entries.length?round1(points/entries.length):0

}

function physicalEquivalent(index,avg){

  if(!avg){
    return '0';
  }

  var cat=CATS[index];

  var min=Math.round(avg*cat.approx[0]);
  var max=Math.round(avg*cat.approx[1]);

  if(min===max){
    return '≈ '+min+' '+cat.unit;
  }

  return '≈ '+min+'–'+max+' '+cat.unit;
}

        '<div class="da-th-name">'+esc(CATS[c].short)+'</div>'+

      for(var x=0;x<CATS.length;x++){
        html+='<td></td>';
      }

      html+='</tr>';

      continue;
    }

    var diversity=diversityCount(entry.day);

    html+=
      '<tr>'+
        '<td>'+entry.dayNumber+'</td>'+
        '<td>'+dateTiny(entry.date)+'</td>'+
        '<td class="da-matrix-dqs">'+score(dayTotal(entry.day))+'</td>'+
        '<td class="'+diversityCellClass(diversity)+'">'+diversity+'</td>';

    for(var cat=0;cat<CATS.length;cat++){

      var portions=Number(
        entry.day &&
        entry.day.p &&
        entry.day.p[cat] || 0
      );

      html+=
        '<td class="'+matrixCellClass(cat,portions)+'">'+
          formatPortion(portions)+
        '</td>';
    }

    html+='</tr>';
  }

  html+='</tbody></table></div></div>';

  return html;
}

function matrixCellClass(index,portions){

  var cat=CATS[index];

  if(cat.promote){

    if(portions===0){
      return 'cell-promote-zero';
    }

    if(portions<=1.5){
      return 'cell-promote-low';
    }

    return '';
  }

  if(cat.nuts){

    if(portions===0 || portions>2){
      return 'cell-question';
    }

    return '';
  }

  if(cat.drinks){

    if(portions>3){
      return 'cell-question';
    }

    if(portions>2.5){
      return 'cell-warning';
    }

    return '';
  }

  if(cat.harmful){

    if(portions>2.5){
      return 'cell-bad';
    }

    return '';
  }

  if(cat.limited){

    if(portionScore(index,portions)<=-2){
      return 'cell-warning';
    }
  }

  return '';
}

function diversityCellClass(value){

  if(value<=0)return 'cell-div0';
  if(value===1)return 'cell-div1';
  if(value===2)return 'cell-div2';
  if(value===3)return 'cell-div3';

  return 'cell-div4';
}

/* PORTION VISUAL */

function renderPortionStrip(catIndex,portions,type){

  var wrapper=type==='feed'?'da-feed-strip':'da-portion-strip';
  var cellClass=type==='feed'?'da-feed-cell':'da-portion-cell';
  var fillClass=type==='feed'?'da-feed-fill':'da-portion-fill';

  var html='<div class="'+wrapper+'">';

  var whole=Math.floor(portions);
  var fraction=portions-whole;

  for(var pos=1;pos<=8;pos++){

    var fill=0;

    if(pos<=whole){
      fill=100;
    }else if(pos===whole+1 && fraction>0){
      fill=fraction*100;
    }

    var stepScore=getStepScore(catIndex,pos);

    html+=
      '<div class="'+cellClass+' '+scoreClass(stepScore)+'">'+
        '<div class="'+fillClass+'" style="width:'+fill+'%"></div>'+
      '</div>';
  }

  html+='</div>';

  return html;
}

/* CHART */

function renderDqsChart(entries){

  if(!entries.length){
    return '<div class="da-empty">Пока нет данных.</div>';
  }

  var series=[];

  for(var i=0;i<entries.length;i++){

    var start=Math.max(0,i-6);
    var values=[];

    for(var j=start;j<=i;j++){
      values.push(dayTotal(entries[j].day));
    }

    series.push({
      dayNumber:entries[i].dayNumber,
      dqs:dayTotal(entries[i].day),
      sma:average(values)
    });
  }

  var W=900;
  var H=250;
  var PL=42;
  var PR=15;
  var PT=15;
  var PB=29;

  var all=[];

  for(var n=0;n<series.length;n++){
    all.push(series[n].dqs);
    all.push(series[n].sma);
  }

  var min=Math.min.apply(null,all);
  var max=Math.max.apply(null,all);

  if(min===max){
    min-=1;
    max+=1;
  }

  var margin=Math.max(1,(max-min)*.12);

  min-=margin;
  max+=margin;

  var firstDay=series[0].dayNumber;
  var lastDay=series[series.length-1].dayNumber;

  function x(day){

    if(lastDay===firstDay){
      return PL;
    }

    return PL+
      ((day-firstDay)/(lastDay-firstDay))*
      (W-PL-PR);
  }

  function y(value){

    return PT+
      ((max-value)/(max-min))*
      (H-PT-PB);
  }

  function makePath(key){

    var path='';

    for(var i=0;i<series.length;i++){

      path+=
        (i?' L ':'M ')+
        x(series[i].dayNumber).toFixed(1)+' '+
        y(series[i][key]).toFixed(1);
    }

    return path;
  }

  var points='';

  for(var p=0;p<series.length;p++){

    points+=
      '<circle cx="'+x(series[p].dayNumber)+'" cy="'+y(series[p].dqs)+'" r="3" fill="#7042e8">'+
        '<title>День '+series[p].dayNumber+': '+score(series[p].dqs)+'</title>'+
      '</circle>';
  }

  var mid=(min+max)/2;

  return '<div class="da-chart-wrap">'+

    '<svg class="da-chart" viewBox="0 0 '+W+' '+H+'">'+

      '<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y(max)+'" y2="'+y(max)+'" stroke="#ededf2"></line>'+
      '<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y(mid)+'" y2="'+y(mid)+'" stroke="#ededf2"></line>'+
      '<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y(min)+'" y2="'+y(min)+'" stroke="#ededf2"></line>'+

      '<text x="4" y="'+(y(max)+3)+'" font-size="8" fill="#8b8f9e">'+score(max)+'</text>'+
      '<text x="4" y="'+(y(mid)+3)+'" font-size="8" fill="#8b8f9e">'+score(mid)+'</text>'+
      '<text x="4" y="'+(y(min)+3)+'" font-size="8" fill="#8b8f9e">'+score(min)+'</text>'+

      '<path d="'+makePath('dqs')+'" fill="none" stroke="#7042e8" stroke-width="2"></path>'+
      '<path d="'+makePath('sma')+'" fill="none" stroke="#4c5262" stroke-width="4"></path>'+

      points+

    '</svg>'+

    '<div class="da-chart-legend">'+
      '<span><i class="da-dot actual"></i>DQS</span>'+
      '<span><i class="da-dot sma"></i>SMA 7</span>'+
    '</div>'+

  '</div>';
}

/* DQS CALCULATIONS */

function countAllFilled(){

  var count=0;

  for(var i=0;i<currentUser.days.length;i++){

    if(isFilled(currentUser.days[i])){
      count++;
    }
  }

  return count;
}

function isFilled(day){

  if(!day){
    return false;
  }

  if(Array.isArray(day.p)){

    for(var i=0;i<day.p.length;i++){

      if(Number(day.p[i]||0)>0){
        return true;
      }
    }
  }

  if(Array.isArray(day.d)){

    for(var j=0;j<day.d.length;j++){

      if(day.d[j]===true){
        return true;
      }
    }
  }

  return false;
}

function getLastFilledDate(){

  if(!currentUser.startDate){
    return '';
  }

  for(var i=currentUser.days.length-1;i>=0;i--){

    if(isFilled(currentUser.days[i])){
      return addDays(currentUser.startDate,i);
    }
  }

  return '';
}

function getStepScore(catIndex,position){

  var scores=CATS[catIndex].scores;

  if(position<=scores.length){
    return scores[position-1];
  }

  return scores[scores.length-1];
}

function portionScore(catIndex,portions){

  portions=Math.max(0,Number(portions||0));

  var whole=Math.floor(portions);
  var fraction=portions-whole;

  var total=0;

  for(var position=1;position<=whole;position++){
    total+=getStepScore(catIndex,position);
  }

  if(fraction>0){
    total+=fraction*getStepScore(catIndex,whole+1);
  }

  return round1(total);
}

function hasDiversity(day,index){

  if(!day || !Array.isArray(day.d)){
    return false;
  }

  if([0,1,2,3,4,8].indexOf(index)===-1){
    return false;
  }

  return day.d[index]===true;
}

function diversityCount(day){

  if(!day || !Array.isArray(day.d)){
    return 0;
  }

  var leaders=[0,1,2,3,4,8];
  var total=0;

  for(var i=0;i<leaders.length;i++){

    if(day.d[leaders[i]]===true){
      total++;
    }
  }

  return total;
}

function categoryTotal(day,index){

  var portions=
    day &&
    day.p
    ? day.p[index]
    : 0;

  var total=portionScore(index,portions);

  if(hasDiversity(day,index)){
    total+=1;
  }

  return round1(total);
}

function dayTotal(day){

  var total=0;

  for(var i=0;i<CATS.length;i++){
    total+=categoryTotal(day,i);
  }

  return round1(total);
}

function scoreClass(value){

  if(value===2)return 's2';
  if(value===1)return 's1';
  if(value===0)return 's0';
  if(value===-1)return 'sm1';

  return 'sm2';
}

/* FORMAT */

function average(values){

  if(!values || !values.length){
    return null;
  }

  var sum=0;

  for(var i=0;i<values.length;i++){
    sum+=Number(values[i]||0);
  }

  return round1(sum/values.length);
}

function round1(value){

  return Math.round(
    (Number(value||0)+Number.EPSILON)*10
  )/10;
}

function score(value){

  if(value===null || typeof value==='undefined'){
    return '—';
  }

  return round1(value).toFixed(1).replace('.',',');
}

function nullableScore(value){

  if(value===null || typeof value==='undefined'){
    return '—';
  }

  return score(value);
}

function signed(value){

  if(value===null || typeof value==='undefined'){
    return '—';
  }

  var n=round1(value);

  return n>0
    ? '+'+score(n)
    : score(n);
}

function formatPortion(value){

  var n=round1(value);

  if(Math.floor(n)===n){
    return String(n);
  }

  return String(n).replace('.',',');
}

function parseDate(value){

  if(!value){
    return null;
  }

  var parts=String(value).split('-');

  if(parts.length!==3){
    return null;
  }

  return new Date(
    Number(parts[0]),
    Number(parts[1])-1,
    Number(parts[2])
  );
}

function addDays(value,days){

  var date=parseDate(value);

  if(!date){
    return '';
  }

  date.setDate(
    date.getDate()+Number(days||0)
  );

  return date.getFullYear()+
    '-'+
    String(date.getMonth()+1).padStart(2,'0')+
    '-'+
    String(date.getDate()).padStart(2,'0');
}

function dateShort(value){

  var date=parseDate(value);

  if(!date){
    return '—';
  }

  return date.toLocaleDateString(
    'ru-RU',
    {
      day:'numeric',
      month:'short'
    }
  );
}

function dateLong(value){

  var date=parseDate(value);

  if(!date){
    return '';
  }

  return date.toLocaleDateString(
    'ru-RU',
    {
      day:'numeric',
      month:'long',
      year:'numeric'
    }
  );
}

function dateTiny(value){

  var date=parseDate(value);

  if(!date){
    return '';
  }

  return date.toLocaleDateString(
    'ru-RU',
    {
      day:'2-digit',
      month:'2-digit'
    }
  );
}

function esc(value){

  return String(
    value===null ||
    typeof value==='undefined'
    ? ''
    : value
  )
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');
}

function js(value){

  return String(value||'')
  .replace(/\\/g,'\\\\')
  .replace(/'/g,"\\'")
  .replace(/\n/g,'\\n')
  .replace(/\r/g,'');
}
