<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Погода в Петербурге</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body>
    <main class="weather-page" id="weather-app" aria-busy="true">
      <header class="topbar">
        <div class="topbar-line">
          <button class="city-trigger" id="city-trigger" type="button" aria-expanded="false" aria-controls="city-panel">Санкт-Петербург</button>
          <p class="updated-at" id="updated-at">Загружаю прогноз…</p>
          <nav class="view-tabs" aria-label="Раздел погоды">
            <button type="button" class="tab-button" data-view="forecast" aria-current="page">Прогноз</button>
            <button type="button" class="tab-button" data-view="history">Дневник</button>
          </nav>
          <button class="icon-button" id="settings-button" type="button" aria-expanded="false" aria-controls="settings-panel">⚙ <span>Поля</span></button>
          <button class="mobile-menu-button" id="mobile-menu-button" type="button" aria-expanded="false" aria-controls="city-panel">☰</button>
        </div>
        <div class="topbar-panel city-panel" id="city-panel" hidden>
          <nav class="mobile-tabs" aria-label="Раздел погоды">
            <button type="button" class="tab-button" data-view="forecast" aria-current="page">Прогноз</button>
            <button type="button" class="tab-button" data-view="history">Дневник</button>
          </nav>
          <nav class="city-list" id="city-list" aria-label="Избранные города"></nav>
        </div>
        <div class="topbar-panel settings-panel" id="settings-panel" hidden aria-label="Отображаемые поля">
          <label><input type="checkbox" data-field="air" checked /> Температура воздуха</label>
          <label><input type="checkbox" data-field="feels" checked /> По ощущению</label>
          <label><input type="checkbox" data-field="precipitation" checked /> Осадки</label>
          <label><input type="checkbox" data-field="snow" checked /> Снег</label>
          <form class="city-search" id="city-search">
            <input id="city-query" type="search" placeholder="Найти другой город" aria-label="Найти другой город" />
            <button type="submit">Найти</button>
          </form>
        </div>
      </header>

      <section class="forecast-view" data-view-panel="forecast" aria-label="Прогноз погоды">
        <section class="forecast-card daily-card" aria-label="Прогноз на 12 дней"><div class="daily-scroll"><div class="daily-grid" id="daily-grid"></div></div></section>
        <section class="forecast-card hourly-card" aria-label="Почасовой прогноз на выбранный день">
          <div class="hourly-grid" id="hourly-grid"></div>
        </section>
        <section class="forecast-card map-card" aria-labelledby="weather-map-heading">
          <header class="map-header">
            <div>
              <p class="map-time" id="map-time">Выберите час</p>
              <h2 id="weather-map-heading">Карта прогноза</h2>
            </div>
            <div class="map-tabs" aria-label="Слой карты">
              <button class="map-tab" type="button" data-map-mode="precipitation" aria-pressed="true">Осадки</button>
              <button class="map-tab" type="button" data-map-mode="wind" aria-pressed="false">Ветер</button>
            </div>
          </header>
          <div class="map-controls" aria-label="Управление временем карты">
            <button class="map-step" id="map-previous" type="button" aria-label="Предыдущий час" disabled>‹</button>
            <button class="map-play" id="map-play" type="button" aria-pressed="false" aria-label="Воспроизвести изменения по часам" disabled>▶</button>
            <button class="map-step" id="map-next" type="button" aria-label="Следующий час" disabled>›</button>
            <input id="map-hour-range" type="range" min="0" max="23" value="0" step="1" aria-label="Час для карты" disabled />
            <output id="map-hour-output" for="map-hour-range">00:00</output>
          </div>
          <div class="weather-map" id="weather-map" aria-live="polite">
            <div class="leaflet-map" id="leaflet-map"></div>
            <p class="map-status" id="map-status">Загружаю карту…</p>
          </div>
        </section>
      </section>

      <section class="history-view" data-view-panel="history" hidden aria-label="Дневник погоды">
        <form class="history-controls" id="history-controls">
          <label>С <input id="history-start" type="date" required /></label>
          <label>по <input id="history-end" type="date" required /></label>
          <button type="submit">Показать</button>
        </form>
        <section class="forecast-card history-card"><p class="history-status" id="history-status">Выберите период</p><div class="history-grid" id="history-grid"></div></section>
      </section>

      <p class="source-note">Прогноз и прошлые данные: <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open‑Meteo</a>, CC BY 4.0.</p>
    </main>
    <template id="message-template"><p class="message"></p></template>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="app.js"></script>
  </body>
</html>
