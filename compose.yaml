name: edabalans

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: "${API_DOMAIN}"
      DATA_DOMAIN: "${DATA_DOMAIN}"
      APP_DOMAIN: "${APP_DOMAIN}"
      GO_DOMAIN: "${GO_DOMAIN}"
      BLOG_DOMAIN: "${BLOG_DOMAIN:-blog.похудение-это-есть.рф}"
      ACME_EMAIL: "${ACME_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      telegram-bot:
        condition: service_healthy
      nocodb:
        condition: service_healthy
    networks:
      - edge

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      ADMIN_USERNAME: "${ADMIN_USERNAME}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      APP_AUTH_SECRET: "${APP_AUTH_SECRET}"
      TILDA_WEBHOOK_TOKEN: "${TILDA_WEBHOOK_TOKEN}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://похудение-это-есть.рф}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-1127}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Сергей Воронцов · Похудение — это есть!}"
      SMTP_REPLY_TO: "${SMTP_REPLY_TO:-armagedongt@gmail.com}"
      SMTP_USE_SSL: "${SMTP_USE_SSL:-true}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-false}"
      TELEGRAM_TEST_BOT_USERNAME: "${TELEGRAM_TEST_BOT_USERNAME:-}"
      MAX_BOT_USERNAME: "${MAX_BOT_USERNAME:-}"
      ACCOUNT_TELEGRAM_BOT_USERNAME: "${ACCOUNT_TELEGRAM_BOT_USERNAME:-Fitness_Talks_bot}"
      ACCOUNT_MAX_BOT_USERNAME: "${ACCOUNT_MAX_BOT_USERNAME:-id230409966750_bot}"
      ACCOUNT_PUBLIC_URL: "${ACCOUNT_PUBLIC_URL:-https://go.похудение-это-есть.рф/lk}"
      ACCOUNT_ONBOARDING_ENABLED: "${ACCOUNT_ONBOARDING_ENABLED:-false}"
      ACCOUNT_SESSION_DAYS: "${ACCOUNT_SESSION_DAYS:-30}"
      ACCOUNT_EMAIL_WORKER_ENABLED: "${ACCOUNT_EMAIL_WORKER_ENABLED:-true}"
      ACCOUNT_EMAIL_POLL_SECONDS: "${ACCOUNT_EMAIL_POLL_SECONDS:-15}"
      MASTERCLASS_COURSE_URL: "${MASTERCLASS_COURSE_URL:-https://похудение-это-есть.рф/lk}"
      KNOWLEDGE_MCP_TOKEN: "${KNOWLEDGE_MCP_TOKEN:-}"
      PRICING_CATALOG_ENABLED: "${PRICING_CATALOG_ENABLED:-false}"
      ROBOKASSA_CHECKOUT_ENABLED: "${ROBOKASSA_CHECKOUT_ENABLED:-false}"
      ROBOKASSA_TEST_MODE: "${ROBOKASSA_TEST_MODE:-true}"
      ROBOKASSA_MERCHANT_LOGIN: "${ROBOKASSA_MERCHANT_LOGIN:-}"
      ROBOKASSA_PASSWORD_1: "${ROBOKASSA_PASSWORD_1:-}"
      ROBOKASSA_TEST_PASSWORD_1: "${ROBOKASSA_TEST_PASSWORD_1:-}"
      ROBOKASSA_HASH_ALGORITHM: "${ROBOKASSA_HASH_ALGORITHM:-sha256}"
      ROBOKASSA_JWS_CERTIFICATE_BASE64: "${ROBOKASSA_JWS_CERTIFICATE_BASE64:-}"
      ROBOKASSA_RECEIPT_SNO: "${ROBOKASSA_RECEIPT_SNO:-}"
      ROBOKASSA_RECEIPT_TAX: "${ROBOKASSA_RECEIPT_TAX:-}"
      ROBOKASSA_RECEIPT_PAYMENT_METHOD: "${ROBOKASSA_RECEIPT_PAYMENT_METHOD:-full_payment}"
      ROBOKASSA_RECEIPT_PAYMENT_OBJECT: "${ROBOKASSA_RECEIPT_PAYMENT_OBJECT:-service}"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - edge
      - database

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      TELEGRAM_TEST_BOT_USERNAME: "${TELEGRAM_TEST_BOT_USERNAME}"
      TELEGRAM_TEST_BOT_TOKEN: "${TELEGRAM_TEST_BOT_TOKEN}"
      APP_AUTH_SECRET: "${APP_AUTH_SECRET}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET}"
      TELEGRAM_PUBLIC_BASE_URL: "https://${GO_DOMAIN}"
      TELEGRAM_PROXY_URL: "${TELEGRAM_PROXY_URL:-}"
      TELEGRAM_CHANNEL_ID: "${TELEGRAM_CHANNEL_ID:-}"
      TELEGRAM_POLLING_ENABLED: "${TELEGRAM_POLLING_ENABLED:-false}"
      TELEGRAM_MAINTENANCE_MODE: "${TELEGRAM_MAINTENANCE_MODE:-false}"
      TELEGRAM_MAINTENANCE_ALLOWED_USER_IDS: "${TELEGRAM_MAINTENANCE_ALLOWED_USER_IDS:-}"
      INTENSIVE_PUBLIC_URL: "${INTENSIVE_PUBLIC_URL:-https://go.похудение-это-есть.рф/i}"
      MAX_BOT_USERNAME: "${MAX_BOT_USERNAME:-}"
      MAX_BOT_TOKEN: "${MAX_BOT_TOKEN:-}"
      MAX_WEBHOOK_SECRET: "${MAX_WEBHOOK_SECRET:-}"
      YANDEX_OAUTH_TOKEN: "${YANDEX_OAUTH_TOKEN:-}"
      YANDEX_METRIKA_COUNTER_ID: "${YANDEX_METRIKA_COUNTER_ID:-97331502}"
      YANDEX_METRIKA_OFFLINE_ENABLED: "${YANDEX_METRIKA_OFFLINE_ENABLED:-false}"
      YANDEX_METRIKA_OFFLINE_INTERVAL_SECONDS: "${YANDEX_METRIKA_OFFLINE_INTERVAL_SECONDS:-300}"
      POSTPURCHASE_DISPATCH_ENABLED: "${POSTPURCHASE_DISPATCH_ENABLED:-false}"
      POSTPURCHASE_TEST_ONLY: "${POSTPURCHASE_TEST_ONLY:-true}"
      MASTERCLASS_OFFERS_URL: "${MASTERCLASS_OFFERS_URL:-https://похудение-это-есть.рф/lk}"
      MASTERCLASS_COURSE_URL: "${MASTERCLASS_COURSE_URL:-https://похудение-это-есть.рф/lk}"
      MASTERCLASS_ACCOUNT_URL: "${MASTERCLASS_ACCOUNT_URL:-https://go.похудение-это-есть.рф/lk}"
      ADMIN_USERNAME: "${ADMIN_USERNAME}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      SCHEDULER_ENABLED: "true"
      AUTO_CREATE_SCHEMA: "false"
      MEDIA_ROOT: "/app/media"
    expose:
      - "8001"
    volumes:
      - ./telegram-bot/runtime/media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - edge
      - database

  nocodb:
    image: nocodb/nocodb:2026.08.0
    restart: unless-stopped
    environment:
      NC_DB: "pg://postgres:5432?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=nocodb_meta"
      NC_SITE_URL: "https://${DATA_DOMAIN}"
      NC_ADMIN_EMAIL: "${NOCODB_ADMIN_EMAIL}"
      NC_ADMIN_PASSWORD: "${NOCODB_ADMIN_PASSWORD}"
      NC_AUTH_JWT_SECRET: "${NOCODB_JWT_SECRET}"
      NC_CONNECTION_ENCRYPT_KEY: "${NOCODB_CONNECTION_ENCRYPT_KEY}"
      NC_INVITE_ONLY_SIGNUP: "true"
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"
      NC_DB_POOL_MAX: "5"
    expose:
      - "8080"
    volumes:
      - nocodb_data:/usr/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --tries=1 --spider http://127.0.0.1:8080/api/v1/health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - edge
      - database

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - database

networks:
  edge:
  database:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  nocodb_data:
